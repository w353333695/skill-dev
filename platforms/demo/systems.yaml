# demo 部署配置
# 当前接入的系统。换系统/加系统 = 改这里（+ 放对应 api-cli spec）。
# skill 引擎不耦合任何具体系统，全靠本文件声明。

deployment: demo
description: 可行性验证用——接 EasyOps CMDB（api-cli 已有清单）

systems:
  cmdb:
    spec: projects/api-cli/examples/easyops-cmdb.yaml
    description: EasyOps CMDB（object_instance 资源，search 操作）
    default_resource: object_instance
    default_endpoint: frontend   # 网关面（见 spec）
    notes: |
      真调需 EasyOps 凭证（easyops-cookie auth）+ 内网可达。
      demo 用 --print-curl / --dry-run 验证调度链路，不依赖凭证/网络。

