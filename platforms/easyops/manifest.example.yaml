name: easyops
# 默认环境（未指定 --env 时用）
default_env: prod
environments:
  prod:
    host: <YOUR_HOST>                            # 占位符，用户替换（内网 IP / 域名）
    gateway_base: http://<YOUR_HOST>/next/api/gateway
    auth:
      internal:                                  # easyops_internal 模式：内网直连（免 cookie，user/org 头鉴权）
        org: "<YOUR_ORG>"                        # 组织 ID
        user: "<YOUR_USER>"                      # 内网调用身份（须有相应权限，如系统管理员）
      session_cookie:
        cookie: "<EXTRACT_VIA_extract_auth>"     # 跑 `extract_auth --env prod` 自动填充（勿手填）
      aksk:                                      # easyops_aksk 模式：OpenAPI HMAC 签名（不用可删）
        ak: "<YOUR_AK>"
        sk: "<YOUR_SK>"
        port_app_map:
          8079: cmdbservice
    call_policy:
      default_mode: easyops_internal             # easyops_internal(免cookie) / easyops_gateway / easyops_aksk
    auth_source: tmp/profiles/<YOUR_HOST>/       # extract_auth 的 cookie profile 来源（recorder 录制的浏览器 profile）
  # 按需加 dev / test 等环境，结构同上
