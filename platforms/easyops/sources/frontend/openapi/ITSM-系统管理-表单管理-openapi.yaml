openapi: 3.0.3
info:
  title: ITSM 表单管理 API
  version: "1.0.0"
  description: |
    EasyOps ITSM「系统管理 -> 表单管理」相关接口。

    表单定义了工单填报表单的结构（字段、布局、属性），支持多版本管理。
    本清单覆盖表单的列表查询、分类、创建、版本详情、更新（新建版本）、版本列表、设主版本、删除，以及配套的对象引用接口。

    - 录制来源：http://172.30.5.20/next/itsc-form-management/form-list
    - 每条 `x-relevant: true` 表示与本流程强相关；`false` 的条目（心跳、公告、登录态、标准字段、静态资源等）已从 paths 中剔除，可在 apis.json 中回溯。
servers:
  - url: http://172.30.5.20
    description: ITSM 测试环境
tags:
  - name: 表单列表查询
    description: 按关键词、状态、作者、分类查询表单列表
  - name: 表单分类
    description: 拉取表单分类与数据源
  - name: 表单创建
    description: 新建表单（含初始版本）
  - name: 表单版本详情
    description: 查询表单版本详情（v1/v2）
  - name: 表单更新
    description: 更新表单（新建版本/改字段），提交 formDefinition
  - name: 表单版本管理
    description: 版本列表、设为主版本
  - name: 表单删除
    description: 删除表单版本
paths:
  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/form:
    get:
      tags: [表单列表查询]
      operationId: listForm
      summary: 查询表单列表
      description: |
        按关键词、状态、作者、分类等条件查询表单列表。
        进入表单管理列表页、执行搜索时调用。
      x-relevant: true
      x-triggered-by-step: [3, 73, 79]
      parameters:
        - name: page
          in: query
          schema: { type: integer, example: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, example: 10 }
        - name: state
          in: query
          schema: { type: string, enum: [done, draft] }
          description: 状态（done=已完成，draft=草稿）
          example: ""
        - name: Q
          in: query
          schema: { type: string }
          description: 关键词（按表单名称模糊匹配）
          example: ""
        - name: name
          in: query
          schema: { type: string }
          description: 表单名称
          example: ""
        - name: category
          in: query
          schema: { type: string }
          description: 分类
          example: ""
        - name: creator
          in: query
          schema: { type: string }
          description: 作者
          example: ""
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      total: { type: integer, example: 4 }
                      page: { type: integer, example: 1 }
                      page_size: { type: integer, example: 10 }
                      list:
                        type: array
                        items:
                          $ref: '#/components/schemas/FormListItem'
  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/form_schema_category:
    get:
      tags: [表单分类]
      operationId: getFormSchemaCategory
      summary: 查询表单分类列表
      description: 拉取表单分类（如事件管理、知识管理），用于新建表单时的分类下拉。
      x-relevant: true
      x-triggered-by-step: [4]
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      categoryList:
                        type: array
                        items: { type: string }
                        example: [事件管理, 知识管理]
  /next/api/gateway/logic.flowable_service/api/v1/flowable_service/form_data_source:
    get:
      tags: [表单分类]
      operationId: listFormDataSource
      summary: 查询表单数据源
      description: 拉取表单数据源列表，用于字段配置（下拉/选择类字段的数据来源）。
      x-relevant: true
      x-triggered-by-step: [3]
      parameters:
        - name: page
          in: query
          schema: { type: integer, example: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, example: 1000 }
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      total: { type: integer, example: 0 }
                      list:
                        type: array
                        items: { type: object }
  /next/api/gateway/logic.flowable_service/api/flowable_service/v2/form:
    post:
      tags: [表单创建]
      operationId: createForm
      summary: 新建表单
      description: |
        在新建表单页填写名称、分类、说明、版本号、版本说明后点击「保存」提交创建。
        `formDefinition` 为字段定义 JSON 字符串（设计器产出的控件数组）。
      x-relevant: true
      x-triggered-by-step: [41]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category, versionName, formDefinition]
              properties:
                name:
                  type: string
                  description: 表单名称
                  example: test
                category:
                  type: string
                  description: 分类
                  example: 事件管理
                memo:
                  type: string
                  description: 表单说明
                  example: test
                state:
                  type: string
                  enum: [done, draft]
                  description: 状态（done=已完成）
                  example: done
                versionName:
                  type: string
                  description: 版本号（X.Y.Z 三位）
                  example: 1.0.0
                versionMemo:
                  type: string
                  description: 版本说明
                  example: init
                formDefinition:
                  type: string
                  description: 字段定义 JSON 字符串（控件数组）
                  example: '[{"key":"hkcjf9xz29","modelField":"hkcjf9xz29","name":"info"}]'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      lastestVersion:
                        $ref: '#/components/schemas/FormVersion'
  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/form/{formId}/version/{versionId}:
    get:
      tags: [表单版本详情]
      operationId: getFormVersion
      summary: 查询表单版本详情（v1）
      description: 进入表单版本详情页时，按 formId/versionId 拉取该版本完整详情（formSchema + domainModel）。
      x-relevant: true
      x-triggered-by-step: [86, 107]
      parameters:
        - name: formId
          in: path
          required: true
          schema: { type: string }
          example: 656783815611b
        - name: versionId
          in: path
          required: true
          schema: { type: string }
          example: 6567838159ed2
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      formSchema:
                        $ref: '#/components/schemas/FormSchema'
                      domainModel:
                        type: object
                        description: 领域模型（字段绑定）
    delete:
      tags: [表单删除]
      operationId: deleteFormVersion
      summary: 删除表单版本
      description: |
        删除指定表单版本。前端需输入版本号解锁删除按钮二次确认。
        ⚠️ 删除会影响已使用该版本渲染的工单前端渲染。
      x-relevant: true
      x-triggered-by-step: [110, 116]
      parameters:
        - name: formId
          in: path
          required: true
          schema: { type: string }
          example: 656783815611b
        - name: versionId
          in: path
          required: true
          schema: { type: string }
          example: 6567838159ed2
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data: { type: object, nullable: true, example: null }
  /next/api/gateway/logic.flowable_service/api/flowable_service/v2/form/{formId}/version/{versionId}:
    get:
      tags: [表单版本详情]
      operationId: getFormVersionV2
      summary: 查询表单版本详情（v2，编辑用）
      description: 进入版本编辑/新建版本页时拉取，含 standardFields（标准字段）、userDisplayMap 等，供设计器使用。
      x-relevant: true
      x-triggered-by-step: [87]
      parameters:
        - name: formId
          in: path
          required: true
          schema: { type: string }
          example: 656783815611b
        - name: versionId
          in: path
          required: true
          schema: { type: string }
          example: 6567838159ed2
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      formSchema:
                        $ref: '#/components/schemas/FormSchema'
                      domainModel:
                        type: array
                        description: 领域模型（编辑态为数组）
                        items: { type: object }
                      standardFields:
                        type: array
                        description: 标准字段列表
                        items: { type: object }
    put:
      tags: [表单更新]
      operationId: updateForm
      summary: 更新表单（新建版本/改字段）
      description: |
        在表单设计器中修改字段后点击「保存」提交，body 含新 versionName 与 formDefinition。
        若 versionName 递增则创建新版本；保存后通常配合 `POST .../v1/form/{id}/version/{newVerId}` 设为主版本。
      x-relevant: true
      x-triggered-by-step: [72, 106]
      parameters:
        - name: formId
          in: path
          required: true
          schema: { type: string }
          example: 656783815611b
        - name: versionId
          in: path
          required: true
          schema: { type: string }
          example: 6567838159ed2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: test
                category:
                  type: string
                  example: 事件管理
                memo:
                  type: string
                  example: test
                state:
                  type: string
                  enum: [done, draft]
                  example: done
                versionName:
                  type: string
                  description: 版本号（新建版本时递增，如 1.0.0 -> 1.0.1）
                  example: 1.0.1
                formDefinition:
                  type: string
                  description: 字段定义 JSON 字符串
                  example: '[{"key":"hkcjf9xz29","modelField":"hkcjf9xz29","name":"info","condition":true}]'
                domainModel:
                  type: string
                  description: 领域模型 JSON
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      lastestVersion:
                        $ref: '#/components/schemas/FormVersion'
  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/form/{formId}/version:
    get:
      tags: [表单版本管理]
      operationId: listFormVersions
      summary: 查询表单版本列表
      description: 查询某表单的全部版本列表，含每个版本的 versionInfo（versionName/state/isMain 等）。
      x-relevant: true
      x-triggered-by-step: [107]
      parameters:
        - name: formId
          in: path
          required: true
          schema: { type: string }
          example: 656783815611b
        - name: page
          in: query
          schema: { type: integer, example: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, example: 3000 }
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      total: { type: integer, example: 2 }
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            versionInfo:
                              $ref: '#/components/schemas/FormVersion'
  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/form/{formId}/version/{versionId}/setMain:
    post:
      tags: [表单版本管理]
      operationId: setMainVersion
      summary: 设为主版本
      description: |
        新版本保存后将指定版本设为主版本（isMain=true）。
        录制中对应 `POST .../v1/form/{formId}/version/{versionId}`（无 setMain 后缀，按实际网关路由）。
      x-relevant: true
      x-triggered-by-step: [107]
      parameters:
        - name: formId
          in: path
          required: true
          schema: { type: string }
          example: 656783815611b
        - name: versionId
          in: path
          required: true
          schema: { type: string }
          example: 656783b62ccd5
      responses:
        '200':
          description: 设置成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data: { type: object, nullable: true, example: null }
  /next/api/gateway/cmdb.cmdb_object.GetObjectRef/object_ref:
    get:
      tags: [表单分类]
      operationId: getObjectRef
      summary: 查询对象引用
      description: 获取 USER/USER_GROUP 等对象引用配置，进入表单管理时加载，用于字段配置中的对象选择。
      x-relevant: true
      x-triggered-by-step: [2]
      parameters:
        - name: ref_object
          in: query
          required: true
          schema: { type: string }
          description: 引用对象类型（逗号分隔，如 USER,USER_GROUP）
          example: USER,USER_GROUP
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        objectId: { type: string, example: HOST }
                        name: { type: string, example: 主机 }
                        category: { type: string, example: 基础设施 }
components:
  schemas:
    FormListItem:
      type: object
      description: 表单列表项
      properties:
        instanceId: { type: string, example: 656783815611b }
        name: { type: string, example: test }
        category: { type: string, example: 事件管理 }
        creator: { type: string, example: easyops }
        lastestMainVersion:
          $ref: '#/components/schemas/FormVersion'
    FormVersion:
      type: object
      description: 表单版本信息
      properties:
        instanceId: { type: string, example: 6567838159ed2 }
        versionName: { type: string, example: 1.0.0 }
        isMain: { type: boolean, example: true }
        state: { type: string, enum: [done, draft], example: done }
        memo: { type: string, example: init }
        creator: { type: string, example: easyops }
        businessRules: { type: string, example: "[]" }
        formDefinition:
          type: string
          description: 字段定义 JSON 字符串
    FormSchema:
      type: object
      description: 表单 Schema
      properties:
        instanceId: { type: string, example: 656783815611b }
        name: { type: string, example: test }
        category: { type: string, example: 事件管理 }
        creator: { type: string, example: easyops }
        memo: { type: string, example: test }
        ctime: { type: string, example: "2026-07-13 14:29:57" }
