openapi: 3.0.3
info:
  title: EasyOps CMDB — 模型管理 API
  description: |
    录制自 EasyOps 平台（http://172.30.0.90/）「CMDB 模型管理」流程（`/next/cmdb-model-management`）。
    覆盖模型（对象/Object）全生命周期：列表查询、导入导出、新建、字段与关系管理、视图、高级设置、编辑与删除。

    - 流程指引见同目录 `CMDB-模型管理-操作指引.md`
    - 通用响应包装：`{ code, error, message, data }`（部分创建类为 `{ code, error, codeExplain, data }`），`code === 0` 表示成功
    - 网关接口统一前缀 `/next/api/gateway/<service>/...`，命名式接口形如 `cmdb.cmdb_object.Create`、`cmdb.object_attribute.Create`、`cmdb.object_relation.Create`
    - 示例模型：`LLM_TEST`（演示用）
  version: "1.0.0"
  contact:
    name: 录制生成（browser-recorder）

servers:
  - url: http://172.30.0.90
    description: EasyOps 测试环境

tags:
  - name: 模型列表与详情
    description: 模型基础列表、分类、详情
  - name: 模型导入导出
    description: 模型批量导出、文件导入与校验
  - name: 模型创建与更新
    description: 新建模型、更新模型（含高级设置整体更新）
  - name: 字段管理
    description: 模型属性（attr）的创建、更新、删除
  - name: 关系管理
    description: 模型间关系（relation）的创建、更新、删除
  - name: 模型视图
    description: 模型字段的视图（分组排序、字段启用）
  - name: 高级设置
    description: 全文搜索屏蔽、变更日志屏蔽
  - name: 模型与字段删除
    description: 删除模型、删除属性、删除关系

paths:
  # ============ 模型列表与详情 ============
  /next/api/gateway/cmdb.cmdb_object.ListObjectBasic/object_basic:
    get:
      tags: [模型列表与详情]
      summary: 模型基础列表
      description: 获取所有模型的基础信息（objectId/name 等），用于模型管理列表展示。
      operationId: model_list_object_basic
      responses:
        "200":
          description: 模型基础信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  /next/api/gateway/cmdb.cmdb_object.ListObjectCategoryV2/v2/object_category:
    get:
      tags: [模型列表与详情]
      summary: 模型分类列表（v2）
      description: 模型分类（资源域），如 IT 资源管理、应用资源、AI 等。
      operationId: model_list_category_v2
      responses:
        "200":
          description: 模型分类
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  /next/api/gateway/cmdb.cmdb_object.GetObjectBasicAll/object_basic_all:
    get:
      tags: [模型列表与详情]
      summary: 全部模型基础信息（含计数）
      description: 拉取全部模型基础信息（含实例计数等），用于列表与分类角标。
      operationId: model_get_object_basic_all
      responses:
        "200":
          description: 模型基础信息数组
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  /next/api/gateway/cmdb.cmdb_object.GetDetail/object/{objectId}:
    get:
      tags: [模型列表与详情]
      summary: 模型详情
      description: 获取指定模型的完整定义（字段、关系、视图等）。
      operationId: model_get_detail
      parameters:
        - name: objectId
          in: path
          required: true
          schema: { type: string }
          description: 模型 ID，如 LLM_TEST
      responses:
        "200":
          description: 模型详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  # ============ 模型导入导出 ============
  /next/api/gateway/cmdb.cmdb_object.ExportObjectV2/v2/object_export:
    post:
      tags: [模型导入导出]
      summary: 导出模型（v2）
      description: 将指定模型集合导出为文件（含字段、关系、视图定义）。
      operationId: model_export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                objectIds:
                  type: array
                  items: { type: string }
                  description: 要导出的模型 ID 列表，如 ["HOST"]
      responses:
        "200":
          description: 导出结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  /next/api/gateway/cmdb_extend.custom.GetObjectUploadData/api/abjectGetUploadData:
    post:
      tags: [模型导入导出]
      summary: 获取上传参数
      description: 导入模型前获取文件上传所需的参数（上传地址/凭证等）。
      operationId: model_get_upload_data
      responses:
        "200":
          description: 上传参数
          content:
            application/json:
              schema:
                type: object
      x-relevant: true

  /next/api/gateway/cmdb.cmdb_object.ImportCheckV2/v2/object_import_check:
    post:
      tags: [模型导入导出]
      summary: 导入校验（v2）
      description: 上传文件后校验待导入的模型定义（object_list），返回冲突/错误预览。
      operationId: model_import_check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                object_list:
                  type: array
                  items: { type: object }
                  description: 待导入模型定义（含 attrList/relationList 等）
      responses:
        "200":
          description: 校验结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  /next/api/gateway/cmdb.cmdb_object.ImportV2/v2/object_import:
    post:
      tags: [模型导入导出]
      summary: 执行导入（v2）
      description: 校验通过后正式导入模型定义。
      operationId: model_import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                object_list:
                  type: array
                  items: { type: object }
                ignore_dst_relation:
                  type: boolean
                  description: 是否忽略目标侧关系不存在的情况
      responses:
        "200":
          description: 导入结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  # ============ 模型创建与更新 ============
  /next/api/gateway/cmdb.cmdb_object.Create/object:
    post:
      tags: [模型创建与更新]
      summary: 新建模型
      description: |
        创建新模型。关键字段：
        - `objectId`：模型 ID（1-47 字符，大写字母开头，含大写字母/数字/下划线）
        - `name`：资源名称（显示名）
        - `category`：分类（资源域，如 AI）
        - `system`：所属系统标识
      operationId: model_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                objectId: { type: string, example: LLM_TEST }
                name: { type: string, example: 测试 }
                category: { type: string, example: AI }
                system: { type: string, example: LLM_TEST }
                notifyDenied: { type: boolean, description: 是否屏蔽变更通知 }
                wordIndexDenied: { type: boolean, description: 是否屏蔽全文搜索索引 }
      responses:
        "200":
          description: 创建结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  /next/api/gateway/cmdb.cmdb_object.UpdateV2/v2/object/{objectId}:
    put:
      tags: [模型创建与更新]
      summary: 更新模型（v2，整体更新）
      description: |
        整体更新模型定义。高级设置提交时会调用此接口，写入 `wordIndexDenied`/`notifyDenied`/
        `view` 等聚合字段。
      operationId: model_update
      parameters:
        - name: objectId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wordIndexDenied: { type: boolean }
                notifyDenied: { type: boolean }
                system: { type: string }
                view:
                  type: object
                  description: 视图配置（分组顺序、字段启用等）
      responses:
        "200":
          description: 更新结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  # ============ 字段管理 ============
  /next/api/gateway/cmdb.object_attribute.Create/object/{objectId}/attr:
    post:
      tags: [字段管理]
      summary: 新建属性
      description: |
        为模型新建一个属性（字段）。关键字段：
        - `id`：属性 ID（如 attr1）
        - `name`：属性名称
        - `value.type`：值类型（float/string/datetime/int 等）
        - `tag`：标签分组（如 ["基础"]、["扩展"]）
        - `required`：是否必填
      operationId: attr_create
      parameters:
        - name: objectId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string, example: attr1 }
                name: { type: string, example: 属性1 }
                value:
                  type: object
                  properties:
                    type: { type: string, example: float }
                    default: { nullable: true }
                tag:
                  type: array
                  items: { type: string }
                  example: [基础]
                required: { type: boolean }
      responses:
        "200":
          description: 创建结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  /next/api/gateway/cmdb.cmdb_object.UpdateProperty/object/{objectId}/attr/{attrId}:
    put:
      tags: [字段管理]
      summary: 更新属性
      description: 修改已存在属性的名称、类型、标签等。
      operationId: attr_update
      parameters:
        - name: objectId
          in: path
          required: true
          schema: { type: string }
        - name: attrId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: 属性32 }
                value:
                  type: object
                  properties:
                    type: { type: string }
      responses:
        "200":
          description: 更新结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  /next/api/gateway/cmdb.cmdb_object.DeleteProperty/object/{objectId}/attr/{attrId}:
    delete:
      tags: [模型与字段删除]
      summary: 删除属性
      operationId: attr_delete
      parameters:
        - name: objectId
          in: path
          required: true
          schema: { type: string }
        - name: attrId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 删除结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  # ============ 关系管理 ============
  /next/api/gateway/cmdb.object_relation.Create/object_relation:
    post:
      tags: [关系管理]
      summary: 新建关系
      description: |
        在两个模型间建立关系。关键字段：
        - `left_object_id` / `right_object_id`：左右模型 ID（如 LLM_TEST / AGENT@AI）
        - `left_id`：关系 ID（1-32 字符，字母/数字/下划线）
        - `right_description` / `left_description`：关系描述
      operationId: relation_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                left_object_id: { type: string, example: LLM_TEST }
                right_object_id: { type: string, example: AGENT@AI }
                left_id: { type: string, example: AGENT }
                right_description: { type: string, example: 关联智能体 }
                left_description: { type: string }
      responses:
        "200":
          description: 创建结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  /next/api/gateway/cmdb.object_relation.Update/object_relation/{relationId}:
    put:
      tags: [关系管理]
      summary: 更新关系
      operationId: relation_update
      parameters:
        - name: relationId
          in: path
          required: true
          schema: { type: string }
          description: 关系 ID，如 LLM_TEST_AGENT_TEST_AIII
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                right_description: { type: string }
                left_description: { type: string }
      responses:
        "200":
          description: 更新结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  /next/api/gateway/cmdb.object_relation.DeleteRelation/object_relation/{relationId}:
    delete:
      tags: [模型与字段删除]
      summary: 删除关系
      operationId: relation_delete
      parameters:
        - name: relationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 删除结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  # ============ 模型视图 ============
  /next/api/gateway/logic.cmdb.service/object_view/{objectId}:
    put:
      tags: [模型视图]
      summary: 保存模型视图
      description: 更新模型字段的视图配置（分组顺序 attr_category_order、字段启用等）。
      operationId: model_view_update
      parameters:
        - name: objectId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                view:
                  type: object
                  properties:
                    attr_category_order:
                      type: array
                      items: { type: string }
                      example: [扩展, 基础]
      responses:
        "200":
          description: 保存结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  # ============ 高级设置 ============
  /next/api/gateway/cmdb.cmdb_object.AlertWordIndex/object_word_index/{objectId}:
    post:
      tags: [高级设置]
      summary: 全文搜索屏蔽设置
      description: |
        设置模型及各字段的全文搜索索引屏蔽。`wordIndexDenied` 为模型级屏蔽，
        `attrList` 内按字段设置 `wordIndexDenied`。
      operationId: model_alert_word_index
      parameters:
        - name: objectId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wordIndexDenied: { type: boolean, description: 模型级屏蔽 }
                attrList:
                  type: array
                  items:
                    type: object
                    properties:
                      attrId: { type: string }
                      wordIndexDenied: { type: boolean }
      responses:
        "200":
          description: 设置结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  /next/api/gateway/cmdb.cmdb_object.AlertNotifyDenied/object_notify_denied/{objectId}:
    put:
      tags: [高级设置]
      summary: 变更通知屏蔽设置
      description: 设置模型及各字段的实例变更通知屏蔽（日志屏蔽）。
      operationId: model_alert_notify_denied
      parameters:
        - name: objectId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notifyDenied: { type: boolean, description: 模型级屏蔽 }
                attrList:
                  type: array
                  items:
                    type: object
                    properties:
                      attrId: { type: string }
                      notifyDenied: { type: boolean }
      responses:
        "200":
          description: 设置结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  # ============ 模型与字段删除 ============
  /next/api/gateway/cmdb.cmdb_object.DeleteObject/object/{objectId}:
    delete:
      tags: [模型与字段删除]
      summary: 删除模型
      description: |
        删除整个模型（含所有字段、关系、实例），不可恢复。
        前端通常要求二次确认（输入模型 ID）。
      operationId: model_delete
      parameters:
        - name: objectId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 删除结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

components:
  schemas:
    CmdbResult:
      type: object
      description: EasyOps CMDB 通用响应包装
      properties:
        code:
          type: number
          description: 业务码，0 表示成功
          example: 0
        error:
          type: string
          description: 错误信息（成功时为空）
          example: ""
        codeExplain:
          type: string
          description: 业务码说明（创建类接口常见）
          example: ""
        message:
          type: string
          description: 错误消息（成功时为空）
          example: ""
        data:
          description: 业务数据（具体结构见各接口）
      required: [code]
