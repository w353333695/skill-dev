name: createProxySetting
module: proxy
method: POST
path: /api/flowable_service/v1/personal_center/proxy_setting
gateway_path: /next/api/gateway/flowable_service.personal_center.CreateProxySetting/api/flowable_service/v1/personal_center/proxy_setting
