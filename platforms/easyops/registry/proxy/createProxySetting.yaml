request:
  required:
  - name
  - category
  - status
  - proxyConfigs
  properties:
    name:
      type: string
      desc: 代理规则名称
    category:
      type: string
      desc: 适用服务分类 ID
    status:
      type: string
      desc: 状态（enabled=启用）
    isGlobal:
      type: boolean
      desc: 是否全权代理人（true 时 serviceIds 可为空，代理所有服务）
    serviceIds:
      type: string[]
      desc: 适用服务实例 ID 列表（isGlobal=true 时为空）
    creator:
      type: string
      desc: 创建者用户名
    proxyConfigs:
      type: array
      desc: 代理人配置列表
outputs:
  instanceId:
    jsonpath: $.data.instanceId
    desc: 新建成功的代理人协议 ID
requires:
- category 须为已存在的服务分类 instanceId
- serviceIds 须为已存在服务实例 instanceId
- proxyConfigs 中的代理人须为已存在用户
rollback:
  api: deleteProxySetting
  param_from_output: instanceId
