name: updateStandardField
module: standard_field
method: PUT
path: /api/flowable_service/v1/standard_field/{fieldId}
gateway_path: /next/api/gateway/logic.flowable_service/api/flowable_service/v1/standard_field/{fieldId}
service: logic.flowable_service
side_effect: update
path_source: gateway_strip
path_confidence: medium
tags:
- 标准字段
- 更新
- 写操作
summary: 更新标准字段
description: '按 fieldId 更新标准字段定义。body 结构与创建一致（key/name/kind/sourceType/sourceConfig/required/readonly/default/desc/domainModelIds）。

  编辑页修改字段说明、属性配置等后点击「保存」提交。

  '
request:
  required:
  - fieldId
  - key
  - name
  - kind
  - sourceType
  properties:
    fieldId:
      type: string
      desc: 字段实例 ID
    key:
      type: string
      desc: 唯一标识（数字、大小写字母、下划线）
    name:
      type: string
      desc: 字段名称
    kind:
      type: string
      desc: 字段类型（USER_SELECTOR=用户选择器，INPUT=单行文本 等）
    sourceType:
      type: string
      desc: 数据源类型（customize=自定义）
    sourceConfig:
      type: string
      desc: 字段属性配置 JSON 字符串（key/modelField/label/type + 类型相关属性）
    desc:
      type: string
      desc: 字段说明
    required:
      type: boolean
      desc: 是否必填
    readonly:
      type: boolean
      desc: 是否只读
    default:
      type: string
      desc: 默认值
    domainModelIds:
      type: array
      desc: 关联领域模型 ID 列表
outputs:
  instanceId:
    jsonpath: $.data.instanceId
    desc: 更新后的字段实例 ID
requires:
- fieldId 须是已存在的标准字段 instanceId
- sourceConfig 须为合法 JSON 字符串
rollback:
  api: getStandardField
  param_from_output: instanceId
examples:
- fieldId: 656788ffdaf71
  key: ITSC_handler
  name: 处理人
  kind: USER_SELECTOR
  sourceType: customize
  sourceConfig: '{"key":"ITSC_handler","modelField":"ITSC_handler","label":"处理人","type":"USER_SELECTOR","multiLimit":3,"displayFields":["nickname","tel"]}'
  desc: 工单处理人
  required: true
  readonly: false
  default: ''
  domainModelIds: []
confidence:
  request: high
  module: high
  outputs: high
  tags: high
  summary: high
endpoint:
  contract_ref: ''
  mode: easyops_gateway
