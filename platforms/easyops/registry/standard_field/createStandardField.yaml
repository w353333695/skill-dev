name: createStandardField
module: standard_field
method: POST
path: /api/flowable_service/v1/standard_field
gateway_path: /next/api/gateway/logic.flowable_service/api/flowable_service/v1/standard_field
service: logic.flowable_service
side_effect: create
path_source: backend_contract
path_confidence: high
tags:
- 标准字段
- 创建
- 写操作
summary: 新建标准字段
description: '新建标准字段。填写唯一标识（key）、字段名称（name）、字段类型（kind），配置 sourceConfig 属性后提交。

  sourceConfig 为字段属性配置 JSON 字符串（含 key/modelField/label/type 及类型相关属性）。

  kind 为字段类型枚举：USER_SELECTOR（用户选择器）、INPUT（单行文本）等。响应 data.instanceId 为新建字段 ID。

  '
request:
  required:
  - key
  - name
  - kind
  - sourceType
  properties:
    key:
      type: string
      desc: 唯一标识（数字、大小写字母、下划线）
    name:
      type: string
      desc: 字段名称
    kind:
      type: string
      desc: 字段类型（USER_SELECTOR=用户选择器，INPUT=单行文本 等）
    sourceType:
      type: string
      desc: 数据源类型（customize=自定义）
    sourceConfig:
      type: string
      desc: 字段属性配置 JSON 字符串（key/modelField/label/type + 类型相关属性）
    desc:
      type: string
      desc: 字段说明
    required:
      type: boolean
      desc: 是否必填
    readonly:
      type: boolean
      desc: 是否只读
    default:
      type: string
      desc: 默认值
    domainModelIds:
      type: string[]
      desc: 关联领域模型 ID 列表
outputs:
  instanceId:
    jsonpath: $.data.instanceId
    desc: 新建字段实例 ID
requires:
- sourceConfig 须为合法 JSON 字符串
- domainModelIds（若非空）每个 id 须是已存在的领域模型 instanceId
rollback:
  api: deleteStandardField
  param_from_output: instanceId
examples:
- key: ITSC_handler
  name: 处理人
  kind: USER_SELECTOR
  sourceType: customize
  sourceConfig: '{"key":"ITSC_handler","modelField":"ITSC_handler","label":"处理人","type":"USER_SELECTOR","multiLimit":3,"displayFields":["nickname","tel"]}'
  desc: 工单处理人
  required: true
  readonly: false
  default: ''
  domainModelIds: []
confidence:
  request: high
  module: high
  outputs: high
  tags: high
  summary: high
endpoint:
  contract_ref: logic.flowable_service|POST|/api/flowable_service/v1/standard_field
  mode: easyops_gateway
