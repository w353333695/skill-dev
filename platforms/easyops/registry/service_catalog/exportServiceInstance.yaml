name: exportServiceInstance
module: service_catalog
method: GET
path: /api/flowable_service/v1/export/service_instance
gateway_path: /next/api/gateway/logic.flowable_service/api/flowable_service/v1/export/service_instance
service: logic.flowable_service
side_effect: read
path_source: backend_contract
path_confidence: high
tags:
- 服务
- 导出
- tar.gz
- 备份
- 离线迁移
summary: 导出服务为 tar.gz（含流程/表单/绑定/脚本，离线迁移用）
description: |
  导出服务实例为 tar.gz 压缩包（Content-Type: application/x-compressed-tar），含服务关联的全套资源：
  服务实例/流程定义/流程版本(bpmnXML+processSetting+scriptSettings)/表单定义+版本(formDefinition)/节点-表单绑定关系/触发器/标准字段等（按 CMDB 关系图深度遍历导出），脚本工具单独以 tools/<toolId>.tar.gz 形式打入包内。
  用途：生产环境无法联网时，导出 tar.gz 离线上传（配 importServiceInstance 导入）。
  2026-07-28 实测：GET 8134 内网，instanceIds=服务ID,isMain=true 返回 11383 bytes tar.gz。
  导出包结构：cmdb_service_instance.json（{version,data:[{ObjectID,Depth,RelationList,Result}]}，按 CMDB 模型分组）+ tools/<toolId>.tar.gz。
request:
  required:
  - instanceIds
  properties:
    instanceIds:
      type: comma_separated_string
      desc: 服务实例 ID 列表，逗号分隔（导出多个服务）
    isMain:
      type: bool
      desc: 是否只导出流程定义主版本（true=只主版本，false=全部版本）
outputs: {}
requires:
- instanceIds 须是已存在的服务实例 ID
rollback: null
examples: []
confidence:
  module: high
  outputs: high
  requires: high
  summary: high
  tags: high
  request: high
endpoint:
  contract_ref: logic.flowable_service|GET|/api/flowable_service/v1/export/service_instance
  mode: easyops_internal
source:
  backend_contract_file: platforms/easyops/sources/backend/parsed/contracts.yaml
  contract_operation_key: logic.flowable_service|GET|/api/flowable_service/v1/export/service_instance
  verified_at: '2026-07-28'
registered_at: '2026-07-28'
