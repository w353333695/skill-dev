name: tool_list
module: autoops_tool
method: GET
path: /tools
gateway_path: /next/api/gateway/tool.basic.ListTool/tools
service: logic.tool_service
side_effect: read
path_source: backend_contract
path_confidence: high
tags:
- 工具库
- 工具列表
- 查询
summary: 查询工具列表
description: 查询工具（运维脚本）列表，返回 `list`（工具数组）与 `total`（总数）。
request:
  required: []
  properties:
    page:
      type: integer
      desc: 页码
    pageSize:
      type: integer
      desc: 页大小
    detail:
      type: boolean
      desc: 是否返回详细信息
    plugin:
      type: boolean
      desc: 是否返回插件
    toolId:
      type: string
      desc: 工具 id，多个用逗号分隔
    category:
      type: string
      desc: 工具分类
    name:
      type: string
      desc: 工具名称（模糊匹配）
    permissions:
      type: string
      desc: 用户对工具具有的权限; 用","分割(read=查看, update=更新, delete=删除, execute=执行, execResult=执行结果查看,
        rootExec=Root执行)
      _source: contract
    onlyProduction:
      type: bool
      desc: 仅选择有生产版本的工具 true | false. 默认是false
      _source: contract
    showInvisible:
      type: bool
      desc: 显示listVisible=false的工具; true=显示 | false=不显示. 默认是false
      _source: contract
    viewWhitelist:
      type: bool
      desc: 是否返回白名单信息 默认是false
      _source: contract
    tags:
      type: string
      desc: 标签，用","分隔，标签只支持字符串
      _source: contract
    fields:
      type: string
      desc: '指定查询字段,逗号隔开,eg: "fields=toolId,name"，支持如下字段

        "toolId", "name", "creator", "category", "icon", "style", "disable", "tags",
        "vId",

        "vName", "type", "functionType", "checkInfo", "envType", "memo"

        '
      _source: contract
    execPreAuthOnly:
      type: bool
      desc: 只查询执行前校验的流程
      _source: contract
    creatorOnly:
      type: bool
      desc: 只查询由当前用户创建的工具（即creator是当前用户的工具）
      _source: contract
    needMyApprovalOnly:
      type: bool
      desc: 只查询待我审批的工具（若工具状态为待审批，且未指定审批用户，则也在返回列表中）
      _source: contract
outputs:
  plugins:
    jsonpath: $.data.plugins
    desc: 插件列表
  total:
    jsonpath: $.data.total
    desc: 总数
  list_full:
    jsonpath: $.data.list
    desc: 列表全量
  list_ids:
    jsonpath: $.data.list
    desc: 工具 toolId 列表（配合 ${s.list_full.toolId} 投影）
requires: []
rollback: null
examples: []
confidence:
  request: medium
  module: high
  outputs: high
  tags: high
  summary: high
endpoint:
  contract_ref: logic.tool_service|GET|/tools
  mode: easyops_gateway
