name: tool_create
module: autoops_tool
method: POST
path: /tools
gateway_path: /next/api/gateway/tool.basic.CreateTool/tools
service: logic.tool_service
side_effect: create
path_source: backend_contract
path_confidence: high
tags:
- 工具库
- 新建工具
- 创建
summary: 新建工具
description: |
  创建工具（内网直连 tool_service 8181，POST /tools）。关键字段：
  - type（必填，脚本语言如 python）——⚠️ 服务端认 type，卡片下方 request.properties 的 toolType 字段服务端不认（POST 不带 type 会 400 "必填key type 不存在"）。
  - content：脚本内容（字符串）。
  - sandboxRun：是否沙箱执行（流程节点脚本/表单事件脚本必须 true，否则执行报"工具未设置沙箱执行"）。
  - inputs/outputs：可省（节点脚本入参由流程引擎注入、输出用标记协议）。
  返回 data.toolId（32位hex）。2026-07-28 实测：POST 8181 /tools 带 {name,type:python,content,sandboxRun:true} 返回 200 code=0 toolId。
  免打包创建工具详见 modules/autoops_tool/tool-package-dev.md §4.1。
request:
  required: []
  properties:
    name:
      type: string
      desc: ''
    toolType:
      type: string
      desc: ''
    content:
      type: string
      desc: 脚本内容
    category:
      type: string
      desc: ''
    inputs:
      type: array
      desc: ''
    outputs:
      type: array
      desc: ''
outputs:
  instanceId:
    jsonpath: $.data.toolId
    desc: 工具 id
  detail:
    jsonpath: $.data
    desc: 创建结果
requires: []
rollback:
  api: tool_delete
  params:
  - param_key: toolId
    from_output: instanceId
    from_field: ''
examples: []
confidence:
  request: high
  module: high
  outputs: high
  tags: high
  summary: high
  requires: medium
  rollback: medium
endpoint:
  contract_ref: logic.tool_service|POST|/tools
  mode: easyops_gateway
