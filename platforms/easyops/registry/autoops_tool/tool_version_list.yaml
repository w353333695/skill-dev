name: tool_version_list
module: autoops_tool
method: GET
path: /tools/{toolId}/versions
gateway_path: /next/api/gateway/tool.basic.GetToolVersions/tools/{toolId}/versions
service: logic.tool_service
side_effect: read
path_source: backend_contract
path_confidence: high
tags:
- 工具库
- 工具版本
- 版本列表
- 查询
summary: 查询工具版本列表
description: 查询指定工具的版本列表，返回 `list`（版本数组）与 `total`（版本总数）。
request:
  required:
  - toolId
  properties:
    toolId:
      type: string
      desc: 工具 id
    envType:
      type: string
      desc: 版本类型（development=开发 / production=生产）
    limit:
      type: integer
      desc: 限制返回数量（0 表示不限制）
    startTime:
      type: string
      desc: 开始时间
    endingTime:
      type: string
      desc: 结束时间
    pagingTime:
      type: string
      desc: 分页开始时间（默认最新时间）
    fields:
      type: string
      desc: 返回的属性 keys（逗号分割）
    orderBy:
      type: string
      desc: 排序字段
    orderType:
      type: string
      desc: 排序类型（DESC 降序 / ASC 升序）
outputs:
  total:
    jsonpath: $.data.total
    desc: 版本总数
  list_full:
    jsonpath: $.data.list
    desc: 列表全量
  list_ids:
    jsonpath: $.data.list
    desc: 版本 toolId/vId 列表
requires: []
rollback: null
examples: []
confidence:
  request: high
  module: high
  outputs: high
  tags: high
  summary: high
endpoint:
  contract_ref: logic.tool_service|GET|/tools/{toolId}/versions
  mode: easyops_gateway
