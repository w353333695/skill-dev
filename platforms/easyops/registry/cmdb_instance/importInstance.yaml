name: importInstance
module: cmdb_instance
method: POST
path: /object/{objectId}/instance/_import
gateway_path: /next/api/gateway/cmdb.instance.ImportInstance/object/{objectId}/instance/_import
service: logic.cmdb.service
side_effect: create
path_source: backend_contract
path_confidence: high
tags:
- CMDB
- 实例
- 导入
summary: 导入实例
description: 提交导入数据（也用于「批量编辑」）：按 `keys`（匹配键，如 instanceId）
request:
  required: []
  properties:
    keys:
      type: string[]
      desc: 匹配键字段名
    datas:
      type: map[]
      desc: 数据行（每行为一个实例的部分字段 + 匹配键值）
    objectId:
      type: object_id
      desc: 实例所属的模型ID
      _source: contract
    importMetadata:
      type: bool
      desc: 是否导入metadata字段,ctime,creator,创建实例为true时将会默认填充mtime,modifier字段
      _source: contract
    ignoreReadonlyFields:
      type: bool
      desc: 更新时是否忽略只读字段
      _source: contract
    disableNestedCreateInstance:
      type: bool
      desc: 禁止导入时通过关系嵌套创建实例
      _source: contract
outputs:
  detail:
    jsonpath: $.data
    desc: 导入结果明细
  insert_count:
    jsonpath: $.data.insert_count
    desc: 新增条数
  update_count:
    jsonpath: $.data.update_count
    desc: 更新条数
  failed_count:
    jsonpath: $.data.failed_count
    desc: 失败条数
requires:
- objectId 为已存在模型
rollback: null
examples: []
confidence:
  request: medium
  module: high
  outputs: high
  tags: high
  summary: high
  requires: medium
  rollback: medium
endpoint:
  contract_ref: logic.cmdb.service|POST|/object/{objectId}/instance/_import
  mode: easyops_gateway
