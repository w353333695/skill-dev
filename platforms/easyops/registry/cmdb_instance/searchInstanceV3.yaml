name: searchInstanceV3
module: cmdb_instance
method: POST
path: /v3/object/{objectId}/instance/_search
gateway_path: /next/api/gateway/cmdb.instance.PostSearchV3/v3/object/{objectId}/instance/_search
service: logic.cmdb.service
side_effect: read
path_source: backend_contract
path_confidence: high
tags:
- CMDB
- 实例
- 搜索
- 查询
summary: 搜索模型实例(v3)
description: 按字段、关键词、高级条件（aq）搜索某模型的实例列表，支持分页、排序、关系展开。
request:
  required:
  - fields
  properties:
    fields:
      type: string[]
      desc: 返回的字段列表（必填，值可为空数组 []）
    page:
      type: number
      desc: 页码
    page_size:
      type: number
      desc: 页大小
    sort:
      type: object[]
      desc: 排序规则
    ignore_missing_field_error:
      type: boolean
      desc: 是否忽略fields有不存在的字段的报错
    relation_limit:
      type: number
      desc: 限制fields所带出的关系的数量， 0为不限制，全局配置
    objectId:
      type: object_id
      desc: 模型对象ID
      _source: contract
    query:
      type: map
      desc: 'e.g.: { name: { $like: ''%q%'' } }, { $or: [{ name: { $like: ''%q%''
        }}] }'
      _source: contract
    query_context:
      type: map
      desc: '查询条件模板上下文 模板格式为 @{key} ,e.g.: query:{ name: { $like: ''%@{key1}%''},
        int: ''@{key2}'' }, query_context:{ key1: ''val1'', ''key2'': 12 }, query则会被转换成{
        name: { $like: ''%val1%'' }, int: 12 }, 如果key1对应的值为null或者空字符串, query则会被转换成{
        int: 12 }'
      _source: contract
    only_my_instance:
      type: bool
      desc: 当为 true 时，只搜索与我相关实例
      _source: contract
    permission:
      type: string[]
      desc: '按照权限过滤(通用实例都有 read， update， delete 权限控制， 主机实例在通用实例权限基础上有额外的 operate 权限，
        应用实例在通用实例权限基础上有额外的 developClusterOperate， testClusterOperate， prereleaseClusterOperate，
        productionClusterOperate 权限) e.g.: [ "operate", "update" ]'
      _source: contract
    limitations:
      type: object[]
      desc: 单独指定关系的limit与sort
      _source: contract
    metrics_filter:
      type: object
      desc: 指标数据查询
      _source: contract
    fields_relation_filter:
      type: map
      desc: 'fields_relation_filter,是获取实例关系字段时，只获取指定条件的对端实例。

        fields_relation_filter为 key -> filter, 其中key必须为关系（支持多层）或者边属性@结尾，filter语法同上面的实例filter。

        如: APP <-cluster---app-> CLUSTER <-host---cluster-> HOST 中

        支持： {"cluster": {"$or":[{"name":"aaa"},{"ip":"1"}]},"cluster.@":{"name":"aaa","ctime":"xxx"},"cluster.host":{...}}

        上面过滤，则获取的数据只包含cluster名字为aaa或者ip为1 的 同时边属性满足上面的条件的（目前边属性仅支持 and 逻辑，不支持 or 逻辑），cluster.host同理。

        不支持：{"cluster.name":"aaa"}，key只能为关系的out_id 或者 多层out_id，最后一层支持.@表示该关系上的边属性。'
      _source: contract
outputs:
  list_full:
    jsonpath: $.data.list
    desc: 实例列表
  list_ids:
    jsonpath: $.data.list
    desc: 实例 instanceId 列表
  total:
    jsonpath: $.data.total
    desc: 总数
requires:
- objectId 为已存在的模型 ID
rollback: null
examples: []
confidence:
  request: medium
  module: high
  outputs: high
  tags: high
  summary: high
  requires: medium
  rollback: medium
endpoint:
  contract_ref: logic.cmdb.service|POST|/v3/object/{objectId}/instance/_search
  mode: easyops_gateway
