name: inspection_debug_collector
module: autoops_inspection
method: POST
path: /api/v1/inspection/{pluginId}/collector-debug
gateway_path: ''
service: logic.inspection
side_effect: create
path_source: backend_contract
path_confidence: high
tags:
- AutoOps
- 巡检
- 套件
- 调试
summary: 调试巡检采集脚本
description: 在 target 关联的主机上真实下发执行采集脚本（非 dry-run）。调试的是请求里的 content（非已上架套件），pluginId
  仅用于按套件关系定位主机。需显式传 content+script。
request:
  required:
  - pluginId
  - target
  - content
  - script
  properties:
    pluginId:
      type: string
      desc: 套件 id（路径），仅用于定位套件关系找主机
    target:
      type: string
      desc: 执行目标实例 ID（objectId 模型下真实 CMDB 实例，13 位十六进制）
    content:
      type: string
      desc: 采集脚本内容（collectors/script.py 的 content 字段，JSON 转义串原样传入）
    script:
      type: string
      desc: 脚本类型（python/shell），与 content 对应
    args:
      type: map[]
      desc: 脚本入参覆盖 [{key,value}]，调试用临时值不改套件定义
outputs:
  status:
    jsonpath: $.data.status
    desc: ok/failed/unknown（仅指执行+解析成功，采全与否看 metric_groups）
  msg:
    jsonpath: $.data.msg
    desc: 执行日志（脚本 stdout/stderr、解析过程，排查脚本问题第一现场）
  metric_groups:
    jsonpath: $.data.metric_groups
    desc: 解析出的指标组数据（metric_group_status ok/missing 判采全）
requires:
- pluginId 为已存在套件
- target 为 objectId 下真实 CMDB 实例且关联到有 agent 的主机
- 套件 relationidwithhost/relationid 配置正确（否则报"没有找到套件关联的主机"）
rollback: null
examples: []
confidence:
  request: medium
  module: high
  outputs: high
  tags: high
  summary: high
  requires: medium
  rollback: medium
endpoint:
  contract_ref: logic.inspection|POST|/api/v1/inspection/{pluginId}/collector-debug
  mode: easyops_internal
