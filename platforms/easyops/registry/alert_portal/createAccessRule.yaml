name: createAccessRule
module: alert_portal
method: POST
path: /api/v1/access_rule
gateway_path: /api/gateway/alert_portal.access_rule.CreateAccessRule/api/v1/access_rule
service: logic.alert_portal
side_effect: create
path_source: backend_contract
path_confidence: high
tags:
- 三方告警接入
- 接入规则
- 资源关联
- 重定级
- alert_portal
summary: 新建事件接入规则(资源关联 cmdb-translate / 告警重定级)
description: '在某接入策略下新建一条接入规则。type=cmdb-translate 为资源关联规则(IT资源翻译)，告警重定级类型为重定级规则。

  handlerId=所属接入策略实例id(_EVENT_ACCESS_HANDLER)。资源关联 rule 含 object_id/query/values；重定级
  rule 含 filters/level。

  字段/结构见 knowledge/modules/alert_portal/third-party-alarm-access.md §5.5/§6.2。

  '
request:
  required:
  - name
  - type
  - handlerId
  - rule
  properties:
    name:
      type: string
      desc: 规则名
    type:
      type: string
      desc: 规则类型：cmdb-translate(资源关联) / 告警重定级
    handlerId:
      type: string
      desc: 所属接入策略实例 id(_EVENT_ACCESS_HANDLER)
    rule:
      type: object
      desc: 规则内容；资源关联含 object_id/query/values，重定级含 filters/level
    ignore_fail:
      type: boolean
      desc: 匹配失败是否忽略
outputs:
  detail:
    jsonpath: $.data
    desc: 创建结果(含规则实例 instanceId)
  instanceId:
    jsonpath: $.data.instanceId
    desc: 规则实例 id，更新/删除用
requires:
- handlerId 须为已存在的接入策略实例 id
- 资源关联/重定级 rule 结构见 knowledge/modules/alert_portal/third-party-alarm-access.md §5/§6
rollback: null
examples:
- name: 翻译规则
  type: cmdb-translate
  handlerId: 5a73dd16cf738
  ignore_fail: true
  rule:
    object_id: HOST
    query:
      ip:
        $eq: '@{ip}'
    values:
    - key: ip
      value_path: extInfo.alertInfo.labels.instance
      match_regex: (?:[0-9]{1,3}\.){3}[0-9]{1,3}
      match_multi: false
confidence:
  request: high
  outputs: medium
  requires: high
  rollback: low
  module: high
  tags: high
  summary: high
