    showName:
      type: string
      desc: 展示名称，为空则显示 source
    memo:
      type: string
      desc: 备注
outputs:
  accessId:
    jsonpath: $.data.accessId
    desc: 接入 ID，拼接 webhook 地址用
  detail:
    jsonpath: $.data
    desc: 注册返回全量
