  module: ''
  title: 生成算法精确性
  detail: 已确认：后端 GenInstanceId() 取微秒级时间戳(UnixNano()/1000)，同微秒内自增1，格式化为13位小写hex。原推断「MongoDB
    ObjectId 去时间戳前缀」错误，已订正。
