- name: api-calling
  file: concepts/api-calling/api-calling.md
  tags:
  - API调用
  - 脚本开发
  - 鉴权
  - 内网直连
  - OpenAPI
  - AK/SK
  - HMAC-SHA1
  - 签名
  - 翻页
  - 跨模块
  completeness: partial
  gaps:
  - OpenAPI(AK/SK)签名模式未持有凭证实测（内网模式已真调验证）
  - PORT_APP_MAP 仅含 8079→cmdbservice，其他端口的 app_name 映射待补
  last_verified: '2026-07-23'
  note: EasyOps 平台 API 调用脚本开发参考（客户自研脚本仿照用）。三种访问方式：内网直连 (host:port + user/org 头，推荐)/网关代理(80端口+cookie，不宜脚本依赖)/OpenAPI签名(AK/SK+HMAC-SHA1，跨网络)。
    同目录 api-samples.py 为可跑参考实现（EasyOpsClient：双模式鉴权、签名算法、自动翻页、CMDB搜索/计数具体方法）。 切面对照：本概念面向「客户独立脚本」（脱离skill体系），registry卡片+execute_dag
    已封装同样三种方式供编排调用—— 编排走卡片，独立脚本仿照本样例。内网模式已真调验证，OpenAPI签名未实测。 交付脚本形态规范（独立调用脚本必遵）：①独立可执行自包含（不
    import 项目内模块，客户端传输层完整内联 EasyOpsClient 类，禁重构骨架） ②不动态引用 api_calling ③默认不用 argparse（参数放 if __name__=="__main__"
    下）。
