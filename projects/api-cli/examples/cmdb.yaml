spec: api-cli/v1
service:
  name: cmdb
  version: "1.0"
  default_endpoint: backend
  endpoints:
    backend:
      base_url: ${CMDB_BACKEND_URL}
      auth: backend-sign
      path_prefix: /api/v1
    frontend:
      base_url: ${CMDB_FRONTEND_URL}
      auth: frontend-token
      path_prefix: /web/api/v1
resources:
  inst:
    description: CMDB 实例
    path: /instances
    singular: instance
    parent_key: instance_id # 声明在 parent 上：子 resource（relation）path 里的 {instance_id} 占位由此键注入
    operations:
      create: { method: POST, path: "", description: 创建实例 }
      read:   { method: GET, path: "/{id}", description: 读取单个实例, params: { id: { in: path, type: string, required: true, description: 实例 ID } } }
      update: { method: PATCH, path: "/{id}", description: 更新实例, params: { id: { in: path, required: true } } }
      delete: { method: DELETE, path: "/{id}", description: 删除实例, params: { id: { in: path, required: true } } }
      search:
        description: 搜索实例（cursor 分页）
        method: POST
        path: /search
        pagination:
          type: cursor
          items_path: data.list
          next_token_path: data.next
          has_more_path: data.next
    children:
      relation:
        description: 实例的关系
        path: "/{instance_id}/relations"
        operations:
          create: { method: POST, path: "", description: 为实例创建一条关系 }
          read:   { method: GET, path: "/{id}", description: 读取实例的某个关系, params: { id: { in: path, required: true, description: 关系 ID } } }
