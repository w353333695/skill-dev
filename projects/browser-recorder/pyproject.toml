[project]
name = "browser-recorder"
version = "0.1.0"
description = "跨平台、平台中性的浏览器操作录制/回放/导出 CLI"
# 下限 3.9：代码硬底是 3.7（from __future__ annotations + dataclasses），
# 但 3.9 是依赖健康甜点（playwright 1.44+、pillow 10+ 原生支持）；
# 3.7/3.8 需 EOL 老依赖 + 老 chromium 不可靠，不开放。
requires-python = ">=3.9"
dependencies = [
    # macOS 13 (Ventura) 专用上限：Playwright 1.56+ 的 chromium 不再为 mac13-arm64 提供构建，
    # 在 macOS 13 上会报 "does not support chromium on mac13-arm64"。
    # 升级到 macOS 14+ 后可去掉此上限。详见 microsoft/playwright#19586。
    "playwright>=1.44,<1.56",
    "pillow>=10.0",
    "imageio-ffmpeg>=0.5",
    "click>=8.1,<8.2",  # 8.2 起要求 Python>=3.10，卡住以保证 3.9 可用
    "pyyaml>=6.0",
]

[project.scripts]
browser-recorder = "browser_recorder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["browser_recorder"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
