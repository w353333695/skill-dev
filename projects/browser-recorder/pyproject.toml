[project]
name = "browser-recorder"
version = "0.1.0"
description = "录制浏览器操作, 生成图文手册 + 结构化记录 + 请求日志, 支持回放"
requires-python = ">=3.9,<3.13"
dependencies = [
    "click>=8.1,<8.2",
    "playwright>=1.56,<1.61",  # 1.61+ 要求 py>=3.10
    "pillow>=10.0",
]

[project.scripts]
browser-recorder = "browser_recorder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["browser_recorder"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
markers = [
    "e2e: 端到端测试（需要 chromium，较慢）",
]
