# =============================================================================
# EasyOps AutoOps 工具管理（tool_service）—— api-cli 集中清单
# -----------------------------------------------------------------------------
# 三层体系（+ 执行/导入导出两配套层）：
#   ① tool        工具配置层（ToolConfig）—— 工具本身的 CRUD（basic 模块）
#   ② tool_version 工具版本层（ToolVersion）—— 版本是 Tool 的子结构，无独立写端点
#                  （新建版本 = tool.update 改 version 字段触发派生）；本 resource 只读列表
#   ③ tool_lib    工具库层（ToolLib）—— 动态库 CRUD（lib 模块，仅 python 脚本类型）
#   ④ tool_execution 执行层 —— run_cmd 类工具的执行 + 结果轮询（execute 模块）
#   ⑤ tool_package   导入导出层 —— 工具包 .tar.gz 的导出/导入/预检（import_export 模块）
#
# 数据来源（契约 vs 后端落差大，以后端源码为准）：
#   • 契约  data/api-doc/autoops-tool.json（EAML v2.0，仅 10 端点，且把 3 层压扁成 Tool
#     一个资源——缺 list/delete/版本/执行/lib，全靠源码补）
#   • 后端  data/sources/backend/AutoOps/tool_service/
#        - basic/route.go + route_rewrite.go          （工具 CRUD + 版本列表）
#        - execute/route.go                            （执行 + 结果轮询）
#        - lib/route.go                                （工具库 CRUD）
#        - import_export/route.go + route_rewrite.go   （导入导出）
#   • 权威结构体 internal/types/tool/{tool_config,tool_version,tool_input,tool_output}.go
#     （带 export:"dat|config" tag，决定字段序列化进工具包哪个文件，比契约准）
#
# 接入面：
#   • backend —— 直连 tool_service :8181（HTTP，无 path 前缀）。rewrite 中间件两边都挂，
#     故对外用复数 /tools/:toolId 直连也能命中（原始注册是单数 /tool/:toolId）。**默认走 backend**。
#   • frontend —— 走前端网关（${EASYOPS_AUTOOPS_FRONTEND_URL}，值在部署根 env.d）+ Host 头。网关按 *每个 API* 路由
#     （per-API path_prefix），一个 endpoint 只能持一个前缀，对 tool 域多 verb 不通用。
#     仅作备选，默认不用。
#
# 鉴权：auth: easyops-cookie（部署根 auth.d/easyops-cookie.yaml，API_CLI_AUTH_D 指向；原 home 目录位置已废弃；provider=cookie，
#   持 PHPSESSID）。与 cmdb 完全一致——backend/frontend 均用同一 cookie。
#   ⚠️ cookie 不够！直连后端还要 org+user 两个 header（orguser 中间件，
#      cmd/tool_service/main.go:624；缺一报 empty org/user）。见 endpoint.headers。
#
# ⚠️ api-cli 能力边界（影响 tool_package）：
#   • params.in 仅 path/query/header/body，**无 formData** → multipart 上传（import）api-cli
#     做不了真调，用 --print-curl 生成 curl 或走 Python SDK（sdk/easyops_client.py）。
#   • response 仅 io.ReadAll + 宽松 JSON 解码，**无 --output 存文件** → tar.gz 二进制流
#     （export）api-cli 直接调会乱码，走 Python SDK 流式下载或 --print-curl + curl。
#   故 tool_package.export/import 的 description 标注「api-cli 仅预览，真调走 SDK」。
#
# 知识按 SKILL.md 设计分文件存放（本目录是外接 EasyOps AutoOps 唯一真相来源，勿依赖记忆）：
#   接入/端口/org/user/run_cmd 语义 → systems.yaml runtime；
#   工具结构/副作用/内置变量/工具包格式 → objects.yaml；
#   字段锚 toolId/vId/versionId/execId → entities.yaml；建/改/删/执行流程 → flows/；
#   索引导航 → README.md。
# =============================================================================
spec: api-cli/v1
service:
  name: easyops-autoops
  version: "1.0"
  default_endpoint: backend
  endpoints:
    backend:
      base_url: ${EASYOPS_AUTOOPS_BACKEND_URL}        # 值在部署根 env.d/demo.env（含 IP+端口）；端口事实见 systems.yaml runtime.ports.autoops_backend
      host: admin.easyops.local                        # IP 直连，Host 由 endpoint.Host 注入
      path_prefix: ""                                  # 路由挂在 gin root（无前缀）
      auth: none                                       # 直连后端：auth=none 跳过 cookie 加载（engine/execute.go:135）。org/user 由 endpoint.headers 注入，独立于 auth（engine/request.go:40-43）。实测 autoops:8181 无 cookie 直 200（见 systems.yaml cookie_optional_direct）。
      headers:                                         # endpoint 级固定 header（每请求自动注入）
        org: ${EASYOPS_ORG}                            # EasyOps 租户 org（系统自带 0/1/2 禁动）；值在部署根 env.d/demo.env
        user: ${EASYOPS_USER}                          # EasyOps 用户标识（模型系统管理员=easyops 写权限）；值在部署根 env.d/demo.env
    frontend:
      base_url: ${EASYOPS_AUTOOPS_FRONTEND_URL}        # 值在部署根 env.d/demo.env（前端网关完整 URL）
      host: admin.easyops.local
      auth: easyops-cookie
      # path_prefix 网关 per-API 路由（形如 /next/api/gateway/logic.tool_service.<Verb>），
      # 一个 endpoint 只能持一个前缀，对 tool 域多 verb 不通用 → 默认走 backend。

# -----------------------------------------------------------------------------
# 资源 1：tool —— 工具配置层 CRUD（basic 模块）。3 层体系的核心。
# 路径 disparate（/tools、/tools/:toolId 无公共前缀可提），故 resource.path 留空，
# 每个 operation 持完整路径。复数 /tools/:toolId 经 rewrite 中间件命中单数 /tool/:toolId。
# -----------------------------------------------------------------------------
resources:
  tool:
    description: EasyOps 工具（AutoOps）。一个工具 = ToolConfig（配置：name/category/权限/通知…）+ ToolVersion（版本：脚本类型/脚本内容/输入参数/输出定义/绑定库…）。新建工具同时建首个版本；新建版本无独立端点——走 update 改 version 字段触发派生（返回新 vId）。删除是软删（置 delete_me）。工具脚本执行见 tool_execution；工具包导入导出见 tool_package。
    path: ""

    operations:
      # ---------- 列表（GET /tools）—— 场景1/4 找工具 ----------
      list:
        description: "工具列表（分页，支持分类/名称/类型过滤）。前端列表页 ?category=&q= 映射到本接口——注意前端 q 是后端 name 的别名（后端实际参数是 name，做 $like %name% 同时匹配 name 和 memo）。category 含子类展开（传 ITSM 会 $in 其所有子类）。⚠️后端响应是 {code,codeExplain,error,data:{list,total,page,pageSize}} wrapper（取 data.list）；api-cli 调本端点会流式输出 NDJSON（每行一个 Tool——那是 api-cli 的分页输出特性，非后端响应格式）。分页用 page/pageSize query。"
        method: GET
        path: /tools
        params:
          name:     { in: query, type: string, description: "名称关键词，$like 模糊匹配 name + memo（前端 q 别名走这里）" }
          category: { in: query, type: string, description: "分类过滤，含子类展开（如 ITSM 命中 ITSM 及其所有子类）" }
          type:     { in: query, type: string, description: "脚本类型过滤（shell/python/perl/...），空=忽略" }
          page:     { in: query, type: integer, description: "页码，从 1 起" }
          pageSize: { in: query, type: integer, description: "每页条数" }
        response:
          type: object
          description: "标准 wrapper：{ code, codeExplain, error, data: { list, total, page, pageSize } }"
          properties:
            code: { type: integer, description: "0=成功" }
            data:
              type: object
              properties:
                list:
                  type: array
                  description: "工具列表（每条含 toolId/name/category/vId 等摘要）"
                  items: { type: object, additional_properties: true }
                total: { type: integer, description: "总数" }
        pagination:
          type: offset
          page_in: query
          items_path: data.list
          page_param: page
          size_param: pageSize
          size: 20

      # ---------- 详情（GET /tools/:toolId）—— 拿工具完整定义（含 inputs/outputDefs/tableDefs）----------
      get:
        description: 读取单个工具完整详情（ToolConfig + ToolVersion）。vId 支持版本别名：$latest_version（最新版本）/ $latest_development（最新开发版）/ $latest_production（最新生产版）；不填默认最新生产版。改工具/加版本前先调它拿当前定义。
        method: GET
        path: /tools/{toolId}
        params:
          toolId: { in: path, type: string, required: true, description: "工具 ID（32 位 hex md5，服务端生成；≠ CMDB instanceId）。前端详情页 URL 的 <id> 即此。" }
          vId:    { in: query, type: string, description: "版本 ID（32 位 hex）或别名 $latest_version/$latest_development/$latest_production；不填=最新生产版" }
        response:
          type: object
          description: "标准 wrapper，data 为完整 Tool（ToolConfig+ToolVersion，结构见 create body）"
          properties:
            code: { type: integer }
            data: { type: object, description: "完整工具定义", additional_properties: true }

      # ---------- 新建（POST /tools）—— 场景2 建工具 ----------
      create:
        description: 新建工具（同时建首个版本）。body 是完整 Tool（ToolConfig 基础字段 + ToolVersion 脚本/输入/输出）。必填 name/type/category/content。返回新 toolId + vId。注意：工具脚本若要调 easyops/cmdb，运行时用 EASYOPS_* 环境变量（详见 objects.yaml#autoops_tool.api_behavior，⚠️不存在 __instance__/${cmdb.xxx} 这类写法）。
        method: POST
        path: /tools
        body:
          type: object
          required: [name, type, category, content]
          description: "新建工具请求（Tool = ToolConfig + ToolVersion 聚合）。必填 name/type/category/content。权威字段定义见 objects.yaml#autoops_tool。"
          properties:
            # —— ToolConfig 基础 ——
            name:         { type: string, description: "工具名（同 org 内不可重复）" }
            category:     { type: string, description: "分类（如 ITSM、CMDB；点分多级如 运维.监控）" }
            memo:         { type: string, description: "说明" }
            icon:         { type: string, description: "图标 class" }
            tags:         { type: array, items: { type: string }, description: "标签" }
            listVisible:  { type: boolean, description: "列表中是否显示，默认 true" }
            disable:      { type: boolean, description: "禁用开关" }
            level:        { type: integer, description: "等级" }
            # —— 权限白名单（细粒度授权）——
            readAuthorizers:              { type: array, items: { type: string }, description: "只读权限白名单（用户/角色）" }
            updateAuthorizers:            { type: array, items: { type: string }, description: "编辑权限白名单" }
            deleteAuthorizers:            { type: array, items: { type: string }, description: "删除权限白名单" }
            executeAuthorizers:           { type: array, items: { type: string }, description: "执行权限白名单" }
            # —— ToolVersion 脚本与执行（建首个版本）——
            vName:            { type: string, description: "版本名（首个版本，如 v1）" }
            vDesc:            { type: string, description: "版本说明" }
            type:             { type: string, enum: [shell, python, perl, powershell, batch, Ansible-PlayBook], description: "脚本类型，决定运行时注入哪个 SDK 库 + 默认解释器（shell→main.sh/bash，python→main.py/python）" }
            content:          { type: string, description: "脚本正文。可调平台 SDK 函数：PutStr(name,val) 出标量、PutRow(table,row)/PutFormRows(table,rows) 出表格行（行格式 k1=v1&k2=v2）。这些函数由平台按 type 自动注入，无需自己实现。" }
            timeout:          { type: integer, description: "超时秒，默认 86400；0=不限" }
            defaultExecUser:  { type: string, description: "默认执行用户（Linux），如 root" }
            envLinux:         { type: array, items: { type: object, properties: { name: { type: string }, value: { type: string } } }, description: "Linux 进程环境变量" }
            envWindows:       { type: array, items: { type: object, properties: { name: { type: string }, value: { type: string } } }, description: "Windows 进程环境变量" }
            forceShutdown:    { type: boolean, description: "超时强杀" }
            sandboxRun:       { type: boolean, description: "沙箱执行" }
            # —— 输入参数（场景核心 + 工具包开发关键）——
            inputs:           { type: array, description: "输入参数定义（ToolInput[]，详见 items）。脚本里通过保留 key / 环境变量取值；type=cmdbInstance(s) 的参数由平台按执行目标注入实例。", items: { type: object, additional_properties: true }, additional_properties: true }
            # —— 输出定义 ——
            outputDefs:       { type: array, description: "标量输出定义（OutputDef[]：{id,name}）。脚本 PutStr(id,val) 回吐。", items: { type: object, properties: { id: { type: string }, name: { type: string } } } }
            tableDefs:        { type: array, description: "表格输出定义（TableDefs[]：{id,name,dimensions[],columns[]}）。脚本 PutRow/PutFormRows 回吐多行；查主机内存这类多行数据用它。", items: { type: object, additional_properties: true } }
            # —— 绑定工具库 ——
            toolLibs:         { type: array, description: "绑定的动态库（ToolLib[]：{name,packageId,versionId,scriptType(仅python),description,custom}）。", items: { type: object, additional_properties: true } }
        response:
          type: object
          description: "标准 wrapper。data 含新 toolId + vId。"
          properties:
            code: { type: integer }
            data:
              type: object
              properties:
                toolId: { type: string, description: "新工具 ID（32 位 hex）" }
                vId:    { type: string, description: "首个版本 ID（32 位 hex）" }

      # ---------- 改/加版本（PUT /tools/:toolId）—— 场景3 加版本 ----------
      update:
        description: 修改工具。改 ToolConfig 字段（如 name/category）直接生效；**改 ToolVersion 字段（inputs/outputDefs/tableDefs/content/toolLibs 等）会派生一条新版本**（manager.UpdateToolWithExists 检测到 version 字段变更→CreateByExists 新版本），返回新 vId/vName。故"给工具新增版本"= 先 get 拿当前定义 → 改 version 字段（如加 inputs 入参、改 content）→ update。⚠️场景3 的"强制删除"是工具脚本自己的 input（清理脚本的入参），不是工具层的 force（工具层 force 见 delete）。
        method: PUT
        path: /tools/{toolId}
        params:
          toolId: { in: path, type: string, required: true, description: "工具 ID" }
        body:
          type: object
          description: "⚠️body 是 **flat**（顶层直接是工具字段，不要套 tool 包裹）——ValidateUpdateTool 把整段 body 直接 unmarshal 进 request.Tool（api_validator.go:671）；若套 {tool:{...}} 则 updateFields=[tool] 命中『仅改 config』短路分支，假成功不生效（实测坑）。改 ToolVersion 字段（inputs/content/outputDefs/tableDefs/vDesc/vName/type 等）触发派生新版本（envType=development，vName 不传则=vId）；改 ToolConfig 字段（name/category/tags 等）仅改配置不派生。toolId 走 path；vId/versionMark 不带。"
          additional_properties: true
          properties:
            inputs:           { type: array, description: "改入参（派生新版本）。含 @agents（cmdbInstances 执行目标）+ 业务入参", items: { type: object, additional_properties: true } }
            content:          { type: string, description: "改脚本正文（派生新版本）" }
            vDesc:            { type: string, description: "版本说明" }
            vName:            { type: string, description: "可选版本名（不传则默认=vId；传了会查重）" }
            name:             { type: string, description: "改工具名（仅改 ToolConfig，不派生版本）" }
            relationToolLibs: { type: array, description: "调整工具库关联（lib instanceId 字符串列表）", items: { type: string } }
        response:
          type: object
          description: "标准 wrapper。⚠️data 只含 {toolId}（无 vId/vName，源码 basic_service.go:322）——派生是否成功须 tool_version.list 复查。"
          properties:
            code: { type: integer }
            data:
              type: object
              properties:
                vId:   { type: string, description: "新版本 ID（若本次派生了新版本）" }
                vName: { type: string, description: "新版本名" }

      # ---------- 删除（DELETE /tools/:toolId）—— 场景6 ----------
      delete:
        description: 删除工具（软删，置 delete_me=true，非物理删）。force=true（query 字符串 "true"）仅用于绕过 ReadOnly 约束。versionId 不填=删整个工具（所有版本 + 配置）；填则只删该版本，删完若无版本才连带删配置。⚠️ReadOnly=true 的工具不让删（除非 force）。被流程引用的删除防护在更上层，本服务层只认 ReadOnly。
        method: DELETE
        path: /tools/{toolId}
        params:
          toolId:    { in: path, type: string, required: true, description: "工具 ID" }
          force:     { in: query, type: string, enum: ["true", "false"], description: "强制删除（绕过 ReadOnly），字符串 \"true\" 才生效，默认 false" }
          versionId: { in: query, type: string, description: "版本 ID（不填=删整个工具；填=只删该版本）" }
        response:
          type: object
          description: "标准 wrapper。code=0 成功。"
          properties:
            code: { type: integer }

  # ---------------------------------------------------------------------------
  # 资源 2：tool_version —— 工具版本层（薄，只读列表）。
  # 版本无独立写端点：新建版本 = tool.update（改 version 字段触发派生）。
  # 故本 resource 只提供 list（列版本），写操作走 tool.update。
  # ---------------------------------------------------------------------------
  tool_version:
    description: 工具版本（ToolVersion）。版本无独立写端点——新建/改版本走 tool.update（改 version 字段即派生新版本，返回新 vId）。本 resource 仅提供版本列表查询（校验/审计用）。
    path: ""

    operations:
      list:
        description: 列出某工具的所有版本（含 vId/vName/envType/审批状态/创建时间）。给工具新增版本后可调它确认新版本在列。
        method: GET
        path: /tools/{toolId}/versions
        params:
          toolId: { in: path, type: string, required: true, description: "工具 ID" }
        response:
          type: object
          description: "标准 wrapper：{ code, data: ToolVersion[] }"
          properties:
            code: { type: integer }
            data: { type: array, description: "版本列表（每条含 vId/vName/envType/vCreateTime 等）", items: { type: object, additional_properties: true } }

  # ---------------------------------------------------------------------------
  # 资源 3：tool_lib —— 工具库（动态库）CRUD（lib 模块）。
  # 工具库是可被多个工具引用的 python 库（scriptType 仅 python）。
  # 无独立 list 端点（源码 lib/route.go 只有 create/update/delete + 导入导出）。
  # ---------------------------------------------------------------------------
  tool_lib:
    description: 工具库（ToolLib，动态库）—— 可被多个工具引用的 python 库（scriptType 仅支持 python）。无独立 list 端点；工具通过 tool.toolLibs 字段关联库。库的导入导出见 /api/tools/v1/libs/import|export（本清单未收，属配套，按需用 Python SDK）。
    path: ""

    operations:
      create:
        description: 新建工具库。上传一个库包（python），返回库 instanceId/packageId。
        method: POST
        path: /tools/lib
        body:
          type: object
          description: "工具库请求（ToolLibRequest）。file 为库包内容，name/description 为元信息。⚠️multipart——api-cli 仅 --print-curl 预览，真调走 Python SDK（sdk/easyops_client.py）。"
          additional_properties: true
          properties:
            name:        { type: string, description: "库名" }
            description: { type: string, description: "库说明" }
            custom:      { type: boolean, description: "是否自定义库" }
        response:
          type: object
          properties:
            code: { type: integer }
            data: { type: object, description: "含 instanceId/packageId/versionId", additional_properties: true }
      update:
        description: 更新工具库（如换库包内容、改名）。
        method: PUT
        path: /tools/lib/{id}
        params:
          id: { in: path, type: string, required: true, description: "库 instanceId" }
        body:
          type: object
          description: "库更新内容（结构同 create）。⚠️multipart 走 Python SDK。"
          additional_properties: true
      delete:
        description: 删除工具库。
        method: DELETE
        path: /tools/lib/{id}
        params:
          id: { in: path, type: string, required: true, description: "库 instanceId" }
        response:
          type: object
          properties:
            code: { type: integer }

  # ---------------------------------------------------------------------------
  # 资源 4：tool_execution —— 工具执行 + 结果轮询（execute 模块）。场景4。
  # 执行是异步：run 返回 execId → 轮询 get_status/get_result/get_table 取结果。
  # run_cmd 不是端点，是预置工具（type=shell/python，content=执行命令采集）；
  # 执行它先 tool.list 找到 toolId，再 run。
  # python 解释器固定 /usr/local/easyops/python/bin/python（agent 自带）。
  # ---------------------------------------------------------------------------
  tool_execution:
    description: 工具执行（异步）。run 下发到 easy_command（经 agent）或 runner（python 快通道），返回 execId；随后轮询 get_status/get_result/get_table 取结果。场景4『run_cmd 查主机内存』= tool.list 找 run_cmd 的 toolId → run（带目标主机 + 入参）→ 轮询 get_table 取内存表。⚠️e2e 依赖：run_cmd 工具存在 + 目标主机 agent 在线 + easy_command 可用 + 执行账号有权限（+ runner 注册，若走 python 快通道）。
    path: ""

    operations:
      # ---------- 执行（POST /tools/execution）—— 场景4 ----------
      run:
        description: 异步执行工具。必填 toolId；默认 vId=$latest_production、needNotify=true。目标主机走 agents 或 inputs.@agents（旧版 agents 数组会被兼容成 inputs.@agents）。返回 execId（异步，不返回 stdout）——用 get_result/get_table/get_status 轮询取结果。
        method: POST
        path: /tools/execution
        body:
          type: object
          required: [toolId]
          description: "执行请求（ExecuteToolRequest）。toolId 必填；⚠️inputs 是 **map**（proto map<string,Value>，key=参数名 value=值，如 {\"cmd\":\"free -m\"}），不是 [{name,value}] 数组（实测数组报 json 解析失败 100000）；agents 目标主机（IP 数组，被重写成 inputs.@agents）。"
          properties:
            toolId:    { type: string, description: "要执行的工具 ID" }
            vId:       { type: string, description: "版本 ID 或别名 $latest_version/$latest_development/$latest_production，默认 $latest_production。⚠️若工具只有 development 版本（如 run_cmd），$latest_production 报『工具版本不存在 100005』——用具体 vId 或 $latest_development" }
            inputs:    { type: object, additional_properties: true, description: "⚠️入参值 **map**（不是数组！）——key=参数名（对应工具 ToolInput.name），value=参数值；如 {\"cmd\":\"free -m\"}" }
            agents:    { type: array, description: "目标主机（旧版兼容字段，会被重写成 inputs.@agents）；优先用 inputs 里 type=cmdbInstances 的入参", items: { type: string } }
            execUser:  { type: string, description: "执行用户（覆盖工具 defaultExecUser）" }
            needNotify: { type: string, enum: ["true", "false"], description: "是否通知，默认 true（字符串）" }
            timeout:   { type: integer, description: "超时秒（覆盖工具 timeout）" }
        response:
          type: object
          description: "标准 wrapper。data 含 execId/taskId（异步句柄，用于轮询）。"
          properties:
            code: { type: integer }
            data:
              type: object
              properties:
                execId: { type: string, description: "执行 ID（轮询用）" }
                taskId: { type: string, description: "easy_command 任务 ID" }

      # ---------- 执行结果（GET /tools/execution/result/:execId）----------
      get_result:
        description: 取执行的完整结果（每主机的 outputs/status/exitStatus/msg）。执行完成后调它拿每台主机的 stdout/输出。
        method: GET
        path: /tools/execution/result/{execId}
        params:
          execId: { in: path, type: string, required: true, description: "执行 ID（run 返回的 execId）" }
        response:
          type: object
          description: "标准 wrapper，data 为 ToolTask（含每主机 outputs/status）"
          properties:
            code: { type: integer }
            data: { type: object, description: "ToolTask：{execId, agentData:{<ip>:{outputs,status,exitStatus,msg}}}", additional_properties: true }

      # ---------- 表格结果（GET /tools/execution/table/:execId）—— 场景4 内存表 ----------
      get_table:
        description: 取执行的表格结果（TableData + TableDefs）。仅当工具声明了 tableDefs 才有表格（如查主机内存的多行数据）。按主机拆行。场景4 run_cmd 查内存的结果走这里。
        method: GET
        path: /tools/execution/table/{execId}
        params:
          execId: { in: path, type: string, required: true, description: "执行 ID" }
        response:
          type: object
          description: "标准 wrapper，data 为 {tableData, tableDefs}"
          properties:
            code: { type: integer }
            data: { type: object, description: "{tableDefs: 表头定义, tableData: 行数据（每行按主机+维度展开）}", additional_properties: true }

      # ---------- 执行状态（GET /tools/execution/status/:execId）—— 轮询 ----------
      get_status:
        description: 取执行状态（仅状态，轻量）。轮询执行是否完成用这个，完成了再调 get_result/get_table 取数据。
        method: GET
        path: /tools/execution/status/{execId}
        params:
          execId: { in: path, type: string, required: true, description: "执行 ID" }
        response:
          type: object
          description: "标准 wrapper，data 为执行状态"
          properties:
            code: { type: integer }
            data: { type: object, description: "执行状态（running/success/failed 等）", additional_properties: true }

  # ---------------------------------------------------------------------------
  # 资源 5：tool_package —— 工具包导入导出（import_export 模块）。场景5。
  # 工具包 = 单个 .tar.gz（<toolName>/{._easyPackageConfig.dat, config, script, libs/}）。
  # ⚠️ export 返回 tar.gz 二进制流、import 是 multipart——api-cli 都做不了真调，
  #    仅 export_check（JSON 交互）能用 api-cli；export/import 真调走 Python SDK
  #    （sdk/easyops_client.py 的 export_tool/import_tool）或 --print-curl + curl。
  # ---------------------------------------------------------------------------
  tool_package:
    description: 工具包导入导出。工具包是单个 .tar.gz 归档（含 ._easyPackageConfig.dat 元信息 + config 配置JSON + script 脚本 + 可选 libs/）。export_check 预检（JSON，api-cli 可调）；export/import 涉及二进制/多部分——api-cli 仅 --print-curl 预览，真调走 Python SDK（sdk/easyops_client.py）。文件结构与字段详见 objects.yaml#autoops_tool.api_behavior.package_format。
    path: ""

    operations:
      # ---------- 导出预检（POST /tools/:toolId/export/check）—— JSON，api-cli 可调 ----------
      export_check:
        description: 导出前检查（主要查工具绑定的 lib 制品是否还在）。返回 toolLibExportCheckResults[]（每项 result=success/libNotFound）。导出前先调它确认 lib 完整，避免导出包缺 lib。
        method: POST
        path: /tools/{toolId}/export/check
        params:
          toolId:    { in: path, type: string, required: true, description: "工具 ID" }
        body:
          type: object
          description: "导出预检请求"
          properties:
            versionId: { type: string, description: "版本 ID（32 位 hex）" }
        response:
          type: object
          description: "标准 wrapper：{ code, data: { toolLibExportCheckResults[] } }"
          properties:
            code: { type: integer }
            data: { type: object, description: "{toolLibExportCheckResults: [{result: success|libNotFound, ...}]}", additional_properties: true }

      # ---------- 导出（GET /tools/:toolId/export）—— 场景5，二进制流走 SDK ----------
      export:
        description: "导出单个工具为 .tar.gz（响应是 application/x-gzip 二进制流，Content-Disposition: attachment）。⚠️⚠️**GET 方法**（非 POST）；query 参数是 **versionId**（不是 vId，与其他端点不一致！正则 ^[a-fA-F0-9]{32}$）。api-cli 无法存二进制文件——**真调走 Python SDK** `client.tool_package.export(toolId, versionId, save_to=...)` 流式下载，或 `--print-curl` 生成 curl 命令。"
        method: GET
        path: /tools/{toolId}/export
        params:
          toolId:    { in: path, type: string, required: true, description: "工具 ID" }
          versionId: { in: query, type: string, required: true, pattern: '^[a-fA-F0-9]{32}$', description: "版本 ID（32 位 hex；⚠️参数名是 versionId 不是 vId）" }
          compatibility: { in: query, type: string, description: "兼容性标签（仅打进 tar 文件名，不影响内容），默认 latest" }
        response:
          type: file
          description: "application/x-gzip 二进制流（.tar.gz）。api-cli 直接调会乱码——走 Python SDK 下载。"

      # ---------- 导入（POST /tools/import）—— multipart，走 SDK ----------
      import:
        description: 导入工具包（multipart/form-data：file 上传 .tar.gz + 可选 systemImport/tools）。导入是 upsert（toolId 存在→更新即新增版本，不存在→新建）。⚠️multipart——api-cli 仅 --print-curl 预览，**真调走 Python SDK** `client.tool_package.import_tool(file=...)` 或 curl -F。
        method: POST
        path: /tools/import
        params:
          systemImport: { in: query, type: boolean, description: "是否平台系统导入" }
        # body 是 multipart/form-data（file + tools），api-cli 的 --body-file 只发 JSON 不支持，
        # 故此处不声明 JSON body schema——真调用 Python SDK 的 requests.files 上传。
        response:
          type: object
          description: "标准 wrapper：{ code, data: { tools: ToolImportCheckResult[] } }（逐工具导入结果，含 importType=create|update、result 枚举）"
          properties:
            code: { type: integer }
            data: { type: object, description: "{tools: [{versionId, versionName, importType: create|update, result, ...}]}", additional_properties: true }
