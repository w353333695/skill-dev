# 流程模板：给已存在模型加属性（场景③）。change 挡。
name: add-attributes
intent: 给已有模型增加分类/新属性（如监管等级、服务时间）
trigger: ["给 X 模型加属性", "增加字段", "加分类属性"]
guard: 确认挡（写、1-2 步）—— 展示将加的属性确认
key_rule: "新属性 id 须加 _ 前缀（如 _regulatory_level）才识别为新增；枚举值放 value.regex 数组。见 objects.yaml#cmdb_object.side_effects。"
steps:
  - n: 1
    op: object_model.export       # 或 object_model.detail
    args: [--body-file, '{"objectIds":["<objectId>"]}', --insecure, --yes]
    desc: 取当前完整模型定义（拿到现有 attrList）
    dataflow: "data[].attrList → step2 拼新属性"
  - n: 2
    op: object_model.import
    args: [--body-file, "<model-with-new-attrs.json>", --insecure, --yes]
    desc: 重导完整模型（含原属性 + 新属性，新属性 id 加 _ 前缀）
    expect: "code=0；新属性「创建成功」，原属性「更新成功」"
    note: "import 是 upsert，重导不会丢原属性；也可改用 object_attr create 单加一个属性"
  - n: 3
    op: object_model.detail
    args: ["<objectId>", --insecure]
    desc: 校验新属性在列
alternative: "object_attr create <objectId> --body-file <attr.json>（单属性细粒度新增，body 是单个 Property）"
