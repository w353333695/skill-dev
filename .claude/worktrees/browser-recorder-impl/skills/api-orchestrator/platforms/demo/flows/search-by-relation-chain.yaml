# 流程模板：跨模型沿关系链取字段 / 按终端属性过滤实例（多层关系链路）。
# 直通挡（纯读）。配套：objects.yaml#api_behavior.instance_relation_chain + relation_path_discovery。
# 思路：链路键不要手猜——先 object_relation.related_key 发现两模型间的路径，再 object_instance.search 用键多层 jsonPath 穿越。
name: search-by-relation-chain
intent: 跨模型沿关系链取终端字段（如"查主机关联的系统名"）或按终端属性过滤实例（如"按系统名搜主机"）
trigger: ["查关联的 X 的某属性", "按 X 名搜 Y 实例", "沿关系链取/过滤", "跨模型关联查询", "主机属于哪个系统", "实例关联链路"]
guard: 直通挡（纯读：related_key 发现 + search 穿越，无写）

prerequisites:
  env: [EASYOPS_ORG, EASYOPS_USER, EASYOPS_CMDB_BACKEND_URL]
  known: "起点模型 src（实例列表侧，如 HOST）+ 终点模型 dst（终端属性侧，如 APP_SYSTEM@ONEMODEL）+ 想取/过滤的终端属性（如 name）"
  note: "dst 模型 id 常带命名空间后缀（如 APP_SYSTEM@ONEMODEL）；查模型名用 object_model.list"

steps:
  - n: 1
    op: object_relation.related_key
    args: ["--src_object_id", "<SRC>", "--dst_object_id", "<DST>", --insecure]
    desc: 发现 src→dst 的所有可达关系路径（实测最多 100 条）
    expect: "data[] 每条含 {label, reverseQueryKey, path}；label 人读链路名辅助选路"
    on_fail: "路径太多/不贴切 → 加 --white_list/--black_list 收窄（只走特定模型/关系）"

  - n: 2
    transform: 选路 + 推导键（本地，非 API）
    desc: |
      从 step1 的路径里选最贴切的一条（看 label；reverseQueryKey 段数≈跳数，越短越快）。
      再决定【在哪一侧 search】——取决于"要列出哪侧的实例"：
        · 列 src 实例（如列主机）→ 用【正向键】search src：正向键 = path[] 里【边节点】的 relation_side_id 按序拼接（跳过模型节点）
        · 列 dst 实例（如列系统）→ 用 step1 直给的【reverseQueryKey】search dst（dst→src 反向）
      终端字段拼在键尾：取值 fields=["<key>.<终端属性>"]；过滤 query={"<key>.<终端属性>":{$eq:...}}。
    how: "jq 取所选路径的 path[]；边节点(relation_side_id)按序拼成正向键；reverseQueryKey 直接取"

  - n: 3
    op: object_instance.search
    args: ["<搜索侧模型>", --body-file, "<search.json>", --insecure]
    desc: 用推导出的键多层 jsonPath 穿越链路——取终端字段或按终端属性过滤根实例
    body_hint: |
      # 列 src（正向键）例：HOST 取关联系统名
      { "fields":["instanceId","<正向键>.name"], "page":1,"page_size":20 }
      # 或按系统名过滤 src：
      { "fields":["instanceId","<正向键>.name"], "query":{"<正向键>.name":{"$eq":"Easyops"}} }
    expect: "code=0；list 每条带终端字段值（如 serviceSets:[{system:[{name:'Easyops'}]}]）"

key_rule: |
  两个键的方向（别用反）：
   · reverseQueryKey（related_key 直给）= dst→src，用在【dst 模型】search
   · 正向键（path 边的 relation_side_id 序列拼）= src→dst，用在【src 模型】search
  选哪侧 search = 要列哪侧的实例。终端字段永远拼在键尾（<key>.<attr>）。
  ⚠️ search 的 fields 带 `name` 时若模型缺 name relation 配置，报 133116「Can not find name relation」
     （见 objects.yaml#api_behavior.instance_search_name_field）——换终端字段或换一侧 search 规避。

worked_example: |
  org 18832008，"查主机关联的系统名"：
   · src=HOST, dst=APP_SYSTEM@ONEMODEL, 终端属性=name
   · step1 related_key(HOST, APP_SYSTEM@ONEMODEL) → 首条 label="主机-服务集(服务集)-应用系统(系统)"，
     reverseQueryKey="serviceSets.hosts"，path 边序列 relation_side_id=[serviceSets, system]
   · step2 列主机→用正向键=serviceSets.system；终端字段=serviceSets.system.name
   · step3 HOST search fields=["instanceId","serviceSets.system.name"] → 返回 serviceSets:[{system:[{name:"Easyops"}]}] ✓
   （反向验证：APP_SYSTEM search fields=["serviceSets.hosts.ip"] → 取到 HOST ip 172.30.0.232 ✓）

side_effects: objects.yaml#cmdb_instance.side_effects
acceptance: "${EASYOPS_CMDB_FRONTEND_URL}/next/next-cmdb-instance-management/next/<搜索侧模型>/list"
