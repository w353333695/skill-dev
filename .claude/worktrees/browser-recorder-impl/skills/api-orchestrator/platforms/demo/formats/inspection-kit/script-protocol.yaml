# =============================================================================
# formats/inspection-kit/script-protocol.yaml
# 巡检脚本协议（v1 体系）—— py2 脚本怎么写、参数怎么进、结果怎么出。
#
# ⚠️与采集套件（collector-kit）脚本协议【完全不同】：
#   - 参数传递：采集=环境变量 EASYOPS_COLLECTOR_*；巡检=【脚本头部注入变量赋值】
#   - 输出格式：采集=[{dims,vals}]直接输出；巡检=【start/end 标记包裹】
#   - instanceId：巡检脚本【必须】输出 INSTANCE ID 标记（采集不需要）
#
# 权威源：
#   A. internal/script_operator/{python_operator,shell_operator,script_operator}.go（注入+解析）
#   B. internal/msg_parser/msg_parser.go（输出标记正则）
#   C. internal/execution/api/custom/processor.go（执行拼接）
#   D. 真调实测：weblogic 真实脚本（py2，psutil+subprocess）
#   E. statics/tools/kill_task_processes.py（内置 py2 脚本范例）
# =============================================================================

# -----------------------------------------------------------------------------
# 一、脚本运行时
# -----------------------------------------------------------------------------
runtime:
  language: "Python 2（默认）或 Shell(bash)"
  python_interpreter:
    default: "/usr/local/easyops/python/bin/python"
    shebang_override: "脚本首行 shebang 可覆盖解释器（正则 ^#!\\s?[^ ](.*)python(.*)\\n），支持 #!/usr/bin/python / #! /usr/bin/env python3"
    source: "python_operator.go:14（默认）; :72-80（shebang 正则）; python_operator_test.go:293-379"
  shell_interpreter:
    default: "/bin/bash"
    shebang_override: "正则 ^#!\\s?[^ ](.*)bash(.*)\\n"
    source: "shell_operator.go:13,16"
  exec_user: "root（执行时硬编码）"
  source: "processor.go:218; script_service.go:75"

# -----------------------------------------------------------------------------
# 二、参数传递（与采集套件最大的不同：脚本头部注入变量赋值）
# 平台把参数直接拼接到脚本源码【前部】作为 Python 变量赋值语句，不是环境变量。
# source: python_operator.go:41-69; processor.go:159-173
# -----------------------------------------------------------------------------
param_injection:
  mechanism: |
    执行时平台构造 cmd = 参数赋值头 + instanceId 标记打印 + 脚本源码，整体交给解释器。
    参数不是环境变量、不是命令行参数——是【源码级注入的变量赋值】。
  injected_variable_rules:
    rule_table: |
      注入格式只看 args 的 source 字段（python_operator.go:pythonAssignFunc 46-57）：
        source=attr_id（CMDB属性，含唯一键）→ EASYOPS_<key>=<value>   ← 加前缀
        source=custom（用户填）            → <key>=<value>           ← 无前缀
        instanceId（平台内置）             → EASYOPS_instanceId=...    ← 加前缀
      ⚠️踩坑（2026-08-13 e2e）：attr_id 的参数（如 ip）在脚本里要读 EASYOPS_ip，
      不是读 ip！否则取不到值（None），是巡检脚本 failed 的常见原因。
    EASYOPS_prefix: "instanceId / 唯一键(info.keys) / 【所有 source:attr_id 的 CMDB 属性参数】 → EASYOPS_<key>"
    no_prefix: "source:custom 的自定义参数（用户填）→ 无前缀 <key>=<value>"
    none_for_empty: "空字符串参数转 None（Python 字面量，py_marshal.JsonToPy）"
    source: "python_operator.go:46-57 (pythonAssignFunc switch keyType); collector/message.go:43 (SourceAttrId)"
  injection_header_example: |
    # 平台注入的头部（执行时拼在脚本前），假设 args: [{key:ip,source:attr_id},{key:username,source:custom},{key:password,type:password,source:custom},{key:db_name,source:custom}]
    #!<解释器>
    # -*- coding: UTF-8 -*-
    EASYOPS_instanceId="5894db498854a"        # instanceId 注入
    EASYOPS_ip="172.30.0.90"                  # source:attr_id 的参数（CMDB属性）→ 加前缀
    username="root"                           # source:custom 自定义参数 → 无前缀
    password="secret123"                      # password 类型（source:custom）解密后注入 → 无前缀
    db_name=None                              # source:custom 空参数转 None
    print ("-------INSTANCE ID START---------")
    print (EASYOPS_instanceId)
    print ("-------INSTANCE ID END---------")
  shell_variant: |
    Shell 脚本注入等价 bash 语法：EASYOPS_instanceId="..."/key=value，
    instanceId 标记用 echo + $EASYOPS_instanceId（shell_operator.go:52-62）
  source: "python_operator.go:41-69; processor.go:159-176; py_marshal/json_py.go:10-21"

# -----------------------------------------------------------------------------
# 二·补、外部命令路径规范（脚本设计红线）
# 巡检脚本在目标主机 root 执行，目标主机环境千差万别——命令路径严禁硬编码。
# -----------------------------------------------------------------------------
command_path_rule:
  problem: |
    e2e 踩坑（2026-08-13）：脚本写死 '/usr/local/easyops/mysql/bin/mysqladmin' 报
    OSError [Errno 2] No such file or directory——目标主机没有这个路径。
  forbidden: "禁止硬编码绝对路径（如 /usr/local/easyops/mysql/bin/mysqladmin、/opt/xxx/bin/cli）"
  solutions: |
    三选一（按可靠性排序）：
    1.【首选】用 Python 客户端库直连，不调外部命令——无路径问题。
       真实套件范式：mongodb=pymongo / mssql=pymssql / redis=redis-py / oracle=cx_Oracle。
       DB 类巡检一律走客户端库，不要调 mysqladmin/sqlcmd 之类。
    2. 客户端路径从实例属性拼：installPath(attr_id) → EASYOPS_installPath，
       脚本 os.path.join(install_path,'bin','mysqladmin')；无 installPath 则 fallback 'mysqladmin' 走 PATH。
       适用：必须调外部命令（如某些 DB 没有 Python 客户端）。
    3. 直接用命令名（'mysqladmin'），靠目标主机 PATH 解析。
       适用：通用命令（ping/df/cat）。
  real_examples: |
    mongodb（库直连）：client = MongoClient('mongodb://%s:%s@%s:%s/'%(user,pass,host,port))
    mssql（库直连）：conn = pymssql.connect(host, user, password, db)
    mysql（命令+installPath拼路径，本次修正）：
      install_path = globals().get("EASYOPS_installPath", "")
      client = os.path.join(install_path,"bin","mysqladmin") if install_path else "mysqladmin"
  source: "真调实测 mysql e2e（2026-08-13）；真实套件 mongodb/mssql/redis/oracle collector"

# -----------------------------------------------------------------------------
# 三、脚本必须输出的两组标记（协议核心）
# 平台用正则从 stdout 解析这两组标记，缺了无法归属结果。
# source: internal/msg_parser/msg_parser.go:11-46
# -----------------------------------------------------------------------------
output_protocol:
  marker_regex: "(?i)-+(?:start)-+[...]*(\\[.*\\])[...]*-+(?:end)-+"（大小写不敏感）
  source: "msg_parser.go:11-12"

  # ---- 标记1：instanceId 标记（必须，结果归属）----
  instance_id_marker:
    format: |
      print ("-------INSTANCE ID START---------")
      print (EASYOPS_instanceId)
      print ("-------INSTANCE ID END---------")
    shell_format: |
      echo "-------INSTANCE ID START---------"
      echo $EASYOPS_instanceId
      echo "-------INSTANCE ID END---------"
    rule: "取第一个匹配，去除非字母数字字符。⚠️不输出此标记，结果无法归属到巡检实例"
    source: "msg_parser.go:37-46; python_operator.go:59-69"

  # ---- 标记2：指标输出标记（核心，指标数据）----
  metrics_marker:
    format: |
      print ("-------start-------")
      print (json.dumps(metric_groups))
      print ("-------end--------")
    payload_schema: |
      标记之间是【指标组数组】JSON：
      [
        {"id": "<指标组id>",                    # 对应 metrics.yaml 的组 id
         "vals": [
           {"id": "<指标id>", "value": 45.5}    # 对应组内 vals[].id；value 数值或字符串
         ],
         "dims": [
           {"id": "hostname", "value": "srv-01"}  # 可选维度
         ]
        }
      ]
    key_linkage: |
      ⚠️id 对应关系（开发套件最关键约束）：
        payload[].id        ↔ metrics.yaml 指标组的 id
        payload[].vals[].id ↔ metrics.yaml 组内 vals[].id
      脚本输出的 id 若在 metrics.yaml 没定义，该值被丢弃（CleanMetricGroup 清洗）；
      metrics.yaml 定义了但脚本没输出，该指标无数据。
    value_type: "interface{}：数值（float32/int）或字符串（对应 vals[].type）"
    source: "msg_parser.go:28-34; job_result/api.go:109-124; msg_parser_test.go:63-70"

  full_output_example: |
    # py2 巡检脚本输出（stdout）
    -------INSTANCE ID START---------
    5894db498854a
    -------INSTANCE ID END---------
    -------start-------
    [{"id":"connection_info","vals":[{"id":"active_connections","value":45},{"id":"thread_count","value":120}],"dims":[{"id":"hostname","value":"srv-01"}]}]
    -------end--------

# -----------------------------------------------------------------------------
# 四、阈值判定（在平台层，不在脚本里）
# 脚本只输出原始值，平台按 metrics.yaml 的 conditions 判定等级+算分。
# -----------------------------------------------------------------------------
threshold_judgement:
  location: "平台层（不在脚本）。脚本输出原始值 → 平台比对 conditions → 定 level → 算分"
  rules_source: "详见本格式包 metric-threshold.yaml（comparator/level/评分规则全表）"
  numeric_compare:
    gt: "newValue >= MinValue 触发"
    lt: "newValue < MaxValue 触发"
    between: "MinValue <= newValue < MaxValue 触发"
    source: "parse_result.go:139-161; metric_group/helper.go:166-188"
  string_compare:
    in: "condition.Value contains newValue"
    nin: "不包含"
    eq: "相等"
    neq: "不等"
    source: "parse_result.go:163-189; metric_group/helper.go:190-216"

# -----------------------------------------------------------------------------
# 五、py2 脚本模板（MySQL 巡检风格，可直接改造）
# -----------------------------------------------------------------------------
script_template_py2: |
  #!/usr/local/easyops/python/bin/python
  # -*- coding: utf-8 -*-
  # MySQL 巡检脚本模板（v1 巡检套件，py2）
  # 参数经脚本头部注入（非环境变量）：username/password/port/db_name（自定义）
  #                                              EASYOPS_instanceId/EASYOPS_<唯一键>（平台注入）
  import sys
  import json
  import subprocess

  reload(sys)
  sys.setdefaultencoding('utf-8')

  def single_command(command):
      # py2 subprocess（不用 timeout 参数）
      try:
          result = subprocess.check_output(command, stderr=subprocess.STDOUT, shell=True)
          return True, result.rstrip()
      except Exception as e:
          return False, str(e)

  def collect_metrics():
      metric_groups = []
      # ====== 采集逻辑（示例：mysqladmin 状态）======
      ok, out = single_command('mysqladmin -u%s -p%s -P%s status' % (username, password, port))
      group = {
          'id': 'basic_status',                # ↔ metrics.yaml 指标组 id
          'vals': [],
          'dims': [{'id': 'hostname', 'value': EASYOPS_instanceId}],
      }
      if ok:
          # 解析输出，填 vals（id ↔ metrics.yaml 组内 vals[].id）
          group['vals'].append({'id': 'uptime', 'value': 100})
          group['vals'].append({'id': 'threads_live', 'value': 5})
      else:
          group['vals'].append({'id': 'uptime', 'value': 0})
      metric_groups.append(group)
      return metric_groups

  def main():
      # 1. instanceId 标记（必须）
      print ('-------INSTANCE ID START---------')
      print (EASYOPS_instanceId)
      print ('-------INSTANCE ID END---------')
      # 2. 指标输出标记（必须，start/end 包裹指标组数组）
      print ('-------start-------')
      print (json.dumps(collect_metrics()))
      print ('-------end--------')

  if __name__ == '__main__':
      main()

# -----------------------------------------------------------------------------
# 六、真实脚本参考（.90 实测）
# -----------------------------------------------------------------------------
real_script_references:
  weblogic: |
    实测 weblogic 脚本（INSPECTION_COLLECTOR pluginId=weblogic）特征：
    - shebang #!/usr/local/easyops/python/bin/python + reload(sys); sys.setdefaultencoding('utf-8')（py2）
    - import psutil/subprocess/re/json（可用 psutil）
    - single_command 封装 subprocess.check_output（shell=True）
    - 非 root 用户自动 sudo 前缀
  platform_builtin: "statics/tools/kill_task_processes.py（平台内置 py2 脚本，print 语句 + subprocess.Popen）"
  source: "真调实测 .90 CMDB INSPECTION_COLLECTOR; statics/tools/kill_task_processes.py:1-2"

# -----------------------------------------------------------------------------
# 七、与采集套件（collector-kit）脚本协议对比速查
# -----------------------------------------------------------------------------
vs_collector_kit:
  param_transfer: "采集=环境变量 EASYOPS_COLLECTOR_<name>；巡检=脚本头部变量赋值注入（无前缀自定义参数 + EASYOPS_ 前缀键）"
  output_format: "采集=[{dims,vals}] 直接输出；巡检=start/end 标记包裹指标组数组"
  instance_id_output: "采集=不需要；巡检=【必须】输出 INSTANCE ID 标记"
  dims_role: "采集 dims=维度标签；巡检 dims=维度列（可空）"
  metric_id_linkage: "采集=指标名自由（origin_metric 定义）；巡检=必须 ↔ metrics.yaml 的 id 精确对应"
  exec_user: "采集=按任务；巡检=root 硬编码"
