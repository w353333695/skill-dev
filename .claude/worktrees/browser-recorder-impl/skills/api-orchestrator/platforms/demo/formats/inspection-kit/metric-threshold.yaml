# =============================================================================
# formats/inspection-kit/metric-threshold.yaml
# 巡检指标阈值规则 —— comparator/level 枚举 + 类型约束 + 评分算法。
#
# 阈值定义在 metrics.yaml 的 vals[].conditions，平台执行后比对判分。
# source: internal/database/cmdb/task/message.go:130-151（Condition 结构）
#        internal/constants.go:36-99（level/score/weight 常量）
#        internal/database/cmdb/metrics/message.go:393-431（导入校验规则）
#        history/parse_result.go:129-227（v1 判定+评分）
# =============================================================================

# -----------------------------------------------------------------------------
# 一、Condition 结构（每个阈值条件）
# source: task/message.go:135-151
# -----------------------------------------------------------------------------
condition_fields:
  comparators:
    type: string
    enum: [between, gt, lt, eq, neq, in, nin]
    desc: "比较器。int 型用 between/gt/lt/eq/neq；string 型用 in/nin/eq/neq"
    source: "task/message.go:132-142"
  level:
    type: integer
    enum: [0, 5, 10]
    desc: "告警等级。⚠️仅取 0/5/10，分别对应 notice（提示）/warning（警告）/emergency（紧急）"
    source: "task/message.go:147（注释）；internal/constants.go:66-99"
  value:
    type: string
    desc: "阈值。仅为 type==string 服务（in/nin 的包含串、eq/neq 的比较串）"
    source: "task/message.go:148"
  maxValue:
    type: float32
    desc: "区间上限。仅为 type==int 的 between 服务"
    source: "task/message.go:149"
  minValue:
    type: float32
    desc: "区间下限。仅为 type==int 服务（between 区间/gt 触发下限）"
    source: "task/message.go:150"

# -----------------------------------------------------------------------------
# 二、EmergencyLevel 枚举与显示
# source: internal/constants.go:66-99
# -----------------------------------------------------------------------------
emergency_level:
  mapping:
    -1: { name: normal, 中文: 正常 }
    0: { name: notice, 中文: 提示, score: 80 }
    5: { name: warning, 中文: 警告, score: 50 }
    10: { name: emergency, 中文: 紧急, score: 20 }
  score_constants:
    MaxScore: 100
    MinScore: 0
    NoticeScore: 80
    WarningScore: 50
    EmergencyScore: 20
  weight_constants: { MaxWeight: 100, MinWeight: 0 }
  source: "internal/constants.go:53-99"

# -----------------------------------------------------------------------------
# 三、指标类型与 comparator 约束（导入强校验）
# source: metrics/message.go:407-431（CheckConditions）
# -----------------------------------------------------------------------------
type_comparator_constraints:
  e2e_verified_note: |
    ✅真调实锤（2026-08-13，.90 建 mysql 套件）：
    1. 【conditions 可空】套件定义时 conditions 留空数组 [] 是常态（真实 20 套件的指标 conditions 全空）——
       阈值通常在【任务】里配（task.vals 覆盖），套件定义只定指标结构。源码校验仅在 conditions 非空时逐条检查。
    2. 【type 实际值是 num】真实数据的数值型指标 type="num"（非源码注释的 int）——string/num 两种。
    3. 【validator 必填】建指标组必填 id/name/category/vals（category 两级点分）。
  string_type:
    allowed: [in, nin, eq, neq]
    forbidden: [between, gt, lt]
    forbidden_fields: "maxValue/minValue 禁用（值非 0 也拒）"
    rule_desc: "type=string 时不能用数值比较器，不能用 max/min（校验：string型指标不能指定between/gt/lt的int类型；string类型指标不能设置maxValue和minValue）"
    source: "metrics/message.go:412-428; metric_group_service.go:307-338（e2e实测 .90 2026-08-13）"
  num_type:
    allowed: [between, gt, lt]
    required_one: "conditions 非空时必须 between/gt/lt 之一"
    constraints:
      between_rule: "between 时 maxValue >= minValue"
      gt_rule: "gt 时 maxValue 应为 0（无值）"
      lt_rule: "lt 时 minValue 应为 0（无值）"
    source: "metrics/message.go:412-428; metric_group_service.go:307-338"
  note: "vals[].type 实际两种：string|num（⚠️真实数据用 num 非源码注释的 int；导入校验 string|int 的分支按 source 走，API 建议用 num）"

# -----------------------------------------------------------------------------
# 四、判定逻辑（平台执行后比对）
# source: history/parse_result.go:129-189（v1）; internal/execution/metric_group/helper.go:155-216（v2）
# -----------------------------------------------------------------------------
judgement_rules:
  numeric:
    gt: "采集值 >= minValue → 触发该 level"
    lt: "采集值 < maxValue → 触发该 level"
    between: "minValue <= 采集值 < maxValue → 触发该 level"
    source: "parse_result.go:139-161"
  string:
    in: "condition.value 包含 采集值 → 触发"
    nin: "condition.value 不包含 采集值 → 触发"
    eq: "相等 → 触发"
    neq: "不等 → 触发"
    source: "parse_result.go:163-189"
  multiple_conditions: "一个 val 可配多个 conditions（不同 level 各一条），取触发的最高 level 为该指标等级"

# -----------------------------------------------------------------------------
# 五、评分算法
# -----------------------------------------------------------------------------
score_algorithm:
  v1_formula: |
    CalculateScore（parse_result.go:191-227）：
    1. 假设所有指标满分：total = Σ(MaxScore × weight)
    2. 对每个异常指标扣分：numerator -= (MaxScore - levelScore) × weight
       （levelScore：notice=80/warning=50/emergency=20）
    3. score = numerator / Σweight，保留2位小数
    4. total<=0 时返回 MinScore(0)
  v2_formula: |
    v2（metric_group/helper.go:64-69）：每指标 Source = scoreMap[level] × weight × 0.01，
    总分 = ΣSource / 指标数
  level_to_score: { normal: 100, notice: 80, warning: 50, emergency: 20 }
  example: |
    例：2 个指标（weight 各 50）——A normal(100分)、B emergency(20分)
    v1: total=100×50+100×50=10000；numerator=10000-(100-20)×50=6000；score=6000/100=60分

# -----------------------------------------------------------------------------
# 六、target 状态判定（v1）
# source: parse_result.go:58-86
# -----------------------------------------------------------------------------
target_status:
  rules:
    failed: "脚本执行失败（status!=ok）→ Score=MinScore(0)"
    abnormal: "脚本成功 + 有异常指标（level>=0 至少一条触发）"
    normal: "脚本成功 + 无异常指标"
  job_status:
    ok: "只要有 1 个 target 正常执行（normal/abnormal）"
    failed: "全部 target 失败"
    passing_rate: "passingCount(normal+abnormal) / totalTargets"
    source: "timer_callback_task.pb.go:367-411"

# -----------------------------------------------------------------------------
# 七、metrics.yaml 阈值配置范例（MySQL 巡检用）
# -----------------------------------------------------------------------------
mysql_threshold_example: |
  # metrics.yaml 片段（MySQL 巡检，3 个指标组示例）
  - id: connection_status
    name: 连接状态
    category: 连接状态.基础
    pluginid: mysql
    dims: [{id: hostname, name: 主机名}]
    vals:
      - id: alive
        name: 存活状态
        type: int
        unit: ""
        weight: 30
        conditions:
          - {comparators: lt, level: 10, maxValue: 1, minValue: 0}   # 采集值<1（挂了）→ emergency
      - id: threads_connected
        name: 当前连接数
        type: int
        unit: ""
        weight: 20
        conditions:
          - {comparators: gt, level: 5, maxValue: 0, minValue: 500}    # >500 → warning
          - {comparators: gt, level: 10, maxValue: 0, minValue: 1000}  # >1000 → emergency
  - id: slow_query
    name: 慢查询
    category: 性能状态.慢查询
    pluginid: mysql
    vals:
      - id: slow_queries_total
        name: 慢查询累计数
        type: int
        unit: 次
        weight: 30
        conditions:
          - {comparators: gt, level: 5, maxValue: 0, minValue: 10}     # >10次 → warning
  - id: version_info
    name: 版本信息
    category: 整体状态.版本
    pluginid: mysql
    vals:
      - id: version
        name: MySQL版本
        type: string
        unit: ""
        weight: 5
        conditions:
          - {comparators: eq, level: 0, value: ""}   # 示例：string 型用 eq/in/nin
  design_principles:
    - "category 两级点分（连接状态.基础），正好 1 个点（服务端强校验）"
    - "关键指标（存活）weight 高（30），信息类（版本）weight 低（5）"
    - "数值型多 level 分层配置（500→warning，1000→emergency）"
    - "脚本输出的 vals[].id 必须与此处 id 一一对应"
