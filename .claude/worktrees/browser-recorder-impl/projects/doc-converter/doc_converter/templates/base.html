<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.8;
            color: #333;
            padding: 20px;
            background: #fff;
        }
        h1 { font-size: 1.8em; margin: 0.8em 0 0.4em; border-bottom: 2px solid #eee; padding-bottom: 0.3em; }
        h2 { font-size: 1.5em; margin: 0.7em 0 0.3em; }
        h3 { font-size: 1.25em; margin: 0.6em 0 0.3em; }
        p { margin: 0.5em 0; }
        code {
            background: #f5f5f5; padding: 2px 6px; border-radius: 3px;
            font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; font-size: 0.9em;
        }
        pre {
            background: #f8f8f8; padding: 16px; border-radius: 6px;
            overflow-x: auto; margin: 1em 0; border: 1px solid #e8e8e8;
        }
        pre code { background: none; padding: 0; }
        table {
            border-collapse: collapse; width: 100%; margin: 1em 0;
        }
        th, td {
            border: 1px solid #ddd; padding: 8px 12px; text-align: left;
        }
        th { background: #f5f5f5; font-weight: 600; }
        tr:nth-child(even) { background: #fafafa; }
        blockquote {
            border-left: 4px solid #ddd; padding: 0.5em 1em;
            margin: 1em 0; color: #666; background: #fafafa;
        }
        ul, ol { padding-left: 2em; margin: 0.5em 0; }
        li { margin: 0.2em 0; }
        a { color: #1976D2; text-decoration: none; }
        img { max-width: 100%; }
        hr { border: none; border-top: 1px solid #eee; margin: 1.5em 0; }
    </style>
    {{EXTRA_HEAD}}
</head>
<body>
    {{CONTENT}}
</body>
</html>
