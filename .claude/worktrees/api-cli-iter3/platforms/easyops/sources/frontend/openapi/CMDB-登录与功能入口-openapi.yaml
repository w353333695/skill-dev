openapi: 3.0.3
info:
  title: EasyOps CMDB — 登录与功能入口 API
  description: |
    录制自 EasyOps 平台（http://172.30.0.90/）「登录系统 + 进入 CMDB 资源管理 + 浏览应用系统架构树」流程。
    涵盖四个语义阶段：认证登录、门户启动台、CMDB 资源管理初始化、应用系统架构树。

    - 流程指引见同目录 `CMDB-登录与功能入口-操作指引.md`
    - 通用响应包装：`{ code, codeExplain, error, data }`（部分 cmdb.service 接口为 `{ code, error, message, data }`），`code === 0` 表示成功
    - 网关接口统一前缀 `/next/api/gateway/<service>/...`，其中 `<service>` 形如
      `logic.xxx`(逻辑服务) / `xxx.YYYVerb`(命名式接口) / `cmdb.instance.PostSearchV3`
  version: "1.0.0"
  contact:
    name: 录制生成（browser-recorder）

servers:
  - url: http://172.30.0.90
    description: EasyOps 测试环境

tags:
  - name: 认证
    description: 登录认证、会话状态、运行时配置
  - name: 门户启动台
    description: 登录后门户首页加载（工作台设置、用户信息、启动台、已安装微应用）
  - name: CMDB 资源管理初始化
    description: 进入 CMDB 资源管理后加载的微应用运行态、模型基础信息、模型分类
  - name: 应用系统架构树
    description: 应用系统架构树的实例树、应用/服务/DNS 等模型实例搜索与详情

paths:
  # ============ 认证 ============
  /next/api/auth/login/v2:
    post:
      tags: [认证]
      summary: 用户名密码登录（v2）
      description: |
        提交账号密码完成登录。成功后服务端下发会话凭证，前端跳转门户 `/next/portal`。
        请求体含账号密码字段（录制时已脱敏，schema 省略明文）。
      operationId: auth_login_v2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                  description: 登录密码（脱敏，勿明文存储）
                org:
                  type: number
                  description: 组织 ID，可缺省
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/auth/login:
    get:
      tags: [认证]
      summary: 登录页配置 / 会话状态
      description: 获取登录页配置，同时用于探测当前会话是否已登录（已登录时返回用户信息）。
      operationId: auth_login_status
      responses:
        "200":
          description: 登录页配置或会话信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  # ============ 门户启动台 ============
  /next/api/gateway/micro_app_standalone.launchpad.GetLaunchpadInfo/api/v1/micro_app_standalone/launchpad_info:
    get:
      tags: [门户启动台]
      summary: 启动台信息
      description: 获取启动台（Launchpad）收藏、分类、应用列表等聚合信息，用于门户首页卡片展示。
      operationId: cmdb_launchpad_info
      responses:
        "200":
          description: 启动台信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/logic.micro_app_standalone_service/api/v1/micro_app_standalone/runtime/{microApp}:
    get:
      tags: [门户启动台]
      summary: 微应用运行时清单
      description: |
        获取指定微应用的运行时清单（菜单、路由、provider 等）。`microApp` 取值如
        `home`、`portal`、`next-cmdb`、`system-union` 等。`version` 为微应用版本。
      operationId: cmdb_micro_app_runtime
      parameters:
        - name: microApp
          in: path
          required: true
          schema: { type: string }
          description: 微应用 ID，如 portal / next-cmdb
        - name: version
          in: query
          required: false
          schema: { type: string }
          description: 微应用版本
      responses:
        "200":
          description: 微应用运行时清单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
        "401":
          description: 未登录（登录态校验失败）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/logic.sys_setting/api/sys_setting/v2/workbench:
    get:
      tags: [门户启动台]
      summary: 工作台设置
      description: 门户工作台的配置项（标题、主题、布局等）。
      operationId: cmdb_sys_setting_workbench
      responses:
        "200":
          description: 工作台设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/logic.user_service/api/v1/users/orgs:
    get:
      tags: [门户启动台]
      summary: 用户所属组织列表
      operationId: cmdb_user_orgs
      parameters:
        - name: username
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 组织列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/logic.user_service/api/v1/users/detail/{username}:
    get:
      tags: [门户启动台]
      summary: 用户详情
      description: 获取指定用户详情（含组织、角色等）。
      operationId: cmdb_user_detail
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
        - name: org
          in: query
          required: false
          schema: { type: number }
          description: 组织 ID
      responses:
        "200":
          description: 用户详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/logic.cmdb.service/v3/object/USER/instance/_search:
    post:
      tags: [门户启动台]
      summary: 查询用户实例
      description: CMDB 检索 `USER` 模型实例（含所属用户组等关联），用于登录后补全当前用户的 CMDB 实例信息。
      operationId: cmdb_search_user_instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: array
                  items: { type: string }
                  description: 返回字段，如 name、__members_USER_GROUP
                page: { type: number }
                pageSize: { type: number }
      responses:
        "200":
          description: 用户实例列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  # ============ CMDB 资源管理初始化 ============
  /next/api/gateway/logic.micro_app_standalone_service/api/v1/micro_app_standalone/search:
    post:
      tags: [CMDB 资源管理初始化]
      summary: 搜索微应用
      description: 门户搜索框输入关键字时检索匹配的微应用（如 `inst` → 资源管理）。
      operationId: cmdb_search_micro_app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keyword:
                  type: string
                  description: 搜索关键字
      responses:
        "200":
          description: 匹配的微应用列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/cmdb.cmdb_object.GetObjectBasicAll/object_basic_all:
    get:
      tags: [CMDB 资源管理初始化]
      summary: 全部模型基础信息
      description: 拉取所有 CMDB 模型的基础信息（objectId/name 等），用于「全部资源」列表展示。
      operationId: cmdb_object_basic_all
      responses:
        "200":
          description: 模型基础信息数组
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  /next/api/gateway/cmdb.cmdb_object.ListObjectCategory/object_category:
    get:
      tags: [CMDB 资源管理初始化]
      summary: 模型分类列表
      description: 模型分类（资源域），如 IT 资源管理、应用系统、基础设施、数据消费、数据运营、数据管理。
      operationId: cmdb_object_category
      responses:
        "200":
          description: 模型分类
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  /next/api/gateway/easyops.api.cmdb.my_resource.ListMyResource@1.0.1/api/v1/list-my-resource:
    get:
      tags: [CMDB 资源管理初始化]
      summary: 我的资源列表
      description: 当前用户收藏/负责的资源列表。
      operationId: cmdb_my_resource
      responses:
        "200":
          description: 我的资源
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/cmdb.cmdb_object.search_collect/object/search_collect:
    get:
      tags: [CMDB 资源管理初始化]
      summary: 收藏的模型搜索
      description: 用户在资源管理中收藏的模型查询配置。
      operationId: cmdb_search_collect
      responses:
        "200":
          description: 收藏配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  /next/api/gateway/logic.cmdb.service/v1/batch/instance/count:
    post:
      tags: [CMDB 资源管理初始化]
      summary: 批量实例计数
      description: 批量统计多个模型的实例数量，用于资源管理各分类角标。
      operationId: cmdb_batch_instance_count
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                object_ids:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: 各模型实例计数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  # ============ 应用系统架构树 ============
  /next/api/gateway/logic.cmdb.service/instance_tree/full:
    post:
      tags: [应用系统架构树]
      summary: 实例树（架构树全量）
      description: |
        获取应用系统架构树的完整实例树（系统→子系统→模块→资源的层级关系），
        是架构树视图的核心数据接口。
      operationId: cmdb_instance_tree_full
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                objectId:
                  type: string
                  description: 根模型，如 APPLICATION@ONEMODEL
      responses:
        "200":
          description: 实例树
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/logic.cmdb.service/v3/object/APPLICATION@ONEMODEL/instance/_search:
    post:
      tags: [应用系统架构树]
      summary: 查询应用实例
      description: 检索 `APPLICATION@ONEMODEL`（应用系统）模型实例。
      operationId: cmdb_search_application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: array
                  items: { type: string }
                page: { type: number }
                pageSize: { type: number }
      responses:
        "200":
          description: 应用实例列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/logic.cmdb.service/v3/object/SERVICE@ONEMODEL/instance/_search:
    post:
      tags: [应用系统架构树]
      summary: 查询服务实例
      description: 检索 `SERVICE@ONEMODEL`（服务）模型实例。
      operationId: cmdb_search_service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: array
                  items: { type: string }
                page: { type: number }
                pageSize: { type: number }
      responses:
        "200":
          description: 服务实例列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/logic.cmdb.service/v3/object/DNS_RECORD@ONEMODEL/instance/_search:
    post:
      tags: [应用系统架构树]
      summary: 查询 DNS 记录实例
      description: 检索 `DNS_RECORD@ONEMODEL` 模型实例。
      operationId: cmdb_search_dns_record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: array
                  items: { type: string }
                page: { type: number }
                pageSize: { type: number }
      responses:
        "200":
          description: DNS 记录实例列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/logic.cmdb.service/object_id_map_name:
    get:
      tags: [应用系统架构树]
      summary: 模型 ID 映射名称
      description: 批量将模型实例 ID 映射为展示名称。
      operationId: cmdb_object_id_map_name
      responses:
        "200":
          description: ID→名称映射
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/cmdb.cmdb_object.GetDetail/object/{objectId}:
    get:
      tags: [应用系统架构树]
      summary: 模型详情
      description: 获取指定模型的字段定义与详情（如 HOST、APPLICATION@ONEMODEL）。
      operationId: cmdb_object_detail
      parameters:
        - name: objectId
          in: path
          required: true
          schema: { type: string }
          description: 模型 ID，如 HOST / APPLICATION@ONEMODEL
      responses:
        "200":
          description: 模型详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  /next/api/gateway/cmdb.cmdb_object.List/object:
    get:
      tags: [应用系统架构树]
      summary: 模型列表
      description: 模型清单（含字段、视图等元数据）。
      operationId: cmdb_object_list
      responses:
        "200":
          description: 模型列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmdbResult"
      x-relevant: true

  /next/api/gateway/easyops.api.cmdb.instance.GetListDisplayView@1.0.2/object/{objectId}:
    get:
      tags: [应用系统架构树]
      summary: 模型列表展示视图
      description: 获取模型实例列表的展示视图（列定义）。
      operationId: cmdb_list_display_view
      parameters:
        - name: objectId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 列表视图配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/logic.permission/api/v1/policy_validate:
    post:
      tags: [应用系统架构树]
      summary: 权限校验
      description: 校验当前用户对指定资源的操作权限。
      operationId: cmdb_policy_validate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                policies:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: 权限校验结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

components:
  schemas:
    ApiResult:
      type: object
      description: EasyOps 通用响应包装（user_service / sys_setting / micro_app 等）
      properties:
        code:
          type: number
          description: 业务码，0 表示成功
          example: 0
        codeExplain:
          type: string
          description: 业务码说明，如 ERR_UNAUTHENTICATED
          example: ""
        error:
          type: string
          description: 错误信息（成功时为空）
          example: ""
        data:
          description: 业务数据（具体结构见各接口）
      required: [code]
    CmdbResult:
      type: object
      description: CMDB 服务响应包装（cmdb.service / cmdb_object 系列）
      properties:
        code:
          type: number
          description: 业务码，0 表示成功
          example: 0
        error:
          type: string
          description: 错误信息（成功时为空）
          example: ""
        message:
          type: string
          description: 错误消息（成功时为空）
          example: ""
        data:
          description: 业务数据（array 或 object，具体见各接口）
      required: [code]
