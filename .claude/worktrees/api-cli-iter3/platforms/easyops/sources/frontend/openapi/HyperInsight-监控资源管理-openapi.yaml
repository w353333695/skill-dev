openapi: 3.0.3
info:
  title: EasyOps HyperInsight — 监控资源管理 API
  description: |
    录制自 EasyOps 平台（http://172.30.0.90/）「HyperInsight 监控资源管理」流程。
    涵盖监控资源的全生命周期配置：搜索资源 → 新建/编辑/删除资源监控配置、调整采集间隔与采集器套件。

    核心能力：
    - 资源配置增删改：`create_resource_monitor_config` / `update_resource_monitor_config` / `DeleteResourceMonitorConfig`
    - 资源查询与搜索：`list-resource-config`（列表/搜索）、`resource-monitor-config/{objectId}`（详情）、监控任务/采集探测任务
    - 采集套件与 Agent：采集器套件列表、资源包状态、Agent 下载/安装 Key

    - 流程指引见同目录 `HyperInsight-监控资源管理-操作指引.md`
    - 通用响应包装：`{ code, codeExplain, error, data }`，`code === 0` 表示成功；`agent` 系列为 `{ code, error, message, data, serverAddress }`
    - 网关接口前缀 `/next/api/gateway/<service>/...`，命名式接口形如 `easyops.api.collector_service.res_monitor_config.CreateResourceMonitorConfigV2@1.0.1`
    - 写操作为覆盖式更新：`update_resource_monitor_config` 按 `objectId` 定位，传完整配置体
    - 删除需二次确认：前端要求输入与资源名称完全一致的字符串解锁确认按钮
  version: "1.0.0"
  x-system: easyops
  x-recorded-at: 2026-07-31T15:57:20
  contact:
    name: 录制生成（browser-recorder）

servers:
  - url: http://172.30.0.90
    description: EasyOps 测试环境

tags:
  - name: 资源配置增删改
    description: 资源监控配置的新建 / 更新 / 删除（监控资源管理的核心写操作）
  - name: 资源查询与搜索
    description: 资源监控配置列表 / 搜索 / 详情 / 监控任务查询
  - name: 采集套件与Agent
    description: 采集器套件、资源包状态、Agent Key（配置采集时加载的上下文）

paths:
  /next/api/gateway/easyops.api.collector_service.res_monitor_config.CreateResourceMonitorConfigV2@1.0.1/api/v1/create_resource_monitor_config:
    post:
      tags: [资源配置增删改]
      summary: 新建资源监控配置
      description: |
        为某个 CMDB 资源（objectId）创建一条监控采集配置，使其纳入 HyperInsight 监控。
        对应操作指引「三、配置监控采集」的保存动作。
      operationId: createResourceMonitorConfig
      x-relevant: true
      x-triggered-by-step: 17
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objectId, category]
              properties:
                objectId: {type: string, description: 资源对象 ID（CMDB 模型 ID）, example: TESTWWH}
                objectName: {type: string, description: 资源名称（建议与资源名称一致）, example: wwh测试模型}
                category: {type: string, description: 资源分类, example: 计算资源}
                enabled: {type: boolean, description: 是否启用监控, example: true}
                isBuiltin: {type: boolean, description: 是否内置, example: false}
                dataTTL: {type: number, description: 数据保留时长（小时）, example: 8784}
                icon:
                  type: object
                  description: 资源展示图标
                  properties:
                    lib: {type: string, example: easyops}
                    category: {type: string, example: default}
                    icon: {type: string, example: agent}
                relatedObjects:
                  type: array
                  description: 关联资源对象
                  items:
                    type: object
                    properties:
                      objectId: {type: string, example: TESTWWH}
                architectureObserveConfig:
                  type: object
                  properties:
                    isShow: {type: boolean, example: false}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  codeExplain: {type: string, example: ""}
                  error: {type: string, example: ""}
                  data:
                    type: object
                    properties:
                      instanceId: {type: string, description: 新建配置实例 ID, example: 657e382daf37d}

  /next/api/gateway/easyops.api.collector_service.res_monitor_config.UpdateResourceMonitorConfig@1.0.0/api/v1/update_resource_monitor_config/{objectId}:
    post:
      tags: [资源配置增删改]
      summary: 更新资源监控配置
      description: |
        按 objectId 更新资源监控配置（覆盖式：传完整配置体）。
        可用于重命名资源（objectName）、调整采集间隔/数据保留时长（dataTTL）、启停监控（enabled）。
        对应操作指引「五、编辑资源配置」的保存动作。
      operationId: updateResourceMonitorConfig
      x-relevant: true
      x-triggered-by-step: 28
      parameters:
        - name: objectId
          in: path
          required: true
          schema: {type: string}
          description: 资源对象 ID
          example: TESTWWH
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objectId]
              properties:
                objectId: {type: string, description: 资源对象 ID, example: TESTWWH}
                objectName: {type: string, description: 资源名称（可改名，建议与资源名称一致）, example: wwh测试模型rename}
                category: {type: string, description: 资源分类, example: 计算资源}
                enabled: {type: boolean, description: 是否启用监控, example: true}
                isBuiltin: {type: boolean, example: false}
                isOtherResourceMonitor: {type: boolean, example: false}
                healthAssessmentEnabled: {type: boolean, description: 是否启用健康评估, example: false}
                dataTTL: {type: number, description: 数据保留时长（小时，本例改为 480）, example: 480}
                view:
                  type: array
                  description: 视图配置
                  items: {type: object}
                icon:
                  type: object
                  properties:
                    lib: {type: string, example: easyops}
                    category: {type: string, example: default}
                    icon: {type: string, example: agent}
                relatedObjects:
                  type: array
                  items:
                    type: object
                    properties:
                      objectId: {type: string, example: TESTWWH}
                      serviceSetPath: {type: string, example: ""}
                      appSystemPath: {type: string, example: ""}
                      appPath: {type: string, example: ""}
                architectureObserveConfig:
                  type: object
                  properties:
                    isShow: {type: boolean, example: false}
                    layer: {type: string, example: ""}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  codeExplain: {type: string, example: ""}
                  error: {type: string, example: ""}
                  data:
                    type: object
                    properties:
                      instanceId: {type: string, example: 657e382daf37d}
                      objectId: {type: string, example: TESTWWH}

  /next/api/gateway/resource_monitor.resource_monitor_config.DeleteResourceMonitorConfig/api/v1/resource-monitor-config/{objectId}:
    delete:
      tags: [资源配置增删改]
      summary: 删除资源监控配置
      description: |
        按 objectId 删除资源监控配置。
        前端二次确认：要求输入与资源名称完全一致的字符串解锁确认按钮。
        对应操作指引「六、删除资源配置」。
      operationId: deleteResourceMonitorConfig
      x-relevant: true
      x-triggered-by-step: 39
      parameters:
        - name: objectId
          in: path
          required: true
          schema: {type: string}
          description: 资源对象 ID
          example: TESTWWH
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  codeExplain: {type: string, example: ""}
                  error: {type: string, example: ""}
                  data:
                    type: object
                    description: 空对象

  /next/api/gateway/easyops.api.collector_service_v2.job.GetResourceConfig@1.0.12/api/v1/list-resource-config:
    post:
      tags: [资源查询与搜索]
      summary: 资源监控配置列表/搜索
      description: |
        分页查询资源监控配置列表（进入监控资源管理页、搜索资源时调用）。
        对应操作指引「六-1 搜索资源」。
      operationId: listResourceConfig
      x-relevant: true
      x-triggered-by-step: 34
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                objectId:
                  type: array
                  description: 按对象 ID 过滤（可空）
                  items: {type: string}
                objectName: {type: string, description: 资源名称关键词, example: ""}
                page: {type: number, example: 1}
                pageSize: {type: number, example: 3000}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  codeExplain: {type: string, nullable: true}
                  error: {type: string, example: ""}
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        description: 资源配置列表
                        items:
                          type: object
                          properties:
                            instanceId: {type: string}
                            objectId: {type: string}
                            category: {type: string, example: 平台资源}
                            enabled: {type: boolean}
                            isBuiltin: {type: boolean}
                            isHidden: {type: boolean}
                            collectorKits:
                              type: array
                              items: {type: object}

  /next/api/gateway/logic.resource_monitor/api/v1/resource-monitor-config/{objectId}:
    get:
      tags: [资源查询与搜索]
      summary: 查询单个资源监控配置详情
      description: |
        按 objectId 查询单个资源的监控配置详情（进入资源编辑页时加载）。
        对应操作指引「四-1 搜索资源」「五、编辑资源配置」前的数据加载。
      operationId: getResourceMonitorConfig
      x-relevant: true
      x-triggered-by-step: 21
      parameters:
        - name: objectId
          in: path
          required: true
          schema: {type: string}
          description: 资源对象 ID
          example: TESTWWH
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  codeExplain: {type: string, example: ""}
                  error: {type: string, example: ""}
                  message: {type: string, example: success}
                  data:
                    type: object
                    properties:
                      objectId: {type: string}
                      category: {type: string, example: 计算资源}
                      enabled: {type: boolean}
                      dataTTL: {type: number}
                      healthAssessmentEnabled: {type: boolean}
                      collectorKits:
                        type: array
                        items: {type: object}
                      architectureObserveConfig:
                        type: object
                        properties:
                          isShow: {type: boolean}
                          layer: {type: string, nullable: true}

  /next/api/gateway/easyops.api.collector_service.job.ListResourceMonitorJob@1.0.37/api/v1/list-resource-monitor-job:
    get:
      tags: [资源查询与搜索]
      summary: 资源监控任务列表
      description: 按 objectId 查询该资源关联的监控采集任务列表（含任务状态）。
      operationId: listResourceMonitorJob
      x-relevant: true
      x-triggered-by-step: 23
      parameters:
        - in: query
          name: objectIdQ
          schema: {type: string}
          description: 资源对象 ID
          example: TESTWWH
        - in: query
          name: page
          schema: {type: string, example: "1"}
        - in: query
          name: pageSize
          schema: {type: string, example: "10"}
        - in: query
          name: showJobStatus
          schema: {type: string, example: "true"}
        - in: query
          name: nameQ
          schema: {type: string, example: ""}
        - in: query
          name: collectorKitsQ
          schema: {type: string, example: ""}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  codeExplain: {type: string, nullable: true}
                  error: {type: string, example: ""}
                  data:
                    type: object
                    properties:
                      page: {type: number, example: 1}
                      pageSize: {type: number, example: 10}
                      total: {type: number, example: 0}
                      jobs:
                        type: array
                        items: {type: object}

  /next/api/gateway/logic.collector_service/api/v1/collector_detect_job:
    get:
      tags: [资源查询与搜索]
      summary: 采集探测任务列表
      description: 查询采集探测任务（配置采集时用于探测 Agent 可达性等）。
      operationId: listCollectorDetectJob
      x-relevant: true
      x-triggered-by-step: 22
      parameters:
        - in: query
          name: objectId
          schema: {type: string}
          example: TESTWWH
        - in: query
          name: detectAgentType
          schema: {type: string, example: private}
        - in: query
          name: page
          schema: {type: string, example: "1"}
        - in: query
          name: pageSize
          schema: {type: string, example: "10"}
        - in: query
          name: onlyBaseInfo
          schema: {type: string, example: "true"}
        - in: query
          name: requireFlowDetect
          schema: {type: string, example: "false"}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  codeExplain: {type: string, example: ""}
                  error: {type: string, example: ""}
                  data:
                    type: object
                    properties:
                      page: {type: number, example: 1}
                      page_size: {type: number, example: 10}
                      total: {type: number, example: 0}
                      list:
                        type: array
                        items: {type: object}

  /next/api/gateway/easyops.api.collector_service.job.ListCollectorKitInfo@1.0.8/api/v1/collector/kit/info/list:
    get:
      tags: [采集套件与Agent]
      summary: 采集器套件列表
      description: |
        查询采集器套件列表（含其指标集 metricSets），配置采集时选择套件用。
        对应操作指引「三-4 选择资源分类」触发加载。
      operationId: listCollectorKitInfo
      x-relevant: true
      x-triggered-by-step: 13
      parameters:
        - in: query
          name: page
          schema: {type: string, example: "1"}
        - in: query
          name: pageSize
          schema: {type: string, example: "3000"}
        - in: query
          name: status
          schema: {type: string, example: enabled}
        - in: query
          name: names
          schema: {type: string, example: ""}
        - in: query
          name: relatedObjectIds
          schema: {type: string, example: ""}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  codeExplain: {type: string, nullable: true}
                  error: {type: string, example: ""}
                  data:
                    type: object
                    properties:
                      total: {type: number, example: 24}
                      page: {type: number, example: 1}
                      pageSize: {type: number, example: 3000}
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            metricSets:
                              type: array
                              items:
                                type: object
                                properties:
                                  instanceId: {type: string}
                                  name: {type: string, example: cpu}

  /next/api/gateway/logic.resource_package_service/api/v1/resource-package/monitor-kits-R:
