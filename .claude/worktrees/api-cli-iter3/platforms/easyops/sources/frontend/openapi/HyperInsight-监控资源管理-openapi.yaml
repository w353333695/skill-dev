      operationId: getResourcePackageMonitorKits
      x-relevant: true
      x-triggered-by-step: 17
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  codeExplain: {type: string, example: ""}
                  error: {type: string, example: ""}
                  data:
                    type: object
                    properties:
                      name: {type: string, example: monitor-kits-R}
                      version: {type: string, example: 1.50.12}
                      initStatus: {type: string, example: succeeded}
                      errMsg: {type: string, example: ""}
                      lastImportTime: {type: string, example: "2026-02-25 18:48:29"}

