openapi: 3.0.3
info:
  title: ITSM 系统管理 · 服务目录管理 API
  version: "1.0"
  description: |
    ITSM「系统管理 -> 服务目录管理」涉及的后端接口。涵盖服务目录（catalog）的
    增删改查、隐藏/显示、权限设置，目录下服务（service_instance）的新建/排序/删除，
    服务导入导出，以及新建服务时的用户/用户组检索、流程/触发器/知识关联。
    路径前缀均为 `/next/api/gateway/...`，网关按「服务.方法」路由到后端微服务。
  x-system: itsm

# ============ 标签 ============
tags:
  - name: 服务目录管理
    description: 服务目录（catalog）的增删改查、隐藏/显示
  - name: 服务实例管理
    description: 目录下服务（service_instance）的新建、排序、删除
  - name: 服务导入导出
    description: 服务批量导入
  - name: 目录权限
    description: 服务目录的查看/操作权限设置
  - name: 用户与用户组搜索
    description: 选负责人/设权限时的用户、用户组检索
  - name: 流程与知识关联
    description: 新建服务时关联流程、触发器、知识；默认常用服务

# ============ 路径 ============
paths:

  # ---------- 服务目录管理 ----------
  /next/api/gateway/flowable_service.service_catalog.ListCatalog/api/flowable_service/v1/service_catalog:
    get:
      tags: [服务目录管理]
      operationId: listServiceCatalog
      summary: 获取全部服务目录
      description: |
        返回所有服务目录（含父子层级），进入服务目录管理页、刷新时调用。
      x-relevant: true
      responses:
        '200':
          description: 服务目录列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  codeExplain: { type: string, example: "" }
                  error: { type: string, example: "" }
                  data:
                    type: object
                    properties:
                      page: { type: number, example: 1 }
                      page_size: { type: number, example: 54 }
                      list:
                        type: array
                        description: 目录节点
                        items:
                          type: object
                          properties:
                            instanceId: { type: string, example: "5b55f857c6551" }
                            name: { type: string, example: "标准事件" }
                            parentID: { type: string, example: "" }
                            parentName: { type: string, example: "" }
                            description: { type: string, example: "" }

  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/service_catalog:
    post:
      tags: [服务目录管理]
      operationId: createServiceCatalog
      summary: 新建服务目录
      description: |
        在指定父目录下新建服务目录，返回新目录 instanceId。
      x-relevant: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, parentID]
              properties:
                name:
                  type: string
                  example: "test"
                  description: 目录名称
                parentID:
                  type: string
                  example: "5b55f857c6551"
                  description: 父目录 ID（顶层为空）
                parentName:
                  type: string
                  example: "标准事件"
                  description: 父目录名称
                description:
                  type: string
                  example: "测试"
                  description: 目录描述
      responses:
        '200':
          description: 新建结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  codeExplain: { type: string, example: "" }
                  error: { type: string, example: "" }
                  data:
                    type: object
                    properties:
                      instanceId: { type: string, example: "6567758520fcf" }

  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/service_catalog/{catalogId}:
    put:
      tags: [服务目录管理]
      operationId: updateServiceCatalog
      summary: 编辑服务目录 / 隐藏 / 显示
      description: |
        修改目录名称、描述，或切换目录的可见状态（隐藏/显示）。
        通过同一 PUT 接口提交更新后的完整字段。
      x-relevant: true
      parameters:
        - in: path
          name: catalogId
          required: true
          schema: { type: string }
          description: 目录 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instanceId:
                  type: string
                  example: "6567758520fcf"
                name:
                  type: string
                  example: "test1"
                  description: 目录名称
                parentName:
                  type: string
                  example: "标准事件"
                description:
                  type: string
                  example: "测试"
      responses:
        '200':
          description: 编辑结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  codeExplain: { type: string, example: "" }
                  error: { type: string, example: "" }
                  data: { type: object, nullable: true, example: null }
    delete:
      tags: [服务目录管理]
      operationId: deleteServiceCatalog
      summary: 删除服务目录
      description: |
        删除指定服务目录。删除前需确认其下服务已清空或按页面提示二次确认。
      x-relevant: true
      parameters:
        - in: path
          name: catalogId
          required: true
          schema: { type: string }
          description: 待删除目录 ID
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  codeExplain: { type: string, example: "" }
                  error: { type: string, example: "" }
                  data: { type: object, nullable: true, example: null }

  # ---------- 服务实例管理 ----------
  /next/api/gateway/flowable_service.service_catalog.ListService/api/flowable_service/v1/service_instance:
    get:
      tags: [服务实例管理]
      operationId: listServiceInstance
      summary: 查询目录下服务列表
      description: |
        分页查询指定目录下的服务列表。
        query: catalogID（目录 ID）、page、pageSize、Q（关键词）。
      x-relevant: true
      parameters:
        - in: query
          name: catalogID
          schema: { type: string, example: "5b55f857da185" }
          description: 目录 ID
        - in: query
          name: page
          schema: { type: string, example: "1" }
        - in: query
          name: pageSize
          schema: { type: string, example: "10" }
        - in: query
          name: Q
          schema: { type: string, example: "" }
          description: 服务关键词
      responses:
        '200':
          description: 服务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data:
                    type: object
                    properties:
                      page: { type: number, example: 1 }
                      page_size: { type: number, example: 10 }
                      list:
                        type: array
                        items:
                          type: object

  /next/api/gateway/logic.flowable_service/api/flowable_service/v2/service_instance:
    post:
      tags: [服务实例管理]
      operationId: createServiceInstance
      summary: 新建服务
      description: |
        在指定目录下新建服务。需配置服务名称、关联流程、负责人、触发器、
        服务分类码、关联知识、图标等。返回新服务 instanceId。
      x-relevant: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [catalogId, serviceName, name]
              properties:
                catalogId:
                  type: string
                  example: "6567758520fcf"
                  description: 所属目录 ID
                serviceName:
                  type: string
                  example: "test"
                  description: 服务编码
                name:
                  type: string
                  example: "test"
                  description: 服务名称
                description:
                  type: string
                  example: "测试"
                icon:
                  type: object
                  description: 图标配置
                  example: { category: "", color: "blue", icon: "chart-pie", lib: "fa", prefix: "fas" }
                # 关联流程、负责人、触发器、分类码、知识等字段以表单实际提交为准
      responses:
        '200':
          description: 新建结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data:
                    type: object
                    properties:
                      instanceId: { type: string, example: "656775aec9647" }

  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/service_instance/sort:
    post:
      tags: [服务实例管理]
      operationId: sortServiceInstance
      summary: 服务排序
      description: |
        调整目录下服务的展示顺序。serviceIdList 与 sortList 一一对应。
      x-relevant: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceIdList, sortList]
              properties:
                serviceIdList:
                  type: array
                  items: { type: string }
                  example: ["656775aec9647"]
                  description: 服务 ID 列表
                sortList:
                  type: array
                  items: { type: number }
                  example: [2]
                  description: 对应的排序序号
      responses:
        '200':
          description: 排序结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data: { type: object, nullable: true, example: null }

  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/service_instance/{instanceId}:
    delete:
      tags: [服务实例管理]
      operationId: deleteServiceInstance
      summary: 删除服务
      description: |
        删除指定服务。前端通常要求二次确认后调用。
      x-relevant: true
      parameters:
        - in: path
          name: instanceId
          required: true
          schema: { type: string }
          description: 服务实例 ID
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data: { type: object, nullable: true, example: null }

  # ---------- 服务导入导出 ----------
  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/service_catalog/{catalogId}/import:
    post:
      tags: [服务导入导出]
      operationId: importServiceInstance
      summary: 导入服务
      description: |
        上传文件批量导入服务到指定目录。
        文件需为「导出」功能下载的格式（gzip 压缩），否则可能返回
        gzip: invalid header 错误（code=500）。
      x-relevant: true
      parameters:
        - in: path
          name: catalogId
          required: true
          schema: { type: string }
          description: 目标目录 ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 导入文件（导出格式）
      responses:
        '200':
          description: 导入结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  codeExplain: { type: string, example: "" }
                  error: { type: string, example: "" }
                  data: { type: object, nullable: true, example: null }
                  description: "失败时 code=500, codeExplain=ERR_UNKNOWN_ERROR, error=gzip: invalid header"

  # ---------- 目录权限 ----------
  /next/api/gateway/flowable_service.service_catalog.SetCatalogPermission/api/flowable_service/v1/set_catalog_permission:
    post:
      tags: [目录权限]
      operationId: setCatalogPermission
      summary: 设置服务目录权限
      description: |
        配置可查看（readUserList）与可操作（modifyUserList）该目录的用户/用户组列表。
      x-relevant: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instanceId]
              properties:
                instanceId:
                  type: string
                  example: "6567758520fcf"
                  description: 目录 ID
                readUserList:
                  type: array
                  items: { type: string }
                  example: ["deploy_strategy", "alanzou"]
                  description: 可查看的用户/用户组
                modifyUserList:
                  type: array
                  items: { type: string }
                  example: ["test0001"]
                  description: 可操作的用户/用户组
      responses:
        '200':
          description: 设置结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data: { type: object, nullable: true, example: null }

  # ---------- 用户与用户组搜索 ----------
  /next/api/gateway/cmdb.instance.PostSearch/object/USER/instance/_search:
    post:
      tags: [用户与用户组搜索]
      operationId: searchUser
      summary: 搜索用户
      description: |
        按关键词分页搜索用户（CMDB USER 实例）。
        选服务负责人、设置目录权限时调用。
      x-relevant: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page: { type: number, example: 1 }
                page_size: { type: number, example: 20 }
                fields:
                  type: object
                  example: { name: true }
                ignore_missing_field_error: { type: boolean, example: true }
                query:
                  type: object
                  description: 支持 $or / $like 模糊匹配
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            instanceId: { type: string, example: "653547e2782c3" }
                            name: { type: string, example: "easyops" }
                            nickname: { type: string, example: "鲲鹏3046" }

  /next/api/gateway/cmdb.instance.PostSearch/object/USER_GROUP/instance/_search:
    post:
      tags: [用户与用户组搜索]
      operationId: searchUserGroup
      summary: 搜索用户组
      description: |
        按关键词分页搜索用户组（CMDB USER_GROUP 实例）。
        选服务负责人、设置目录权限、默认常用服务时调用。
      x-relevant: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page: { type: number, example: 1 }
                page_size: { type: number, example: 20 }
                fields:
                  type: object
                  example: { name: true }
                ignore_missing_field_error: { type: boolean, example: true }
                query:
                  type: object
                  description: 支持 $and / $or / $like
      responses:
        '200':
          description: 用户组列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data:
                    type: object
                    properties:
                      total: { type: number, example: 1 }
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            instanceId: { type: string, example: "656289c9ad8ff" }
                            name: { type: string, example: "test" }

  # ---------- 流程与知识关联 ----------
  /next/api/gateway/flowable_service.process_definition_version.ListProcessDefinition/api/flowable_service/v1/process_definition:
    get:
      tags: [流程与知识关联]
      operationId: listProcessDefinition
      summary: 加载可选流程（主版本）
      description: |
        新建服务选择关联流程时调用，返回已发布的流程主版本。
        query: isMain=true（仅主版本）、page、pageSize、Q。
      x-relevant: true
      parameters:
        - in: query
          name: isMain
          schema: { type: string, example: "true" }
        - in: query
          name: page
          schema: { type: string, example: "1" }
        - in: query
          name: pageSize
          schema: { type: string, example: "30" }
        - in: query
          name: Q
          schema: { type: string, example: "" }
      responses:
        '200':
          description: 流程列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data:
                    type: object
                    properties:
                      page: { type: number, example: 1 }
                      page_size: { type: number, example: 30 }
                      list:
                        type: array
                        items:
                          type: object

  /next/api/gateway/flowable_service.trigger.ListTrigger/api/flowable_service/v1/trigger:
    get:
      tags: [流程与知识关联]
      operationId: listTrigger
      summary: 加载触发器列表
      description: |
        新建服务选择「引用触发器」时调用，返回可选触发器。
      x-relevant: true
      responses:
        '200':
          description: 触发器列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object

  /next/api/gateway/flowable_service.knowledge_base.ListKnowledge/api/flowable_service/v1/knowledge_base/knowledge:
    get:
      tags: [流程与知识关联]
      operationId: listKnowledge
      summary: 搜索关联知识
      description: |
        新建服务「根据知识编号搜索」时调用，从知识库检索可关联知识。
        query: catalogId（知识库目录）、Q、page、pageSize、status=published。
      x-relevant: true
      parameters:
        - in: query
          name: catalogId
          schema: { type: string, example: "6a4f252229e257caa1573431" }
        - in: query
          name: Q
          schema: { type: string, example: "" }
        - in: query
          name: status
          schema: { type: string, example: "published" }
        - in: query
          name: page
          schema: { type: string, example: "1" }
        - in: query
          name: pageSize
          schema: { type: string, example: "20" }
      responses:
        '200':
          description: 知识列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object

  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/knowledge_base/catalog_tree:
    get:
      tags: [流程与知识关联]
      operationId: getKnowledgeCatalogTree
      summary: 获取知识库目录树
      description: |
        新建服务表单打开时调用，加载知识库目录树用于关联知识选择。
      x-relevant: true
      responses:
        '200':
          description: 知识库目录树
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data:
                    type: object
                    properties:
                      catalogTree:
                        type: array
                        items:
                          type: object

  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/process_definition:
    post:
      tags: [流程与知识关联]
      operationId: saveProcessDefinition
      summary: 保存默认常用服务 / 创建知识
      description: |
        保存「默认常用服务」配置，或从服务目录「创建知识」时调用。
      x-relevant: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: 默认常用服务配置或创建知识参数（按表单实际提交）
      responses:
        '200':
          description: 保存结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data:
                    type: object
