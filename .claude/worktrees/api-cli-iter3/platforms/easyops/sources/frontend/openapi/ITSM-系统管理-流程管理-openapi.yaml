openapi: 3.0.3
info:
  title: ITSM 系统管理 · 流程管理 API
  version: "1.0"
  description: |
    ITSM「系统管理 -> 流程管理」涉及的后端接口。涵盖流程定义的创建、编辑，
    流程版本（bpmnXML）的保存与发布、阶段配置、设为主版本、表单绑定、删除，
    流程图编排时的节点连通性校验，以及触发器、表单、用户/CMDB 实例查询。
    路径前缀均为 `/next/api/gateway/...`，网关按「服务.方法」路由到后端微服务。
  x-system: itsm

# ============ 标签 ============
tags:
  - name: 流程列表与详情
    description: 流程定义列表查询与搜索
  - name: 流程创建与编辑
    description: 流程基本信息的新建与编辑
  - name: 流程版本保存与发布
    description: 流程版本（bpmnXML）保存、阶段配置、设为主版本、表单绑定
  - name: 流程版本删除
    description: 删除流程版本
  - name: 流程节点编排
    description: 流程图编排时的节点连通性校验
  - name: 触发器与表单
    description: 触发器列表、表单 schema 列表
  - name: 用户与CMDB查询
    description: 处理人用户/用户组检索、CMDB 实例查询

# ============ 路径 ============
paths:

  # ---------- 流程列表与详情 ----------
  /next/api/gateway/flowable_service.process_definition_version.ListProcessDefinition/api/flowable_service/v1/process_definition:
    get:
      tags: [流程列表与详情]
      operationId: listProcessDefinition
      summary: 查询流程定义列表
      description: |
        分页查询流程定义列表，支持关键词搜索（q）。
        进入流程管理页、搜索流程时调用。
      x-relevant: true
      parameters:
        - in: query
          name: page
          schema: { type: string, example: "1" }
        - in: query
          name: page_size
          schema: { type: string, example: "10" }
        - in: query
          name: q
          schema: { type: string, example: "test" }
          description: 关键词
        - in: query
          name: visible
          schema: { type: string, example: "true" }
          description: 可见性过滤（高级搜索）
      responses:
        '200':
          description: 流程列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object

  # ---------- 流程创建与编辑 ----------
  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/process_definition:
    post:
      tags: [流程创建与编辑]
      operationId: createProcessDefinition
      summary: 新建流程
      description: |
        创建流程定义，填写名称、分类、说明、触发器等，返回流程 ID，
        随后跳转至流程编排页。
      x-relevant: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "test"
                  description: 流程名称
                category:
                  type: string
                  example: "事件管理"
                  description: 流程分类
                memo:
                  type: string
                  example: "info"
                  description: 流程说明
                triggerIdList:
                  type: array
                  items: { type: string }
                  description: 关联触发器 ID 列表
      responses:
        '200':
          description: 新建结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data:
                    type: object

  /next/api/gateway/logic.flowable_service/api/flowable_service/v2/process_definition:
    put:
      tags: [流程创建与编辑]
      operationId: updateProcessDefinition
      summary: 编辑流程基本信息
      description: |
        修改流程名称、分类、说明、触发器等基本信息。
      x-relevant: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "test_01"
                category:
                  type: string
                  example: "事件管理"
                memo:
                  type: string
                  example: "info"
                triggerIdList:
                  type: array
                  items: { type: string }
                  example: []
                useFormBuilder:
                  type: boolean
                  example: true
      responses:
        '200':
          description: 编辑结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data: { type: object }

  # ---------- 流程版本保存与发布 ----------
  /next/api/gateway/logic.flowable_service/api/flowable_service/v2/process_definition_version:
    post:
      tags: [流程版本保存与发布]
      operationId: saveProcessDefinitionVersion
      summary: 保存流程版本
      description: |
        提交流程图 bpmnXML 保存为新版本。编排完成后保存、复制版本保存时调用。
        state=done 表示完成态。
      x-relevant: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bpmnXML:
                  type: string
                  description: BPMN 2.0 XML 流程定义
                  example: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<bpmn2:definitions ...>"
                memo:
                  type: string
                  example: "init"
                  description: 版本说明
                state:
                  type: string
                  example: "done"
                  description: 版本状态
      responses:
        '200':
          description: 保存结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data:
                    type: object

  /next/api/gateway/flowable_service.process_definition_version.SaveProcessDefinitionVersion/api/flowable_service/v1/process_definition_version/save:
    put:
      tags: [流程版本保存与发布]
      operationId: saveVersionStage
      summary: 保存阶段配置/设为主版本
      description: |
        保存流程的阶段配置（stage），或将某版本设为主版本，或绑定表单后保存。
      x-relevant: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 阶段配置/主版本标记/表单绑定参数
      responses:
        '200':
          description: 保存结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data: { type: object, nullable: true, example: null }
    post:
      tags: [流程版本保存与发布]
      operationId: bindForm
      summary: 表单绑定保存
      description: |
        为流程版本绑定表单后保存。
      x-relevant: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 表单绑定参数
      responses:
        '200':
          description: 绑定结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data: { type: object }

  # ---------- 流程版本删除 ----------
  /next/api/gateway/flowable_service.process_definition_version.DeleteProcessDefinitionVersion/api/flowable_service/v1/process_definition_version/{versionId}:
    delete:
      tags: [流程版本删除]
      operationId: deleteProcessDefinitionVersion
      summary: 删除流程版本
      description: |
        删除指定流程版本。删除前需二次确认。
      x-relevant: true
      parameters:
        - in: path
          name: versionId
          required: true
          schema: { type: string }
          description: 版本 ID
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data: { type: object }

  # ---------- 流程节点编排 ----------
  /next/api/gateway/flowable_service.process_definition_version.GetNextNodes/api/flowable_service/v1/process_definition_version/next_nodes:
    post:
      tags: [流程节点编排]
      operationId: getNextNodes
      summary: 查询后继节点
      description: |
        编排时根据 bpmnXML 与 userTaskId 查询某节点的后继节点，用于连线校验。
      x-relevant: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bpmnXML, userTaskId]
              properties:
                bpmnXML:
                  type: string
                  description: BPMN 2.0 XML
                userTaskId:
                  type: string
                  example: "Activity_1y72q7b"
                  description: 当前节点 ID
      responses:
        '200':
          description: 后继节点列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data: { type: object }

  /next/api/gateway/flowable_service.process_definition_version.GetPreviousNodes/api/flowable_service/v1/process_definition_version/previous_nodes:
    post:
      tags: [流程节点编排]
      operationId: getPreviousNodes
      summary: 查询前置节点
      description: |
        编排时查询某节点的前置节点，用于退回/连线校验。
      x-relevant: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bpmnXML, userTaskId]
              properties:
                bpmnXML: { type: string }
                userTaskId: { type: string, example: "Activity_1y72q7b" }
      responses:
        '200':
          description: 前置节点列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data: { type: object }

  /next/api/gateway/flowable_service.process_definition_version.GetJumpableNodes/api/flowable_service/v1/process_definition_version/jumpable_nodes:
    post:
      tags: [流程节点编排]
      operationId: getJumpableNodes
      summary: 查询可跳转节点
      description: |
        编排时查询从当前节点可跳转的目标节点（用于配置退回/跳转）。
      x-relevant: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bpmnXML]
              properties:
                bpmnXML: { type: string }
      responses:
        '200':
          description: 可跳转节点列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data: { type: object }

  # ---------- 触发器与表单 ----------
  /next/api/gateway/flowable_service.trigger.ListTrigger/api/flowable_service/v1/trigger:
    get:
      tags: [触发器与表单]
      operationId: listTrigger
      summary: 加载触发器列表
      description: |
        新建/编辑流程选择触发器时调用，返回可选触发器。
      x-relevant: true
      responses:
        '200':
          description: 触发器列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data: { type: object }

  /next/api/gateway/flowable_service.form_schema_version.ListFormSchema/api/flowable_service/v1/form_schema_version:
    get:
      tags: [触发器与表单]
      operationId: listFormSchema
      summary: 加载表单 schema 列表
      description: |
        流程设置-绑定表单时调用，返回可选表单 schema。
      x-relevant: true
      responses:
        '200':
          description: 表单列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data: { type: object }

  # ---------- 用户与CMDB查询 ----------
  /next/api/gateway/flowable_service.assistant.QueryCMDBInstanceV2/api/flowable_service/v1/assistant/cmdb_instance:
    post:
      tags: [用户与CMDB查询]
      operationId: queryCMDBInstance
      summary: 查询 CMDB 实例
      description: |
        节点配置「使用流程表单值」时，按关键词查询 CMDB 实例（表单值候选）。
        支持 $or / $like 模糊匹配。
      x-relevant: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page: { type: number, example: 1 }
                page_size: { type: number, example: 20 }
                fields:
                  type: object
                  example: { name: true }
                query:
                  type: object
                  description: 支持 $or / $like
                  example: { "$or": [ { "name": { "$like": "%%" } } ] }
      responses:
        '200':
          description: CMDB 实例列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data: { type: object }

  /next/api/gateway/cmdb.instance.PostSearch/object/USER/instance/_search:
    post:
      tags: [用户与CMDB查询]
      operationId: searchUser
      summary: 搜索用户
      description: |
        配置节点处理人时，按关键词搜索用户（CMDB USER 实例）。
      x-relevant: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page: { type: number, example: 1 }
                page_size: { type: number, example: 20 }
                fields:
                  type: object
                  example: { name: true }
                query:
                  type: object
                  description: 支持 $or / $like
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object

  /next/api/gateway/cmdb.instance.PostSearch/object/USER_GROUP/instance/_search:
    post:
      tags: [用户与CMDB查询]
      operationId: searchUserGroup
      summary: 搜索用户组
      description: |
        配置节点处理人时，按关键词搜索用户组（CMDB USER_GROUP 实例）。
      x-relevant: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page: { type: number, example: 1 }
                page_size: { type: number, example: 20 }
                fields:
                  type: object
                  example: { name: true }
                query:
                  type: object
      responses:
        '200':
          description: 用户组列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
