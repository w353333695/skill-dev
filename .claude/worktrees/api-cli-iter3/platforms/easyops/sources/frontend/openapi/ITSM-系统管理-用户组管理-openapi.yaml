openapi: 3.0.3
info:
  title: ITSM-系统管理-用户组管理 API
  version: "1.0"
  description: |
    ITSM「系统管理 → 用户组管理」模块涉及的后端接口，覆盖用户组的查询、详情、新建、删除，
    以及成员的关联（追加）与移除。仅收录与本流程直接相关的业务接口（x-relevant: true），
    会话上下文类请求（users/orgs、users/detail、permission_role/config、菜单/微应用框架加载等）已剔除。
  x-system: itsm
  x-host: http://172.30.5.20
servers:
  - url: http://172.30.5.20/next
    description: ITSM 网关前缀
tags:
  - name: 用户组列表与详情
    description: 用户组列表查询、用户组详情、用户组对象模型与默认值模板、关联关系定义
  - name: 用户组创建与删除
    description: 用户组实例的新建与删除
  - name: 用户组成员管理
    description: 用户组成员的搜索、关联（追加）、移除

paths:
  # ===== 用户组列表与详情 =====
  /api/gateway/user_service.user_admin.SearchAllUserGroup/api/v1/users/group/all:
    post:
      tags: [用户组列表与详情]
      summary: 查询全部用户组
      description: 查询当前 org 下全部用户组列表，用于用户组列表页渲染；进入列表页、创建/删除后均会刷新调用。
      x-relevant: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  description: 指定返回字段
                  properties:
                    instanceId: {type: boolean, example: true}
                    name: {type: boolean, example: true}
                    _members: {type: boolean, example: true}
                    _description: {type: boolean, example: true}
                    creator: {type: boolean, example: true}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  codeExplain: {type: string}
                  error: {type: object, nullable: true}
                  data:
                    type: array
                    description: 用户组列表
                    items:
                      type: object

  /api/gateway/cmdb.instance.GetDetail/object/USER_GROUP/instance/{instanceId}:
    get:
      tags: [用户组列表与详情]
      summary: 查询单个用户组详情
      description: 按用户组 instanceId 查询该用户组的详情（含名称、描述、成员等），进入用户组详情页时调用。
      x-relevant: true
      parameters:
        - name: instanceId
          in: path
          required: true
          schema: {type: string}
          description: 用户组实例 ID
          example: 6567613d89bf3
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  error: {type: object, nullable: true}
                  message: {type: string}
                  data: {type: object}

  /api/gateway/cmdb.cmdb_object.GetDetail/object/USER_GROUP:
    get:
      tags: [用户组列表与详情]
      summary: 查询用户组对象模型
      description: 查询 USER_GROUP 这个 CMDB 对象的模型定义（字段 schema、视图等），用于详情页渲染表单结构。
      x-relevant: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  error: {type: object, nullable: true}
                  message: {type: string}
                  data: {type: object}

  /api/gateway/cmdb.instance.GetDefaultValueTemplate/object/USER_GROUP/instance_default_value_template:
    get:
      tags: [用户组列表与详情]
      summary: 获取用户组新建表单默认值模板
      description: 打开「新增用户组」表单时加载默认值模板，用于预置字段默认值。
      x-relevant: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  error: {type: object, nullable: true}
                  message: {type: string}
                  data: {type: object}

  /api/gateway/cmdb.cmdb_object.GetObjectRef/object_ref:
    get:
      tags: [用户组列表与详情]
      summary: 查询用户组关联关系定义
      description: 查询 USER_GROUP 对象的关联关系（relation）定义，用于详情页展示成员等关联数据。
      x-relevant: true
      parameters:
        - name: ref_object
          in: query
          required: true
          schema: {type: string}
          description: 关联主体对象 ID
          example: USER_GROUP
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  error: {type: object, nullable: true}
                  message: {type: string}
                  data: {type: object}

  # ===== 用户组创建与删除 =====
  /api/gateway/cmdb.instance.CreateInstance/v2/object/USER_GROUP/instance:
    post:
      tags: [用户组创建与删除]
      summary: 新建用户组
      description: 创建一个新的用户组实例；组名称需唯一，重复会报错。
      x-relevant: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: 用户组名称（唯一）
                  example: 部门2
                _description:
                  type: string
                  description: 用户组描述
                  example: 测试组
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  error: {type: object, nullable: true}
                  message: {type: string}
                  data: {type: object}

  /api/gateway/cmdb.instance.DeleteInstance/object/USER_GROUP/instance/{instanceId}:
    delete:
      tags: [用户组创建与删除]
      summary: 删除用户组
      description: 按 instanceId 删除用户组，同时清除其成员关联关系；不可逆。
      x-relevant: true
      parameters:
        - name: instanceId
          in: path
          required: true
          schema: {type: string}
          description: 用户组实例 ID
          example: 6567613d89bf3
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  error: {type: object, nullable: true}
                  message: {type: string}
                  data: {type: object}

  # ===== 用户组成员管理 =====
  /api/gateway/cmdb.instance.PostSearchV3/v3/object/USER/instance/_search:
    post:
      tags: [用户组成员管理]
      summary: 搜索可关联的用户
      description: |
        在「关联用户」对话框中搜索可加入本用户组的用户。
        查询条件会自动排除已是当前用户组成员的用户（query.__members_USER_GROUP.instanceId: {$ne: <当前组ID>}）。
      x-relevant: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: array
                  items: {type: string}
                  description: 返回字段
                  example: [name, nickname, user_icon, user_email, user_tel, wework_userid, state, user_memo, dingding_userid, developApps, instanceId]
                page: {type: number, example: 1}
                page_size: {type: number, example: 10}
                ignore_missing_field_error: {type: boolean, example: true}
                relation_limit: {type: number, example: 6}
                query:
                  type: object
                  description: 过滤条件，默认排除已是当前组成员的用户
                  properties:
                    __members_USER_GROUP.instanceId:
                      type: object
                      properties:
                        $ne: {type: string, example: 6567613d89bf3}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: object}
                  code: {type: number, example: 0}
                  error: {type: object, nullable: true}
                  message: {type: string}

  /api/gateway/logic.user_service/api/v1/groups/{groupId}/members:
    put:
      tags: [用户组成员管理]
      summary: 关联（追加）成员到用户组
      description: |
        将一批用户关联到指定用户组。请求体 op=append 表示追加（不去重已存在成员）。
        也可用于批量覆盖/移除，由 op 字段控制。
      x-relevant: true
      parameters:
        - name: groupId
          in: path
          required: true
          schema: {type: string}
          description: 用户组实例 ID
          example: 6567613d89bf3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds, op]
              properties:
                userIds:
                  type: array
                  items: {type: string}
                  description: 要关联的用户 instanceId 列表
                  example: [653547e2782c3, 653baedadb9dd, 65408edc0ef7d]
                op:
                  type: string
                  enum: [append, replace, remove]
                  description: 关联操作类型，默认 append（追加）
                  example: append
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  codeExplain: {type: string}
                  error: {type: object, nullable: true}
                  data: {type: object}

  /api/gateway/cmdb.instance_relation.Remove/object/USER_GROUP/relation/_members/remove:
    post:
      tags: [用户组成员管理]
      summary: 从用户组移除成员
      description: |
        将指定用户从用户组的成员关系（_members）中移除，仅解除关联，不删除用户本身。
      x-relevant: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instance_ids, related_instance_ids]
              properties:
                instance_ids:
                  type: array
                  items: {type: string}
                  description: 用户组实例 ID 列表
                  example: [6567613d89bf3]
                related_instance_ids:
                  type: array
                  items: {type: string}
                  description: 要移除的用户 instanceId 列表
                  example: [653baedadb9dd]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  error: {type: object, nullable: true}
                  message: {type: string}
                  data: {type: object}
