name: model_get_detail
module: cmdb_model
method: GET
path: /object/{objectId}
gateway_path: /next/api/gateway/cmdb.cmdb_object.GetDetail/object/{objectId}
service: logic.cmdb.service
side_effect: read
path_source: gateway_strip
path_confidence: medium
tags:
- CMDB
- 模型
- 详情
summary: 模型详情(字段/关系/视图)
description: 获取指定模型的完整定义（字段、关系、视图等）。
request:
  required:
  - objectId
  properties:
    objectId:
      type: string
      desc: 模型 ID，如 LLM_TEST
    ignoreAttrPermission:
      type: bool
      desc: 忽略模型字段权限校验
      _source: contract
    isValidatePermission:
      type: bool
      desc: 是否校验对模型的访问权限
      _source: contract
    withRelationProperty:
      type: bool
      desc: 是否返回关系属性
      _source: contract
    moreMetadataAttr:
      type: string
      desc: 返回更多元数据属性，多个属性id用 , 分隔
      _source: contract
outputs:
  detail:
    jsonpath: $.data
    desc: 模型详情
requires:
- objectId 为已存在模型
rollback: null
