name: getTaskDetail
module: ticket
method: GET
path: /api/flowable_service/v1/ticket/{ticketId}/task/{taskId}
gateway_path: /next/api/gateway/flowable_service.process_instance.GetTaskDetail/api/flowable_service/v1/ticket/{ticketId}/task/{taskId}
service: logic.flowable_service
side_effect: read
path_source: gateway_strip
path_confidence: medium
tags:
- 工单
- 任务
- 详情
- mainTask
- 查询
summary: 查询工单任务详情（mainTask）
description: 发起后点击工单号进入详情时拉取，返回 mainTask（当前任务节点信息）等。
request:
  required:
  - ticketId
  - taskId
  properties:
    ticketId:
      type: instance_id
      desc: 工单实例 ID（非工单号）
    taskId:
      type: instance_id
      desc: 任务步骤 ID
outputs:
  detail:
    jsonpath: $.data
    desc: 任务详情整体（含 mainTask 主任务、ticket 工单、progress 进度、allowedOp 权限等）
  extra_operation_records:
    jsonpath: $.data.extraOperationRecords
    desc: 额外操作历史（撤回/分阅/挂起/激活等）
  main_task:
    jsonpath: $.data.mainTask
    desc: 当前任务节点信息（BriefMainStepInfo）
requires:
- ticketId 须为已存在工单实例 ID（非工单号），可来自 startProcessInstance 的 instanceId
- taskId 须为该工单有效任务步骤 ID
rollback: null
