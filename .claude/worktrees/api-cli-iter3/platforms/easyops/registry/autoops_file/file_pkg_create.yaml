name: file_pkg_create
module: autoops_file
method: POST
path: /package
gateway_path: /next/api/gateway/artifact.pkgservice.Create/package
service: logic.artifact
side_effect: create
path_source: backend_contract
path_confidence: high
tags:
- 文件分发
- 文件包
- 新建
- 创建
summary: 新建文件包
description: 创建文件分发文件包（空包，不含版本）。必填名称/分类/平台类型/默认部署路径；type=4 固定为文件分发。创建后返回 packageId，后续上传文件、提交版本均以其为路径参数。
request:
  required:
  - name
  - category
  - platform
  - installPath
  properties:
    name:
      type: string
      desc: 文件包名称
    category:
      type: string
      desc: 分类（如 默认）
    platform:
      type: string
      desc: 平台类型 linux/windows/other
    installPath:
      type: string
      desc: 默认部署路径（目标主机上的安装目录）
    memo:
      type: string
      desc: 说明
    type:
      type: number
      desc: 包类型（4=文件分发）
    cId:
      type: number
      desc: 分类 ID
outputs:
  packageId:
    jsonpath: $.data.packageId
    desc: 新建文件包的 packageId
  instanceId:
    jsonpath: $.data.instanceId
    desc: CMDB 实例 ID
  detail:
    jsonpath: $.data
    desc: 新建文件包完整信息
requires: []
rollback:
  api: file_pkg_delete
  params:
  - param_key: packageId
    from_output: packageId
    from_field: ''
examples: []
confidence:
  request: high
  module: high
  outputs: medium
  tags: high
  summary: high
endpoint:
  contract_ref: logic.artifact|POST|/package
  mode: easyops_internal
