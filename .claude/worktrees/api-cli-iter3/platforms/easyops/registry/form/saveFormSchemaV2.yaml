name: saveFormSchemaV2
module: form
method: POST
path: /api/flowable_service/v2/form
service: logic.flowable_service
side_effect: create
path_source: backend_contract
path_confidence: high
tags:
- 表单
- 新建
- V2
summary: 新建表单V2(建表单+首版本,自动isMain)
description: 新建表单（V2）。POST /v2/form，一步建表单+首个版本(自动isMain=true)。body含name+category+versionName+state+formDefinition(JSON字符串)+可选businessRules/domainModelId/dataSourceIdList。内网8134实测。⚠️formDefinition是string非object,需二次序列化。详见 form_development/form-schema-v2-dev §2.1。
request:
  required:
  - name
  - category
  - versionName
  - state
  - formDefinition
  properties:
    name:
      type: string
      desc: 表单名
    category:
      type: string
      desc: 表单分类
    versionName:
      type: string
      desc: 首版本号
    state:
      type: string
      desc: unfinished/done
    formDefinition:
      type: string
      desc: 控件定义JSON字符串
    businessRules:
      type: string
      desc: 业务规则
outputs:
  formId:
    jsonpath: $.data.instanceId
    desc: 表单ID
  versionId:
    jsonpath: $.data.lastestVersion.instanceId
    desc: 版本ID
rollback:
  api: deleteFormVersion
examples: []
endpoint:
  contract_ref: logic.flowable_service|POST|/api/flowable_service/v2/form
  mode: easyops_internal
