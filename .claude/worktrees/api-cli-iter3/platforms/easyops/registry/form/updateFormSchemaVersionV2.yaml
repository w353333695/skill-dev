name: updateFormSchemaVersionV2
module: form
method: PUT
path: /api/flowable_service/v2/form/{formId}/version/{versionId}
service: logic.flowable_service
side_effect: update
path_source: backend_contract
path_confidence: high
tags:
- 表单
- 编辑
- V2
summary: 编辑表单V2(done→自动新建版本,草稿→原地更新)
description: 编辑表单版本（V2）。PUT /v2/form/{formId}/version/{versionId}。行为分支:目标done→以请求内容新建版本;unfinished→原地更新。name/category/memo表单元信息每次全量更新。内网8134实测。详见 form_development/form-schema-v2-dev §2.2。
request:
  required:
  - formId
  - versionId
  - state
  properties:
    formId:
      type: string
      desc: 路径
    versionId:
      type: string
      desc: 路径
    name:
      type: string
      desc: 表单元信息(全量)
    state:
      type: string
      desc: 保存后状态
    formDefinition:
      type: string
      desc: 全量覆盖
outputs:
  versionId:
    jsonpath: $.data.lastestVersion.instanceId
    desc: 新建版本时返回新versionId
rollback: null
examples: []
endpoint:
  contract_ref: logic.flowable_service|PUT|/api/flowable_service/v2/form/{formId}/version/{versionId}
  mode: easyops_internal
