[project]
name = "api-console"
version = "0.1.0"
description = "API 资产建设 + 调用编排 CLI（平台中性，adapter 可拔插）"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "click>=8.1,<8.2",        # 8.2 起要求 Python>=3.10，卡住以保 3.9 可用（与 browser-recorder 一致）
    "pycookiecheat>=0.7",     # extract_auth 读 Chromium cookie（仅 extract-auth 子命令用，延迟 import）
]

[project.scripts]
api-console = "api_console.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api_console"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: 真实平台环境测试，默认 skip（-m integration 启用）",
]
