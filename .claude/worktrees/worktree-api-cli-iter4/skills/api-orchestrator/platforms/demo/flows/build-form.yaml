# 流程模板：新建 ITSM 表单（含 formDefinition 内容）—— 场景③。规划挡（写、build）。
# 场景：新建主机申请表单，支持申请多个，可申请物理机/虚拟机，含申请理由；
#       虚拟机有配置档位/是否挂载分区/分区类型/大小/挂载位置；物理机从 HOST 模型实例里选。
name: build-form
intent: 新建一个 ITSM 表单（form.save 永远建 form + 首版本 isMain=true），formDefinition 描述容器/控件树
trigger: ["建个表单", "新建表单", "做个申请表单", "创建 ITSM 表单"]
guard: 规划挡（写、build）—— 须展示 formDefinition 确认

prerequisites:
  env: [EASYOPS_ORG（18832008 测试）, EASYOPS_USER=easyops, EASYOPS_ITSM_BACKEND_URL]
  content: "formDefinition 是 JSON 字符串（JSON.stringify([]Container)）。容器/控件模型见 objects.yaml#itsm_form_definition"
  cmdb_model: "若用 CMDBINSTANCESELECT 控件选实例（如物理机选 HOST），目标模型须存在（HOST 存在）"

steps:
  - n: 1
    transform: 构造 formDefinition（本地）—— ⚠️必须归一化补全前端字段
    desc: |
      按需求拼 []Container（容器平铺列表）。⚠️不能只填语义字段——前端逐字段读，缺 options.layout/belongToSection/remoteFunc/rules 等会白屏崩（"Cannot read properties of undefined"）。
      必须用归一化器补全：容器加 condition/layout/layoutConfig/modelField/displayCondition；控件加 belongToSection + 完整 options（layout/layoutSpan/labelCol/defaultValue/disabled/enabled/highLight/isMore/only/pattern/placeholder/note/question/displayCondition/remoteFunc{toolId,scriptInputs}/rules/extraProps/dataType/required）。完整字段集见 objects.yaml#itsm_form_definition constraints。
      最稳：get 一个正常表单（如「知识表单」）的 formDefinition 作模板，改里面的 type/label/modelField/extraProps.items。
      本场景结构：
      ① row 容器『基础信息』: 申请理由 INPUT(必填) + 申请主机类型 SELECT[物理机|虚拟机] + 申请主机类型 MULTIPLESELECT（决定后续 table 显隐，条件显示见 add-version.yaml）
      ② table 容器『虚拟机申请』(动态多行): 配置档位 SELECT + 是否挂载分区 SWITCH + 分区类型 SELECT + 分区大小 NUMBERINPUT + 挂载位置 INPUT
      ③ table 容器『物理机申请』(动态多行): 选物理机 CMDBINSTANCESELECT(cmdbProps.class=relation, foreignObjectId=HOST, options.frontKey=name)
      控件 json tag 是 propertys（少 y）；SELECT 选项放 options.extraProps.items:[{key,label,value}]。
    body_hint: |
      formDefinition = JSON.stringify([
        { "key":"c_base","name":"基础信息","type":"row","propertys":[
            {"key":"reason","label":"申请理由","type":"INPUT","modelField":"reason","options":{"required":true}},
            {"key":"hostType","label":"申请主机类型","type":"SELECT","modelField":"hostType",
             "options":{"extraProps":{"items":[{"key":"vm","label":"虚拟机","value":"vm"},{"key":"pm","label":"物理机","value":"pm"}]}}} ]},
        { "key":"c_vm","name":"虚拟机申请","type":"table","propertys":[
            {"key":"vmSpec","label":"配置档位","type":"SELECT","modelField":"vmSpec","options":{"extraProps":{"items":[{"key":"s","label":"小","value":"s"}]}}},
            {"key":"mountPart","label":"是否挂载分区","type":"SWITCH","modelField":"mountPart","options":{}},
            {"key":"partType","label":"分区类型","type":"SELECT","modelField":"partType","options":{"extraProps":{"items":[{"key":"xfs","label":"xfs","value":"xfs"}]}}},
            {"key":"partSize","label":"分区大小(G)","type":"NUMBERINPUT","modelField":"partSize","options":{}},
            {"key":"mountPoint","label":"挂载位置","type":"INPUT","modelField":"mountPoint","options":{}} ]},
        { "key":"c_pm","name":"物理机申请","type":"table","propertys":[
            {"key":"host","label":"选择物理机","type":"CMDBINSTANCESELECT","modelField":"host",
             "cmdbProps":{"class":"relation","foreignObjectId":"HOST"},
             "options":{"frontKey":"name"}} ]} ])
  - n: 2
    op: form.save
    args: [--body-file, "<form.json>", --insecure, --yes]
    desc: 新建表单（永远建 form + 首版本 isMain=true；非 upsert）
    body_hint: |
      { "name":"主机申请表单", "category":"ITSM",
        "formDefinition": <上面的 JSON 字符串>,
        "state":"unfinished", "versionName":"1.0.0", "versionMemo":"初版" }
    expect: "code=0；data.instanceId=表单id，data.lastestVersion.instanceId=版本id"
    on_fail: "403 鉴权失败 → user 缺 itsc:form_management_create 权限；必填缺失 → 补 name/category/formDefinition/state"
  - n: 3
    op: form_version.get
    args: ["<formId>", "<versionId>", --insecure]
    desc: 校验——get 回读 formDefinition 确认内容落库（formDefinition 是字符串，需二次 JSON.parse 看 []Container）
    dataflow: "step2 返回的 formId + versionId → step3 path 参数"

key_rule: |
  form.save 非 upsert（永远新建）；formId/versionId 不可指定，CMDB 生成返回。
  formDefinition 是 JSON 字符串（wire 层 string），不是嵌套对象——save 时 JSON.stringify([]Container)。
  想先验证表单内容可跑通，可先 save 成功再用 form_version.get 回读确认。
side_effects: objects.yaml#itsm_form_version.side_effects
acceptance: "${EASYOPS_CMDB_FRONTEND_URL}/next/itsc-form-management/form-list/<formId>/<versionId>"
rollback: "form.delete <formId>（须先清版本；但新建的首版本删了会级联删 form，见 delete-form.yaml）"
