# 流程模板：从零建一个 CMDB 模型（场景②）。对应 SKILL.md flows/（build 用）。
name: build-model
intent: 声明式建模型（含属性 attrList + 关系 relation_list + 视图 view）
trigger: ["建个 X 模型", "新建模型", "定义资源类", "给 X 加属性和关系"]
guard: 规划挡（写、build）—— 须先展示 payload 确认
prerequisites:
  env: [EASYOPS_ORG（非 0/1/2 测试 org，如 18832008）, EASYOPS_USER=easyops, EASYOPS_CMDB_BACKEND_URL]
  payload: 完整 CmdbObject JSON，字段见 objects.yaml#cmdb_object.fields
  relations: "relation_list 的 left/right_object_id 须指向已存在或同批模型；不满足则 payload 设 ignore_dst_relation:true"
steps:
  - n: 1
    op: object_model.import_check
    args: [--body-file, "<model.json>", --insecure, --yes]
    desc: 预检（不落库，查关系对端）
    on_fail: "133116/Can not find X object → 对端模型不存在；加 ignore_dst_relation:true 或同批导入对端"
  - n: 2
    op: object_model.import
    args: [--body-file, "<model.json>", --insecure, --yes]
    desc: 真建（声明式 upsert）
    expect: "code=0；逐属性/逐关系 code=0；is_create=true（新建）"
    dataflow: "objectId（payload 自带）→ step3"
  - n: 3
    op: object_model.detail
    args: ["<objectId>", --insecure]
    desc: 校验落库（attrList/relation_list 齐全）
side_effects: objects.yaml#cmdb_object.side_effects
acceptance: "${EASYOPS_CMDB_FRONTEND_URL}/next/cmdb-model-management/object/<objectId>/detail"
rollback: object_model.delete --forceDelete true（见 delete-model.yaml）
