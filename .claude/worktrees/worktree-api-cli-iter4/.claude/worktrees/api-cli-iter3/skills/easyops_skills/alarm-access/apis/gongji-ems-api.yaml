openapi: 3.0.3
info:
  title: 共济基础设施监控北向接口 API
  description: |
    共济基础设施监控系统（EMS）向上层集成平台开放的北向数据接入接口。

    ## 传输约定
    - 协议：HTTP v1.1，统一使用 POST 方法，传输层端口可配置（默认 8000）。
    - 编码：UTF-8，JSON 格式；任何参数为空时键值必须存在。
    - 鉴权：建立连接（login）后返回 token，后续所有请求在 **HTTP 头部自定义字段 `token`** 中携带该 token。
    - 心跳：登录后需周期性（建议 20s）调用 `/north/heart`，30s 无心跳则 token 失效，需重新登录。
    - 包头：所有请求体结构统一为 `{"version": "<版本号>", "data": {...}}`。
    - 响应：统一结构 `{"error_code": 0, "error_msg": "ok", "data": {...}}`，error_code 非 0 表示错误。

    ## 两类告警获取模式
    - **Pull 模式（历史告警查询）**：调用 `/north/offline_alarm` 按时间段主动拉取，适合一次性脚本/定时同步。
    - **Push 模式（在线告警订阅）**：调用 `/north/online_alarm_subscribe` 订阅后，底层 EMS 会主动 POST 推送到
      登录时注册的回调地址 `/north/online_alarm_push`，适合实时接入（需常驻 HTTP 服务 + 心跳维持）。
  version: "20211214"
  contact:
    name: 共济基础设施监控系统

servers:
  - url: http://{emsHost}:{emsPort}
    description: 共济 EMS 北向服务地址
    variables:
      emsHost:
        default: "10.0.240.74"
        description: EMS 服务器 IP
      emsPort:
        default: "8000"
        description: 北向服务端口

security:
  - tokenAuth: []

paths:
  /north/login:
    post:
      tags: [连接管理]
      summary: 建立连接（登录鉴权）
      description: |
        上层系统向底层 EMS 发起连接请求，鉴权通过后返回 token。
        - 同一用户不能多点同时登录，多点登录会释放先前连接。
        - `ip`/`port` 为接收 EMS 推送数据（push 模式）的回调地址；纯 pull 模式可填本机占位地址。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, data]
              properties:
                version: {type: string, example: "20211214", description: 协议版本号}
                data:
                  type: object
                  required: [ip, port, username, password]
                  properties:
                    ip: {type: string, example: "192.168.1.2", description: 接收推送数据的回调 IP（32 字节）}
                    port: {type: string, example: "3000", description: 接收推送数据的回调端口，为空默认 80}
                    username: {type: string, example: "admin", description: 用户名（字母/数字/下划线，最大 64 字节）}
                    password: {type: string, example: "123456", description: 密码（最大 64 字节）}
      responses:
        "200":
          description: 登录结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_code: {type: integer, example: 0}
                  error_msg: {type: string, example: "ok"}
                  data:
                    type: object
                    properties:
                      token: {type: string, example: "jssgdgdgjkgdefjbfjbrhbfycfqcfdgvwdwg", description: 鉴权 token，后续请求放 HTTP 头 token 字段}

  /north/heart:
    post:
      tags: [连接管理]
      summary: 心跳检测
      description: 周期性（建议 20s）上报心跳。EMS 30s 内未收到心跳则断开连接、token 失效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvelopeEmpty"
      responses:
        "200":
          description: 心跳响应
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEmpty"

  /north/logout:
    post:
      tags: [连接管理]
      summary: 释放连接（登出）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvelopeEmpty"
      responses:
        "200":
          description: 登出响应
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEmpty"

  /north/offline_alarm:
    post:
      tags: [告警数据]
      summary: 历史告警查询（Pull 模式）
      description: 按时间段、对象、级别、类型等条件查询历史告警。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: {type: string, example: "20211214"}
                data:
                  type: object
                  properties:
                    begin_time: {type: integer, format: int64, description: 查询开始时间（UNIX 秒）}
                    end_time: {type: integer, format: int64, description: 查询结束时间（UNIX 秒）}
                    resource_id: {type: array, items: {type: string}, description: 设备 id/测点 id/空间 id}
                    event_level:
                      type: array
                      items: {type: integer}
                      description: "告警等级可空（1紧急/2严重/3重要/4次要/5预警）"
                    event_type:
                      type: array
                      items: {type: integer}
                      description: "告警类型可空（0通信中断/2过高报警/3不正常值/4过低报警/5错误数据/7事件/21故障/30停止采集）"
                    is_recover:
                      type: array
                      items: {type: integer}
                      description: 恢复状态可空（0未恢复/1恢复）
                    confirm_type:
                      type: array
                      items: {type: integer}
                      description: 告警分类可空（1真实/2测试/3误告警）
                    is_accept:
                      type: array
                      items: {type: integer}
                      description: 处理状态可空（0未处理/1处理中/2已处理）
                    masked:
                      type: array
                      items: {type: integer}
                      description: 屏蔽状态可空（0未屏蔽/1屏蔽）
                    cep_processed:
                      type: array
                      items: {type: integer}
                      description: CEP 过滤状态可空（0未过滤/1已过滤）
      responses:
        "200":
          description: 历史告警列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_code: {type: integer, example: 0}
                  error_msg: {type: string, example: "ok"}
                  data:
                    type: object
                    properties:
                      total: {type: integer, format: int64, description: 历史告警总数量}
                      alarm:
                        type: array
                        items:
                          $ref: "#/components/schemas/AlarmRecord"

  /north/online_alarm_subscribe:
    post:
      tags: [告警数据]
      summary: 在线告警订阅（Push 模式开关）
      description: |
        上层订阅后，底层 EMS 实时通过 POST 推送告警到登录时注册的回调地址 `/north/online_alarm_push`。
        `subscribe=true` 订阅，`subscribe=false` 停止。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: {type: string, example: "20211214"}
                data:
                  type: object
                  properties:
                    subscribe: {type: boolean, example: true}
      responses:
        "200":
          description: 订阅结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEmpty"

  /north/online_alarm_push:
    post:
      tags: [告警数据]
      summary: 推送告警数据（Push 模式回调）
      description: |
        该接口由上层（对接方）实现为 HTTP 服务端接收告警。EMS 作为客户端 POST 推送。
        URL 中的 IP:Port 为建立连接（login）时 data 里登记的回调地址。
        各生命周期字段按 msg_type 取对应结构（event_alarm / event_recover / event_accept / event_confirm）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: {type: string, example: "20211214"}
                data:
                  $ref: "#/components/schemas/PushAlarmData"
      responses:
        "200":
          description: 接收结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_code: {type: integer, example: 0}
                  error_msg: {type: string, example: "ok"}
                  data:
                    type: object
                    properties:
                      status: {type: boolean, example: true, description: 是否接收成功}

  /north/get_space_list:
    post:
      tags: [资源查询]
      summary: 获取空间信息列表
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvelopeEmpty"
      responses:
        "200":
          description: 空间列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEmpty"

  /north/get_device_list:
    post:
      tags: [资源查询]
      summary: 获取设备列表
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvelopeEmpty"
      responses:
        "200":
          description: 设备列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEmpty"

  /north/offline_value:
    post:
      tags: [数据查询]
      summary: 测点历史数据获取
      description: 每次测点数量最大 100，时间间隔最大 1 天；同一时间只响应一个请求。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: {type: string, example: "20211214"}
                data:
                  type: object
                  properties:
                    start: {type: integer, format: int64, description: 开始时间 UNIX 秒}
                    end: {type: integer, format: int64, description: 结束时间 UNIX 秒}
                    resource_ids: {type: array, items: {type: string}, description: 测点 id 数组}
                    interval:
                      type: string
                      description: "时间刻度（five/ten/quarter/twenty/half/hour）"
      responses:
        "200":
          description: 历史值
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEmpty"

  /north/get_event_rules:
    post:
      tags: [告警规则]
      summary: 获取测点告警规则
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: {type: string, example: "20211214"}
                data:
                  type: object
                  properties:
                    resource_ids: {type: array, items: {type: string}, description: 测点资源 id 数组（≤100）}
      responses:
        "200":
          description: 告警规则
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEmpty"

components:
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: token
      description: 登录返回的鉴权 token，放在 HTTP 头部自定义字段 token 中。

  schemas:
    EnvelopeEmpty:
      type: object
      description: 空数据请求包头
      properties:
        version: {type: string, example: "20211214"}
        data: {type: object}

    ResponseEmpty:
      type: object
      properties:
        error_code: {type: integer, example: 0}
        error_msg: {type: string, example: "ok"}
        data: {type: object}

    AlarmRecord:
      type: object
      description: 历史告警记录（offline_alarm 响应元素）
      properties:
        guid: {type: string, description: 告警唯一标识 guid（用作告警 ID）}
        resource_id: {type: string, description: 告警关联对象 id（测点/设备）}
        event_location: {type: string, description: "告警路径，如 project_root/0_103"}
        event_source: {type: string, description: "告警路径中文描述，如 区域/共济温湿度"}
        masked: {type: integer, description: "0未屏蔽/1屏蔽"}
        event_snapshot: {type: string, description: 测点告警触发值}
        event_level: {type: string, description: "告警级别 1-5"}
        event_time: {type: integer, format: int64, description: 告警产生时间 UNIX 秒}
        content: {type: string, description: 告警内容}
        recover_time: {type: integer, format: int64, description: 告警恢复时间 UNIX 秒}
        recover_des: {type: string, description: 告警恢复描述}
        recover_by: {type: string, description: 告警恢复人}
        confirm_time: {type: string, description: 告警确认时间 UNIX 秒}
        confirm_des: {type: string, description: 告警确认描述}
        confirm_by: {type: string, description: 告警确认人}
        cep_processed: {type: integer, description: "CEP 过滤状态（0未过滤/1已过滤）"}
        accept_time: {type: string, description: 告警受理时间 UNIX 秒}
        accept_des: {type: string, description: 告警受理描述}
        accept_by: {type: string, description: 告警受理人}
        event_suggest: {type: string, description: 处理建议}

    PushAlarmData:
      type: object
      description: 在线推送告警数据（online_alarm_push 请求 data）
      properties:
        guid: {type: string, description: 告警唯一标识 guid}
        resource_id: {type: string, description: 告警关联对象 id}
        event_location: {type: string, description: 告警路径}
        event_source: {type: string, description: 告警路径中文描述}
        msg_type:
          type: integer
          description: "0告警产生/1告警恢复/2告警受理/3告警确认"
        masked: {type: integer, description: "0未屏蔽/1屏蔽"}
        event_alarm:
          type: object
          description: msg_type=0 时携带，告警产生数据
          properties:
            event_type:
              type: integer
              description: "0通信中断/1告警恢复/2过高报警/3不正常值/4过低报警/5错误数据/6确认事件/7事件/21故障/30停止采集"
            event_snapshot: {type: string, description: 测点告警触发值}
            event_level: {type: string, description: "告警级别 1-5（1紧急/2严重/3重要/4次要/5预警）"}
            event_time: {type: integer, format: int64, description: 告警产生时间 UNIX 秒}
            content: {type: string, description: 告警内容}
            event_suggest: {type: string, description: 处理建议}
        event_recover:
          type: object
          description: msg_type=1 时携带，告警恢复数据
          properties:
            recover_time: {type: integer, format: int64, description: 告警恢复时间}
            recover_des: {type: string, description: 告警恢复描述}
            recover_by: {type: string, description: 告警恢复人}
        event_accept:
          type: object
          description: msg_type=2 时携带，告警受理数据
          properties:
            accept_time: {type: string, description: 告警受理时间}
            accept_des: {type: string, description: 告警受理描述}
            accept_by: {type: string, description: 告警受理人}
        event_confirm:
          type: object
          description: msg_type=3 时携带，告警确认数据
          properties:
            confirm_time: {type: string, description: 告警确认时间}
            confirm_des: {type: string, description: 告警确认描述}
            confirm_by: {type: string, description: 告警确认人}
