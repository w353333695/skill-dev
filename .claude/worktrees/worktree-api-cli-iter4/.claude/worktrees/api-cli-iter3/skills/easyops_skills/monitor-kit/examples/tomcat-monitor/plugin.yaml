type: simple-script
name: Tomcat监控
version: "1740487964"
command:
    collect:
        interpreter: ""
        scriptPath:
            - src
            - tomcat_monitor.py
        type: python
        user: ""
params:
    - ip
    - port
    - manager_path
    - username
    - password
    - installPath
paramDefine:
    - name: ip
      valueType: string
      defaultValue: $.ip
      display: true
      displayName: "目标IP"
      description: "Tomcat服务器IP地址"
      use: collectParams
      optional: false
      isFromSecret: false
      isEncrypt: false
      extraArgs: null
    - name: port
      valueType: string
      defaultValue: "8080"
      display: true
      displayName: "HTTP端口"
      description: "Tomcat HTTP端口"
      use: collectParams
      optional: false
      isFromSecret: false
      isEncrypt: false
      extraArgs: null
    - name: manager_path
      valueType: string
      defaultValue: "/manager/status/all"
      display: true
      displayName: "Manager路径"
      description: "Tomcat Manager状态接口路径"
      use: collectParams
      optional: false
      isFromSecret: false
      isEncrypt: false
      extraArgs: null
    - name: username
      valueType: string
      defaultValue: ""
      display: true
      displayName: "用户名"
      description: "Tomcat Manager用户名"
      use: collectParams
      optional: true
      isFromSecret: false
      isEncrypt: false
      extraArgs: null
    - name: password
      valueType: string
      defaultValue: ""
      display: true
      displayName: "密码"
      description: "Tomcat Manager密码"
      use: collectParams
      optional: true
      isFromSecret: true
      isEncrypt: true
      extraArgs: null
    - name: installPath
      valueType: string
      defaultValue: $.installPath
      display: true
      displayName: "安装路径"
      description: "Tomcat安装路径，用于维度标识"
      use: collectParams
      optional: false
      isFromSecret: false
      isEncrypt: false
      extraArgs: null
agentType: easyops
category: 平台资源.应用容器
scriptType: python
interpreter: ""
memo: "通过HTTP接口采集Tomcat运行状态指标"
icon: null
relateObjectId: TOMCAT@ONEMODEL
installPath: tomcat-monitor
samplerType: metric_sampler
jobFilter: null
protected: false
noPackage: false
collectType: []
collectAgent: ""
group: []
rating: 0
metricbeatName: ""
processors: []
extInfo: null
