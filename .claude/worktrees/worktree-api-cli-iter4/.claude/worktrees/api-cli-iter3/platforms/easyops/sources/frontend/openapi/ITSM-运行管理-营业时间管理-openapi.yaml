openapi: 3.0.3
info:
  title: ITSM-运行管理-营业时间管理
  description: |
    EasyOps ITSM「营业时间管理（工作日历 work-calendar）」相关接口。工作日历定义每周工作日时段、
    特殊加班日期时段、节假日假期，是 SLA 协议时效计算、定时任务调度等的时间基准。

    覆盖能力：工作日历的 列表查询 / 详情 / 月视图 / 年视图 / 新建 / 编辑 / 删除。
  version: "1.0.0"
  x-flow: ITSM-运行管理-营业时间管理
  x-system: EasyOps ITSM
  x-host: http://172.30.0.90
  x-entry: /next/itsc-workbench/workbench

servers:
  - url: http://172.30.0.90

tags:
  - name: 营业时间(工作日历)管理
    description: 工作日历（work/calendar）的增删改查与月/年视图

paths:
  /next/api/gateway/logic.sys_setting/api/sys_setting/v1/query/work/calendar:
    get:
      tags: [营业时间(工作日历)管理]
      operationId: listWorkCalendar
      summary: 查询工作日历列表
      description: 分页查询工作日历列表，支持按日历名称或创建人模糊搜索。
      x-relevant: true
      parameters:
        - name: Q
          in: query
          description: 关键词（日历名称或创建人模糊匹配）
          schema: { type: string }
        - name: page
          in: query
          schema: { type: string, example: "1" }
        - name: pageSize
          in: query
          schema: { type: string, example: "10" }
      responses:
        "200":
          description: 工作日历列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelope" }

  /next/api/gateway/logic.sys_setting/api/sys_setting/v1/work/calendar/{calendarId}:
    get:
      tags: [营业时间(工作日历)管理]
      operationId: getWorkCalendar
      summary: 查询工作日历详情
      description: 获取单个工作日历详情（编辑表单回填用）。
      x-relevant: true
      parameters:
        - $ref: "#/components/parameters/CalendarId"
      responses:
        "200":
          description: 工作日历详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          calendarId: { type: string }
                          name: { type: string }
                          config: { $ref: "#/components/schemas/CalendarConfig" }
    put:
      tags: [营业时间(工作日历)管理]
      operationId: updateWorkCalendar
      summary: 编辑工作日历
      description: 修改已存在的工作日历配置。
      x-relevant: true
      parameters:
        - $ref: "#/components/parameters/CalendarId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkCalendarUpsert"
      responses:
        "200":
          description: 编辑结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelope" }
    delete:
      tags: [营业时间(工作日历)管理]
      operationId: deleteWorkCalendar
      summary: 删除工作日历
      description: 删除指定工作日历。
      x-relevant: true
      parameters:
        - $ref: "#/components/parameters/CalendarId"
      responses:
        "200":
          description: 删除结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelope" }

  /next/api/gateway/logic.sys_setting/api/sys_setting/v1/work/calendar:
    post:
      tags: [营业时间(工作日历)管理]
      operationId: createWorkCalendar
      summary: 新建工作日历
      description: |
        创建一条工作日历。config 含三类配置：
        workDayList（每周工作日时段）、extraDayList（加班日时段）、holidayList（假期）。
      x-relevant: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkCalendarUpsert"
      responses:
        "200":
          description: 创建结果，返回 calendarId
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          calendarId: { type: string, example: 6a6847e68433f8becf378c1c }

  /next/api/gateway/logic.sys_setting/api/sys_setting/v1/work/calendar_month/{calendarId}:
    get:
      tags: [营业时间(工作日历)管理]
      operationId: getWorkCalendarMonth
      summary: 查询日历月视图
      description: 按月展示某日历的工作日/加班日/假期分布（特殊日期渲染用）。
      x-relevant: true
      parameters:
        - $ref: "#/components/parameters/CalendarId"
        - name: year
          in: query
          required: true
          schema: { type: string, example: "2026" }
        - name: month
          in: query
          required: true
          schema: { type: string, example: "7" }
      responses:
        "200":
          description: 月视图数据
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelope" }

  /next/api/gateway/logic.sys_setting/api/sys_setting/v1/work/calendar_year/{calendarId}:
    get:
      tags: [营业时间(工作日历)管理]
      operationId: getWorkCalendarYear
      summary: 查询日历年视图
      description: 按年展示某日历的特殊日期分布。
      x-relevant: true
      parameters:
        - $ref: "#/components/parameters/CalendarId"
        - name: year
          in: query
          required: true
          schema: { type: string, example: "2026" }
      responses:
        "200":
          description: 年视图数据
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelope" }

components:
  parameters:
    CalendarId:
      name: calendarId
      in: path
      required: true
      description: 工作日历 ID（创建时返回）
      schema: { type: string, example: 6a6847e68433f8becf378c1c }

  schemas:
    ApiEnvelope:
      type: object
      properties:
        code: { type: number, example: 0 }
        codeExplain: { type: string, example: "" }
        error: { type: string, example: "" }
        data:
          nullable: true

    WorkCalendarUpsert:
      type: object
      description: 新建/编辑工作日历的请求体
      required: [config]
      properties:
        config:
          $ref: "#/components/schemas/CalendarConfig"

    CalendarConfig:
      type: object
      description: 日历配置
      properties:
        mode:
          type: string
          description: 配置模式，simple=简易模式
          example: simple
        workDayList:
          type: array
          description: 每周工作日及其时段
          items:
            type: object
            properties:
              weekday:
                type: integer
                description: 星期几（1=周一…7=周日）
                example: 3
              hours:
                type: string
                description: 时段，多个用逗号分隔
                example: "09:00~12:00,14:00~17:00"
        extraDayList:
          type: array
          description: 加班日（非工作日但计时的特殊日期）及其时段
          items:
            type: object
            properties:
              from:
                type: string
                description: 起始日期（YYYY-MM-DD）
                example: "2026-08-01"
              to:
                type: string
                description: 结束日期（YYYY-MM-DD）
                example: "2026-08-31"
              hours:
                type: string
                description: 加班时段
                example: "18:00~22:00"
        holidayList:
          type: array
          description: 假期（不计时间的休息日）
          items:
            type: object
            properties:
              memo:
                type: string
                description: 假期名称
                example: 国庆
              from:
                type: string
                description: 起始日期（YYYY-MM-DD）
                example: "2026-10-01"
              to:
                type: string
                description: 结束日期（YYYY-MM-DD）
                example: "2026-10-07"
              hours:
                type: string
                description: 时段（假期一般为空）
                example: ""
        independenceDayList:
          type: array
          description: 独立日（可选配置）
          items:
            type: object
