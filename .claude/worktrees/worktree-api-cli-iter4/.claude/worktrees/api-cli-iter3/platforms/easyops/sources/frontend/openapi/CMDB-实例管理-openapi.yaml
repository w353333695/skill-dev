openapi: 3.0.3
info:
  title: CMDB-实例管理 API
  version: "1.0"
  description: |
    EasyOps CMDB「实例管理」操作链路涉及的接口：实例查询/搜索、导出、手工导入、
    批量编辑（复用 _import）、批量删除、实例详情、关系管理（添加/移除所属应用）、
    单实例编辑与删除，以及页面加载所需的模型字段/视图/审批规则配置接口。
    路径中 `{objectId}` 为模型 ID（如 HOST），`{instanceId}` 为实例 ID，
    `{relationId}` 为关系侧 ID（如 HOST_APP）。
  x-system: easyops
  x-recorded-at: "2026-07-23T10:03:34"

servers:
  - url: http://172.30.0.90/next/api/gateway

tags:
  - name: 实例查询
    description: 实例列表搜索、字段校验、实例详情
  - name: 实例导出
    description: 导出实例为 Excel
  - name: 实例导入
    description: 手工导入（上传解析）与提交导入/批量更新
  - name: 实例批量删除
    description: 批量归档删除实例
  - name: 实例关系
    description: 实例关联关系的添加与移除（如所属应用）
  - name: 实例编辑
    description: 更新单个实例字段
  - name: 实例删除
    description: 单个实例归档删除
  - name: 模型与视图配置
    description: 模型字段定义、列表展示视图、关系引用定义（页面加载支撑接口）
  - name: 实例审批
    description: 导出/批量操作前的审批规则与计数查询

paths:

  /cmdb.instance.PostSearchV3/v3/object/{objectId}/instance/_search:
    post:
      tags: [实例查询]
      summary: 搜索实例列表（关键词 / 高级搜索）
      description: |
        按字段、关键词、高级条件（aq）搜索某模型的实例列表，支持分页、排序、关系展开。
        高级搜索条件会以 `aq`（MongoDB 风格）形式写入请求体/URL。
      operationId: searchInstanceV3
      x-relevant: true
      parameters:
        - name: objectId
          in: path
          required: true
          description: 模型 ID（如 HOST）
          schema: {type: string, example: HOST}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: array
                  description: 返回的字段列表
                  items: {type: string}
                  example: [ip, _agentHeartBeat, _agentStatus, status]
                page: {type: number, example: 1}
                page_size: {type: number, example: 20}
                sort:
                  type: array
                  description: 排序规则
                  items:
                    type: object
                  example: [{key: _agentStatus, order: -1}]
                ignore_missing_field_error: {type: boolean, example: true}
                relation_limit: {type: number, example: 6}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  error: {type: string, example: ""}
                  message: {type: string, example: ""}
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items: {type: object}

  /cmdb.instance.ValidateInstance/object/{objectId}/instance/validate:
    post:
      tags: [实例查询]
      summary: 校验实例
      description: 在导入/保存前校验实例数据合法性。
      operationId: validateInstance
      x-relevant: true
      parameters:
        - name: objectId
          in: path
          required: true
          schema: {type: string, example: HOST}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                instances:
                  type: array
                  items: {type: object}
                  example: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  message: {type: string, example: ""}
                  data:
                    type: object
                    properties:
                      list: {type: array, items: {type: object}}

  /cmdb.instance.GetDetail/object/{objectId}/instance/{instanceId}:
    get:
      tags: [实例查询]
      summary: 查询实例详情
      description: 按 fields 查询某个实例的完整字段值。
      operationId: getInstanceDetail
      x-relevant: true
      parameters:
        - name: objectId
          in: path
          required: true
          schema: {type: string, example: HOST}
        - name: instanceId
          in: path
          required: true
          schema: {type: string, example: 64ca6c320fe9d}
        - name: fields
          in: query
          required: false
          description: 需返回的字段（逗号分隔）
          schema: {type: string, example: "instanceId,hostname,use"}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  message: {type: string, example: ""}
                  data:
                    type: object
                    description: 实例字段键值（_object_id/_ts/各业务字段）

  /cmdb.instance.ExportInstanceExcel/export/object/{objectId}/instance/excel:
    post:
      tags: [实例导出]
      summary: 导出实例为 Excel
      description: 将当前列表（含搜索/过滤条件）的实例导出为 Excel 文件。
      operationId: exportInstanceExcel
      x-relevant: true
      parameters:
        - name: objectId
          in: path
          required: true
          schema: {type: string, example: HOST}
      responses:
        '200':
          description: 成功（返回 Excel 文件流或导出任务结果）

  /cmdb.instance.ImportInstanceWithExcel/import/object/{objectId}/instance/excel:
    post:
      tags: [实例导入]
      summary: 上传 Excel 并解析（导入第一步）
      description: |
        上传 Excel 文件，服务端解析并返回预计新增/更新/失败计数与校验结果，
        供用户确认后再调用 `_import` 提交。
      operationId: importInstanceWithExcel
      x-relevant: true
      parameters:
        - name: objectId
          in: path
          required: true
          schema: {type: string, example: HOST}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                matchField:
                  type: string
                  description: 用于匹配实例的字段（如 ip）
                  example: ip
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  message: {type: string, example: ""}
                  data:
                    type: object
                    properties:
                      insert_count: {type: number, example: 0}
                      update_count: {type: number, example: 2}
                      failed_count: {type: number, example: 0}

  /cmdb.instance.ImportInstance/object/{objectId}/instance/_import:
    post:
      tags: [实例导入]
      summary: 提交导入 / 批量更新实例
      description: |
        提交导入数据（也用于「批量编辑」）：按 `keys`（匹配键，如 instanceId）
        与 `datas`（数据行）批量新增或更新实例。
      operationId: importInstance
      x-relevant: true
      parameters:
        - name: objectId
          in: path
          required: true
          schema: {type: string, example: HOST}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keys:
                  type: array
                  description: 匹配键字段名
                  items: {type: string}
                  example: [instanceId]
                datas:
                  type: array
                  description: 数据行（每行为一个实例的部分字段 + 匹配键值）
                  items: {type: object}
                  example: [{use: 备机, instanceId: 6490633b18695}]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  message: {type: string, example: ""}
                  data:
                    type: object
                    properties:
                      insert_count: {type: number, example: 0}
                      update_count: {type: number, example: 2}

  /cmdb.instance_archive.BatchArchiveInstance/object/{objectId}/instance_archive_instances:
    post:
      tags: [实例批量删除]
      summary: 批量归档删除实例
      description: 将多个实例批量归档（软删除）。
      operationId: batchArchiveInstance
      x-relevant: true
      parameters:
        - name: objectId
          in: path
          required: true
          schema: {type: string, example: HOST}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instanceIds:
                  type: array
                  description: 待归档的实例 ID 列表
                  items: {type: string}
                  example: [6490633b18695, 64f4f6fe02285]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  message: {type: string, example: ""}
                  data: {nullable: true}

  /cmdb.instance_relation.Append/object/{objectId}/relation/{relationId}/append:
    post:
      tags: [实例关系]
      summary: 添加实例关联关系（如添加所属应用）
      description: |
        为主体实例批量添加关联实例。
        例：HOST 添加所属应用，relationId = HOST_APP。
      operationId: appendRelation
      x-relevant: true
      parameters:
        - name: objectId
          in: path
          required: true
          schema: {type: string, example: HOST}
        - name: relationId
          in: path
          required: true
          description: 关系侧 ID（如 HOST_APP）
          schema: {type: string, example: HOST_APP}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instance_ids:
                  type: array
                  description: 主体实例 ID 列表
                  items: {type: string}
                  example: [64ca6c320fe9d]
                related_instance_ids:
                  type: array
                  description: 被关联的实例 ID 列表
                  items: {type: string}
                  example: [64ac4e907d831, 64ac4e907d895]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  message: {type: string, example: ""}
                  data: {nullable: true}

  /cmdb.instance_relation.Remove/object/{objectId}/relation/{relationId}/remove:
    post:
      tags: [实例关系]
      summary: 移除实例关联关系（如移除所属应用）
      operationId: removeRelation
      x-relevant: true
      parameters:
        - name: objectId
          in: path
          required: true
          schema: {type: string, example: HOST}
        - name: relationId
          in: path
          required: true
          schema: {type: string, example: HOST_APP}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instance_ids:
                  type: array
                  items: {type: string}
                  example: [64ca6c320fe9d]
                related_instance_ids:
                  type: array
                  items: {type: string}
                  example: [64ac4e907d831]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  message: {type: string, example: ""}
                  data: {nullable: true}

  /cmdb.instance.UpdateInstance/object/{objectId}/instance/{instanceId}:
    put:
      tags: [实例编辑]
      summary: 更新单个实例
      description: |
        更新单个实例的字段值。请求体为该实例可编辑字段的键值
        （如 hostname/use/memo/_agentStatus 等）。
      operationId: updateInstance
      x-relevant: true
      parameters:
        - name: objectId
          in: path
          required: true
          schema: {type: string, example: HOST}
        - name: instanceId
          in: path
          required: true
          schema: {type: string, example: 64ca6c320fe9d}
        - name: only_instance_id
          in: query
          required: false
          schema: {type: boolean, example: true}
        - name: ignore_attr_permission
          in: query
          required: false
          schema: {type: boolean, example: false}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 实例可编辑字段键值
              properties:
                hostname: {type: string, example: name133}
                use: {type: string, example: 测试用11}
                memo: {type: string, example: ""}
                _agentStatus: {type: string, example: 未安装}
                osDistro: {type: string, example: CentOS}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  message: {type: string, example: ""}
                  data:
                    type: object
                    properties:
                      instanceId: {type: string, example: 64ca6c320fe9d}

  /cmdb.instance_archive.ArchiveInstance/object/{objectId}/instance_archive/{instanceId}:
    post:
      tags: [实例删除]
      summary: 归档删除单个实例
      description: 将单个实例归档（软删除），并返回其残留关联资源信息。
      operationId: archiveInstance
      x-relevant: true
      parameters:
        - name: objectId
          in: path
          required: true
          schema: {type: string, example: HOST}
        - name: instanceId
          in: path
          required: true
          schema: {type: string, example: 64ca6c320fe9d}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  message: {type: string, example: ""}
                  data:
                    type: object
                    description: 各关联对象下的残留实例列表（如 APP/CLUSTER…）

  /cmdb.cmdb_object.GetDetail/object/{objectId}:
    get:
      tags: [模型与视图配置]
      summary: 查询模型字段定义
      description: 加载模型的字段定义（列表/表单渲染依赖），进入实例列表时调用。
      operationId: getObjectDetail
      x-relevant: true
      parameters:
        - name: objectId
          in: path
          required: true
          schema: {type: string, example: HOST}
        - name: ignoreAttrPermission
          in: query
          required: false
          schema: {type: boolean, example: false}
      responses:
        '200':
          description: 成功（返回模型字段定义）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  data: {type: object}

  /easyops.api.cmdb.instance.GetListDisplayView/object/{objectId}/list/view:
    get:
      tags: [模型与视图配置]
      summary: 查询实例列表展示视图
      description: 实例列表的列展示配置（显示哪些字段、列宽等）。
      operationId: getListDisplayView
      x-relevant: true
      parameters:
        - name: objectId
          in: path
          required: true
          schema: {type: string, example: HOST}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  data: {type: object}

  /cmdb.cmdb_object.GetObjectRef/object_ref:
    get:
      tags: [模型与视图配置]
      summary: 查询模型关系引用定义
      description: 查询某模型可关联的对象/关系定义（详情页关系 Tab 渲染依赖）。
      operationId: getObjectRef
      x-relevant: true
      parameters:
        - name: ref_object
          in: query
          required: true
          description: 模型 ID（如 HOST/APP/CLUSTER）
          schema: {type: string, example: HOST}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  data: {type: object}

  /resource_manage.cmdb_approve.ListRuleConfig/api/v1/rule/config:
    get:
      tags: [实例审批]
      summary: 查询操作审批规则配置
      description: 导出/批量编辑/批量删除等操作前，查询该模型是否配置了审批规则。
      operationId: listApproveRuleConfig
      x-relevant: true
      parameters:
        - name: objectId
          in: query
          required: true
          schema: {type: string, example: HOST}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  data: {type: object}

  /resource_manage.cmdb_approve.GetApproveCount/api/v1/approve/count:
    get:
      tags: [实例审批]
      summary: 查询待审批计数
      description: 查询当前模型的待审批操作数量。
      operationId: getApproveCount
      x-relevant: true
      parameters:
        - name: objectId
          in: query
          required: true
          schema: {type: string, example: HOST}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: number, example: 0}
                  data: {type: object}
