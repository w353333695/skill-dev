name: createProcessDefinitionVersionV2
module: process
method: POST
path: /api/flowable_service/v2/process_definition/{definitionId}
service: logic.flowable_service
side_effect: create
path_source: backend_contract
path_confidence: high
tags:
- 流程版本
- 新建
- V2
summary: 新建流程版本V2(含bpmnXML+processSetting)
description: 新建流程定义版本（V2）。POST /v2/process_definition/{definitionId}，body 含 bpmnXML+versionName+state+processSetting+可选baseVersionId(克隆表单绑定)。内网8134实测可达。详见 modules/process_development §2.2。
request:
  required:
  - definitionId
  - bpmnXML
  - versionName
  - state
  - processSetting
  properties:
    definitionId:
      type: string
      desc: 流程定义实例ID(路径)
    baseVersionId:
      type: string
      desc: 基于已有版本克隆(继承表单绑定+基础设置)
    bpmnXML:
      type: string
      desc: BPMN2.0 XML流程图
    versionName:
      type: string
      desc: 版本号,同definition下唯一
    state:
      type: string
      desc: unfinished草稿/done完成
    memo:
      type: string
      desc: 版本说明
    processSetting:
      type: object
      desc: 流程+节点配置{lineSettings,nodeSettings}
outputs:
  versionId:
    jsonpath: $.data.versionId
    desc: 新版本ID
rollback: null
examples: []
endpoint:
  contract_ref: logic.flowable_service|POST|/api/flowable_service/v2/process_definition/{definitionId}
  mode: easyops_internal
