name: editProcessDefinitionVersionV2
module: process
method: PUT
path: /api/flowable_service/v2/process_definition/{definitionId}/version/{versionId}
service: logic.flowable_service
side_effect: update
path_source: backend_contract
path_confidence: high
tags:
- 流程版本
- 编辑
- 定稿
- V2
summary: 编辑流程版本V2(全量覆盖,可定稿)
description: 编辑未完成版本（V2）。PUT /v2/process_definition/{definitionId}/version/{versionId}，bpmnXML+processSetting全量覆盖。只能改state=unfinished；state置done即定稿(首个done自动设主部署,非首版本需显式设主)。内网8134实测。详见 process_development §2.3。
request:
  required:
  - definitionId
  - versionId
  - state
  - bpmnXML
  - processSetting
  properties:
    definitionId:
      type: string
      desc: 路径
    versionId:
      type: string
      desc: 路径,须state=unfinished
    versionName:
      type: string
      desc: 改名查重
    state:
      type: string
      desc: done=定稿(后不可改)
    bpmnXML:
      type: string
      desc: 全量覆盖
    processSetting:
      type: object
      desc: 全量覆盖
outputs:
  versionId:
    jsonpath: $.data.versionId
    desc: 版本ID
rollback: null
examples: []
endpoint:
  contract_ref: logic.flowable_service|PUT|/api/flowable_service/v2/process_definition/{definitionId}/version/{versionId}
  mode: easyops_internal
