name: searchDomainModel
module: domain_model
method: POST
path: /api/flowable_service/v1/domain_model/_search
gateway_path: /next/api/gateway/logic.flowable_service/api/flowable_service/v1/domain_model/_search
service: logic.flowable_service
side_effect: read
path_source: backend_contract
path_confidence: high
tags:
- 领域模型
- 查询
- 列表
- domain_model
- search
summary: 按条件查询领域模型列表
description: 按关键词（Q）、唯一标识（key）、模型名称（name）、说明（desc）、创建人（creator）、关联标准字段（standard_field）等条件查询领域模型列表。
request:
  required: []
  properties:
    page:
      type: integer
      desc: 页码
    pageSize:
      type: integer
      desc: 每页条数
    Q:
      type: string
      desc: 关键词（模糊匹配唯一标识/名称/说明/创建人）
    key:
      type: string
      desc: 唯一标识
    name:
      type: string
      desc: 模型名称
    desc:
      type: string
      desc: 模型说明
    creator:
      type: string
      desc: 创建人
    standard_field:
      type: string
      desc: 关联的标准字段
    kind:
      type: string
      desc: 预留筛选
    st:
      type: datetime
      desc: 预留筛选
    et:
      type: datetime
      desc: 预留筛选
    instanceIds:
      type: string[]
      desc: id查询
      _source: contract
    sort:
      type: CmdbSort[]
      desc: '按字段排序， 留空默认按照更新时间降序排序(1表示升序, -1表示降序) e.g.: [{ mtime: -1 }]'
      _source: contract
outputs:
  list_full:
    jsonpath: $.data.list
    desc: 领域模型列表全量（含 instanceId/key/name 等）
  list_ids:
    jsonpath: $.data.list
    desc: 列表项 instanceId 集合（配合 ${s1.list_full.instanceId} 投影）
  total:
    jsonpath: $.data.total
    desc: 领域模型总数
requires: []
rollback: null
examples: []
confidence:
