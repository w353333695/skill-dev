name: updateForm
module: form
method: PUT
path: /api/flowable_service/v2/form/{formId}/version/{versionId}
gateway_path: /next/api/gateway/logic.flowable_service/api/flowable_service/v2/form/{formId}/version/{versionId}
service: logic.flowable_service
side_effect: update
path_source: backend_contract
path_confidence: high
tags:
- 表单
- form
- 更新
- update
- 版本
summary: 更新表单或新建版本
description: 在表单设计器中修改字段后点击「保存」提交，body 含新 versionName 与 formDefinition。
request:
  required: []
  properties:
    name:
      type: string
      desc: ''
    category:
      type: string
      desc: ''
    memo:
      type: string
      desc: ''
    state:
      type: string
      desc: 版本状态(unfinished 未完成, done已完成),存为草稿传unfinished,保存传done
    versionName:
      type: string
      desc: 版本号（新建版本时递增，如 1.0.0 -> 1.0.1）
    formDefinition:
      type: string
      desc: 字段定义 JSON 字符串
    domainModel:
      type: string
      desc: 领域模型 JSON
    formId:
      type: string
      desc: 表单实例Id
      _source: contract
    versionId:
      type: string
      desc: 表单版本实例Id
      _source: contract
    versionMemo:
      type: string
      desc: 版本描述
      _source: contract
    domainModelId:
      type: string[]
      desc: 选用的领域模型 id
      _source: contract
    dataSourceIdList:
      type: string[]
      desc: 数据源id列表
      _source: contract
outputs:
  detail:
    jsonpath: $.data.lastestVersion
    desc: 更新后的最新版本信息
requires:
- formId 须存在
- versionId 须存在
- 新建版本时 versionName 须递增
rollback:
  api: deleteFormVersion
  params:
  - param_key: formId
    from_output: detail
    from_field: formId
  - param_key: versionId
    from_output: detail
    from_field: versionId
examples: []
confidence:
  module: high
  outputs: medium
  requires: medium
  rollback: high
  summary: high
  tags: high
  request: medium
endpoint:
  contract_ref: logic.flowable_service|PUT|/api/flowable_service/v2/form/{formId}/version/{versionId}
  mode: easyops_gateway
