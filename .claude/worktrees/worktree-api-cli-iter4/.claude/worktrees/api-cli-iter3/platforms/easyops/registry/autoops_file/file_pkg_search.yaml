name: file_pkg_search
module: autoops_file
method: GET
path: /package/search
gateway_path: /next/api/gateway/artifact.pkgservice.Search/package/search
service: artifact.pkgservice.Search
side_effect: read
path_source: gateway_strip
path_confidence: medium
tags:
- 文件分发
- 文件包
- 列表
- 搜索
summary: 搜索文件包列表
description: 分页搜索文件分发模块的文件包列表，支持按名称模糊/精确、分类、作者、排序过滤。type=4 固定为文件分发包。返回含 lastVersionInfo（最新版本名/类型/时间）。
request:
  required: []
  properties:
    name:
      type: string
      desc: 按文件包名称模糊搜索
    category:
      type: string
      desc: 按分类过滤
    creator:
      type: string
      desc: 按作者过滤
    exact:
      type: string
      desc: 是否精确匹配（true/false）
    order:
      type: string
      desc: 排序字段
    page:
      type: string
      desc: 页码，从 1 开始
    pageSize:
      type: string
      desc: 每页条数，默认 20
    type:
      type: string
      desc: 包类型（4=文件分发）
outputs:
  total:
    jsonpath: $.data.total
    desc: 文件包总数
  list_full:
    jsonpath: $.data.list
    desc: 文件包列表全量（含 packageId/name/creator/lastVersionInfo 等）
  list_ids:
    jsonpath: $.data.list
    desc: 文件包 id 集合（配合 ${s.list_full.packageId} 投影）
requires: []
rollback: null
examples: []
confidence:
  request: high
  module: high
  outputs: medium
  tags: high
  summary: high
endpoint:
  contract_ref: ''
  mode: easyops_gateway
source:
