openapi: 3.0.3
info:
  title: ITSM 代理人管理 API
  version: "1.0.0"
  description: |
    EasyOps ITSM「系统管理 -> 代理人管理」相关接口。

    代理人规则用于在被代理人不在岗时，由代理人代为处理指定服务分类下的工单。
    本清单覆盖代理人规则的查询、详情、创建、更新、删除，以及配套的服务目录与用户选择接口。

    - 录制来源：http://172.30.5.20/next/itsc-personal-center/deputy-management
    - 每条 `x-relevant: true` 表示与本流程强相关；`false` 的条目（心跳、公告计数、登录态等通用接口）已从 paths 中剔除，可在 apis.json 中回溯。
servers:
  - url: http://172.30.5.20
    description: ITSM 测试环境
tags:
  - name: 代理人列表查询
    description: 按关键词与多条件查询代理人规则列表
  - name: 代理人详情
    description: 查询单个代理人规则详情
  - name: 代理人创建
    description: 新建代理人规则
  - name: 代理人更新
    description: 编辑代理人规则（启用/停用、添加代理人、修改代理时效）
  - name: 代理人删除
    description: 删除代理人规则
  - name: 服务目录与用户选择
    description: 新建/编辑时的服务分类、服务实例、用户选择辅助接口
paths:
  /next/api/gateway/flowable_service.personal_center.SearchProxySetting/api/flowable_service/v1/personal_center/proxy_setting/_search:
    post:
      tags: [代理人列表查询]
      operationId: searchProxySetting
      summary: 查询代理人规则列表
      description: |
        按关键词、服务分类、状态、负责人、与我相关、代理人等条件组合查询代理人规则列表。
        进入代理人管理列表页、执行搜索、新建/编辑保存后刷新列表均调用此接口。
      x-relevant: true
      x-triggered-by-step: [4, 6, 12, 17, 45, 48, 76, 79]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  example: 1
                pageSize:
                  type: integer
                  example: 10
                Q:
                  type: string
                  description: 关键词（按规则名称模糊匹配）
                  example: ""
                name:
                  type: string
                  description: 规则名称
                  example: ""
                status:
                  type: string
                  description: 状态筛选（enabled/disabled）
                  example: ""
                category:
                  type: string
                  description: 适用服务分类 ID
                  example: ""
                serviceName:
                  type: string
                  description: 适用服务名称
                  example: ""
                proxyUsername:
                  type: string
                  description: 代理人用户名
                  example: ""
                creator:
                  type: string
                  description: 创建者
                  example: ""
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  error: { type: string, example: "" }
                  data:
                    type: object
                    properties:
                      total: { type: integer, example: 2 }
                      page: { type: integer, example: 1 }
                      page_size: { type: integer, example: 10 }
                      list:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProxySetting'
  /next/api/gateway/flowable_service.personal_center.GetProxySetting/api/flowable_service/v1/personal_center/proxy_setting/{instanceId}:
    get:
      tags: [代理人详情]
      operationId: getProxySetting
      summary: 查询代理人规则详情
      description: 进入某代理人规则编辑页时，按 instanceId 拉取该规则完整详情。
      x-relevant: true
      x-triggered-by-step: [18]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema: { type: string }
          description: 代理人规则实例 ID
          example: 65628a8a57829
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    $ref: '#/components/schemas/ProxySetting'
  /next/api/gateway/flowable_service.personal_center.CreateProxySetting/api/flowable_service/v1/personal_center/proxy_setting:
    post:
      tags: [代理人创建]
      operationId: createProxySetting
      summary: 新建代理人规则
      description: |
        在新建代理人页填写名称、适用服务分类、适用服务、状态、代理时效、代理人后，
        点击「保存」提交创建。`proxyConfigs` 为代理人配置数组，每项含代理人用户名与代理时效起止时间戳（秒）。
      x-relevant: true
      x-triggered-by-step: [40]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category, status, proxyConfigs]
              properties:
                name:
                  type: string
                  description: 代理规则名称
                  example: test01
                category:
                  type: string
                  description: 适用服务分类 ID
                  example: 5b55f857c6551
                status:
                  type: string
                  enum: [enabled, disabled]
                  description: 状态（enabled=启用）
                  example: enabled
                isGlobal:
                  type: boolean
                  description: 是否全权代理人（true 时 serviceIds 可为空，代理所有服务）
                  example: false
                serviceIds:
                  type: array
                  items: { type: string }
                  description: 适用服务实例 ID 列表（isGlobal=true 时为空）
                  example: ["608f94db73be5"]
                creator:
                  type: string
                  description: 创建者用户名
                  example: easyops
                proxyConfigs:
                  type: array
                  description: 代理人配置列表
                  items:
                    $ref: '#/components/schemas/ProxyConfig'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      instanceId: { type: string, example: 656774d5040d2 }
  /next/api/gateway/flowable_service.personal_center.UpdateProxySetting/api/flowable_service/v1/personal_center/proxy_setting/{instanceId}:
    put:
      tags: [代理人更新]
      operationId: updateProxySetting
      summary: 更新代理人规则
      description: |
        编辑代理人规则（启用/停用、添加多个代理人、修改代理时效）后点击「确定」提交更新。
        `proxyConfigs` 可含多个代理人，各自独立设置代理时效。
        ⚠️ 若同一规则内多个代理人的代理时效区间重叠，后端返回 `code:500 error:代理时效冲突`，需调整时效后重试。
      x-relevant: true
      x-triggered-by-step: [69, 76]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema: { type: string }
          description: 代理人规则实例 ID
          example: 65628aa8c3413
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: 全权代理设置
                category:
                  type: string
                  description: 适用服务分类（全权代理人为「全部」）
                  example: "全部"
                status:
                  type: string
                  enum: [enabled, disabled]
                  example: enabled
                isGlobal:
                  type: boolean
                  example: true
                serviceIds:
                  type: array
                  items: { type: string }
                  example: []
                proxyConfigs:
                  type: array
                  items:
                    $ref: '#/components/schemas/ProxyConfig'
      responses:
        '200':
          description: 更新结果（code=0 成功；code=500 代理时效冲突）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  codeExplain: { type: string, example: "" }
                  error: { type: string, description: 错误信息，如「代理时效冲突」, example: "" }
                  data: { type: object, nullable: true }
  /next/api/gateway/flowable_service.personal_center.BatchDeleteProxySetting/api/flowable_service/v1/personal_center/proxy_setting/{instanceId}:
    delete:
      tags: [代理人删除]
      operationId: deleteProxySetting
      summary: 删除代理人规则
      description: 在列表中对代理人规则执行删除，前端二次确认（输入数字）后调用。按 instanceId 删除单条。
      x-relevant: true
      x-triggered-by-step: [79]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema: { type: string }
          description: 代理人规则实例 ID
          example: 65628a8a57829
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data: { type: object, nullable: true, example: null }
  /next/api/gateway/flowable_service.service_catalog.ListCatalog/api/flowable_service/v1/service_catalog:
    get:
      tags: [服务目录与用户选择]
      operationId: listServiceCatalog
      summary: 查询服务分类目录
      description: 拉取服务分类树（如「事件管理 / 标准事件」），用于「适用服务分类」下拉选择。进入代理人管理与高级搜索时加载。
      x-relevant: true
      x-triggered-by-step: [4, 12, 41, 76, 79]
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      total: { type: integer, example: 54 }
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            instanceId: { type: string, example: 5b55f855d236a }
                            name: { type: string, example: 事件管理 }
                            parentID: { type: string, description: 父分类 ID（顶层为空）, example: "" }
                            builtIn: { type: boolean, example: true }
                            serviceCnt: { type: integer, example: 2 }
  /next/api/gateway/flowable_service.service_catalog.ListService/api/flowable_service/v1/service_instance:
    get:
      tags: [服务目录与用户选择]
      operationId: listServiceInstance
      summary: 查询适用服务实例
      description: 按服务分类拉取可选服务实例，用于「适用服务（多选）」勾选。
      x-relevant: true
      x-triggered-by-step: [18, 22, 23, 26]
      parameters:
        - name: catalogID
          in: query
          required: false
          schema: { type: string }
          description: 服务分类 ID（空则查全部）
        - name: page
          in: query
          required: false
          schema: { type: integer, example: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, example: 3000 }
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      total: { type: integer, example: 3 }
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            instanceId: { type: string }
                            processsInstanceDefaultName: { type: string, example: 故障处理 }
                            associatedProcess:
                              type: object
                              properties:
                                instanceId: { type: string }
                                name: { type: string, example: 故障处理 }
                                category: { type: string, example: 问题管理 }
  /next/api/gateway/cmdb.instance.PostSearch/object/USER/instance/_search:
    post:
      tags: [服务目录与用户选择]
      operationId: searchUser
      summary: 搜索用户（选代理人）
      description: 在「请选择一位代理人」弹窗中按用户名搜索用户，用于选择代理人。
      x-relevant: true
      x-triggered-by-step: [18, 36]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                page: { type: integer, example: 1 }
                page_size: { type: integer, example: 1 }
                query:
                  type: object
                  description: 查询条件（如按用户名 $in 精确匹配）
                  properties:
                    name:
                      type: object
                      properties:
                        $in:
                          type: array
                          items: { type: string }
                          example: ["alanzou"]
                fields:
                  type: object
                  description: 返回字段（按需指定）
                  example: { name: true }
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      total: { type: integer, example: 1 }
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            instanceId: { type: string, example: 654091f62d541 }
                            name: { type: string, example: alanzou }
  /next/api/gateway/cmdb.cmdb_object.GetObjectRef/object_ref:
    get:
      tags: [服务目录与用户选择]
      operationId: getObjectRef
      summary: 查询用户对象引用
      description: 获取 USER 对象的引用配置，进入代理人管理时加载，用于用户选择控件初始化。
      x-relevant: true
      x-triggered-by-step: [3, 4]
      parameters:
        - name: ref_object
          in: query
          required: true
          schema: { type: string, enum: [USER] }
          example: USER
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        objectId: { type: string, example: HOST }
                        name: { type: string, example: 主机 }
                        category: { type: string, example: 基础设施 }
components:
  schemas:
    ProxyConfig:
      type: object
      description: 代理人配置（用户名 + 代理时效起止时间戳，秒）
      properties:
        username:
          type: string
          description: 代理人用户名
          example: test0002
        stime:
          type: integer
          description: 代理生效起始时间（Unix 秒）
          example: 1783872005
        etime:
          type: integer
          description: 代理生效结束时间（Unix 秒）
          example: 1784304005
    ProxySetting:
      type: object
      description: 代理人规则
      properties:
        instanceId: { type: string, example: 65628a8a57829 }
        name: { type: string, example: test }
        category: { type: string, description: 适用服务分类 ID（全权代理人为「全部」）, example: 5b55f855d236a }
        categoryName: { type: string, example: "" }
        status: { type: string, enum: [enabled, disabled], example: enabled }
        isGlobal: { type: boolean, description: 是否全权代理人, example: false }
        services:
          type: array
          description: 适用服务列表（全权代理人为空）
          items:
            type: object
            properties:
              instanceId: { type: string, example: 60c33d948bf61 }
              name: { type: string, example: 故障处理 }
        proxyConfigs:
          type: array
          description: 代理人配置列表
          items:
            $ref: '#/components/schemas/ProxyConfig'
        creator: { type: string, example: easyops }
        ctime: { type: string, example: "2026-07-09 15:34:48" }
