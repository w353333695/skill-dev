openapi: 3.0.3
info:
  title: ITSM 系统管理 · 知识目录管理 API
  version: "1.0"
  description: |
    ITSM「系统管理 -> 知识目录管理」涉及的后端接口。涵盖知识目录树的加载、
    目录/子目录的新建、编辑（含移动）、删除，目录权限的查询与设置，
    以及知识条目的发布、注销、批量删除。
    路径前缀均为 `/next/api/gateway/...`，网关按「服务.方法」路由到后端微服务。
  x-system: itsm

# ============ 标签 ============
tags:
  - name: 知识目录树与列表
    description: 知识目录树加载与知识列表查询
  - name: 知识目录增删改
    description: 知识目录/子目录的新建、编辑、删除
  - name: 知识目录权限
    description: 知识目录访问权限的查询与设置
  - name: 知识条目状态管理
    description: 知识条目的发布、注销、批量删除
  - name: 用户与用户组搜索
    description: 设置权限时的用户、用户组检索

# ============ 路径 ============
paths:

  # ---------- 知识目录树与列表 ----------
  /next/api/gateway/flowable_service.knowledge_base.GetCatalogTree/api/flowable_service/v1/knowledge_base/catalog_tree:
    get:
      tags: [知识目录树与列表]
      operationId: getKnowledgeCatalogTree
      summary: 获取知识目录树
      description: |
        返回完整知识目录树（含父子层级）。进入知识目录管理页、目录变更后刷新时调用。
      x-relevant: true
      responses:
        '200':
          description: 知识目录树
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  codeExplain: { type: string, example: "" }
                  error: { type: string, example: "" }
                  data:
                    type: object
                    properties:
                      catalogTree:
                        type: array
                        description: 顶层目录节点（递归包含子节点）
                        items:
                          type: object
                          properties:
                            id: { type: string, example: "6a547b8f6fdf04e91fe0ff79" }
                            name: { type: string, example: "test2" }
                            parentId: { type: string, example: "" }
                            description: { type: string, example: "desc" }

  /next/api/gateway/flowable_service.knowledge_base.ListKnowledge/api/flowable_service/v1/knowledge_base/knowledge:
    get:
      tags: [知识目录树与列表]
      operationId: listKnowledge
      summary: 查询知识列表
      description: |
        分页查询知识条目。可按目录、关键词、标签、创建者等过滤。
        query: page、pageSize、Q（关键词）、tags、title、creatorMark、backend 等。
      x-relevant: true
      parameters:
        - in: query
          name: page
          schema: { type: string, example: "1" }
        - in: query
          name: pageSize
          schema: { type: string, example: "10" }
        - in: query
          name: Q
          schema: { type: string, example: "" }
          description: 关键词
        - in: query
          name: tags
          schema: { type: string, example: "" }
        - in: query
          name: creatorMark
          schema: { type: string, example: "" }
      responses:
        '200':
          description: 知识列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data:
                    type: object
                    properties:
                      page: { type: number, example: 1 }
                      page_size: { type: number, example: 10 }
                      list:
                        type: array
                        items:
                          type: object

  # ---------- 知识目录增删改 ----------
  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/knowledge_base/catalog:
    post:
      tags: [知识目录增删改]
      operationId: createKnowledgeCatalog
      summary: 新建知识目录/子目录
      description: |
        新建知识目录。不带 parentId（或为空）表示顶层目录；
        带 parentId 表示在指定父目录下新建子目录。返回新目录 id。
      x-relevant: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "sub1"
                  description: 目录名称
                description:
                  type: string
                  example: "desc"
                  description: 目录描述
                parentId:
                  type: string
                  example: "6a547b8f6fdf04e91fe0ff79"
                  description: 父目录 ID（顶层为空）
      responses:
        '200':
          description: 新建结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  codeExplain: { type: string, example: "" }
                  error: { type: string, example: "" }
                  data:
                    type: object
                    properties:
                      id: { type: string, example: "6a547b9b29e257caa1573432" }

  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/knowledge_base/catalog/{catalogId}:
    put:
      tags: [知识目录增删改]
      operationId: updateKnowledgeCatalog
      summary: 编辑知识目录（含移动）
      description: |
        修改目录名称、描述。通过修改 parentId 可改变目录归属（移动到其他父目录下）。
      x-relevant: true
      parameters:
        - in: path
          name: catalogId
          required: true
          schema: { type: string }
          description: 目录 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "sub01"
                  description: 目录名称
                description:
                  type: string
                  example: "desc"
                parentId:
                  type: string
                  example: "6a547b8f6fdf04e91fe0ff79"
                  description: 父目录 ID（修改可实现移动）
      responses:
        '200':
          description: 编辑结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  codeExplain: { type: string, example: "" }
                  error: { type: string, example: "" }
                  data: { type: object, nullable: true, example: null }
    delete:
      tags: [知识目录增删改]
      operationId: deleteKnowledgeCatalog
      summary: 删除知识目录
      description: |
        删除指定知识目录。
      x-relevant: true
      parameters:
        - in: path
          name: catalogId
          required: true
          schema: { type: string }
          description: 待删除目录 ID
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data: { type: object, nullable: true, example: null }

  # ---------- 知识目录权限 ----------
  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/knowledge_base/catalog/{catalogId}/perm:
    get:
      tags: [知识目录权限]
      operationId: getKnowledgeCatalogPerm
      summary: 查询知识目录权限
      description: |
        查询指定目录当前的访问权限（visitor 列表）。设置权限面板打开时调用。
      x-relevant: true
      parameters:
        - in: path
          name: catalogId
          required: true
          schema: { type: string }
          description: 目录 ID
      responses:
        '200':
          description: 权限信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data:
                    type: object
                    properties:
                      id: { type: string, example: "6a547b8f6fdf04e91fe0ff79" }
                      visitor:
                        type: array
                        description: 已授权的用户/用户组列表
                        items: { type: string }
    post:
      tags: [知识目录权限]
      operationId: setKnowledgeCatalogPerm
      summary: 设置知识目录权限
      description: |
        设置目录的访问权限。visitor 为用户 instanceId 与用户组 ID（前缀冒号）的混合列表。
      x-relevant: true
      parameters:
        - in: path
          name: catalogId
          required: true
          schema: { type: string }
          description: 目录 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitor]
              properties:
                visitor:
                  type: array
                  items: { type: string }
                  example: ["test0001", ":656289c9ad8ff"]
                  description: 可访问的用户/用户组列表（用户为 instanceId，用户组为 :组ID）
      responses:
        '200':
          description: 设置结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data: { type: object, nullable: true, example: null }

  # ---------- 知识条目状态管理 ----------
  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/knowledge_base/bulk/status/knowledge:
    put:
      tags: [知识条目状态管理]
      operationId: updateKnowledgeStatus
      summary: 发布/注销知识
      description: |
        批量变更知识条目状态。status=published 表示发布，status=cancelled 表示注销。
      x-relevant: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [knowledgeIds, status]
              properties:
                knowledgeIds:
                  type: array
                  items: { type: string }
                  example: ["6a547ade6fdf04e91fe0ff75"]
                  description: 知识条目 ID 列表
                status:
                  type: string
                  enum: [published, cancelled]
                  example: published
                  description: 目标状态（published=发布，cancelled=注销）
      responses:
        '200':
          description: 变更结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data: { type: object, nullable: true, example: null }

  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/knowledge_base/bulk/delete/knowledge:
    post:
      tags: [知识条目状态管理]
      operationId: deleteKnowledge
      summary: 批量删除知识
      description: |
        批量永久删除知识条目。
      x-relevant: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [knowledgeIds]
              properties:
                knowledgeIds:
                  type: array
                  items: { type: string }
                  example: ["6a547ade6fdf04e91fe0ff75"]
                  description: 待删除知识条目 ID 列表
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data: { type: object, nullable: true, example: null }

  # ---------- 用户与用户组搜索 ----------
  /next/api/gateway/cmdb.instance.PostSearch/object/USER/instance/_search:
    post:
      tags: [用户与用户组搜索]
      operationId: searchUser
      summary: 搜索用户
      description: |
        按关键词分页搜索用户（CMDB USER 实例）。设置目录权限时调用。
      x-relevant: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page: { type: number, example: 1 }
                page_size: { type: number, example: 20 }
                fields:
                  type: object
                  example: { name: true }
                ignore_missing_field_error: { type: boolean, example: true }
                query:
                  type: object
                  description: 支持 $or / $like 模糊匹配
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            instanceId: { type: string, example: "653547e2782c3" }
                            name: { type: string, example: "easyops" }
                            nickname: { type: string, example: "鲲鹏3046" }

  /next/api/gateway/cmdb.instance.PostSearch/object/USER_GROUP/instance/_search:
    post:
      tags: [用户与用户组搜索]
      operationId: searchUserGroup
      summary: 搜索用户组
      description: |
        按关键词分页搜索用户组（CMDB USER_GROUP 实例）。设置目录权限时调用。
      x-relevant: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page: { type: number, example: 1 }
                page_size: { type: number, example: 20 }
                fields:
                  type: object
                  example: { name: true }
                ignore_missing_field_error: { type: boolean, example: true }
                query:
                  type: object
                  description: 支持 $and / $or / $like
      responses:
        '200':
          description: 用户组列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: number, example: 0 }
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            instanceId: { type: string, example: "656289c9ad8ff" }
                            name: { type: string, example: "test" }
