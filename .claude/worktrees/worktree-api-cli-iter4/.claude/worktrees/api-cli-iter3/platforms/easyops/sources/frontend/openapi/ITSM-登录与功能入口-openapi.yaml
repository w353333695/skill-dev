openapi: 3.0.3
info:
  title: EasyOps ITSM — 登录与功能入口 API
  description: |
    录制自 EasyOps 平台（http://172.30.0.90/）「登录系统 + 进入 ITSM 工作台」流程。
    涵盖三个语义阶段：认证登录、门户启动台、ITSM 工作台初始化。

    - 流程指引见同目录 `EasyOps-ITSM-登陆功能入口-操作指引.md`
    - 通用响应包装：`{ code, codeExplain, error, data }`，`code === 0` 表示成功
    - 网关接口统一前缀 `/next/api/gateway/<service>/...`，其中 `<service>` 形如
      `logic.xxx`(逻辑服务) / `xxx.YYYVerb`(命名式接口) / `cmdb.instance.PostSearchV3`
  version: "1.0.0"
  contact:
    name: 录制生成（browser-recorder）

servers:
  - url: http://172.30.0.90
    description: EasyOps 测试环境

tags:
  - name: 认证
    description: 登录认证、会话状态、运行时配置
  - name: 门户启动台
    description: 登录后门户首页加载（工作台设置、用户信息、微应用清单）
  - name: ITSM 工作台初始化
    description: 进入 ITSM 工作台后加载的菜单、配置、流程/工单聚合数据

paths:
  # ============ 认证 ============
  /next/api/auth/login/v2:
    post:
      tags: [认证]
      summary: 用户名密码登录（v2）
      description: |
        提交账号密码完成登录。成功后服务端下发会话凭证，前端跳转门户 `/next/portal`。
        请求体含账号密码字段（录制时已脱敏，schema 省略明文）。
      operationId: auth_login_v2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                  description: 登录密码（脱敏，勿明文存储）
                org:
                  type: number
                  description: 组织 ID，可缺省
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/auth/login:
    get:
      tags: [认证]
      summary: 登录页配置 / 会话状态
      description: 获取登录页配置，同时用于探测当前会话是否已登录（已登录时返回用户信息）。
      operationId: auth_login_status
      responses:
        "200":
          description: 登录页配置或会话信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/v1/runtime_standalone:
    get:
      tags: [认证]
      summary: 平台运行时配置
      description: 获取 featureFlags、菜单、平台设置等运行时配置，每个微应用加载时都会拉取。
      operationId: runtime_standalone
      responses:
        "200":
          description: 运行时配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/auth/conf.yaml:
    get:
      tags: [认证]
      summary: 登录页静态配置（YAML）
      description: 登录页渲染所需的静态配置文件，通常 204 无内容（使用默认）。
      operationId: auth_conf_yaml
      responses:
        "204":
          description: 无内容（使用默认配置）
      x-relevant: true

  # ============ 门户启动台 ============
  /next/api/gateway/micro_app_standalone.launchpad.GetLaunchpadInfo/api/v1/micro_app_standalone/launchpad_info:
    get:
      tags: [门户启动台]
      summary: 启动台信息
      description: 获取启动台（Launchpad）收藏、分类、应用列表等聚合信息，用于门户首页卡片展示。
      operationId: launchpad_info
      responses:
        "200":
          description: 启动台信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/logic.micro_app_standalone_service/api/v1/micro_app_standalone/runtime/{microApp}:
    get:
      tags: [门户启动台]
      summary: 微应用运行时清单
      description: |
        获取指定微应用的运行时清单（菜单、路由、provider 等）。`microApp` 取值如
        `home`、`portal`、`itsc-workbench`、`general-auth` 等。`version` 为微应用版本。
      operationId: micro_app_runtime
      parameters:
        - name: microApp
          in: path
          required: true
          schema: { type: string }
          description: 微应用 ID，如 portal / itsc-workbench
        - name: version
          in: query
          required: false
          schema: { type: string }
          description: 微应用版本，如 1.5.0 / 2.54.10
      responses:
        "200":
          description: 微应用运行时清单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
        "401":
          description: 未登录（登录态校验失败）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/logic.sys_setting/api/sys_setting/v2/workbench:
    get:
      tags: [门户启动台]
      summary: 工作台设置
      description: 门户工作台的配置项（标题、主题、布局等）。
      operationId: sys_setting_workbench
      responses:
        "200":
          description: 工作台设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/logic.user_service/api/v1/users/orgs:
    get:
      tags: [门户启动台]
      summary: 用户所属组织列表
      operationId: user_orgs
      parameters:
        - name: username
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 组织列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/logic.user_service/api/v1/users/detail/{username}:
    get:
      tags: [门户启动台]
      summary: 用户详情
      description: 获取指定用户详情（含组织、角色等）。
      operationId: user_detail
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
        - name: org
          in: query
          required: false
          schema: { type: number }
          description: 组织 ID
      responses:
        "200":
          description: 用户详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/logic.cmdb.service/v3/object/_INSTALLED_MICRO_APP/instance/_search:
    post:
      tags: [门户启动台]
      summary: 查询已安装微应用
      description: CMDB 检索 `_INSTALLED_MICRO_APP` 实例，得到平台已安装的微应用清单（appId/版本）。
      operationId: search_installed_micro_app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                page: { type: number }
                page_size: { type: number }
                ignore_missing_field_error: { type: boolean }
      responses:
        "200":
          description: 已安装微应用列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/cmdb.instance.PostSearchV3/v3/object/MICRO_APP_CATEGORY@EASYOPS/instance/_search:
    post:
      tags: [门户启动台]
      summary: 查询微应用分类
      description: 检索微应用分类实例（id/name/icon/order/locales 等），用于门户首页卡片分组展示。
      operationId: search_micro_app_category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                page: { type: number }
                pageSize: { type: number }
                fields:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: 微应用分类列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  # ============ ITSM 工作台初始化 ============
  /next/api/gateway/flowable_service.permission.ListMenuV3/api/flowable_service/v3/menus:
    get:
      tags: [ITSM 工作台初始化]
      summary: ITSM 菜单树
      description: 获取当前用户在 ITSM 工作台的可见菜单（工单中心、服务目录等）。
      operationId: itsc_menus
      responses:
        "200":
          description: 菜单列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/flowable_service.permission.UserInfo/api/flowable_service/v1/user/info:
    get:
      tags: [ITSM 工作台初始化]
      summary: ITSM 用户权限信息
      operationId: itsc_user_info
      responses:
        "200":
          description: ITSM 用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/flowable_service.global_setting.GetItscConfig/api/flowable_service/v1/global_setting/config:
    get:
      tags: [ITSM 工作台初始化]
      summary: ITSM 全局配置
      operationId: itsc_global_config
      responses:
        "200":
          description: ITSM 全局配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/priority_set_all:
    get:
      tags: [ITSM 工作台初始化]
      summary: 工单优先级集合
      operationId: itsc_priority_set
      responses:
        "200":
          description: 优先级集合
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/service_category:
    get:
      tags: [ITSM 工作台初始化]
      summary: 服务目录列表
      description: 拉取全量服务目录（默认 pageSize=1000），用于工单分类选择。
      operationId: itsc_service_category
      parameters:
        - name: page
          in: query
          schema: { type: number }
        - name: pageSize
          in: query
          schema: { type: number }
      responses:
        "200":
          description: 服务目录列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/global_setting/workbench_tag_conf:
    get:
      tags: [ITSM 工作台初始化]
      summary: 工作台标签配置
      operationId: itsc_workbench_tag_conf
      responses:
        "200":
          description: 工作台标签配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/global_setting/ticket_urge_conf:
    get:
      tags: [ITSM 工作台初始化]
      summary: 工单催办配置
      operationId: itsc_ticket_urge_conf
      responses:
        "200":
          description: 工单催办配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/flowable_service.global_setting.GetLabelView/api/flowable_service/v1/global_setting/label_view:
    get:
      tags: [ITSM 工作台初始化]
      summary: 标签视图配置
      operationId: itsc_label_view
      responses:
        "200":
          description: 标签视图配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/process_common:
    get:
      tags: [ITSM 工作台初始化]
      summary: 流程通用列表
      description: 工单流程定义列表（默认 hideDisabled=true, pageSize=1000）。
      operationId: itsc_process_common
      parameters:
        - name: hideDisabled
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: number }
        - name: pageSize
          in: query
          schema: { type: number }
      responses:
        "200":
          description: 流程列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/logic.flowable_service/api/flowable_service/v2/process_instance_count:
    get:
      tags: [ITSM 工作台初始化]
      summary: 流程实例计数（按标签）
      description: 按工单状态标签聚合统计数量，用于工作台待办/进行中等角标。
      operationId: itsc_process_instance_count
      parameters:
        - name: tags
          in: query
          required: true
          schema: { type: string }
          description: 状态标签，逗号分隔，如 run,cc,unhandled,timeout
      responses:
        "200":
          description: 各标签计数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/logic.flowable_service/api/flowable_service/v1/process_type_count:
    get:
      tags: [ITSM 工作台初始化]
      summary: 流程类型计数
      operationId: itsc_process_type_count
      parameters:
        - name: tag
          in: query
          schema: { type: string }
      responses:
        "200":
          description: 各流程类型计数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

  /next/api/gateway/flowable_service.process_instance.ListProcessInstanceStepFilterV3/api/flowable_service/v3/process_instance_step:
    post:
      tags: [ITSM 工作台初始化]
      summary: 查询流程实例步骤（工单列表）
      description: |
        工作台工单列表的核心查询接口。按 filter 过滤、分页返回流程实例步骤明细。
      operationId: itsc_process_instance_step
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  type: object
                  description: 过滤条件
                page: { type: number }
                pageSize: { type: number }
      responses:
        "200":
          description: 流程实例步骤列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
      x-relevant: true

components:
  schemas:
    ApiResult:
      type: object
      description: EasyOps 通用响应包装
      properties:
        code:
          type: number
          description: 业务码，0 表示成功
          example: 0
        codeExplain:
          type: string
          description: 业务码说明，如 ERR_UNAUTHENTICATED
          example: ""
        error:
          type: string
          description: 错误信息（成功时为空）
          example: ""
        data:
          description: 业务数据（具体结构见各接口）
      required: [code]
