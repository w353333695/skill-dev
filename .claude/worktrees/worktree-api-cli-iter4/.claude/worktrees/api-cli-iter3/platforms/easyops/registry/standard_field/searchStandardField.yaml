name: searchStandardField
module: standard_field
method: POST
path: /api/flowable_service/v1/standard_field/_search
gateway_path: /next/api/gateway/logic.flowable_service/api/flowable_service/v1/standard_field/_search
service: logic.flowable_service
side_effect: read
path_source: backend_contract
path_confidence: high
tags:
- 标准字段
- 查询
- 列表
- 搜索
summary: 查询标准字段列表
description: '按关键词（Q）、唯一标识（key）、字段名称（name）、字段说明（desc）、字段类型（kind）、创建人（creator）等条件查询标准字段列表。

  进入标准字段列表页、执行搜索时调用。响应 data.list 含完整字段对象（instanceId/key/name/kind/sourceType/sourceConfig/domainModels
  等）。

  '
request:
  required: []
  properties:
    page:
      type: integer
      desc: 页码
    pageSize:
      type: integer
      desc: 每页条数
    Q:
      type: string
      desc: 关键词（模糊匹配唯一标识/名称/说明/创建人）
    key:
      type: string
      desc: 唯一标识
    name:
      type: string
      desc: 字段名称
    desc:
      type: string
      desc: 字段说明
    kind:
      type: string
      desc: 字段类型（如 USER_SELECTOR、INPUT）
    creator:
      type: string
      desc: 创建人
    et:
      type: string
      desc: 预留筛选
    st:
      type: string
      desc: 预留筛选
    keyList:
      type: string[]
      desc: 唯一标识列表
      _source: contract
    withSource:
      type: bool
      desc: 是否带数据源信息
      _source: contract
outputs:
  list_full:
    jsonpath: $.data.list
    desc: 标准字段列表（含 instanceId/key/name/kind/sourceType/sourceConfig/domainModels 等）
  list_ids:
    jsonpath: $.data.list
    desc: 标准字段 instanceId 列表（配合表达式投影 ${s.list_full.instanceId}）
  total:
    jsonpath: $.data.total
    desc: 匹配总数
requires: []
rollback: null
examples:
- page: 1
  pageSize: 10
  Q: 处理人
confidence:
  request: medium
  module: high
  outputs: high
  tags: high
  summary: high
endpoint:
  contract_ref: logic.flowable_service|POST|/api/flowable_service/v1/standard_field/_search
  mode: easyops_gateway
