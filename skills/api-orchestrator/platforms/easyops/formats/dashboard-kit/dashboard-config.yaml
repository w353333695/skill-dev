# =============================================================================
# formats/dashboard-kit/dashboard-config.yaml
# EasyOps 仪表盘 v2 配置结构 —— 自然语言 → _DASHBOARD 实例配置 JSON。
#
# 核心事实：仪表盘 = CMDB _DASHBOARD 模型实例。CRUD 走 easyops-cmdb.yaml#dashboard
# （create/update 镜像前端 v2 编辑器行为）+ object_instance search 查。
#
# 权威源（全部 file:line 可溯源，源码仓 07-source-repos/）：
#   前端仓 next-apps-hyper-insign-v2/apps/dashboard/src/（v2 唯一在用 dashboard app）：
#     · 保存组装（create/update body 字段全集）CreateAndEditDashboardV2/route.yaml:405-470
#     · 新建默认值（_new_ 哨兵+模板初值）CreateAndEditDashboardV2/route.yaml:1746-1781
#     · Panel 权威 interface  Functions/renderDefaultArgsOfPanel.yaml:68-110
#                          + Functions/transformPanelData.yaml:46-63
#     · 构件清单+默认配置    Functions/getDefaultBrickList.yaml（brickId: 行号见 brick_catalog）
#     · 变量结构            Components/TplVarSelectorModal.yaml:672-705
#     · 数据源类型/DSL      见同目录 providers-context.yaml
#
# 相关文件（本 kit 内）：
#   providers-context.yaml —— 8 种数据源类型 + args DSL + 试查方法
#
# =============================================================================
# 监控套件 dashboard 设计（kit_dashboard——随套件分发的盘，参考 MySQL/Redfish 套件实测结构）
# =============================================================================
kit_dashboard:
  desc: |
    监控套件 dashboard = 套件包内 dashboard/<盘名>.json 文件（随套件 import 分发），结构与独立
    _DASHBOARD 实例一致（dashboard_schema），但有几个套件特有约定：
  conventions:
    - "文件位置：套件包根 dashboard/<中文盘名>.json（如 dashboard/概览.json——MySQL/Redfish 套件实证）"
    - "namespace：resource-monitor.<objectId>（资源监控命名空间——Redfish 盘 resource-monitor.PHYSICAL_SERVER@ONEMODEL 实证；独立盘默认 dashboard）"
    - "variables 通常空（0 个）——盘挂在资源监控详情页，QUERY.instanceId 由宿主页注入（context query: instanceId: <% QUERY.instanceId %>）"
    - "template=normal + timerange=now-1h（顶部时间选择器驱动 QUERY.from/to）"
    - "type/builtIn 等字段不携带（套件导入时由平台补）"
  context_pattern:
    cmdb_olap_metric: |
      监控指标数据源（每指标一个 context，MySQL/Redfish 同款）：
        name: <语义名>  type: cmdb-olap  provider: easyops.api.data_exchange.olap@Query:1.0.0
        dataType: array
        args: |
          - model: easyops.<objectId>          # easyops. 前缀 + objectId
            fillEmptyData: false
            dims: [time(auto), <分组维度如 device_id/sql_stmt>]   # time(auto)=随时间选择器粒度
            filters:
              - {name: time, operator: '>=', value: '<% QUERY.from ?? "now-1h" %>'}
              - {name: time, operator: '<=', value: '<% QUERY.to ?? "now-1s" %>'}
            measures:
              - name: <输出列名>
                function: {expression: last|avg|max|min, args: [<指标字段名>]}
            translate: []
            query:
              instanceId: <% QUERY.instanceId %>   # 资源实例过滤
        transform: "<% DATA?.list ?? [] %>"
      时间粒度固定写法：time(86400s)（按天）/ time(1200s)（20分钟）/ time(1m)（分钟）/ time(auto)
      昨日全天：value: '<% moment().subtract(1, ''day'').startOf(''day'').unix() %>'
    cmdb_instance_info: |
      资源实例信息（盘头信息行用）：
        type: cmdb-list + query instanceId: <% QUERY.instanceId %> + fields ['*'] + pageSize 10
        transform: "<% DATA.list[0] %>"（取单对象）
    transform_map_rows: |
      行映射（含 time 格式化）：transform: |
        <%
        (DATA?.list ?? []).map(item => ({...item, "time": moment.unix(item["time"]).format('YYYY-MM-DD HH:mm:ss')}))
        %>
  panel_pattern:
    trend_in_container: |
      趋势图常嵌在 dynamic-grid-container 容器内（Redfish 卡片流布局）：
      容器 properties.useBrick = [{brick: style, properties: {textContent: <CSS>}}, ..., 
        {brick: div, ..., slots: {items: {bricks: [{brick: chart-v2.time-series-chart,
          properties: {data: "<% CTX.DS.ping %>", xField: "time", yField: "<measure输出列名>",
            showPoint: false, timeFormat: "MM/DD HH:mm", axis: {yAxis: {precision: 2, unit: "ms"}},
            height: 240, style: {width: "98%"}}}]}}, ...}]
      卡片 CSS 骨架可直接从 Redfish-ref 抄（card-header/card-label/card-value/card-status-dot 状态色族）
    simple_trend: "非容器简单形态：panel 直接 chart-v2.time-series-chart（data/xField=time/yField=measure 列名）"
    table: "明细表 brick-table（dataSource.list 绑 cmdb-olap context——MySQL 慢查/死锁两表盘实证）"
  pattern_extras:
    multi_measure_one_context: |
      多指标单 context（MySQL监控套件 metricData 实证——N 图复用 1 个数据源）：
      measures 数组列多个 {name: <中文输出列名>, function: {expression: rate|avg|last, args: [<指标名>]}}；
      图侧 yFields: ["发送流量", "接收流量"]（复数数组——多序列；单序列图用 yField）。
      rate=按时间求速率（流量类）、avg=均值、last=末值（状态类）。
    statistic_item: |
      当前值小卡（statistic-item——区别于 statistic-card）：text: '<% CTX.DS.lastMetric["cluster_status"] %>'
      + itemTitle: "集群状态" + fontSize: 10px + showCard: false；通常配 last 类 context（time 粒度粗+last 函数取当前值）。
      panel 常不设 title（卡片文案在 itemTitle），mode: yaml。
    dashboard_files: "一套件可带多盘：MySQL监控套件 3 盘（InnoDB分析/请求分析/集群状态）各一 json——按分析主题拆盘"
  e2e_note: "路由器监控套件 dashboard（e2e 实战 v1.1.5）：dashboard/概览.json——含两种维度消费模式（见 dim_consume_modes）"
  dim_consume_modes: |
    🔴【带维度指标的两种消费模式】（2026-10-20 用户导入交换机盘指正）——
    📌完整盘样例已固化本目录 samples/（交换机监控-概览.json / 交换机监控-端口状态.json，
    直接 cp 参考不依赖环境 instanceId）：
    模式A【指标独享维度→多序列】：context dims 带 *_name 实体维度 + 图 properties.groupField=<维度字段>
    ——同图按实体自动分多序列（概览盘 CPU 图：groupField: snmp_netware_cpu_name，实测）。
    不设 groupField 则多实体数据无法分层展示。
    模式B【变量（下拉选维度值）作用于多指标】：三件套——
      ① 选项源 context：dims 带 <维度字段>（time 粗粒度）→ 拉维度值列表；
      ② 容器嵌 forms.general-select：options: "<% CTX.DS.<选项源> %>"，value: "<% QUERY.<参数> %>"，
        events.general.select.change → action: history.pushQuery, args: [{"<参数>": "<% EVENT.detail %>"}]
        （选择即写 URL query）；
      ③ 目标 context（可多指标共用）：dims 不带该维度，改【filters】: name=<维度字段>,
        operator: '==', value: <% QUERY.<参数> %>（端口状态盘 trendData 一个 context 供
        in/out 流量+出入错误四图共用，实测）。
    两种模式可共存（路由器盘：CPU/内存/风扇/电源用 A，温度值+温度状态共用温度传感器选择用 B）。
  filter_empty_pitfall: |
    🔴【模式B 下拉的空值坑】（2026-10-20 路由器盘温度不渲染实测）：filters 里
    `name: <维度>, operator: '==', value: <% QUERY.<参数> %>` 在 URL 未带该参数时值为空
    → 查询空 → 绑该 context 的卡片+图全部不渲染（静默空白）。模式B 仅适用于【必须先选才看数】
    的场景（如交换机端口）；概览盘要默认有数 → 用模式A（groupField 多序列）不要用 filter 联动。
    若要"默认全量+可选过滤"，filters 值须带空值回退：value: '<% QUERY.tempName ?? "" %>'
    也不行（=="" 仍匹配空）——OLAP filter 无 nullify 语法，别这么设计。
  expr_escape_pitfall: |
    🔴【<% %> 表达式生成坑】（2026-10-20 路由器盘 instanceId 报错实测）：用 python % 格式化生成
    含 <% %> 表达式的配置时，% 必须转义成 <%% QUERY.xxx %%>——但产物 JSON 落盘前必须还原为
    <% QUERY.xxx %>！<%% %%> 双百分号残留在 args/properties 里，表达式引擎不识别（QUERY.instanceId
    解析为空 → 查询报错）。生成器统一用 .format() 或落盘前全局 replace('<%%','<%').replace('%%>','%>')。
  olap_field_pitfall: |
    🔴【OLAP 指标字段名坑×2】（2026-10-19 路由器盘 300303 两轮实测）：
    ① 字段名取套件包 origin_metric.json 的 key 的【下划线化形态】——key 含点号（snmp.netware.cpu_utilization）
    时 OLAP 落库字段为点→下划线（snmp_netware_cpu_utilization）；🔴直接写带点的 key 报
    code:300303 field:snmp（点被当路径分隔符，只解析出第一段）。维度同理（key snmp.netware.cpu_name
    → 字段 snmp_netware_cpu_name）。权威参照=【通用交换机监控】套件 dashboard/概览.json（官方盘，
    measures: snmp_netware_cpu_utilization / dims: snmp_netware_memory_name 实证）。
    ② collector_metric.list 只证【目录注册】不证【有数据】——easyops simple-script 自注册名（m_*）
    目录里有但从未写入数据，OLAP schema 无此字段同样报 300303。指标选型以【套件包 origin_metric.json
    的 key】为准（它=该套件上报的真实字段），非目录名/别名。
