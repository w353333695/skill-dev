name: easyops-flow-package
version: 2
intent: "描述 AutoOps flow.basic V2 导入导出包，并记录 24 环境导出包的兼容性处理。"
source:
  backend: "resources/sources/backend/AutoOps/tool_service/flow_basic/flow_basic_service.go:660-835"
  export: "resources/sources/backend/AutoOps/tool_service/flow_basic/flow_basic_service.go:1160-1335"
  fixture: "tmp/子目录and文件数量统计-Linuxfbac688008df74e13d3265bc920c9a5a.flow.tar.gz（开发期证据；知识已内联）"
archive:
  required_files:
    - "_easyops_flow_info.json"
    - "_easyops_tar_meta.json"
    - "tool_batch_export.tar.gz"
  optional_files:
    - "<subFlowId>.json"
  root_layout: "导入实现要求上述文件直接位于解压目录根部；若 tar.gz 只有一个顶层目录，先用 normalize_flow_package.py 展平。"
  metadata:
    _easyops_flow_info.json: "主流程完整定义；含 flowId、name、vName、stepList、flowInputs、envType 等。"
    _easyops_tar_meta.json: "工具与子流程索引；tools 的 key 为 toolId_versionId，flows 记录子流程。"
    tool_batch_export.tar.gz: "流程依赖工具的批量工具包；V2 导入缺失该文件会直接返回 NotFound。"
compatibility:
  import_endpoint: "/flows/v2/import"
  multipart_fields:
    file: "必填，流程包 tar.gz"
    tools: "必填 JSON 字符串，来自 import_check 返回的工具选择结果；无工具时传 []"
    flows: "必填 JSON 字符串，来自 import_check 返回的流程选择/改名结果"
  check_endpoint: "/flows/import/check"
  legacy_endpoint: "/flows/import"
  legacy_layout: "仅适用于包含 ._easyPackageConfig.dat 的 V1 包，不适用于本包的 _easyops_flow_info.json + _easyops_tar_meta.json 布局。"
known_issue:
  environment: "24"
  symptom: "导出的包无法直接导入。"
  evidence: "给定包的 tar 列表显示单一顶层目录 子目录and文件数量统计-Linux/，其下才有三个必需文件。"
  workaround: "上传前先展平唯一顶层目录；若仍失败，先调用 /flows/import/check，再将 check 返回的 flows/tools JSON 传给 /flows/v2/import。"
security:
  note: "流程定义可能包含 webhook URL、凭证或通知地址；导入前必须审查 stepList/input 常量并对外泄露的 token 做轮换。"

layout:
  source: "24 环境流程手动调整后的 flowId=b8c43e1b9ba914e142423e2a8486fa34 版本=1792593537（前端保存回读证据）"
  coordinate_fields: ["stepList[]._x", "stepList[]._y", "stepList[]._dx", "stepList[]._dy", "stepList[].styles.width"]
  horizontal_chain:
    rule: "同一条主链使用相同 _y；后续节点沿 _x 递增；parents[].sourcePoint=right、targetPoint=left。"
    observed: "本次手动版：step1 x=288.6033,y=403.5,width=163；step2 x=500,y=403.5,width=135；step3 x=685.5311,y=403.5,width=100；节点边缘间距约 49-51px。"
  start_node_clearance:
    rule: "root=true 的首节点不要贴住或覆盖画布开始节点；首节点的 _dx 是相对开始节点的偏移，不能简单设为 0。先在前端拖动首节点避让开始节点，再回读保存后的 _x/_dx 作为模板。"
    observed: "本次手动版首节点 _x=288.6033、_dx=-188.6033；下游节点 _dx=0。说明开始节点与首节点存在独立偏移关系。"
  sizing: "styles.width 按节点标题长度保留前端实际值；不要把所有节点强制设成同一宽度，否则会改变前端自动布局和边距。"
  update_method: "V2 update 当前不支持 stepList/坐标字段；布局调整应通过前端保存或兼容的流程版本更新端点完成，更新后必须 flow.get 回读坐标。"

runtime_notes:
  client_install: "client-install-runtime-notes.md（24 环境原生客户端安装实测：CMDB选择器、动态工具调用、CEL对象透传、结果映射、导出兼容）"

authoring_defaults:
  node_types: "不涉及外部接口时默认使用工具节点或已有子流程；内部服务调用与轮询封装在工具/子流程，不为每个 API 请求创建 HTTP 节点。外部接口才按需使用 HTTP。"
  cmdb_selector: "显示字段保持简洁，通常 1–2 个可读业务字段，不堆砌内部 ID/长哈希；文件包版本使用 description、versionName，工具使用 name，主机使用 ip、hostname。显示字段不改变执行锚字段。"
  client_install: "推荐三节点：文件分发 → 安装 → 验证，全部 subtype=tool。保留旧流程，不为简化界面删除已有流程。"
