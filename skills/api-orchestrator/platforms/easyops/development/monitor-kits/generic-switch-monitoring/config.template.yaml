        - "1.3.6.1.4.1.25506.2.6.1.1.1.1.12"
      values:
        - "^[1-9]\\d*(\\.\\d+)?$"  # 匹配正整数或正小数（1, 2, 10, 1.5等）
        - "^0\\.\\d*[1-9]\\d*$"    # 匹配0.1, 0.01等正小数（排除0和0.0）
