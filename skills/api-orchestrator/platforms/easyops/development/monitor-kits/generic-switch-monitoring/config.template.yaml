  version: "{{.version}}"
  max_repetitions: 25
  retries: 3
  timeout: 5s
  auth:
    community: "{{.community}}"
    security_level: "{{.security_level}}"
    username: "{{.username}}"
    password: "{{.password}}"
    auth_protocol: "{{.auth_protocol}}"
    priv_protocol: "{{.priv_protocol}}"
    priv_password: "{{.priv_password}}"
    context_name: "{{.context_name}}"

  filters:
  
    {{- if eq .brand "H3C" }}    
    
    - oid: "1.3.6.1.4.1.25506.2.6.1.1.1.1.12"  # H3C 温度值过滤器
      targets:
        - "1.3.6.1.4.1.25506.2.6.1.1.1.1.12"
      values: 
        - "^[0-9]{1,4}$"          # 0-9999
        - "^[0-5][0-9]{4}$"       # 00000-59999
        - "^6[0-4][0-9]{3}$"      # 60000-64999
        - "^65[0-4][0-9]{2}$"     # 65000-65499
        - "^655[0-2][0-9]$"       # 65500-65529
        - "^6553[0-4]$"           # 65530-65534   
        
    - oid: 1.3.6.1.2.1.47.1.1.1.1.5
      targets:
        - "1.3.6.1.2.1.47.1.1.1.1.5"
        - "1.3.6.1.2.1.47.1.1.1.1.7"
        - "1.3.6.1.4.1.25506.2.6.1.1.1.1.6"
        - "1.3.6.1.4.1.25506.2.6.1.1.1.1.8"
        - "1.3.6.1.4.1.25506.2.6.1.1.1.1.12"
      values:
        - "9"
    - oid: "1.3.6.1.2.1.47.1.1.1.1.7"  # H3C cpu、内存过滤器
      targets:
        - "1.3.6.1.2.1.47.1.1.1.1.5"
        - "1.3.6.1.2.1.47.1.1.1.1.7"
        - "1.3.6.1.4.1.25506.2.6.1.1.1.1.6"
        - "1.3.6.1.4.1.25506.2.6.1.1.1.1.8"
        - "1.3.6.1.4.1.25506.2.6.1.1.1.1.12"
      values:  
        - "^([^C]|C([^a]|a([^r]|r[^d])))*$"          # 实体名称不包含Card
    - oid: "1.3.6.1.4.1.25506.2.6.1.1.1.1.6"  # 过滤CPU使用率为0的实体
      targets:
        - "1.3.6.1.2.1.47.1.1.1.1.5"
