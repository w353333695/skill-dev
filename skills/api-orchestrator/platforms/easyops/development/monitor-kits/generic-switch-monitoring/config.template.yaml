- module: snmp
  enabled: true
  metricsets:
    - netware
  period: 10s
  hosts: [ "{{.snmpIp}}:{{ $port := printf "%v" .snmpPort }}{{if or (eq $port "null") (eq $port "<nil>") (eq $port "<no value>") (eq $port "")}}161{{else}}{{$port}}{{end}}" ]
  
  walk:
    - 1.3.6.1.2.1.1.3.0        # 系统运行时间 (sysUpTime)
    - 1.3.6.1.2.1.47.1.1.1.1.5 # 实体索引 (entPhysicalIndex)
    - 1.3.6.1.2.1.47.1.1.1.1.7 # 实体名称 (entPhysicalName)
    - 1.3.6.1.2.1.31.1.1.1.1   # 接口名称 (ifName)
    - 1.3.6.1.2.1.31.1.1.1.15  # 接口速度 (ifSpeed)
    - 1.3.6.1.2.1.2.2.1.7      # 接口管理状态 (ifAdminStatus)
    - 1.3.6.1.2.1.2.2.1.8      # 接口操作状态 (ifOperStatus)
    - 1.3.6.1.2.1.31.1.1.1.6   # 接口入站字节数 (ifHCInOctets)
    - 1.3.6.1.2.1.31.1.1.1.10  # 接口出站字节数 (ifHCOutOctets)
    - 1.3.6.1.2.1.2.2.1.14     # 接口入站错误数 (ifInErrors)
    - 1.3.6.1.2.1.2.2.1.20     # 接口出站错误数 (ifOutErrors)
    {{- if eq .brand "Cisco" }}
    - 1.3.6.1.4.1.9.9.13.1.5.1.3       # Cisco 电源状态值 (ciscoEnvMonSupplyState)
    - 1.3.6.1.4.1.9.9.13.1.4.1.3       # Cisco 风扇状态值 (ciscoEnvMonFanState)
    - 1.3.6.1.4.1.9.9.13.1.3.1.6       # Cisco 温度状态值 (ciscoEnvMonTemperatureState)
    - 1.3.6.1.4.1.9.9.109.1.1.1.1.2    # Cisco CPU 名称 (cpmCPUTotalDescr)
    - 1.3.6.1.4.1.9.9.109.1.1.1.1.8    # Cisco CPU 利用率 (cpmCPUTotal5min)
    - 1.3.6.1.4.1.9.9.48.1.1.1.2       # Cisco 内存名称 (ciscoMemoryPoolName)
    - 1.3.6.1.4.1.9.9.48.1.1.1.6       # Cisco 空闲内存 (ciscoMemoryPoolFree)
    - 1.3.6.1.4.1.9.9.48.1.1.1.5       # Cisco 已用内存 (ciscoMemoryPoolUsed)
    - 1.3.6.1.4.1.9.9.13.1.3.1.3       # Cisco 温度值 (ciscoEnvMonTemperatureValue)
    {{- else if eq .brand "VRP" }}
    - 1.3.6.1.4.1.56813.5.25.31.1.1.1.1.5    # VRP CPU 利用率
    - 1.3.6.1.4.1.56813.5.25.31.1.1.1.1.7    # VRP 内存利用率
    - 1.3.6.1.4.1.56813.5.25.31.1.1.1.1.10   # VRP 运行时长
    - 1.3.6.1.4.1.56813.5.25.31.1.1.1.1.11   # VRP 温度值
    - 1.3.6.1.4.1.56813.5.25.31.1.1.1.1.12   # VRP 温度高阈值
    - 1.3.6.1.4.1.56813.5.25.31.1.1.18.1.6   # VRP 电源状态
    - 1.3.6.1.4.1.56813.5.25.31.1.1.10.1.7   # VRP 风扇状态
    - 1.3.6.1.4.1.56813.5.25.31.1.1.10.1.8   # VRP 风扇转速
    {{- else if eq .brand "Huawei" }}
    - 1.3.6.1.4.1.2011.5.25.31.1.1.1.1.5    # Huawei CPU 利用率
    - 1.3.6.1.4.1.2011.5.25.31.1.1.1.1.7    # Huawei 内存利用率
    - 1.3.6.1.4.1.2011.5.25.31.1.1.1.1.10   # Huawei 运行时长
    - 1.3.6.1.4.1.2011.5.25.31.1.1.1.1.11   # Huawei 温度值
    - 1.3.6.1.4.1.2011.5.25.31.1.1.1.1.12   # Huawei 温度高阈值
    - 1.3.6.1.4.1.2011.5.25.31.1.1.18.1.6   # Huawei 电源状态
    - 1.3.6.1.4.1.2011.5.25.31.1.1.10.1.7   # Huawei 风扇状态
    - 1.3.6.1.4.1.2011.5.25.31.1.1.10.1.8   # Huawei 风扇转速
    - 1.3.6.1.4.1.2011.5.25.31.1.1.18.1.5   # Huawei 电源在位状态
    {{- else if eq .brand "H3C" }}
    - 1.3.6.1.4.1.25506.8.35.9.1.2.1.2   # H3C 电源状态
    - 1.3.6.1.4.1.25506.8.35.9.1.1.1.2   # H3C 风扇状态
    - 1.3.6.1.4.1.25506.2.6.1.1.1.1.6    # H3C CPU 利用率
    - 1.3.6.1.4.1.25506.2.6.1.1.1.1.8    # H3C 内存利用率
    - 1.3.6.1.4.1.25506.2.6.1.1.1.1.12   # H3C 温度值
    {{- else if eq .brand "Gigamon" }}
    - 1.3.6.1.4.1.26866.2.13    # Gigamon CPU 利用率
    - 1.3.6.1.4.1.26866.2.14    # Gigamon 内存利用率
    - 1.3.6.1.4.1.26866.2.16    # Gigamon 电源状态
    - 1.3.6.1.4.1.26866.2.17    # Gigamon 内存使用率
    {{- else if eq .brand "Ruijie" }}
    - 1.3.6.1.4.1.4881.1.1.10.2.1.1.18.1.2   # Ruijie 电源状态
    - 1.3.6.1.4.1.4881.1.1.10.2.1.1.18.1.3   # Ruijie 电源实体名称
    - 1.3.6.1.4.1.4881.1.1.10.2.1.1.21.1.2   # Ruijie 风扇状态
    - 1.3.6.1.4.1.4881.1.1.10.2.1.1.21.1.3   # Ruijie 风扇实体名称
    - 1.3.6.1.4.1.4881.1.1.10.2.1.1.44.1.4   # Ruijie 温度实体名称
    - 1.3.6.1.4.1.4881.1.1.10.2.1.1.44.1.5   # Ruijie 温度值
    - 1.3.6.1.4.1.4881.1.1.10.2.1.1.44.1.6   # Ruijie 温度高阈值
    - 1.3.6.1.4.1.4881.1.1.10.2.35.1.1.1.3   # Ruijie 内存利用率
    - 1.3.6.1.4.1.4881.1.1.10.2.36.1.1.1.0   # Ruijie CPU 利用率
    {{- else if eq .brand "Digital China" }}
    - 1.3.6.1.4.1.6339.100.1.7.1.2    # Digital China 电源状态
    - 1.3.6.1.4.1.6339.100.1.12.1.3   # Digital China 风扇状态
    - 1.3.6.1.4.1.6339.100.1.11.9     # Digital China 温度值
    - 1.3.6.1.4.1.6339.100.1.11.10    # Digital China CPU 利用率
    - 1.3.6.1.4.1.6339.100.1.11.11    # Digital China 内存利用率
    {{- end }}
  get:
  metrics:
    - name: uptime
      oid: 1.3.6.1.2.1.1.3.0        # 系统运行时间 (sysUpTime)
      type: gauge
    {{- if eq .brand "Cisco" }}
    - name: power_status
      oid: 1.3.6.1.4.1.9.9.13.1.5.1.3       # Cisco 电源状态值 (ciscoEnvMonSupplyState)
      type: gauge
      indexes:
        - labelname: power_name
          type: gauge
      lookups:
        - labels: [ power_name ]
          oid: 1.3.6.1.2.1.47.1.1.1.1.7      # 实体名称 (entPhysicalName)
          type: DisplayString
          labelname: power_name
    - name: fan_status
      oid: 1.3.6.1.4.1.9.9.13.1.4.1.3       # Cisco 风扇状态 (ciscoEnvMonFanState)
      type: gauge
      indexes:
        - labelname: fan_name
          type: gauge
      lookups:
        - labels: [ fan_name ]
          oid: 1.3.6.1.2.1.47.1.1.1.1.7      # 实体名称 (entPhysicalName)
          type: DisplayString
          labelname: fan_name
    - name: temperature_status
      oid: 1.3.6.1.4.1.9.9.13.1.3.1.6       # Cisco 温度状态值 (ciscoEnvMonTemperatureState)
      type: gauge
      indexes:
        - labelname: temperature_name
          type: gauge
      lookups:
        - labels: [ temperature_name ]
          oid: 1.3.6.1.2.1.47.1.1.1.1.7      # 实体名称 (entPhysicalName)
          type: DisplayString
          labelname: temperature_name
    - name: cpu_utilization
      oid: 1.3.6.1.4.1.9.9.109.1.1.1.1.8    # Cisco CPU 使用率 (cpmCPUTotal5minRev)
      type: gauge
      indexes:
        - labelname: cpu_name
          type: gauge
      lookups:
        - labels: [ cpu_name ]
          oid: 1.3.6.1.4.1.9.9.109.1.1.1.1.2      # Cisco CPU 名称 (cpmCPUTotalDescr)
          type: DisplayString
          labelname: cpu_name
    - name: memory_used
      oid: 1.3.6.1.4.1.9.9.48.1.1.1.5       # Cisco 已用内存 (ciscoMemoryPoolUsed)
      type: gauge
      indexes:
        - labelname: memory_name
          type: gauge
      lookups:
        - labels: [ memory_name ]
          oid: 1.3.6.1.4.1.9.9.48.1.1.1.2   # Cisco 内存名称 (ciscoMemoryPoolName)
          type: DisplayString
          labelname: memory_name
    - name: memory_free
      oid: 1.3.6.1.4.1.9.9.48.1.1.1.6       # Cisco 空闲内存 (ciscoMemoryPoolFree)
      type: gauge
      indexes:
        - labelname: memory_name
          type: gauge
      lookups:
        - labels: [ memory_name ]
          oid: 1.3.6.1.4.1.9.9.48.1.1.1.2   # Cisco 内存名称 (ciscoMemoryPoolName)
          type: DisplayString
          labelname: memory_name
    - name: temperature_val
      oid: 1.3.6.1.4.1.9.9.13.1.3.1.3       # Cisco 温度值 (ciscoEnvMonTemperatureValue)
      type: gauge
      indexes:
        - labelname: temperature_name
          type: gauge
      lookups:
        - labels: [ temperature_name ]
          oid: 1.3.6.1.2.1.47.1.1.1.1.7      # 实体名称 (entPhysicalName)
          type: DisplayString
          labelname: temperature_name

    {{- else if eq .brand "Huawei" }}
    - name: fan_status
      oid: 1.3.6.1.4.1.2011.5.25.31.1.1.10.1.7        # Huawei 风扇状态
      type: gauge
      indexes:
        - labelname: fan_index
          type: gauge
        - labelname: fan_name
          type: gauge
    - name: power_status
      oid: 1.3.6.1.4.1.2011.5.25.31.1.1.18.1.6        # Huawei 电源状态
      type: gauge
      indexes:
        - labelname: power_index
          type: gauge
        - labelname: power_name
          type: gauge

    - name: power_present
      oid: 1.3.6.1.4.1.2011.5.25.31.1.1.18.1.5       # Huawei 电源在位状态
      type: gauge
      indexes:
        - labelname: power_index
          type: gauge
        - labelname: power_name
          type: gauge

    - name: cpu_utilization
      oid: 1.3.6.1.4.1.2011.5.25.31.1.1.1.1.5       # Huawei CPU利用率 
      type: gauge
      indexes:
        - labelname: cpu_index
          type: gauge
      lookups:
        - labels: [ cpu_index ]
          oid: 1.3.6.1.2.1.47.1.1.1.1.7      
          type: DisplayString
          labelname: cpu_name
    - name: memory_utilization
      oid: 1.3.6.1.4.1.2011.5.25.31.1.1.1.1.7        # Huawei 内存利用率 
      type: gauge
      indexes:
        - labelname: memory_index
          type: gauge
      lookups:
        - labels: [ memory_index ]
          oid: 1.3.6.1.2.1.47.1.1.1.1.7      
          type: DisplayString
          labelname: memory_name
    - name: temperature_val
      oid: 1.3.6.1.4.1.2011.5.25.31.1.1.1.1.11       # Huawei 温度
      type: gauge
      indexes:
        - labelname: temperature_index
          type: gauge
      lookups:
        - labels: [ temperature_index ]
          oid: 1.3.6.1.2.1.47.1.1.1.1.7      
          type: DisplayString
          labelname: temperature_name
    - name: temperature_high_threshold
      oid: 1.3.6.1.4.1.2011.5.25.31.1.1.1.1.12       # Huawei 温度高阈值
      type: gauge
      indexes:
        - labelname: temperature_index
          type: gauge
      lookups:
        - labels: [ temperature_index ]
          oid: 1.3.6.1.2.1.47.1.1.1.1.7      
          type: DisplayString
          labelname: temperature_name

    {{- else if eq .brand "VRP" }}
    - name: entity_desc
      oid: 1.3.6.1.2.1.47.1.1.1.1.5         # 实体索引 (entPhysicalIndex)
      type: gauge
      indexes:
        - labelname: if_index
          type: gauge
      lookups:
        - labels: [ if_index ]
          oid: 1.3.6.1.2.1.47.1.1.1.1.7      # 实体名称 (entPhysicalName)
          type: DisplayString
          labelname: device_name
        - labels: [ if_index ]
          oid: 1.3.6.1.4.1.56813.5.25.31.1.1.1.1.5    # VRP CPU 利用率
          type: gauge
          labelname: cpu_utilization
        - labels: [ if_index ]
          oid: 1.3.6.1.4.1.56813.5.25.31.1.1.1.1.7    # VRP 内存利用率
          type: gauge
          labelname: memory_utilization
        - labels: [ if_index ]
          oid: 1.3.6.1.4.1.56813.5.25.31.1.1.1.1.11   # VRP 温度值
          type: gauge
          labelname: temperature_val
        - labels: [ if_index ]
          oid: 1.3.6.1.4.1.56813.5.25.31.1.1.1.1.12   # VRP 温度高阈值
          type: gauge
          labelname: temperature_high_threshold
    - name: fan_status
      oid: 1.3.6.1.4.1.56813.5.25.31.1.1.10.1.7        # VRP 风扇状态
      type: gauge
      indexes:
        - labelname: fan_index
          type: gauge
        - labelname: fan_name
          type: gauge
    - name: power_status
      oid: 1.3.6.1.4.1.56813.5.25.31.1.1.18.1.6        # VRP 电源状态
      type: gauge
      indexes:
        - labelname: power_index
          type: gauge
        - labelname: power_name
          type: gauge

    {{- else if eq .brand "H3C" }}
    - name: cpu_utilization
      oid: 1.3.6.1.4.1.25506.2.6.1.1.1.1.6       # H3C CPU利用率 
      type: gauge
      indexes:
        - labelname: cpu_index
          type: gauge
      lookups:
        - labels: [ cpu_index ]
          oid: 1.3.6.1.2.1.47.1.1.1.1.7      # 实体名称 (entPhysicalName)
          type: DisplayString
          labelname: cpu_name
    - name: memory_utilization
      oid: 1.3.6.1.4.1.25506.2.6.1.1.1.1.8        # H3C 内存利用率 
      type: gauge
      indexes:
        - labelname: memory_index
          type: gauge
      lookups:
        - labels: [ memory_index ]
          oid: 1.3.6.1.2.1.47.1.1.1.1.7      # 实体名称 (entPhysicalName)
          type: DisplayString
          labelname: memory_name
    - name: temperature_val
      oid: 1.3.6.1.4.1.25506.2.6.1.1.1.1.12       # H3C 温度
      type: gauge
      indexes:
        - labelname: temperature_index
          type: gauge
      lookups:
        - labels: [ temperature_index ]
          oid: 1.3.6.1.2.1.47.1.1.1.1.7      # 实体名称 (entPhysicalName)
          type: DisplayString
          labelname: temperature_name

    - name: fan_status
      oid: 1.3.6.1.4.1.25506.8.35.9.1.1.1.2        # H3C 风扇状态
      type: gauge
      indexes:
        - labelname: fan_name
          type: gauge

    - name: power_status
      oid: 1.3.6.1.4.1.25506.8.35.9.1.2.1.2        # H3C 电源状态
      type: gauge
      indexes:
        - labelname: power_name
          type: gauge

    {{- else if eq .brand "Gigamon" }}
    - name: power_status
      type: gauge
      oid: 1.3.6.1.4.1.26866.2.16    # Gigamon 电源状态
      indexes:
        - labelname: power_name
          type: gauge
      regex_extracts:
        "":
          - regex: '\[(\w+) ?: ?(\w+)\]'
            value: '$2'
    - name: cpu_utilization
      type: gauge
      oid: 1.3.6.1.4.1.26866.2.13    # Gigamon CPU 利用率
      indexes:
        - labelname: cpu_name
          type: gauge
      regex_extracts:
        "":
          - regex: 'cpu load:(\d+\.\d+)%'
            value: '$1'
    - name: memory_utilization
      type: gauge
      oid: 1.3.6.1.4.1.26866.2.17    # Gigamon 内存使用率
      indexes:
        - labelname: mem_name
          type: gauge
      regex_extracts:
        "":
          - regex: 'memory load:(\d+\.\d+)%'
            value: '$1'
    {{- else if eq .brand "Ruijie" }}
    - name: power_status
      oid: 1.3.6.1.4.1.4881.1.1.10.2.1.1.18.1.2       # Ruijie 电源状态
      type: gauge
      indexes:
        - labelname: power_name
          type: gauge
      lookups:
        - labels: [ power_name ]
          oid: 1.3.6.1.4.1.4881.1.1.10.2.1.1.18.1.3      # 实体名称 (entPhysicalName)
          type: DisplayString
          labelname: power_name
    - name: fan_status
      oid: 1.3.6.1.4.1.4881.1.1.10.2.1.1.21.1.2       # Ruijie 风扇状态
      type: gauge
      indexes:
        - labelname: fan_name
          type: gauge
      lookups:
        - labels: [ fan_name ]
          oid: 1.3.6.1.4.1.4881.1.1.10.2.1.1.21.1.3      # 实体名称 (entPhysicalName)
          type: DisplayString
          labelname: fan_name
    - name: temperature_val
      oid: 1.3.6.1.4.1.4881.1.1.10.2.1.1.44.1.5  # 温度值OID
      type: gauge
      indexes:
        - labelname: device_id
          type: gauge
        - labelname: reserved
          type: gauge
        - labelname: sensor_id
          type: gauge
      lookups:
        - labels: [device_id, reserved, sensor_id]
          oid: 1.3.6.1.4.1.4881.1.1.10.2.1.1.44.1.4  # 温度传感器名称OID
          type: DisplayString
          labelname: temperature_name
    - name: temperature_high_threshold
      oid: 1.3.6.1.4.1.4881.1.1.10.2.1.1.44.1.6  # 温度高阈值OID
      type: gauge
      indexes:
        - labelname: device_id
          type: gauge
        - labelname: reserved
          type: gauge
        - labelname: sensor_id
          type: gauge
      lookups:
        - labels: [device_id, reserved, sensor_id]
          oid: 1.3.6.1.4.1.4881.1.1.10.2.1.1.44.1.4  # 温度传感器名称OID
          type: DisplayString
          labelname: temperature_name
    - name: memory_utilization
      oid: 1.3.6.1.4.1.4881.1.1.10.2.35.1.1.1.3       # Ruijie 内存利用率
      type: gauge
      indexes:
        - labelname: memory_name
          type: gauge
    - name: cpu_utilization
      oid: 1.3.6.1.4.1.4881.1.1.10.2.36.1.1.1.0       # Ruijie CPU 利用率
      type: gauge
      indexes:
        - labelname: cpu_name
          type: gauge
    {{- else if eq .brand "Digital China" }}
    - name: power_status
      type: gauge
      oid: 1.3.6.1.4.1.6339.100.1.7.1.2    # Digital China 电源状态
      indexes:
        - labelname: power_name
          type: gauge
    - name: fan_status
      type: gauge
      oid: 1.3.6.1.4.1.6339.100.1.12.1.3    # Digital China 风扇状态
      indexes:
        - labelname: fan_name
          type: gauge
    - name: temperature_val
      type: gauge
      oid: 1.3.6.1.4.1.6339.100.1.11.9    # Digital China 温度值
      indexes:
        - labelname: temperature_name
          type: gauge
    - name: cpu_utilization
      type: gauge
      oid: 1.3.6.1.4.1.6339.100.1.11.10    # Digital China CPU 利用率
      indexes:
        - labelname: cpu_name
          type: gauge
    - name: memory_utilization
      type: gauge
      oid: 1.3.6.1.4.1.6339.100.1.11.11    # Digital China 内存利用率
      indexes:
        - labelname: memory_name
          type: gauge
    {{- end }}
    - name: device_ifspeed
      type: gauge
      oid: 1.3.6.1.2.1.31.1.1.1.15        # 接口速度 (ifSpeed)
      indexes:
        - labelname: if_index
          type: gauge
      lookups:
        - labels: [ if_index ]
          oid: 1.3.6.1.2.1.31.1.1.1.1  # 接口名称 (ifName)
          type: DisplayString
          labelname: device_ifname
    - name: device_ifadminstatus
      type: gauge
      oid: 1.3.6.1.2.1.2.2.1.7        # 接口管理状态 (ifAdminStatus)
      indexes:
        - labelname: if_index
          type: gauge
      lookups:
        - labels: [ if_index ]
