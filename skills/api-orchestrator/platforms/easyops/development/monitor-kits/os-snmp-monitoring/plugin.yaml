type: simple-script
name: 操作系统SNMP监控
version: "0.1.10"
command:
    collect:
        interpreter: ""
        scriptPath:
            - src
            - os_snmp_monitor.py
        type: python
        user: ""
params:
    - ip
    - snmpPort
    - snmpVersion
    - community
    - securityLevel
    - securityName
    - authProtocol
    - authKey
    - privProtocol
    - privKey
    - contextName
paramDefine:
    - {name: ip, valueType: string, defaultValue: $.ip, display: true, displayName: "操作系统IP", description: "取HOST模型的ip属性，不是BMC管理口IP", use: collectParams, optional: false, isFromSecret: false, isEncrypt: false, extraArgs: null}
    - {name: snmpPort, valueType: int, defaultValue: $.snmp_conf.snmpPort, display: true, displayName: "SNMP端口", description: "取HOST.snmp_conf.snmpPort，默认161", use: collectParams, optional: true, isFromSecret: false, isEncrypt: false, extraArgs: null}
    - {name: snmpVersion, valueType: string, defaultValue: $.snmp_conf.snmpVersion, display: true, displayName: "SNMP版本", description: "取HOST.snmp_conf.snmpVersion：1/2c/3", use: collectParams, optional: false, isFromSecret: false, isEncrypt: false, extraArgs: null}
    - {name: community, valueType: cmdb, defaultValue: $.snmp_conf.community, display: true, displayName: "SNMP团体名", description: "取HOST.snmp_conf.community，v1/v2c只读团体名", use: collectParams, optional: true, isFromSecret: false, isEncrypt: false, extraArgs: null}
    - {name: securityLevel, valueType: string, defaultValue: $.snmp_conf.securityLevel, display: true, displayName: "SNMPv3安全级别", description: "取HOST.snmp_conf.securityLevel：noAuthNoPriv/authNoPriv/authPriv", use: collectParams, optional: true, isFromSecret: false, isEncrypt: false, extraArgs: null}
    - {name: securityName, valueType: string, defaultValue: $.snmp_conf.securityName, display: true, displayName: "SNMPv3安全名", description: "取HOST.snmp_conf.securityName", use: collectParams, optional: true, isFromSecret: false, isEncrypt: false, extraArgs: null}
    - {name: authProtocol, valueType: string, defaultValue: $.snmp_conf.authProtocol, display: true, displayName: "SNMPv3认证协议", description: "取HOST.snmp_conf.authProtocol：MD5/SHA等", use: collectParams, optional: true, isFromSecret: false, isEncrypt: false, extraArgs: null}
    - {name: authKey, valueType: cmdb, defaultValue: $.snmp_conf.authKey, display: true, displayName: "SNMPv3认证密钥", description: "取HOST.snmp_conf.authKey", use: collectParams, optional: true, isFromSecret: false, isEncrypt: false, extraArgs: null}
    - {name: privProtocol, valueType: string, defaultValue: $.snmp_conf.privProtocol, display: true, displayName: "SNMPv3加密协议", description: "取HOST.snmp_conf.privProtocol：DES/AES", use: collectParams, optional: true, isFromSecret: false, isEncrypt: false, extraArgs: null}
    - {name: privKey, valueType: cmdb, defaultValue: $.snmp_conf.privKey, display: true, displayName: "SNMPv3加密密钥", description: "取HOST.snmp_conf.privKey", use: collectParams, optional: true, isFromSecret: false, isEncrypt: false, extraArgs: null}
    - {name: contextName, valueType: string, defaultValue: $.snmp_conf.contextName, display: true, displayName: "SNMPv3上下文", description: "取HOST.snmp_conf.contextName", use: collectParams, optional: true, isFromSecret: false, isEncrypt: false, extraArgs: null}
agentType: easyops
category: 操作系统.带内监控
scriptType: python
interpreter: ""
memo: "通过操作系统IP上的标准SNMP Agent采集Linux和Windows带内指标，不包含BMC硬件管理口指标"
icon: null
relateObjectId: HOST
