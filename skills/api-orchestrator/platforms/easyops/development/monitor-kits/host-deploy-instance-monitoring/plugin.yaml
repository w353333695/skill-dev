type: simple-script
name: 主机部署实例监控
version: "0.1.15"
command:
    collect:
        interpreter: ""
        scriptPath:
            - src
            - host_deploy_instance_monitor.py
        type: python
        user: ""
params:
    - instanceId
    - hostUuid
    - hostIp
    - cacheDir
    - cacheTtlDays
    - openapiScheme
    - openapiAkText
    - openapiSkText
    - sampleInterval
    - requestTimeout
    - logLevel
paramDefine:
    - {name: instanceId, valueType: string, defaultValue: $.instanceId, display: false, displayName: "主机实例ID", description: "取HOST模型instanceId，用于缓存文件隔离；必填", use: collectParams, optional: false, isFromSecret: false, isEncrypt: false, extraArgs: null}
    - {name: hostUuid, valueType: string, defaultValue: $._uuid, display: false, displayName: "主机UUID", description: "取HOST._uuid，OpenAPI优先用它匹配部署实例uuid；缺失时使用主机IP", use: collectParams, optional: true, isFromSecret: false, isEncrypt: false, extraArgs: null}
    - {name: hostIp, valueType: string, defaultValue: $.ip, display: false, displayName: "主机IP", description: "取HOST.ip，hostUuid缺失时匹配部署实例ip", use: collectParams, optional: true, isFromSecret: false, isEncrypt: false, extraArgs: null}
    - {name: cacheDir, valueType: string, defaultValue: /tmp/easyops/deploy-instance-monitor, display: true, displayName: "缓存目录", description: "执行主机本地缓存目录；Linux默认/tmp/easyops/deploy-instance-monitor，Windows自动映射到SystemRoot\\Temp\\easyops\\deploy-instance-monitor", use: collectParams, optional: true, isFromSecret: false, isEncrypt: false, extraArgs: null}
    - {name: cacheTtlDays, valueType: int, defaultValue: "7", display: true, displayName: "缓存有效期(天)", description: "缓存超过该天数后重新调用OpenAPI search，默认7天，范围1-90", use: collectParams, optional: true, isFromSecret: false, isEncrypt: false, extraArgs: null}
    - {name: openapiScheme, valueType: string, defaultValue: https, display: true, displayName: "OpenAPI协议", description: "agent配置发现网关IP后使用的协议，支持http或https，默认https", use: collectParams, optional: true, isFromSecret: false, isEncrypt: false, extraArgs: null}
    - {name: openapiGateway, valueType: string, defaultValue: "", display: false, displayName: "OpenAPI网关地址", description: "兼容兜底完整地址；默认读取agent conf.yaml的command服务IP并按openapiScheme拼接，也可用EASYOPS_OPENAPI_GATEWAY_URL", use: collectParams, optional: true, isFromSecret: false, isEncrypt: false, extraArgs: null}
    - {name: openapiAkText, valueType: string, defaultValue: "", display: true, displayName: "OpenAPI AK", description: "普通字符串任务参数或EASYOPS_OPENAPI_AK；不启用Secret引用和加密，不写日志", use: collectParams, optional: false, isFromSecret: false, isEncrypt: false, extraArgs: null}
    - {name: openapiSkText, valueType: string, defaultValue: "", display: true, displayName: "OpenAPI SK", description: "普通字符串任务参数或EASYOPS_OPENAPI_SK；不启用Secret引用和加密，不写日志", use: collectParams, optional: false, isFromSecret: false, isEncrypt: false, extraArgs: null}
    - {name: sampleInterval, valueType: string, defaultValue: "0.2", display: true, displayName: "CPU采样间隔(秒)", description: "两次/proc进程CPU计数间隔，默认0.2秒，范围0.05-2", use: collectParams, optional: true, isFromSecret: false, isEncrypt: false, extraArgs: null}
    - {name: requestTimeout, valueType: int, defaultValue: "10", display: true, displayName: "OpenAPI超时(秒)", description: "OpenAPI请求超时，默认10秒，范围3-30", use: collectParams, optional: true, isFromSecret: false, isEncrypt: false, extraArgs: null}
    - {name: logLevel, valueType: string, defaultValue: ERROR, display: true, displayName: "日志级别", description: "默认ERROR；DEBUG输出结构化采集诊断到缓存目录<hostInstanceId>.debug.log，不污染stdout/stderr，不输出AK/SK或完整命令行", use: collectParams, optional: true, isFromSecret: false, isEncrypt: false, extraArgs: null}
agentType: easyops
category: 基础设施.计算资源
scriptType: python
interpreter: ""
samplerType: metric_sampler
memo: "按HOST本地缓存/OpenAPI刷新ARTIFACT_INST@ONEMODEL中是否监控=是的部署实例，采集进程、端口、CPU、内存和句柄指标。"
icon: null
relateObjectId: HOST
