# =============================================================================
# vCenter监控 plugin.yaml
# 关联模型：CLOUD_PROVIDER@ONEMODEL（云平台，基础设施.云资源，2026-11-19 实查存在）
# 地址默认动态参数 $.url（模型已有 url 属性）；密码加密手填。
# 🔴密码加密口径（0.1.3，对齐线上实证 DM监控套件 instanceId=65dc3d3488b19）：
#   password = string + isFromSecret:true + isEncrypt:true（前端加密输入、密文存储、
#   下发链路 decrypt 合法）【必须配套隐藏 secretName 参数】——缺 secretName 时
#   Secret 解密链路异常，手填值报 illegal base64 data（0.1.1/0.1.2 无 secretName 实测）。
#   0.1.2 的 passwordText 明文形态（两标志 false）为降级备选，已废弃。
# 采集脚本 py2.7（agent 内置 pyVim/pyVmomi），输出 metric_sampler 纯 JSON 数组。
# =============================================================================
type: simple-script
name: vCenter监控
version: 0.1.4
agentType: easyops
samplerType: metric_sampler
relateObjectId: CLOUD_PROVIDER@ONEMODEL
scriptType: python
category: 基础设施.云资源
protected: false
memo: 通过vCenter SDK（pyVmomi）动态枚举数据中心、集群、数据存储、宿主机和虚拟机，采集平台可用性、集群状态与容量、数据存储空间与IO延迟、宿主机连接/电源/资源使用率、虚拟机电源/资源/存储/Tools状态关键指标。地址默认取云平台实例url属性；密码加密手填（对齐DM监控套件形态，配套隐藏secretName参数），全程不落日志。logLevel=DEBUG时诊断日志经COLLECT_ERROR:协议直达前端任务输出。采集周期建议不小于300秒。
noPackage: false
command:
  collect:
    interpreter: ""
    scriptPath: ["src", "vcenter_monitor.py"]
    type: python
    user: ""
paramDefine:
  - {name: address, valueType: string, defaultValue: "$.url", display: true, displayName: "vCenter地址", description: "默认取云平台实例url属性；支持 https://host/sdk、host、host:port 写法，https缺省端口443；创建任务时可替换为任意属性路径或手填", use: collectParams, optional: false, isFromSecret: false, isEncrypt: false, extraArgs: null}
  - {name: username, valueType: string, defaultValue: "", display: true, displayName: "用户名", description: "vCenter账号，手填；建议使用只读权限专用账号", use: collectParams, optional: false, isFromSecret: false, isEncrypt: false, extraArgs: null}
  - {name: password, valueType: string, defaultValue: "", display: true, displayName: "密码", description: "vCenter密码，加密手填（isFromSecret/isEncrypt=true，须配套secretName参数）；全程不写日志", use: collectParams, optional: false, isFromSecret: true, isEncrypt: true, extraArgs: null}
  - {name: secretName, valueType: string, defaultValue: "", display: false, displayName: "密钥实例名称", description: "密码Secret链路配套参数（display=false前端隐藏）；缺失会导致解密链路报illegal base64 data", use: collectorParams, optional: true, isFromSecret: false, isEncrypt: false, extraArgs: null}
  - {name: timeout, valueType: int, defaultValue: "60", display: true, displayName: "采集超时(秒)", description: "连接与采集总超时，默认60秒，范围10-300；大环境建议300且采集周期不小于600秒", use: collectParams, optional: true, isFromSecret: false, isEncrypt: false, extraArgs: null}
  - {name: logLevel, valueType: string, defaultValue: "ERROR", display: true, displayName: "日志级别", description: "默认ERROR零输出；DEBUG把结构化诊断按COLLECT_ERROR:协议整体输出到stdout（前端任务输出直接复制，无需登执行主机），指标JSON保留在METRICS:之后，不含密码", use: collectParams, optional: true, isFromSecret: false, isEncrypt: false, extraArgs: null}
params: [address, username, password, secretName, timeout, logLevel]
