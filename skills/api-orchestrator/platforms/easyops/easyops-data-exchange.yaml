# =============================================================================
# EasyOps 数据交换服务（data_exchange）—— api-cli 清单
# -----------------------------------------------------------------------------
# 定位（data_exchange/README:1）：为前端各种 dashboard 的展示和统计，提供符合
# 数据交换标准的数据。dashboard context 数据源的执行后端：
#   cmdb-olap     → /api/v1/data_exchange/olap（前端 getUrlOfProvider.yaml:43 铁证）
#   cmdb-columndb → /api/v1/data_exchange/tsdb_column/aggregate（:45）
#
# 源码：07-source-repos/data_exchange/（Go monorepo）
#   路由全表 olap/route.go:7-14 / database_proxy/route.go:7-21
#   查询 DSL internal/types/types.go:83-92 + 算子 internal/types/operators.go:13-27,84-98
#   v3 series 分组 olap/olap_service.go:305-410；select_raw_data olap_service.go:95-153
#
# ⚠️指标元数据【不在本服务】——data_exchange 不存储指标定义（tags-list 是空实现桩
#   olap/olap_service.go:91-93）。「有哪些指标可用」查 collector_service
#   collector_metric（easyops-collector-service.yaml）；本服务只做数据查询/试查。
#
# 鉴权：org 由 gin 中间件解析（main_start.go:127 orguser.Middleware）→ db 名即 org 号
# （store/store_service.go:51-52）+ SQL 层自动 org==%d 过滤（pkg/sqlclient/parse.go:168-171）。
# 直连时 org/user 走 endpoint.headers 注入（与 cmdb/collector 同平台惯例）。
# 端口：直连 :8152（cmd/data_exchange/conf/conf.default.yaml:6 默认端口；e2e 实测 2026-08-14
#   .90 :8152 直 200，org+user+Host 三件 header 免 cookie/contract）。
#   网关面 /next/api/gateway/logic.data_exchange/* 需有效会话 cookie（实测过期 cookie 报
#   ERR_UNAUTHENTICATED 获取会话信息失败——编排统一走 :8152 直连）。
# =============================================================================
spec: api-cli/v1
service:
  name: easyops-data-exchange
  version: "1.0"
  default_endpoint: backend
  endpoints:
    backend:
      base_url: ${EASYOPS_DATA_EXCHANGE_BACKEND_URL}   # 指 http://172.30.0.90:8152（e2e 实测 2026-08-14）
      host: admin.easyops.local                        # IP 直连，Host 由 endpoint.Host 注入
      path_prefix: ""
      auth: none                                       # 直连 auth=none，org/user 由 headers 注入（同 cmdb 惯例）
      headers:
        org: ${EASYOPS_ORG}
        user: ${EASYOPS_USER}

# -----------------------------------------------------------------------------
# 资源 1：olap_metric —— 监控指标聚合查询（cmdb-olap 数据源的执行端点）。
# DSL：model="datasource.table"（前端写 easyops.<objectId>，olap_service.go:955-961
# SplitN(model,".",2) 解析）；dims/measures/filters 三件套。
# -----------------------------------------------------------------------------
resources:
  olap_metric:
    description: 监控指标 OLAP 聚合查询（dashboard cmdb-olap 数据源的执行端点，前端 provider easyops.api.data_exchange.olap@Query:1.0.0）。v1/v2 返回平铺行、v3 按 series 分组（olap_service.go:305-410：List[]{name,dims,values[]{value,time}}）。⚠️前端 dashboard 的 cmdb-olap 实际走 v1（getUrlOfProvider.yaml:43）——配盘内图表/统计卡须按 v1 平铺结构取值（坑见 platforms formats/dashboard-kit/）；v3 适合编排侧 API 消费（series 分组好解析），但试查结果与 v1 可能有差异（实测 v3 某指标 30d total=0 而 v1 now-1h 有数据），存疑时 v1 复核。
    path: ""

    operations:
      # ---------- v3 查询（POST /api/v3/data_exchange/olap）—— 编排侧 API 消费合用 ----------
      query_v3:
        description: OLAP 聚合查询 v3（按 series 分组，API 消费好解析）。⚠️前端 dashboard 配盘内组件用 v1 平铺结构（见 resource description）。请求字段全集（v3 最全）：model/dims/measures/filters/query/having/order/limitBy/limit{limit,offset}/epoch(s|ms)/minimumStep/withEmptyData/withoutObjectId/fillEmptyData/countTotal/translate/cmdbGroupDims/displayName/withShowKey/fieldsRelationFilter。聚合算子（operators.go:13-27）：count/min/max/sum/avg/topK/last/divide/increase/rate/irate/quantile。过滤算子（:84-98）：== != <= < >= > =~ !~ in has nin and like nlike exists；时间过滤 name=time，value 支持 now-30m 相对时间（pkg/sqlclient/parse.go:98-103）。试查「指标是否有数据」：dims=["time"] + filters=[{name:time,operator:>=,value:now-1h}] + limit={limit:1} + withEmptyData:false，看 list 是否空（存疑时 v1 复核）。
        method: POST
        path: /api/v3/data_exchange/olap
        body:
          type: object
          required: [model, dims, measures]
          description: "OLAP 查询 DSL（v3）"
          properties:
            model:     { type: string, description: "数据源.表（前端 cmdb-olap 写 easyops.<objectId>，如 easyops.HOST）。SplitN 两段解析（olap_service.go:955-961）" }
            dims:      { type: array, items: { type: string }, description: "分组维度；time=时间维度（自动粒度）。🔴前端真实写法是 time(auto)（现有盘 args 实测），API 直调 time 亦可" }
            measures:
              type: array
              description: "聚合指标列表"
              items:
                type: object
                properties:
                  name:     { type: string, description: "输出列名（如 CPU使用率）" }
                  function:
                    type: object
                    properties:
                      expression: { type: string, description: "🔴聚合算子（JSON 字段名是 expression，非 Go struct 的 Operator——e2e 实测 2026-08-14 传 operator 报 not valid measure operator）：count/min/max/sum/avg/topK/last/divide/increase/rate/irate/quantile（operators.go:13-27）" }
                      args:     { type: array, items: { type: string }, description: "指标名（collector_metric.list 查证，snake_case）" }
            filters:
              type: array
              description: "过滤条件（自动追加时间范围由前端拼，API 直调须自带）"
              items:
                type: object
                properties:
                  name:     { type: string, description: "维度名；time=时间" }
                  operator: { type: string, description: "== != <= < >= > =~ !~ in has nin and like nlike exists" }
                  value:    { description: "值；time 支持 now-1h 相对时间" }
            query:      { type: object, additional_properties: true, description: "实例过滤（CMDB 风格 query，限定查哪些实例）" }
            having:     { type: array, description: "聚合后过滤" }
            order:      { type: array, description: "排序" }
            limit:      { type: object, properties: { limit: { type: integer }, offset: { type: integer } }, description: "分页（试查用 limit:1）" }
            epoch:      { type: string, enum: [s, ms], description: "时间戳单位，默认 s" }
            withEmptyData: { type: boolean, description: "false=跳过全空序列（试查用）" }
            fillEmptyData: { type: boolean, description: "空数据点补齐（趋势图平滑）" }
            displayName:   { type: boolean, description: "true=响应带 displayNameList 指标元数据（olap_service.go:530-542）——次级指标元数据线索" }
        response:
          type: object
          description: "v3 wrapper：{ code, data: { total, list[]{name,dims,values[]{value,time}}, from, to, step, displayNameList } }"
          properties:
            code: { type: integer }
            data:
              type: object
              properties:
                total: { type: integer }
                list:
                  type: array
                  description: "series 列表（每系列一条）"
                  items:
                    type: object
                    properties:
                      name:   { type: string, description: "series 名（metricName_dims）" }
                      dims:   { type: object, additional_properties: true, description: "系列维度值" }
                      values:
                        type: array
                        description: "数据点"
                        items:
                          type: object
                          properties:
                            value: { type: number }
                            time:  { type: integer, description: "秒级时间戳（epoch 可切 ms）" }
                displayNameList: { type: array, description: "指标显示名元数据（displayName:true 时）", items: { type: object, additional_properties: true } }

      # ---------- 原始点试查（POST /api/v1/data_exchange/select_raw_data）----------
      select_raw:
        description: 原始时序点直查（分页，olap_service.go:95-153）——「某指标最近有没有数据点」的权威试查端点。page_size 给小值（如 5）+ 最近时间窗（start_time=now-1h）即可验证指标活性，不聚合。
        method: POST
        path: /api/v1/data_exchange/select_raw_data
        body:
          type: object
          required: [database, object_ids, metric, instance_ids, fields, start_time, end_time, page, page_size]
          description: "原始数据查询（validator 树 request_validate_trees.go:31）"
          properties:
            database:     { type: string, description: "库（=org 号字符串，通常由调用方拼；直调传 org 值）" }
            object_ids:   { type: array, items: { type: string }, description: "模型 ID 列表（如 [HOST]）" }
            metric:       { type: string, description: "指标名（collector_metric 查证）" }
            instance_ids: { type: array, items: { type: string }, description: "实例 ID 列表（13 位）" }
            fields:       { type: array, items: { type: string }, description: "返回字段" }
            start_time:   { type: integer, description: "起始秒级时间戳" }
            end_time:     { type: integer, description: "结束秒级时间戳" }
            page:         { type: integer, description: "页码 ≥1" }
            page_size:    { type: integer, description: "每页（试查给 5）" }
        response:
          type: object
          description: "wrapper：{ code, data: { list, total } }——list 空=该指标该时间窗无数据"
          properties:
            code: { type: integer }
            data: { type: object, additional_properties: true }

  # -----------------------------------------------------------------------------
  # 资源 2：column_history —— 历史数据统计（cmdb-columndb 数据源的执行端点）。
  # dashboard「历史数据统计」类数据源走 tsdb_column/aggregate（database_proxy 模块，
  # database_proxy_service.go:59-109）。表=18 个 @EASYOPS 历史库（前端
  # TplColumndbDataSourceForm.yaml:5-41 全清单）。
  # -----------------------------------------------------------------------------
  column_history:
    description: 历史数据统计聚合（dashboard cmdb-columndb 数据源执行端点）。覆盖告警/CMDB变更/工具/流水线/定时/Agent/巡检/CI/ITSM 等 18 张历史表（monitor_event@EASYOPS、cmdb_change_history@EASYOPS、tool_oplog@EASYOPS、pipeline_build@EASYOPS、itsm_ticket@EASYOPS 等，全清单见 formats/dashboard-kit/providers-context.yaml#context_types.cmdb_columndb.tables）。
    path: ""

    operations:
      aggregate:
        description: 列存储库聚合查询（database_proxy/route.go:7-21）。请求结构对齐前端 cmdb-columndb args（getTransformYaml.yaml:88-103）：database=org 号、filter=JSON 字符串、group_by/measures（field+op(count|sum|max|min)+alias）、start_time/end_time 秒级时间戳。
        method: POST
        path: /api/v1/data_exchange/tsdb_column/aggregate
        body:
          type: object
          required: [database, object_ids, start_time, end_time]
          description: "列存聚合请求（前端 args 结构）"
          properties:
            database:    { type: string, description: "库（org 号字符串）" }
            filter:      { type: object, additional_properties: true, description: "过滤条件（🔴API 直调传对象；args YAML 里的 JSON 字符串是前端序列化格式——直调传字符串报 json 解析失败，e2e 实测 2026-08-14。默认 {}）" }
            group_by:    { type: array, items: { type: string }, description: "分组字段（支持按天/小时分组模板）" }
            measures:
              type: array
              description: "聚合字段"
              items:
                type: object
                properties:
                  field: { type: string, description: "字段名" }
                  op:    { type: string, enum: [count, sum, max, min], description: "聚合方法（TplColumndbDataSourceForm.yaml:93-104）" }
                  alias: { type: string, description: "输出别名" }
            object_ids:  { type: array, items: { type: string }, description: "历史表（18 个 @EASYOPS 库之一，如 monitor_event@EASYOPS）" }
            start_time:  { type: integer, description: "起始秒级时间戳（前端 followTimeRange 时由 QUERY.from 注入）" }
            end_time:    { type: integer, description: "结束秒级时间戳" }
        response:
          type: object
          description: "wrapper：{ code, data: { data: [...] } }（前端 transform 取 DATA?.data）"
          properties:
            code: { type: integer }
            data: { type: object, additional_properties: true }

# -----------------------------------------------------------------------------
# 资源 3：tsdb_column CRUD —— 列存表直操作（读/写/删；2026-09-23 .26 告警工具实测接入）。
# 与 column_history（聚合统计）同源 database_proxy/route.go:10-20，但这是行级 CRUD 视角。
# 常驻表：monitor_event@EASYOPS（全量历史告警，按月 partition）、monitor_event_last@EASYOPS
# （当前告警热视图——恢复后行被移走）、monitor_group_event@EASYOPS（聚合告警）等 @EASYOPS 表。
# 🔴通用契约：
#   · database=org 号字符串；object_id(s)=表名（含 @EASYOPS 后缀）。
#   · 🔴时间双轨：请求 start_time/end_time 是【毫秒】；表内 time 字段毫秒、
#     startTime/notifyTime/processTime/insertTime 是【Int32 秒】（塞毫秒溢出报 300313
#     "has overflowed for the type Int32"）。
#   · filter：精确值 + {$gte/$lte/$in} 操作符（对象直传）。
#   · 响应双层 wrapper {code, data: {code, total/count, data}}——取数剥两层。
#   · 必填列（写 monitor_event* 时）：batchId/alertId/eventId（缺报 missing column）。
# -----------------------------------------------------------------------------
  tsdb_column:
    description: 列存表行级 CRUD（database_proxy tsdb_column/* 端点族）。检索/计数/按filter更新/按_row_id更新/upsert/物理删除——告警事件表直操作的主通道（2026-09-23 .26 告警处理工具 v1-v6 全链实测）。
    path: ""

    operations:
      # ---------- 检索（POST search-with-skip）—— 行级查询主端点 ----------
      search:
        description: 行级检索（分页）。🔴分页参数是 skip/limit（传 page/page_size 不报错但静默失效，实测每页恒返 30）；字段列表 filed/fields 双名都认；sorts=[{field,descending}]；without_total 翻页优化。filter 支持精确+{$gte/$lte/$in}。响应 {code,data:{total,data[]}}。
        method: POST
        path: /api/v1/data_exchange/tsdb_column/search-with-skip
        body:
          type: object
          required: [database, object_ids, start_time, end_time]
          properties:
            database:    { type: string, description: "库（org 号）" }
            object_ids:  { type: array, items: { type: string }, description: "表名列表" }
            start_time:  { type: integer, description: "毫秒（0 起）" }
            end_time:    { type: integer, description: "毫秒（上限 9007199254740991）" }
            filter:      { type: object, additional_properties: true, description: "过滤（精确值或 $gte/$lte/$in 操作符对象）" }
            fields:      { type: array, items: { type: string }, description: "返回字段（['*'] 全量；别名 filed 亦认）" }
            skip:        { type: integer, description: "偏移（🔴不是 page）" }
            limit:       { type: integer, description: "页大小（🔴不是 page_size）" }
            sorts:       { type: array, description: "[{field,descending}]" }
            without_total: { type: boolean, description: "翻页时免 total 优化" }

      # ---------- 计数（POST count）----------
      count:
        description: 行计数（同 filter/time 契约）。响应 data.count。
        method: POST
        path: /api/v1/data_exchange/tsdb_column/count
        body:
          type: object
          required: [database, object_ids, start_time, end_time]
          properties:
            database:   { type: string }
            object_ids: { type: array, items: { type: string } }
            start_time: { type: integer, description: "毫秒" }
            end_time:   { type: integer, description: "毫秒" }
            filter:     { type: object, additional_properties: true }

      # ---------- upsert（PUT upsert_by_search_keys）—— 可靠写入主路径 ----------
      upsert:
        description: 按搜索键 upsert（🔴写主路径；tsdb_column/insert 只进 tmp 表有 flush 延迟不可立查——实测 insert 返回行但 search 查不到）。search_keys 匹配（如 ['eventId']）命中则更新否则插入。响应 {insert_count, update_count, rids[]}。写 monitor_event* 必填 batchId/alertId/eventId + 时间双轨（time 毫秒、startTime 等秒）。
        method: PUT
        path: /api/v1/data_exchange/tsdb_column/upsert_by_search_keys
        body:
          type: object
          required: [database, object_id, search_keys, start_time, end_time, data]
          properties:
            database:    { type: string }
            object_id:   { type: string, description: "单表（非复数）" }
            search_keys: { type: array, items: { type: string }, description: "匹配键字段名" }
            start_time:  { type: integer, description: "毫秒（0）" }
            end_time:    { type: integer, description: "毫秒（9007199254740991）" }
            data:        { type: array, items: { type: object }, description: "行列表（必填列+时间双轨）" }

      # ---------- 按 filter 更新（PUT update_by_filter）----------
      update_by_filter:
        description: 按 filter 批量更新。响应 data.update_count。
        method: PUT
        path: /api/v1/data_exchange/tsdb_column/update_by_filter
        body:
          type: object
          required: [database, object_id, filter, update_data]
          properties:
            database:    { type: string }
            object_id:   { type: string }
            filter:      { type: object, additional_properties: true }
            update_data: { type: object, additional_properties: true, description: "要改的字段值" }

      # ---------- 按 _row_id 更新（PUT update_by_id_v2）----------
      update_by_ids:
        description: 按行 id 精确更新。data 每行必须带 _row_id（源码注释铁证 column_instance.pb.go:1733）+ 要改字段。响应 {update_count, update_fail_count}。
        method: PUT
        path: /api/v1/data_exchange/tsdb_column/update_by_id_v2
        body:
          type: object
          required: [database, object_id, data]
          properties:
            database: { type: string }
            object_id: { type: string }
            data:      { type: array, items: { type: object }, description: "[{...,_row_id}]" }

      # ---------- 删除（POST delete_by_filter）—— 物理删 ----------
      delete:
        description: 按 filter 物理删除（不可恢复；无按 id 删除端点）。空匹配返回 delete_count=0（可安全探针）。响应 data.delete_count。
        method: POST
        path: /api/v1/data_exchange/tsdb_column/delete_by_filter
        body:
          type: object
          required: [database, object_id, filter]
          properties:
            database:  { type: string }
            object_id: { type: string, description: "单表（非复数）" }
            filter:    { type: object, additional_properties: true }

      # ---------- 插入（POST insert）—— ⚠️只进 tmp 表，避免用 ----------
      insert:
        description: 批量插入。⚠️实测只写 tmp 表（tmp_table_config.enabled=true，flush 延迟）插入返回成功但 search-with-skip 立查不到——可靠写入走 upsert。record 是 {object_id, data} 嵌套结构（非平铺行）。
        method: POST
        path: /api/v1/data_exchange/tsdb_column/insert
        body:
          type: object
          required: [database, record]
          properties:
            database: { type: string }
            record:   { type: array, items: { type: object }, description: "[{object_id, data:{...}}]（嵌套非平铺）" }
