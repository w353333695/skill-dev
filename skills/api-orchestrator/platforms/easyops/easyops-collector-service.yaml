# =============================================================================
# EasyOps 采集服务契约—— api-cli 集中清单
# -----------------------------------------------------------------------------
# 真调环境（172.30.0.90）与源码核对结果：collector_service:8125 注册
# collector_job CRUD、job_status/get、collector_metric；源码未注册
# /api/v1/collector/kit/activate 或 /api/v1/collector/kit/info/list。
# 原有 kit 资料已移除，避免编排调用现网不存在的接口。
#
# 接入面：
#   • backend —— :12000（HTTP，giraffe-contract-name header 路由）。
#
# 鉴权：与 collector_plugin_service 同 EasyOps 平台。org+user header；cookie 非必需。
#
# collector_job/job_status 使用 legacy 端点，实测无需 giraffe-contract-name；
# backend(:12000) 仅保留作兼容配置，不宣称存在 kit 路由。
# =============================================================================
spec: api-cli/v1
service:
  name: easyops-collector-service
  version: "1.0"
  default_endpoint: backend
  endpoints:
    backend:
      base_url: ${EASYOPS_COLLECTOR_SERVICE_BACKEND_URL}   # 值在 env.d/collector.env，指 http://172.30.0.90:12000（实测 kit 端点在 12000 非 8125）
      host: admin.easyops.local                              # IP 直连，Host 由 endpoint.Host 注入
      path_prefix: ""
      auth: none                                              # 直连 auth=none，org/user 由 headers 注入
      headers:
        org: ${EASYOPS_ORG}
        user: ${EASYOPS_USER}
        # giraffe-contract-name 不在此设——它因 operation 而异（activate≠list），真调 per-op 用 --header 传
    backend_legacy:
      base_url: ${EASYOPS_COLLECTOR_SERVICE_LEGACY_URL}     # :8125 旧版进程（metric/collector_job 端点所在）。实测（2026-08-14）：collector_metric list/get 直 200 免 contract header
      host: admin.easyops.local
      path_prefix: ""
      auth: none
      headers:
        org: ${EASYOPS_ORG}
        user: ${EASYOPS_USER}

# -----------------------------------------------------------------------------
# 资源：collector_job —— 采集任务 CRUD（collector_service:8125）
# 权威源码：resources/源代码/collector_service/collector_job/route.go
# -----------------------------------------------------------------------------
resources:

# -----------------------------------------------------------------------------
  collector_job:
    description: |
      采集任务 CRUD。源码实际注册在 collector_service:8125：
      POST/GET/PUT/DELETE /api/v1/collector_job，另有 PUT /status 与 GET 详情。
      创建任务会写入 _COLLECTOR_JOB；easyops agentType 会自动开启插件安装和 agent channel。
    path: ""
    operations:
      create:
        description: "创建监控采集任务。源码要求 job.objectId/jobName/filter/timeout/enabled/interval/agentType/collectorParams、metrics、pluginIds。"
        method: POST
        path: /api/v1/collector_job
        body:
          type: object
          required: [job, metrics, pluginIds]
          properties:
            job: { type: object, description: "CollectorJob；必填 objectId/jobName/filter/timeout/enabled/interval/agentType/collectorParams" }
            metrics: { type: array, items: { type: object }, description: "别名指标 [{aliasMetricId,...}]" }
            pluginIds: { type: array, items: { type: string }, description: "采集套件 instanceId 列表" }
        response:
          type: object
          properties:
            code: { type: integer }
            data: { type: object, properties: { instanceId: { type: string } } }
      list:
        description: "分页列出采集任务。源码路由 GET /api/v1/collector_job。"
        method: GET
        path: /api/v1/collector_job
        params:
          page: { in: query, type: integer }
          pageSize: { in: query, type: integer }
          objectId: { in: query, type: string }
          jobName: { in: query, type: string }
        response:
          type: object
          additional_properties: true
      get:
        description: "读取单个采集任务。"
        method: GET
        path: /api/v1/collector_job/{instanceId}
        params:
          instanceId: { in: path, type: string, required: true }
        response: { type: object, additional_properties: true }
      update:
        description: "更新采集任务。"
        method: PUT
        path: /api/v1/collector_job/{instanceId}
        params:
          instanceId: { in: path, type: string, required: true }
        body: { type: object, additional_properties: true }
        response: { type: object, additional_properties: true }
      status:
        description: "启停采集任务。"
        method: PUT
        path: /api/v1/collector_job/{instanceId}/status
        params:
          instanceId: { in: path, type: string, required: true }
        body:
          type: object
          required: [enabled]
          properties: { enabled: { type: boolean } }
        response: { type: object, additional_properties: true }
      delete:
        description: "删除采集任务。"
        method: DELETE
        path: /api/v1/collector_job/{instanceId}
        params:
          instanceId: { in: path, type: string, required: true }
        response: { type: object, additional_properties: true }

# -----------------------------------------------------------------------------
# 资源：job_status —— 任务最近一次采集状态
# 权威源码：resources/源代码/collector_service/job_status/route.go
# -----------------------------------------------------------------------------
  job_status:
    description: "查询采集任务最近状态与 lastErr。"
    path: ""
    operations:
      get:
        description: "POST /v1/job_status/get，返回 status/lastErr。"
        method: POST
        path: /v1/job_status/get
        body:
          type: object
          required: [configId, list]
          properties:
            configId: { type: string }
            list:
              type: array
              description: "任务标识列表；每项按 agent UUID 与任务实例 ID 定位"
              items:
                type: object
                required: [instanceId, uuid]
                properties:
                  instanceId: { type: string, description: "采集任务实例 ID" }
                  uuid: { type: string, description: "采集 Agent UUID" }
            sampler: { type: string, default: metric_sampler, description: "采样器；省略时源码默认 metric_sampler" }
        response: { type: object, additional_properties: true }

# -----------------------------------------------------------------------------
# 资源：collector_metric —— 指标元数据（collector_service.metric 模块）。
# 源码：07-source-repos/collector_service/metric/route.go:20-21,38 + validators/
# request_validate_trees.go:67,71 + metric_service.go:756,835。
# 这是「dashboard 有哪些指标可用」的权威查询途径（data_exchange 的 tags-list 是空实现桩，
# olap/olap_service.go:91-93——勿用它查指标元数据）。
# ✅端口已定案（e2e 2026-08-14）：metric 端点在 legacy 进程 :8125（endpoint backend_legacy，
# 直 200 免 contract header；:12000 报 giraffe-contract-name 错）。
# -----------------------------------------------------------------------------
  collector_metric:
    description: 采集指标元数据（CollectorAliasMetric 目录）——指标名/显示名/单位/维度/objectId/所属插件与套件。dashboard cmdb-olap 数据源选指标前用它查证（指标名错→图表静默空白）。list=v2 分页检索（支持 metricName 模糊/metricNames 精确集合/objectId/jobId/pluginId/metricSetId 过滤），get=单指标详情（objectId+metricName 定位）。⚠️端点在 legacy 进程 :8125——调用加 --endpoint backend_legacy（:12000 报 giraffe-contract-name 错，实测 2026-08-14）。
    path: ""

    operations:
      # ---------- v2 列表（POST /api/v2/collector-metric-names）----------
      list:
        description: 分页检索指标元数据（metric/route.go:21 ListCollectorMetricNamesV2）。过滤参数（validator 树 request_validate_trees.go:71）：page/pageSize 必填；metricNames 逗号分隔精确集合（$in）；其余模糊/外键过滤选填。响应 data.list 元素 = CollectorMetricName（metric_service_test.go:4128-4177 实证字段）：metricId/metricName/objectId/description/unit/displayName/dims/isKeyMetric/keyMetricOrder。total=总数。查「HOST 有哪些指标」：object_id 传 HOST。
        method: POST
        path: /api/v2/collector-metric-names
        body:
          type: object
          required: [page, pageSize]
          description: "指标列表检索请求（ListCollectorMetricNamesV2Request）"
          properties:
            page:          { type: integer, description: "页码（≥1，必填）" }
            pageSize:      { type: integer, description: "每页（≥1，必填）" }
            metricNames:   { type: string, description: "精确指标名集合，逗号分隔（$in，如 cpu_usage,mem_usage）" }
            metricName:    { type: string, description: "指标名模糊匹配（$like %x%）" }
            metricDisplayName: { type: string, description: "显示名模糊匹配" }
            objectId:      { type: string, description: "按模型过滤（如 HOST）——查某模型可用指标用这个" }
            jobId:         { type: string, description: "按采集任务过滤（13 位 id）" }
            pluginId:      { type: string, description: "按采集插件过滤（13 位 id）" }
            metricSetId:   { type: string, description: "按指标集过滤（13 位 id）" }
            types:         { type: string, description: "按数据类型过滤，逗号分隔" }
        response:
          type: object
          description: "wrapper：{ code, data: { list, total } }（kitweb JSONPb gogo 序列化）"
          properties:
            code: { type: integer }
            data:
              type: object
              properties:
                total: { type: integer, description: "指标总数" }
                list:
                  type: array
                  description: "CollectorMetricName 列表"
                  items:
                    type: object
                    additional_properties: true
                    properties:
                      metricId:   { type: string, description: "指标 ID" }
                      metricName: { type: string, description: "指标名（cmdb-olap measures[].function.args 用它，snake_case）" }
                      displayName: { type: string, description: "显示名（如 CPU使用率）" }
                      objectId:   { type: string, description: "所属模型" }
                      unit:       { type: string, description: "单位（如 percent(1)/bibytes）" }
                      dims:       { type: array, description: "维度列表", items: { type: object, additional_properties: true } }
                      isKeyMetric: { type: boolean, description: "是否关键指标" }
                      keyMetricOrder: { type: integer, description: "关键指标排序" }

      # ---------- 详情（GET /api/v1/detail-collector-metric-name）----------
      get:
        description: 单指标详情（metric/route.go:38 DetailCollectorMetricName）。objectId+metricName 定位（request_validate_trees.go:35），返回指标完整定义（含 dims 维度、unit 单位、originalMetrics 来源插件）。dashboard 配指标前查证用。
        method: GET
        path: /api/v1/detail-collector-metric-name
        params:
          objectId:   { in: query, type: string, required: true, description: "模型 ID（如 HOST）" }
          metricName: { in: query, type: string, required: true, description: "指标名（snake_case）" }
        response:
          type: object
          description: "wrapper：{ code, data: { metricName, metricKey, ... } }（字段同 list 元素）"
          properties:
            code: { type: integer }
            data: { type: object, additional_properties: true }
