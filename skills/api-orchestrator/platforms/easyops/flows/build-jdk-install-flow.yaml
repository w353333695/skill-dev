name: build_jdk_install_flow
intent: "创建并执行自动化安装 JDK 流程：推送指定包到目标主机 → 安装并启动 → 验证 java 版本。"
trigger:
  - "做个自动化安装jdk的流程"
  - "批量安装指定版本 JDK"
guard: 规划
prerequisites:
  env: [EASYOPS_AUTOOPS_BACKEND_URL, EASYOPS_ORG, EASYOPS_USER]
  payload: "提供 JDK 包名称/版本、目标主机（@agents）、安装路径和期望 java 版本。"
  evidence: "tool.list 必须查到文件包管理、安装执行、版本验证三个可执行工具；不得凭工具名或 ID 臆造。"
steps:
  - n: 1
    op: tool.list
    args: [--name, "文件包管理", --page, "1", --pageSize, "50"]
    desc: "查找可把指定名称/版本软件包推送到目标主机的工具；按实际工具名调整关键词。"
    expect: "data.list 命中一个可执行工具并取得 toolId/vId/inputs/outputDefs。"
    on_fail: "停止并要求用户提供已存在的包管理工具或先创建工具。"
  - n: 2
    op: tool.list
    args: [--name, "安装", --page, "1", --pageSize, "50"]
    desc: "查找安装/启动工具。"
    expect: "取得安装工具的 toolId/vId 及输入输出定义。"
    on_fail: "停止，不用 shell 拼接替代正式工具。"
  - n: 3
    op: tool.list
    args: [--name, "Java", --page, "1", --pageSize, "50"]
    desc: "查找 JDK/Java 版本验证工具。"
    expect: "取得验证工具的 toolId/vId 及成功输出定义。"
    on_fail: "停止并要求用户提供验证工具。"
  - n: 4
    op: flow.create
    args: [--body-file, <jdk-flow-definition.json>]
    desc: "将步骤 1-3 查到的 toolId/vId 回填到 stepList，创建流程及首个版本。step 2/3 的 @agents、包版本和安装参数从 flowInputs 传入。"
    dataflow: "tool.list.data.list[].toolId/vId → stepList[].toolId/vId；用户参数 → flowInputs。"
    expect: "code=0 且返回 flowId/version。"
    on_fail: "不执行后续步骤；保留失败响应供定位。"
  - n: 5
    op: flow.get
    args: [<flowId>, --version-mark, "$latest_production"]
    desc: "重新读取流程，核对三步依赖、输入名称和版本。"
    expect: "stepList 顺序为推包→安装启动→验证，且无未解析占位符。"
  - n: 6
    op: flow_execution.run
    args: [--body-file, <jdk-execution.json>]
    desc: "提交异步执行；flowInputs 至少包含 @agents、packageName、packageVersion、installPath、expectedJavaVersion。"
    dataflow: "flowId/version + 用户参数 → ExecuteFlowRequest；返回 taskId。"
    expect: "code=0 且 data.taskId 非空。"
  - n: 7
    op: flow_execution.get_result
    args: [<taskId>]
    desc: "按退避轮询直到 totalStatus 为完成态；检查推包、安装、启动、java -version 四类结果。"
    dataflow: "run.data.taskId → get_result.taskId。"
    expect: "总状态成功，验证步骤输出中的 java 版本与 expectedJavaVersion 一致。"
    on_fail: "报告失败步骤和主机输出；不要把提交成功当安装成功。"
side_effects: objects.yaml#autoops_flow.side_effects
rollback: "流程定义创建失败无需回滚；若用户确认清理，则 flow.delete 删除本次新建 flowId。主机侧卸载 JDK 不在本模板内，必须另行确认。"
acceptance: "打开 systems.yaml#systems.easyops-autoops.acceptance_urls.flow_detail，确认流程图、输入定义和版本；再以非生产测试主机执行并核对 java -version。"
