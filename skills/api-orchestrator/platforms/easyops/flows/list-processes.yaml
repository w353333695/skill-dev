# 流程模板：查流程列表 + 分类—— 场景①。直通挡（纯读）。
# 场景：看看当前环境有几个流程，分类情况怎么样。
name: list-processes
intent: 查流程定义列表 + 看分类分布（纯读）
trigger: ["有哪些流程", "看流程列表", "当前环境几个流程", "流程分类"]
guard: 直通挡（纯读）

prerequisites:
  env: [EASYOPS_ORG, EASYOPS_USER=easyops, EASYOPS_ITSM_BACKEND_URL]

steps:
  - n: 1
    op: process_definition.list
    args: [--page, "1", --pageSize, "100", --insecure]
    desc: 流程列表（name/category/creator/Q 过滤）。返回 list[]，每条含 instanceId/name/category/creator/state/isMain
    note: "不返 bpmnXML/processSetting（重字段）。后处理 jq/python 抽 name+category 统计分类分布给用户看"
    expect: "code=0；data.total=流程总数，data.list[]=流程数组"

key_rule: |
  list 不返 bpmnXML/processSetting（重字段）。要 BPMN/节点详情走 process_version.get(V2)。
  isMain=true 只列有主版本的 def。
side_effects: objects.yaml#itsm_process_definition.side_effects
acceptance: "${EASYOPS_CMDB_FRONTEND_URL}/next/itsc-process-manage/process-list?visible=true&page=1&pageSize=20"
