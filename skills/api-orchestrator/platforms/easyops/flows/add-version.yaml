# 流程模板：给表单加版本（含条件显示）—— 场景④。规划挡（写、change）。
# 场景：给主机申请表单加个版本，加个『申请主机类型』多选框，决定表单显示哪些 table 容器（让页面整洁）。
# update 的派生/对外生效规则见 objects.yaml#itsm_form_version.side_effects（form_version.update / 配置生效 rule）。本文件不复述规则全文。
name: add-version
intent: 对已发布(done)表单版本派生新草稿版本，加入条件显示控件（某字段值决定容器显隐）
trigger: ["给表单加版本", "表单加字段", "条件显示", "按类型显示不同表单内容", "派生新版本"]
guard: 规划挡（写、change）—— 须展示新 formDefinition 确认

prerequisites:
  env: [EASYOPS_ORG, EASYOPS_USER=easyops, EASYOPS_ITSM_BACKEND_URL]
  base: "已有表单 + 至少一个 done 或 unfinished 版本（formId/versionId 已知）"

steps:
  - n: 1
    op: form_version.get
    args: ["<formId>", "<versionId>", --insecure]
    desc: 取当前版本完整内容（拿 formDefinition 字符串 + 现有 businessRules）
    dataflow: "data.formDefinition(JSON 字符串) → step2 二次 parse 改造"
    note: "formDefinition 是字符串，python json.loads 后改 []Container，再 json.dumps 回字符串"

  - n: 2
    transform: 改造 formDefinition（本地）
    desc: |
      在 formDefinition 的 []Container 里加内容 + 配条件显示。
      【条件显示】用 displayCondition 字符串表达式（前端求值）。语法：`#{容器key.控件key}` 引用值 + JS 风格操作符，按触发控件类型选模板（完整表见 objects.yaml#itsm_conditional_display）：
        · SELECT单选/RADIO：#{c.field}.value = "vm"
        · MULTIPLESELECT/CHECKBOX：#{c.field}.some(item => item.value = "vm")
        · INPUT/TEXTAREA/NUMBERINPUT/SLIDER：#{c.field} = "1"
        · SWITCH：#{c.field}.toString() = "true"
      容器key/控件key 用 formDefinition 里的 key（非 modelField）。配在容器 displayCondition / 组件 options.displayCondition / tabPane.displayCondition。
      复杂联动（多字段计算/动态取值）超出表达式时才用 onValueChange 脚本（container.options.listenEvents + toolId，返 formConfig）。
      本场景：加『申请主机类型』SELECT(单选 key=f_htype)；虚拟机/物理机 table 配 displayCondition。
    body_hint: |
      # 加触发控件（归一化补全 options 全字段，见 build-form.yaml）
      {"key":"f_htype","type":"SELECT","label":"申请主机类型","modelField":"hostType","belongToSection":"c_base",
       "options":{"extraProps":{"items":[{"key":"vm","label":"虚拟机","value":"vm"},{"key":"pm","label":"物理机","value":"pm"}]},
                 "layout":[0,1,12,1],"labelCol":3,"dataType":"object","displayCondition":"","remoteFunc":{"toolId":"","scriptInputs":[]},"rules":[],...}}
      # 虚拟机 table 的 displayCondition（容器级）
      {"key":"c_vm","name":"虚拟机申请","type":"table","displayCondition":"#{c_base.f_htype}.value = \"vm\"","propertys":[...]}
      # 物理机 table
      {"key":"c_pm","name":"物理机申请","type":"table","displayCondition":"#{c_base.f_htype}.value = \"pm\"","propertys":[...]}

  - n: 3
    op: form_version.update
    args: ["<formId>", "<versionId>", --body-file, "<new.json>", --insecure, --yes]
    desc: |
      改版本（PUT）。按【当前版本 state】的 upsert 非对称行为（done→新建草稿/unfinished→就地改）
      见 objects.yaml#itsm_form_version.side_effects（form_version.update rule）。
      本场景④走 done 版 update 派生新草稿（versionName 不能与已有重）。同时改 form.name/category/memo。
    body_hint: |
      { "name":"主机申请表单", "category":"ITSM",
        "formDefinition": <改造后的 JSON 字符串>,
        "state":"unfinished", "versionName":"1.1.0", "versionMemo":"加主机类型多选+条件显示" }
    expect: "code=0；done 版时 data 是新派生草稿版本的 instanceId/versionName"
    on_fail: "『重复的表单版本号』→ versionName 与已有重，改号（约束见 objects.yaml#itsm_form_version.side_effects）；403 → 缺 itsc:form_management_update 权限"

  - n: 4
    op: form_version.get
    args: ["<formId>", "<新版本id>", --insecure]
    desc: 校验新版本内容（formDefinition 含新控件 + 条件显示）
    dataflow: "step3 返回的新 versionId → step4"

key_rule: |
  update 的 upsert 非对称行为（done→新建草稿/unfinished→就地改）+ 『对外生效』机制（新版本须 set_main 才生效）
  见 objects.yaml#itsm_form_version.side_effects（form_version.update / 配置生效 rule）。
  displayCondition 字符串表达式前端解释——后端不校验语义，写错只在前端表现为不生效。
side_effects: objects.yaml#itsm_form_version.side_effects
acceptance: "${EASYOPS_CMDB_FRONTEND_URL}/next/itsc-form-management/form-list/<formId>/<新版本id>"
