# 流程模板：删除工具（场景⑥）。确认挡（破坏性，必确认）。
name: delete-tool
intent: 删除工具
trigger: ["删除X工具", "删掉工具", "把工具删了"]
guard: 确认挡（破坏性）—— 展示将删的工具确认
key_rule: '软删（置 delete_me）。force=true（query 字符串 "true"）仅绕 ReadOnly。versionId 不填=删整个工具；填=只删该版本。⚠️ReadOnly 工具需 force。'
steps:
  - n: 1
    op: tool.get
    args: ["<toolId>", --insecure]
    desc: 确认将删的工具（展示 name/category）
    expect: "返回工具详情供确认"
  - n: 2
    op: tool.delete
    args: ["<toolId>", --insecure, --yes]
    desc: 删整个工具（所有版本 + 配置）
    expect: "code=0"
    note: "只删某版本加 --versionId <vId>；ReadOnly 工具加 --force true"
rollback: "软删不可逆（delete_me=true）；恢复走 tool_package.import 还原（或联系平台）"
acceptance: "tool.list --name <工具名> 不再命中"
