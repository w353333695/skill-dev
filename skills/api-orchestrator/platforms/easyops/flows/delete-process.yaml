# 流程模板：删流程定义—— 场景⑤。规划挡（写、破坏性）。
# 场景：删除名称为 test 的流程。版本删除约束/级联规则见 objects.yaml#itsm_process_version.side_effects（本文件不复述规则全文）。
name: delete-process
intent: 删除一个 ITSM 流程定义（含其所有版本）
trigger: ["删除流程", "删掉 X 流程", "清理测试流程"]
guard: 规划挡（写、破坏性）—— 必须确认删哪个（definitionId）

prerequisites:
  env: [EASYOPS_ORG, EASYOPS_USER=easyops, EASYOPS_ITSM_BACKEND_URL]
  confirm: "已确认 definitionId；删错不可逆"

steps:
  - n: 1
    op: process_definition.list
    args: [--name, "test", --insecure]
    desc: 找 test 流程，拿 definitionId
    dataflow: "data.list[].instanceId（definitionId）→ step2/3"

  - n: 2
    op: process_version.list
    args: ["<definitionId>", --insecure]
    desc: 列该流程所有版本，拿 versionId 清单
    dataflow: "data.list[].vInstanceId（versionId）→ step3"
    expect: "total=版本数；向用户展示版本清单确认"

  - n: 3
    op: process_version.delete
    args: ["<definitionId>", "<versionId>", --insecure, --yes]
    desc: |
      逐个删版本（循环单删——versionIds 路径复数但只删第一个，见 side_effects）。
      删除可能被 4 约束拒绝（任一即 HTTP 412），约束清单 + 报错原文 + 各自解法
      见 objects.yaml#itsm_process_version.side_effects（process_version.delete rule）。
      解完约束再删；删完最后一个版本隐式级联删 def。
    on_fail: "按 key_rule 的清理顺序解约束（表单/工单/服务/引用），逐项解后重删版本"

  - n: 4
    op: process_definition.delete
    args: ["<definitionId>", --insecure, --yes]
    desc: 删流程定义（step3 清光版本后本步幂等成功——末版本级联已删 def）
    on_fail: "『存在流程定义版本』→ 回 step2 确认版本没清干净，继续 step3（规则见 objects.yaml#itsm_process_definition.side_effects）"

key_rule: |
  删流程 = 清所有版本（末版本级联删 def）。版本删不掉时按 4 约束【按序解】——
  约束内容 + 报错原文见 objects.yaml#itsm_process_version.side_effects，此处只列【清理顺序】（怎么做）：
    ① 表单绑定 → process_form.set 解绑（formRelationInstanceId 非空 + formId 空）
    ② 关联工单 → 工单侧处理
    ③ 主版本+绑服务 → 删服务或换主版本（⚠️服务=ITSC_SERVICE_INSTANCE 跨域，须服务管理 API，不在本清单）
    ④ 被父/子流程引用 → 解引用
  test 流程实测路径：③卡服务绑定（须先删服务）→ ①卡表单绑定（即使 taskInfo formId 显示空，
    ITSC_PROCESS_FORM_RELATION 关系行还在，须 process_form.set 显式解绑）→ 删版本 code 0 → 末版本级联删 def。
side_effects: objects.yaml#itsm_process_version.side_effects
acceptance: "process_definition.list 过滤该 name → 不含它（删干净）"
