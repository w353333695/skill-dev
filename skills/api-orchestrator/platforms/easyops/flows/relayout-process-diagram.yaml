# 流程模板：重排存量流程图布局（事后补救链路）。
name: relayout-process-diagram
intent: 已发布/草稿流程的 BPMN 图布局混乱（斜线/绕路/交叉），不改动流程语义只重排坐标，派生新版本供验收发布
trigger: ["流程图太乱", "重新布局流程图", "重排BPMN", "流程图布局优化", "连线穿来穿去"]
guard: 规划挡（写 ITSM：派生新版本）—— 须展示将派生的版本号并确认；不碰原版本（done 主版本不动，set_main 前一切可逆）

prerequisites:
  env: [EASYOPS_ORG, EASYOPS_USER, EASYOPS_ITSM_BACKEND_URL]
  tool: "formats/bpmn-kit/relayout.py（Dagre LR 算法：最长路径分层→重心法列内排序减交叉→正交折线→跨列/反向边上/下绕行通道嵌套）。语义零改动——process 元素树（节点/流/条件/flowable 扩展属性）逐项等价，仅 BPMNDiagram 坐标重写 + 前缀统一 bpmn2:→bpmn:（URI 不变，实测 .90 前端渲染正常）"
  design_note: |
    布局正确的位置是【设计时】——build-process 生成纯语义 XML 后即调 relayout_xml()（生成即优化，见
    flows/build-process.yaml step2）。本 flow 是两类场景的兜底：①存量人工拖的烂图；②人在前端设计器
    二次编辑 API 生成的图（bpmn-js 会重写 DI 可能退化）。前端设计器本身闭源（itsc-process-manage.
    process-design 懒加载构件），改不了它——根治须平台组在设计器加自动布局按钮（bpmn-js 生态有
    bpmn-auto-layout/dagre 现成方案）。

steps:
  - n: 1
    op: process_version.list
    args: ["<definitionId>"]
    desc: 确认目标流程的版本链（versionName/state/isMain/vInstanceId），选定要重排的源版本。definitionId 从 URL 取（/itsc-process-manage/<definitionId>/...）或 process_definition.list 查。
    expect: "源版本 id + state（done 主版本须走派生；unfinished 草稿可直接 edit 覆盖）"

  - n: 2
    op: process_version.get
    args: ["<definitionId>", "<versionId>"]
    desc: 拉 BPMN 原文 + processSetting。processSetting 从 CMDB _ITSC_PROCESS_VERSION 取原始字段更全（get 端点可能不返）。
    expect: "bpmnXML + processSetting（注意 get 版本参数顺序：definitionId 在前）"

  - n: 3
    desc: |
      本地重排（纯算法，不调远端）：
      python3 formats/bpmn-kit/relayout.py <拉回的.bpmn> -o <relayouted.bpmn>
      自检：节点/流数量不变；processSetting 原样带回（一字节不动）。
    expect: "重排后 bpmnXML（语义等价，DI 重写）"

  - n: 4
    op: process_version.create
    desc: |
      🔴done 版本不可 edit（报『当前版本已完成，不可修改！』）——须 create 派生新版本：
      body { bpmnXML: <重排版>, versionName: <源版本号+1，如 1.0.1→1.0.2>, state: "unfinished",
             processSetting: <🔴对象非字符串——CMDB 存储态是 JSON 字符串但 API 请求须传对象，传字符串报
             readObjectStart: expect { or n>,
             memo: 注明"自动布局重排，语义与 <源版本> 一致",
             baseVersionId: <源版本id——克隆表单绑定+阶段设置> }
      源是 unfinished 草稿：改用 process_version.edit 同结构 body 直接覆盖（无 baseVersionId）。
    expect: "code=0 + 新 versionId（或草稿已更新）"

  - n: 5
    desc: |
      验收：前端打开草稿编辑页（用户看图）：
      ${EASYOPS_CMDB_FRONTEND_URL}/next/itsc-process-manage/<definitionId>/versionCreate-v2/<新versionId>?activeTab=0
      用户确认布局满意（算法是 80 分底稿；个别节点不满意可手工微调，或改 relayout.py 参数重跑）。
    expect: "用户确认布局可接受"

  - n: 6
    op: process_version.set_main
    desc: 满意后两步发布：先 process_version.edit 改 state="done"（bpmnXML/processSetting 原样带回）→ 本步 set_main 部署到 Flowable 引擎。不满意：process_version.delete 删草稿重来（无约束——草稿未绑表单未关联工单）。
    expect: "code=0；新版本成为主版本；运行中工单不受影响（仍走旧 deploymentId）"

side_effects: objects.yaml#itsm_process_version（版本约束/级联）
acceptance: "前端流程图无斜线无穿节点；工单按新版本流转正常"
rollback: "草稿阶段随时 process_version.delete；已 set_main 则旧主版本仍在（可再 set_main 回滚）"
note: |
  实测链路（2026-08-15，事件管理流程-生产 6590091492e4d）：1.0.1(done,主) → 派生 1.0.2(unfinished)
  65901a347b8ed → 前端验收。坑：①processSetting 传对象 ②done 不可 edit ③get 参数 definitionId 在前
  ④算法前缀重写 bpmn2:→bpmn: 属正常（URI 等价）。
