# =============================================================================
# platforms/collector/systems.yaml
# deployment=collector 下接入的系统清单 + 各自 api-cli spec 路径 + 接入面 + 鉴权 + 运行时知识。
# 编排挡（orchestration.md）查本文件获知「有哪些系统可用」与「spec 在哪」。
#
# 真调环境（2026-08-13 实测）：172.30.0.90 / org 8888（独立 EasyOps 实例，与 demo 的 .232/org18832008 分离）。
#
# 资料分工（唯一真相来源，换环境/换 LLM 从此读，勿依赖记忆）：
#   systems.yaml(本文件) = 接入(鉴权/端口/org/user)+激活机制+拓扑+计数坑；
#   objects.yaml = 套件结构+字段+副作用规则；entities.yaml = 字段锚+跨服务接力；
#   flows/ = e2e 流程模板；easyops-collector-plugin.yaml / easyops-collector-service.yaml = api-cli 清单；
#   formats/collector-kit/ = 套件包格式/plugin.yaml schema/py2规范/$.attr（跨部署复用，在 demo deployment）。
# =============================================================================
deployment: collector

# =============================================================================
# 平台级公约（与 demo 一致，本 deployment 同 EasyOps 平台）
# =============================================================================
platform_conventions:
  auth: |
    平台级鉴权公约（与 demo deployment 一致）：
    直连后端（backend endpoint）【免 cookie】——org + user + Host 三件 header 即够。
    机制：engine/execute.go:135（auth=none 跳过 auth.Apply）+ engine/request.go:40-43
    （endpoint.headers 的 org/user 在 resolve 阶段独立注入，不依赖 auth provider）。
    collector_plugin_service:8151 实测（2026-08-13）：org+user+Host 直接 200（plugin list total=198）。
    网关面（frontend endpoint）仍需 cookie（auth.d/collector-cookie.yaml）。
  code: |
    套件采集脚本默认 Python2.7（agent 运行时），py2 规范见 formats/collector-kit/sampler-types.yaml python2_rules：
    print 语句（不能用 __future__ print_function，运行时注入破坏顶部）、requests 库（py2 环境已装）、
    subprocess 不用 timeout、新式类+.format()+编码声明。

systems:
  # ===========================================================================
  # collector_plugin_service —— 采集套件管理（CRUD/导入导出/指标导入）
  # ===========================================================================
  collector_plugin_service:
    description: |
      EasyOps 采集套件管理（collector_plugin_service:8151）—— 4 能力域 23 端点：
      ① plugin 套件 CRUD（10）：3 类型（simple-script/metricbeat/exporter）各有 create/update；
      ② plugin_package 导出/导入/升级（3）：zip 流 / multipart；
      ③ log_plugin 日志套件 CRUD（4）：processSteps 链；
      ④ metric_management 指标导入（6）：4 adapter（prometheus/zabbix/easyagent/metricbeat）。
      ⚠️本服务无启用/禁用/激活端点——激活在 collector_service.kit（见下）。
      核心范式：套件=类型+关联CMDB模型+采集参数(paramDefine)+指标定义；3 类型由端点隐式区分（无单 type 字段）。

    spec: easyops-collector-plugin.yaml          # api-cli 清单，相对本目录
    default_endpoint: backend                    # 直连 :8151（套件 CRUD + 指标导入全 verb 干净命中）

    endpoints:
      backend:                                   # 直连后端（HTTP，无 path 前缀，全 verb 通用）
        base_url: ${EASYOPS_COLLECTOR_PLUGIN_BACKEND_URL}
        host: admin.easyops.local
      frontend:                                  # 前端网关（HTTPS :232，per-API 路由，仅备选）
        base_url: ${EASYOPS_COLLECTOR_FRONTEND_URL}
        host: admin.easyops.local

    auth: collector-cookie                       # auth.d/collector-cookie.yaml（仅网关面用；直连 auth=none）

    env:                                         # 环境变量契约（值在 env.d/collector.env）
      EASYOPS_COLLECTOR_PLUGIN_BACKEND_URL: ""   # :8151 完整 URL；端口见 runtime.ports.collector_plugin_backend
      EASYOPS_COLLECTOR_FRONTEND_URL: ""         # 前端页面/网关完整 URL

    # 能力清单（resource.verb）—— 编排挡据此判意图可达性
    capabilities:
      plugin:
        create_with_script:   "创建脚本型套件（simple-script/agentType=easyops）。必填 name/agentType"
        create_with_metricbeat: "创建 metricbeat 型套件（noPackage=true）。必填 name/agentType"
        create_with_package:  "创建带程序包套件（exporter 等）。必填 name/agentType/packageId/packageVersionId"
        list:                 "分页列套件（精简字段，不含 content/template/readme/pluginYaml）"
        detail:               "套件完整详情（含 pluginYaml/params/processors 全字段+只读字段）"
        delete:               "删套件（前置：未被采集任务引用；级联清指标；物理删）"
        update_with_script:   "更新脚本型（processors空切片重建，ExtInfo用请求值）"
        update_with_metricbeat: "更新 metricbeat 型（processors继承追加，ExtInfo保留旧值）"
        update_with_package:  "更新 package 型（packageId校验被注释，与Create不一致）"
        metricbeat_list:      "列内置 metricbeat 模块模板（moduleCache，读 conf.module.yaml）"
      plugin_package:
        export:        "导出套件为 zip 流（⚠️multipart/binary，api-cli仅预览，真调走SDK）"
        import:        "导入套件 zip（multipart，同名冲突 upsert=true 覆盖）"
        import_update: "升级套件（multipart，agentType不可变，version唯一）"
      log_plugin:
        create: "创建日志套件（processSteps 链，每个 step 必须有 action）"
        delete: "删日志套件（前置：未被 COLLECTOR_LOG_JOB 引用）"
        get:    "日志套件详情"
        update: "更新日志套件"
      metric_management:
        import_alias_metric_check: "导入别名指标前校验（按 pluginId）"
        import_metric_list:        "导入指标列表（按 pluginId）"
        import_metrics:            "导入指标（按 plugin_id ⚠️下划线非驼峰，走 4 adapter）"
        import_plugin_alias_metrics: "导入套件别名指标"
        list_plugin_metrics:       "列套件所有指标"
        import_metric_check:       "导入指标前校验"

    # 运维知识（实测，真相来源）
    runtime:
      admin_user: easyops                # 写操作用户
      env_required:                      # 调用前 export（值在 env.d/collector.env）
        - "EASYOPS_COLLECTOR_PLUGIN_BACKEND_URL"
        - "EASYOPS_ORG"
        - "EASYOPS_USER"
      ports: { collector_plugin_backend: 8151, frontend: 232 }
      host_header: admin.easyops.local
      auth: "直连 backend（endpoint.auth=none）只需 org+user header——实测 8151 直 200（plugin list total=198）。cookie 仅网关面需要"
      list_total_in_body: "⚠️plugin.list 响应 total 在 data.total（body 内），不是 api-cli stderr 的 _meta.total。计数场景读 data.total（jq .data.total）。空结果时 data.total=0"
      response_wrapper: "标准响应 {code,codeExplain,error,data}；code=0 成功。与 cmdb 的 {code,message,error,data} 略不同（多 codeExplain 少 message）"
      create_returns_instanceid: "3 个 create 端点响应 data:{instanceId}（13hex），用于后续 detail/delete/activate"
      delete_precondition: "删除前置：套件不能被 _COLLECTOR_JOB 引用（SearchTotal.Data!=0 报『此套件关联有采集任务不允许删除』）；删除级联清空 MetricObjectId 下所有 collectorPlugin.instanceId==id 的指标实例"
      update_agenttype_immutable: "import_update 升级时 agentType 不可变（报『更新套件时不允许变更套件类型』）；version 必须唯一（重复报『已存在同名版本』）"
      no_enable_endpoint: "⚠️本服务无 enable/disable/activate 端点（全包搜 enable/disable 0 命中）。激活在 collector_service.kit.activate（见下）"
      multipart_uses_sdk: "plugin_package.export/import/import_update 是 multipart/binary 流，api-cli 无法真调（params.in 无 formData）。真调走 Python SDK（sdk/easyops_client.py 扩展）或 curl -F。详见 formats/collector-kit/package-format.yaml"
      py2_runtime: "采集脚本默认 Python2.7（agent 运行时），py2 规范见 formats/collector-kit/sampler-types.yaml python2_rules（print语句/requests/subprocess无timeout）"
      sampler_type_decides_output: "samplerType 决定脚本输出协议：metric_sampler→直接[{dims,vals}]JSON（监控）；process_sampler→BEGIN/END GATHERING DATA标记包裹（CMDB采集）。详见 formats/collector-kit/sampler-types.yaml"

    # e2e 验收 URL（前端）
    acceptance_urls:
      kit_list: "${EASYOPS_COLLECTOR_FRONTEND_URL}/next/monitor-kit/kit/easyops?page=1&pageSize=20"
      kit_detail: "${EASYOPS_COLLECTOR_FRONTEND_URL}/next/monitor-kit/kit/easyops/{instanceId}/detail?tab=readme"

# =============================================================================
# e2e 真调验证状态（2026-08-13，org 8888，172.30.0.90）
# =============================================================================
e2e_verified:
  collector_plugin_service_8151:
    plugin_list: "✅ 真调通过（198套件，响应 data.total）"
    plugin_detail: "✅ 真调通过（完整字段集实锤，见 objects.yaml#collector_plugin fields）"
    plugin_import: "✅ 真调通过（curl -F 上传，两套件均 code:0 返回 instanceId+agentType）"
    plugin_export: "✅ 真调通过（GET zip 流 130KB，含 HOST.json/alias_metric/origin_metric/metric_set/package.conf.yaml/dashboard/alertRule）"
    plugin_import_update: "✅ 真调通过（version 必填：缺则报 key version not found；版本唯一：重复报 code:100007 已存在同名版本）"
    plugin_delete: "✅ 真调通过（curl DELETE code:0；前置检查：无引用可删，有引用报此套件关联有采集任务不允许删除）"
    metricbeat_list: "✅ 真调通过（返回 moduleCache 模块表）"
  collector_service_kit_12000:
    activate: "⚠️ GAP——端点在 12000（giraffe-contract-name 路由确认），但 contract 实际版本/名未确定（kits.go 的 ActivateCollectorKit@1.0.19 实测 not found，试 1.0.0~1.0.20 全 not found）。需前端实际激活操作抓包拿真实 giraffe-contract-name header 回流"
    list: "⚠️ 同 activate，contract 版本未确定"
  kit_samples_imported:
    desc: "e2e 导入的两个测试套件（保留套件A用于后续激活验证）"
    metric_sampler: "套件A『主机端口可达性监控套件』instanceId=658e73a176ad1（simple-script/metric_sampler，采集HOST端口可达性，保留未删）"
    process_sampler: "套件B『主机信息采集套件』instanceId=658e73d07bdbd（simple-script/process_sampler，采集HOST写回CMDB，已验证后删除）"
  packaging_format: "✅ ZIP_STORED + UTF-8 flag 确认可用（DEFLATED 未测，STORED 已够）。打包脚本 pack_kit.py"
  gaps:
    - "kit.activate contract 版本号（需前端抓包）"
    - "采集脚本 py2.7 实际执行（.90 HOST _agentStatus=未安装，无 agent 接收；套件导入/激活链路可验，采集执行依赖 agent 是另一层）"
    - "process_sampler GATHERING DATA 协议解析（在 collector_proxy_server/agent 端，源码不在本地）"

  # ===========================================================================
  # collector_service —— 采集服务（套件激活 / 采集任务管理）
  # ===========================================================================
  collector_service:
    description: |
      EasyOps 采集服务（collector_service）—— 当前覆盖【套件激活面 kit】。
      ⚠️真调环境拓扑（2026-08-13 实测，172.30.0.90）：
      • :8125 是 collector_service 旧版——collector_job 端点在（/api/v1/collector_job HTTP400=参数错），
        但 kit 端点（activate/info/list）全 404（缺 kit 模块，源码 tmp/源代码/collector_service 印证）。
      • :12000 才是 kit activate/info/list 端点所在，需 giraffe-contract-name header 路由。
      故本 system 的 spec default_endpoint 指 :12000（env EASYOPS_COLLECTOR_SERVICE_BACKEND_URL 指 12000）。
      命令树见 easyops-collector-service.yaml；激活机制/拓扑见本 system runtime。

    spec: easyops-collector-service.yaml         # api-cli 清单（kit activate/update/list）
    default_endpoint: backend                    # :12000（kit 端点实测在此）

    endpoints:
      backend:
        base_url: ${EASYOPS_COLLECTOR_SERVICE_BACKEND_URL}   # 指 http://172.30.0.90:12000
        host: admin.easyops.local

    auth: collector-cookie

    env:
      EASYOPS_COLLECTOR_SERVICE_BACKEND_URL: ""  # :12000 完整 URL；端口见 runtime.ports.collector_service_kit

    capabilities:
      kit:
        activate: "激活套件（把定义变成运行中采集任务）。必填 instanceId；可选 objectId/params/hostIds/collectAgent"
        update:   "更新套件同步到任务（复用 activate 端点，body 加 syncToJobs/dashboards/dashboardStrategy）"
        list:     "列套件含运行态（status/params/metricSets），双源合并 collector_service + cmdb"

    runtime:
      admin_user: easyops
      env_required:
        - "EASYOPS_COLLECTOR_SERVICE_BACKEND_URL"
        - "EASYOPS_ORG"
        - "EASYOPS_USER"
      ports: { collector_service_legacy: 8125, collector_service_kit: 12000, frontend: 232 }
      host_header: admin.easyops.local
      auth: "直连 backend（endpoint.auth=none）只需 org+user header"

      # ---- 真调环境拓扑（关键，实测 2026-08-13）----
      topology: |
        .90 环境实测拓扑：
          :8125  collector_service 旧版——collector_job 端点在（/api/v1/collector_job 返 400 参数错=端点存在），
                 /v1/agent-job/cmdb-change-callback 返 500=端点存在；但 kit 端点（activate/info/list）全 404（缺 kit 模块）。
          :12000 kit activate/info/list 端点【实际在此】，需 giraffe-contract-name header 路由。
        ⚠️不可凭 tmp/源代码/collector_service（旧版 Go 源码）说「kit 端点不存在」——该源码落后于实际部署。

      giraffe_contract_routing: |
        :12000 的每个端点必须带 header `giraffe-contract-name: <proto服务名>@<版本>` 才能路由：
          • 缺 header → 'get giraffe-contract-name none'（HTTP 400）
          • 带 header 但版本不对 → 'contract <name>@<版本> not found'（HTTP 404）
        kits.go 用的 contract 名：ActivateCollectorKit@1.0.19 / ListCollectorKitInfo@1.0.5，
        但 .90 实测这两个版本都 not found——实际版本号待 e2e 探测（可能环境是别的版本）。
        ⚠️api-cli endpoint.headers 是固定 header（每请求注入），但 contract-name 因 operation 而异
        （activate≠list），无法用 endpoint.headers 统一设——真调用 --header per-op 传，或走 SDK call 时注入。

      contract_version_gap: |
        GAP：.90 环境的 kit 端点 contract 实际版本号未确定（kits.go 的 @1.0.19/@1.0.5 实测 not found）。
        e2e 激活环节先探测真实 contract 名（尝试常见版本/查服务 contract 列表），确定后回流本字段 + spec。
        探测方法：① 查 12000 是否有 contract 列举端点；② 试不同版本号；③ 从前端抓包看实际 header。

      activation_mechanism: |
        activate 端点不直接建采集任务，而是触发 collector_service 的 AssignJobs（assign_job.go:28）：
          1. activate 写/改 _COLLECTOR_EASYOPS_PLUGIN 或 _COLLECTOR_JOB 状态
          2. CMDB 发 instance 事件 → /v1/agent-job/cmdb-change-callback（8125）→ OnCmdbObjectChange → AssignJobs
          3. AssignJobs 前置：EnableAgentJob=true、Plugins 非空、Enabled=true（任一不满足静默失败）
          4. 生成采集任务下发给 collector_proxy_server + 刷新 kit 统计
          兜底：HyperInsightJobRefreshTask 每 PollInterval（默认 600s）refresh 全量任务。
        成功判定：HTTP 200 且响应 totalStatus != "fail"（kits.go:134）。

      activate_response_success: "成功判定：HTTP 200 且 data.totalStatus != 'fail'（fail 报 KITS_005 套件激活失败）"
      update_reuses_activate: "kit.update 复用 activate 端点（同 URL），body 不同（syncToJobs/dashboards/dashboardStrategy，dashboardStrategy 仅 overwrite|rename）"

      collector_job_association: "_COLLECTOR_JOB.plugins 字段存 pluginInstanceId 列表；AssignJobs 取 Plugins[0].InstanceId 作 kitId（assign_job.go:34）"
      sync_to_bypass_timer: "activate 后想立即生效不等 600s：调 collector_service:8125 POST /api/v1/sync-job-config（config/route.go:11）主动同步"

    acceptance_urls:
      kit_list: "${EASYOPS_COLLECTOR_FRONTEND_URL}/next/monitor-kit/kit/easyops?page=1&pageSize=20"
      kit_detail: "${EASYOPS_COLLECTOR_FRONTEND_URL}/next/monitor-kit/kit/easyops/{instanceId}/detail?tab=readme"
