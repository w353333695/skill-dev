# =============================================================================
# EasyOps 巡检服务（inspection）—— api-cli 集中清单
# -----------------------------------------------------------------------------
# 端口 8103（cmd/inspection/conf/conf.default.yaml:5-7），服务名 logic.inspection。
# ⚠️实测定调（2026-08-13，.90/org8888）：平台当前用【v1 体系】（INSPECTION_INFO 20 套件）。
#   本 spec 收录 v1 主线；v2（INSP_SUITE 0 套件）与「系统巡检」产品线（inspection_service/v2|v3）
#   不收录（端点索引见 formats/inspection-kit/suite-package.yaml v2_compatibility_index）。
#
# v1 体系关键认知（详见 formats/inspection-kit/）：
#   巡检套件 = 4 个 CMDB 模型组装（INFO+COLLECTOR+METRIC_GROUP+REPORT_TEMPLATE，pluginId 串联）：
#     info         套件元信息（pluginId=info.id）
#     collector    采集脚本（py2，args 含 password 类型）
#     metric_group 指标组（含阈值 conditions，平台判分）
#     template     报告模板
#   e2e 链路：建任务(task) → 调度执行产生 jobId → history 按 jobId 查结果/报告。
#   ⚠️注意：/api/v2/inspection/:pluginId/task（V2入参）与 /api/inspection_service/v3/*（系统巡检）
#   底层也是 INSPECTION_INFO，但属旁支产品线，本 spec 不收。
#
# 数据来源（契约缺失，全靠源码 route.go + 真调实测）：
#   • data/sources/backend/AutoOps/inspection/{info,metric_group,template,collector,task,
#     execution,history,statistics,import_export}/route.go
#   • 真调实测（2026-08-13）：weblogic/mssql/oracle 真实套件，端点全 200
#
# 接入面：
#   • backend —— 直连 :8103（HTTP，无 path 前缀）。默认走 backend。
#
# 鉴权：与 demo 其他系统同 EasyOps 平台。直连 backend（auth=none）org+user+Host 三件 header。
#
# ⚠️ api-cli 能力边界：
#   • import（multipart file 上传）与 export/history 的 excel|word（二进制流）——api-cli 仅
#     --print-curl 预览，真调走 curl -F / Python SDK。
#
# 知识分文件：
#   接入/端口/两套体系 → systems.yaml runtime；
#   套件结构/阈值/脚本协议/包格式 → formats/inspection-kit/；
#   字段锚 pluginId/inspectionTaskId/jobId → entities.yaml；e2e 流程 → flows/。
# =============================================================================
spec: api-cli/v1
service:
  name: easyops-inspection
  version: "1.0"
  default_endpoint: backend
  endpoints:
    backend:
      base_url: ${EASYOPS_INSPECTION_BACKEND_URL}   # 值在部署根 env.d/demo.env（含 IP+端口 8103）
      host: admin.easyops.local                      # IP 直连，Host 由 endpoint.Host 注入
      path_prefix: ""
      auth: none                                      # 直连 auth=none，org/user 由 headers 注入（实测 8103 直 200）
      headers:
        org: ${EASYOPS_ORG}
        user: ${EASYOPS_USER}

# -----------------------------------------------------------------------------
# 资源 1：insp_info —— 巡检套件元信息（info 模块，INSPECTION_INFO@EASYOPS）
# 套件四对象的统领（pluginId=info.id）。CRUD + 克隆 + 白名单 + 组合套件子目标。
# -----------------------------------------------------------------------------
resources:
  insp_info:
    description: |
      巡检套件元信息（v1 体系，INSPECTION_INFO@EASYOPS）。一个巡检套件 = info（元信息）
      + collector（脚本）+ metric_group（指标组）+ template（报告模板）四对象组装，pluginId 串联。
      ⚠️isSystem=true 是内置套件；开发新套件 isSystem=false。
      objectId 是巡检目标 CMDB 模型（开发前必须确认模型存在，见 flows/develop-inspection-kit step 1-3 门禁）。
      套件包格式/脚本协议详见 formats/inspection-kit/。
    path: ""

    operations:
      create:
        description: "创建巡检套件元信息。body 含 id（pluginId，英文唯一）/name/objectId/method/keys/isSystem 等。字段结构见 formats/inspection-kit/suite-package.yaml info_yaml_schema。"
        method: POST
        path: /api/v1/inspection
        body:
          type: object
          required: [id, name, objectId]
          description: "InspectionInfo（v1 入参）。完整字段见 formats/inspection-kit/suite-package.yaml"
          properties:
            id: { type: string, description: "套件唯一标识（pluginId），英文小写如 mysql。包根目录名=此值" }
            name: { type: string, description: "套件显示名（中文），如 MySQL巡检" }
            objectId: { type: string, description: "巡检目标 CMDB 模型 id（如 MYSQL@ONEMODEL）。开发前必须确认模型存在" }
            objectName: { type: string, description: "目标对象显示名" }
            method: { type: string, description: "巡检方式（agent=远程主机执行，默认）" }
            keys: { type: array, items: { type: string }, description: "唯一键列表（CMDB 属性 id，定位巡检实例）" }
            isSystem: { type: boolean, description: "是否内置套件（自定义 false）" }
            isApp: { type: boolean, description: "是否应用类" }
            memo: { type: string, description: "备注" }
            counterSideId: { type: string, description: "对端模型（DB类常用 HOST）" }
            relationIdWithHost: { type: string, description: "与 HOST 的关系 id（agent 找执行宿主机用）" }
        response:
          type: object
          properties:
            code: { type: integer }
            data: { type: object, additional_properties: true }

      list:
        description: "巡检套件列表（跨套件）。query 过滤。"
        method: GET
        path: /api/v1/inspection
        params:
          name: { in: query, type: string, description: "套件名模糊过滤" }
          page: { in: query, type: integer, description: "页码" }
          pageSize: { in: query, type: integer, description: "每页数" }
        response:
          type: object
          description: "list 元素含 instanceId/id/name/objectId/method/keys/isSystem/status/ctime"
          properties:
            code: { type: integer }
            data: { type: object, properties: { list: { type: array, items: { type: object, additional_properties: true } }, total: { type: integer } } }

      get:
        description: "查单个巡检套件详情（含全部元信息字段）。"
        method: GET
        path: /api/v1/inspection/{pluginId}
        params:
          pluginId: { in: path, type: string, required: true, pattern: '^[a-zA-Z_][0-9a-zA-Z_]{0,31}$', description: "套件 id（info.id，如 weblogic/mysql，非 13hex instanceId）" }
        response:
          type: object
          properties:
            code: { type: integer }
            data: { type: object, additional_properties: true, description: "完整套件元信息（instanceId/id/name/objectId/keys/method/relationIdWithHost/...）" }

      update:
        description: "更新巡检套件元信息。"
        method: PUT
        path: /api/v1/inspection/{pluginId}
        params:
          pluginId: { in: path, type: string, required: true, pattern: '^[a-zA-Z_][0-9a-zA-Z_]{0,31}$' }
        body: { type: object, additional_properties: true, description: "更新的套件字段" }
        response: { type: object, properties: { code: { type: integer } } }

      delete:
        description: "删除巡检套件元信息。⚠️建议先删关联对象（metric_group/collector/template）或用导入导出对账，避免孤儿数据。"
        method: DELETE
        path: /api/v1/inspection/{pluginId}
        params:
          pluginId: { in: path, type: string, required: true, pattern: '^[a-zA-Z_][0-9a-zA-Z_]{0,31}$' }
        response: { type: object, properties: { code: { type: integer } } }

      clone:
        description: "克隆巡检套件（含关联对象，改 pluginId）。基于内置套件定制时用（内置 isSystem=true 禁改，克隆后改）。"
        method: POST
        path: /api/v1/inspection/clone_info/{pluginId}
        params:
          pluginId: { in: path, type: string, required: true, description: "源套件 id" }
        body: { type: object, additional_properties: true, description: "克隆参数（新 pluginId/name）" }
        response: { type: object, properties: { code: { type: integer } } }

  # -----------------------------------------------------------------------------
  # 资源 2：insp_metric_group —— 指标组（metric_group 模块）
  # 含子指标 vals + 阈值 conditions（平台执行后判分）。category 两级点分强校验。
  # -----------------------------------------------------------------------------
  insp_metric_group:
    description: |
      巡检指标组（INSPECTION_METRIC_GROUP）。含子指标 vals（含阈值 conditions）+ 维度 dims。
      ⚠️category 必须两级点分（如 整体状态.连接数，正好 1 个点，否则报『分类格式错误』）。
      vals[].type 仅 string|int；conditions 的 comparator/level 约束详见 formats/inspection-kit/metric-threshold.yaml。
      删除副作用：更新时删掉的 val 会同步从 task 和 report_template 删除引用；删组级联删模板和任务中的引用。
    path: /api/v1/inspection/{pluginId}/metric-groups

    operations:
      create:
        description: "创建指标组。body 含 id/name/category/dims/vals（含 conditions 阈值）。"
        method: POST
        path: /api/v1/inspection/{pluginId}/metric-groups
        params:
          pluginId: { in: path, type: string, required: true, description: "套件 id" }
        body:
          type: object
          required: [id, name, category, vals]
          description: "指标组定义。阈值规则见 formats/inspection-kit/metric-threshold.yaml"
          properties:
            id: { type: string, description: "指标组 id（套件内唯一，脚本输出 payload[].id 对应此）" }
            name: { type: string, description: "指标组显示名" }
            category: { type: string, pattern: '^([^.]*\.)*[^.]*$', description: "⚠️两级分类点分（正好1个点，如 整体状态.连接数）" }
            memo: { type: string }
            dims: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string } } }, description: "维度列" }
            vals: { type: array, items: { type: object }, description: "指标值列表（至少1个，每项含 id/name/type/weight/conditions，结构见 metric-threshold.yaml mysql_threshold_example）" }
        response: { type: object, properties: { code: { type: integer } } }

      list:
        description: "列出套件的所有指标组（真调 weblogic 返回 8 组）。"
        method: GET
        path: /api/v1/inspection/{pluginId}/metric-groups
        params:
          pluginId: { in: path, type: string, required: true, description: "套件 id" }
        response:
          type: object
          properties:
            code: { type: integer }
            data: { type: object, properties: { list: { type: array, items: { type: object, additional_properties: true } }, total: { type: integer } } }

      get:
        description: "查单个指标组（含 vals+conditions 完整定义）。"
        method: GET
        path: /api/v1/inspection/{pluginId}/metric-groups/{metricGroupId}
        params:
          pluginId: { in: path, type: string, required: true }
          metricGroupId: { in: path, type: string, required: true, description: "指标组 id" }
        response: { type: object, properties: { code: { type: integer }, data: { type: object, additional_properties: true } } }

      update:
        description: "更新指标组。⚠️Update 时 vals 必填（至少 1 个值类型指标）。删掉的 val 级联删 task/template 引用。"
        method: PUT
        path: /api/v1/inspection/{pluginId}/metric-groups/{metricGroupId}
        params:
          pluginId: { in: path, type: string, required: true }
          metricGroupId: { in: path, type: string, required: true }
        body: { type: object, additional_properties: true, description: "更新后的完整指标组（vals 必填）" }
        response: { type: object, properties: { code: { type: integer } } }

      delete:
        description: "删除指标组。级联删除 report_template 和 task 中的引用。"
        method: DELETE
        path: /api/v1/inspection/{pluginId}/metric-groups/{metricGroupId}
        params:
          pluginId: { in: path, type: string, required: true }
          metricGroupId: { in: path, type: string, required: true }
        response: { type: object, properties: { code: { type: integer } } }

  # -----------------------------------------------------------------------------
  # 资源 3：insp_collector —— 采集脚本（collector 模块）
  # py2 脚本 + args 参数定义（含 password 类型）。⚠️脚本协议与采集套件完全不同。
  # -----------------------------------------------------------------------------
  insp_collector:
    description: |
      巡检采集脚本（INSPECTION_COLLECTOR）。py2 脚本存 content 字段，参数定义存 args。
      ⚠️脚本协议（参数注入/start-end标记/instanceId标记）见 formats/inspection-kit/script-protocol.yaml。
      ⚠️args 设计（含 password 类型安全规范）见 formats/inspection-kit/args-design.yaml。
      collector-debug 可在线试跑脚本（开发调试利器）。
    path: /api/v1/inspection/{pluginId}/collector

    operations:
      create:
        description: "创建采集脚本。body 含 name/script(python|shell)/args(参数定义数组)/content(py2源码)。"
        method: POST
        path: /api/v1/inspection/{pluginId}/collector
        params:
          pluginId: { in: path, type: string, required: true, description: "套件 id" }
        body:
          type: object
          required: [name, script, args, content]
          description: "采集脚本定义。args 结构见 formats/inspection-kit/args-design.yaml；content 是 py2 源码"
          properties:
            name: { type: string, description: "脚本名（如 script）" }
            script: { type: string, enum: [python, shell], description: "脚本类型（默认 python，py2.7）" }
            args: { type: array, items: { type: object }, description: "参数定义数组（key/alias/type/require/source/default）。⚠️密码类必须 type:password" }
            content: { type: string, description: "Python/Shell 源码（py2 语法，协议见 script-protocol.yaml）" }
        response: { type: object, properties: { code: { type: integer } } }

      list:
        description: "列出套件的采集脚本（1 套件通常 1 个）。"
        method: GET
        path: /api/v1/inspection/{pluginId}/collector
        params:
          pluginId: { in: path, type: string, required: true }
        response:
          type: object
          properties:
            code: { type: integer }
            data: { type: object, properties: { list: { type: array, items: { type: object, additional_properties: true } }, total: { type: integer } } }

      get:
        description: "查单个采集脚本（含 args 和 content 完整源码）。"
        method: GET
        path: /api/v1/inspection/{pluginId}/collector/{collectorId}
        params:
          pluginId: { in: path, type: string, required: true }
          collectorId: { in: path, type: string, required: true, description: "采集器 id" }
        response: { type: object, properties: { code: { type: integer }, data: { type: object, additional_properties: true } } }

      update:
        description: "更新采集脚本（改脚本源码/参数定义）。"
        method: PUT
        path: /api/v1/inspection/{pluginId}/collector/{collectorId}
        params:
          pluginId: { in: path, type: string, required: true }
          collectorId: { in: path, type: string, required: true }
        body: { type: object, additional_properties: true, description: "更新后的脚本定义" }
        response: { type: object, properties: { code: { type: integer } } }

      delete:
        description: "删除采集脚本。"
        method: DELETE
        path: /api/v1/inspection/{pluginId}/collector/{collectorId}
        params:
          pluginId: { in: path, type: string, required: true }
          collectorId: { in: path, type: string, required: true }
        response: { type: object, properties: { code: { type: integer } } }

      debug:
        description: "在线调试采集脚本（试跑 content，看输出是否符合协议）。开发套件时的调试利器。"
        method: POST
        path: /api/v1/inspection/{pluginId}/collector-debug
        params:
          pluginId: { in: path, type: string, required: true }
        body: { type: object, additional_properties: true, description: "调试请求（脚本内容+模拟参数）" }
        response: { type: object, additional_properties: true, description: "调试执行结果" }

  # -----------------------------------------------------------------------------
  # 资源 4：insp_template —— 报告模板（template 模块）
  # -----------------------------------------------------------------------------
  insp_template:
    description: |
      巡检报告模板（INSPECTION_REPORT_TEMPLATE）。详情模板（metricgroups）+ 总览模板（summarytemplates）。
      可选对象（套件可无模板，导入失败不回退可页面新建）。
      ⚠️删除前置：模板被巡检任务引用时拒删（『已关联巡检任务，不可删除』）。
    path: /api/v1/inspection/{pluginId}/report-templates

    operations:
      create:
        description: "创建报告模板。body 含 name/metricgroups(详情模板)/summarytemplates(总览模板)。"
        method: POST
        path: /api/v1/inspection/{pluginId}/report-templates
        params:
          pluginId: { in: path, type: string, required: true }
        body:
          type: object
          required: [name]
          properties:
            name: { type: string, description: "模板名" }
            memo: { type: string }
            metricgroups: { type: array, items: { type: object }, description: "详情模板（displaytype: LineChart/BarChart/Form/CycleChart）" }
            summarytemplates: { type: object, description: "总览模板（metricgroups+metrics，displaytype: Form/LineChart/BarChart/DoughnutChart/Card）" }
        response: { type: object, properties: { code: { type: integer } } }

      list:
        description: "列出套件的报告模板。"
        method: GET
        path: /api/v1/inspection/{pluginId}/report-templates
        params:
          pluginId: { in: path, type: string, required: true }
        response:
          type: object
          properties:
            code: { type: integer }
            data: { type: object, properties: { list: { type: array, items: { type: object, additional_properties: true } }, total: { type: integer } } }

      get:
        description: "查单个报告模板。"
        method: GET
        path: /api/v1/inspection/{pluginId}/report-templates/{templateId}
        params:
          pluginId: { in: path, type: string, required: true }
          templateId: { in: path, type: string, required: true }
        response: { type: object, properties: { code: { type: integer }, data: { type: object, additional_properties: true } } }

      update:
        description: "更新报告模板。"
        method: PUT
        path: /api/v1/inspection/{pluginId}/report-templates/{templateId}
        params:
          pluginId: { in: path, type: string, required: true }
          templateId: { in: path, type: string, required: true }
        body: { type: object, additional_properties: true }
        response: { type: object, properties: { code: { type: integer } } }

      delete:
        description: "删除报告模板。⚠️前置：被巡检任务引用拒删。"
        method: DELETE
        path: /api/v1/inspection/{pluginId}/report-templates/{templateId}
        params:
          pluginId: { in: path, type: string, required: true }
          templateId: { in: path, type: string, required: true }
        response: { type: object, properties: { code: { type: integer } } }

  # -----------------------------------------------------------------------------
  # 资源 5：insp_task —— 巡检任务（task 模块，e2e 执行主线）
  # 建任务 → 调度触发 → 产生 jobId → history 查结果。
  # -----------------------------------------------------------------------------
  insp_task:
    description: |
      巡检任务（v1 主线）。关联套件（pluginId）+ 巡检目标（targets）+ 调度（taskType/taskScheduler）+ 通知。
      e2e 链路：create（建任务，触发注册 scheduler）→ 调度到点执行（或等定时）→ history 按 jobId 查结果。
      调度：taskType=once（绝对时间 2006-01-02 15:04:05）/ crontab（cron 表达式）。
      ⚠️无内置 cron，定时委托外部 scheduler 服务（到点回调 inspection 的 callback URL）。
    path: /api/v1/inspection/{pluginId}/task

    operations:
      create:
        description: |
          创建巡检任务。body 含 name/targets（巡检目标实例）/taskType（once|crontab）/taskScheduler（时间或cron）/
          args（连接参数如 username/password）/vals（阈值覆盖）/notify 配置。
          创建后注册外部 scheduler（once 到点/crontab 周期触发执行）。
        method: POST
        path: /api/v1/inspection/{pluginId}/task
        params:
          pluginId: { in: path, type: string, required: true, description: "套件 id" }
        body:
          type: object
          required: [name]
          description: "InspectionTask。targets 必填（巡检目标 CMDB 实例）"
          properties:
            name: { type: string, description: "任务名" }
            targets: { type: array, items: { type: object, properties: { instanceId: { type: string, description: "巡检目标 CMDB 实例 id（必填）" } } }, description: "巡检目标实例列表" }
            taskType: { type: string, enum: [once, crontab], description: "调度类型（once=单次绝对时间/crontab=cron表达式）" }
            taskScheduler: { type: string, description: "once=2006-01-02 15:04:05 格式时间；crontab=cron 表达式" }
            args: { type: array, items: { type: object, properties: { key: { type: string }, value: { type: string } } }, description: "连接参数（username/password/db_name 等，对应脚本 args 定义）" }
            vals: { type: array, items: { type: object }, description: "阈值覆盖（valSet=false 时用自定义 conditions，否则用套件默认）" }
            isAllNotify: { type: boolean, description: "是否全量通知" }
            notifyMethod: { type: string, description: "通知方式（email）" }
            notifyUser: { type: array, items: { type: string }, description: "通知人" }
        response:
          type: object
          properties:
            code: { type: integer }
            data: { type: object, additional_properties: true, description: "含 inspectionTaskId（任务 id）" }

      list:
        description: "列出套件的巡检任务。"
        method: GET
        path: /api/v1/inspection/{pluginId}/task
        params:
          pluginId: { in: path, type: string, required: true }
        response:
          type: object
          properties:
            code: { type: integer }
            data: { type: object, properties: { list: { type: array, items: { type: object, additional_properties: true } }, total: { type: integer } } }

      get:
        description: "查任务详情（含 targets/调度/args/vals 完整定义）。"
        method: GET
        path: /api/v1/inspection/{pluginId}/task/{inspectionTaskId}
        params:
          pluginId: { in: path, type: string, required: true }
          inspectionTaskId: { in: path, type: string, required: true, pattern: '^[0-9a-z]{13}$', description: "任务实例 id（13hex）" }
        response: { type: object, properties: { code: { type: integer }, data: { type: object, additional_properties: true } } }

      update:
        description: "更新任务（改目标/调度/参数/通知）。"
        method: PUT
        path: /api/v1/inspection/{pluginId}/task/{inspectionTaskId}
        params:
          pluginId: { in: path, type: string, required: true }
          inspectionTaskId: { in: path, type: string, required: true, pattern: '^[0-9a-z]{13}$' }
        body: { type: object, additional_properties: true }
        response: { type: object, properties: { code: { type: integer } } }

      delete:
        description: "删除任务（同步删外部 scheduler 注册）。"
        method: DELETE
        path: /api/v1/inspection/{pluginId}/task/{inspectionTaskId}
        params:
          pluginId: { in: path, type: string, required: true }
          inspectionTaskId: { in: path, type: string, required: true, pattern: '^[0-9a-z]{13}$' }
        response: { type: object, properties: { code: { type: integer } } }

  # -----------------------------------------------------------------------------
  # 资源 6：insp_history —— 执行历史/结果（history 模块，e2e 查结果主线）
  # -----------------------------------------------------------------------------
  insp_history:
    description: |
      巡检执行历史与结果（v1，按 jobId 查）。执行产生 jobId → list 看历史 → get 看详情（评分/达标）→
      abnormal 下钻异常 → excel|word 导出报告。
      评分/状态判定规则见 formats/inspection-kit/metric-threshold.yaml。
    path: ""

    operations:
      list:
        description: "套件的执行历史列表（每行一次执行：jobId/status/score/passingRate）。"
        method: GET
        path: /api/v1/inspection/{pluginId}/history
        params:
          pluginId: { in: path, type: string, required: true }
          page: { in: query, type: integer }
          pageSize: { in: query, type: integer }
        response:
          type: object
          properties:
            code: { type: integer }
            data: { type: object, properties: { list: { type: array, items: { type: object, additional_properties: true } }, total: { type: integer } } }

      get:
        description: "单次执行详情（每个 target 的评分/状态/异常指标）。"
        method: GET
        path: /api/v1/inspection/{pluginId}/history/{jobId}
        params:
          pluginId: { in: path, type: string, required: true }
          jobId: { in: path, type: string, required: true, description: "执行 id" }
        response: { type: object, properties: { code: { type: integer }, data: { type: object, additional_properties: true, description: "含 targets[]（status/score/anomalies）" } } }

      statistics:
        description: "单次执行统计（成功数/评分分布）。"
        method: GET
        path: /api/v1/inspection/{pluginId}/history/{jobId}/statistics
        params:
          pluginId: { in: path, type: string, required: true }
          jobId: { in: path, type: string, required: true }
        response: { type: object, properties: { code: { type: integer }, data: { type: object, additional_properties: true } } }

      abnormal_metrics:
        description: "单次执行的异常指标列表（按 level 分组的异常明细）。"
        method: GET
        path: /api/v1/inspection/{pluginId}/history/{jobId}/abnormal-metrics
        params:
          pluginId: { in: path, type: string, required: true }
          jobId: { in: path, type: string, required: true }
        response: { type: object, properties: { code: { type: integer }, data: { type: object, additional_properties: true } } }

      export_excel:
        description: "导出单次执行 Excel 报告。⚠️二进制流，api-cli 仅 --print-curl，真调走 curl/SDK 存盘。"
        method: GET
        path: /api/v1/inspection/{pluginId}/history/{jobId}/excel
        params:
          pluginId: { in: path, type: string, required: true }
          jobId: { in: path, type: string, required: true }
        response: { type: file, description: "Excel 二进制流" }

      export_word:
        description: "导出单次执行 Word 报告。⚠️二进制流，走 curl/SDK。"
        method: GET
        path: /api/v1/inspection/{pluginId}/history/{jobId}/word
        params:
          pluginId: { in: path, type: string, required: true }
          jobId: { in: path, type: string, required: true }
        response: { type: file, description: "Word 二进制流" }

  # -----------------------------------------------------------------------------
  # 资源 7：insp_execution —— 执行控制（terminate）
  # -----------------------------------------------------------------------------
  insp_execution:
    description: "巡检执行控制（终止卡死的执行）。"
    path: ""
    operations:
      terminate:
        description: "终止一次巡检执行（杀 easy_command 进程，强制置 failed）。"
        method: PUT
        path: /api/v1/inspection/{pluginId}/job/{jobId}/terminate
        params:
          pluginId: { in: path, type: string, required: true }
          jobId: { in: path, type: string, required: true, description: "执行 id" }
        response: { type: object, properties: { code: { type: integer } } }

  # -----------------------------------------------------------------------------
  # 资源 8：insp_statistics —— 统计（statistics 模块）
  # -----------------------------------------------------------------------------
  insp_statistics:
    description: "巡检统计（总览/异常下钻）。"
    path: ""
    operations:
      overview:
        description: "巡检总览（跨套件：成功/失败/成功率，时间区间）。"
        method: GET
        path: /api/v1/inspection_overview
        params:
          startTime: { in: query, type: string, description: "开始时间" }
          endTime: { in: query, type: string, description: "结束时间" }
        response: { type: object, properties: { code: { type: integer }, data: { type: object, additional_properties: true } } }

      abnormal_metric_group:
        description: "单次执行的异常指标组列表。"
        method: GET
        path: /api/v1/inspection/{pluginId}/statistics/{jobId}/abnormal-metric-group
        params:
          pluginId: { in: path, type: string, required: true }
          jobId: { in: path, type: string, required: true }
        response: { type: object, properties: { code: { type: integer }, data: { type: object, additional_properties: true } } }

  # -----------------------------------------------------------------------------
  # 资源 9：insp_package —— 套件导入导出（import_export 模块，v1）
  # ⚠️multipart/binary，api-cli 仅 --print-curl 预览，真调走 curl -F / SDK。
  # -----------------------------------------------------------------------------
  insp_package:
    description: |
      巡检套件包导入导出（v1 体系）。tar.gz（info.yaml+metrics.yaml+collectors/script.py+reports_temp/detail.yaml+models.json）。
      包格式详见 formats/inspection-kit/suite-package.yaml。
      ⚠️导出不幂等：重复 pluginId 导入直接报错（mongo 重复键），需先删旧或改 id。
      multipart 上传 api-cli 不支持，真调走 curl -F "file=@<包>.tar.gz" 或 SDK。
    path: ""
    operations:
      export:
        description: |
          导出 v1 套件为 tar.gz（含指标组/模板/采集器/关联CMDB模型）。
          ⚠️二进制流，api-cli 仅 --print-curl，真调走 curl -o / SDK 存盘。
        method: GET
        path: /api/v1/inspection-export/{pluginId}
        params:
          pluginId: { in: path, type: string, required: true, description: "套件 id" }
        response: { type: file, description: "application/octet-stream，<pluginId>.tar.gz" }

      import:
        description: |
          导入 v1 套件包（multipart file 上传 tar.gz）。导入顺序：模型→套件→指标组→采集器→模板（部分失败有回退）。
          ⚠️重复 pluginId 报错（不幂等）。multipart 走 curl -F "file=@<包>.tar.gz" / SDK。
        method: POST
        path: /api/v1/inspection-import
        # multipart（file 字段），api-cli 不支持，走 SDK
        response: { type: object, properties: { code: { type: integer } } }
