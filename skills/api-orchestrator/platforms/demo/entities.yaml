# =============================================================================
# platforms/demo/entities.yaml
# 字段锚 + 实体间映射/转换。对应 SKILL.md：entities.yaml — 跨系统实体映射。
# 单系统内即「实体间靠什么字段关联 + 字段格式约定」，编排挡接线用。
# =============================================================================
entities:
  object_id:
    description: 模型（object）主键锚。实例、关系、属性都通过它挂到模型。
    format: "NAME@NAMESPACE（如 OCEANBASE@EASYOPS）"
    namespaces: [EASYOPS, ONEMODEL]   # 实测见到的命名空间；ONEMODEL 多为系统/权限模型
    rules:
      - "无正则强制，仅非空；@NAMESPACE 在运行时解析"
      - "同命名空间内 objectId / name 不可重复"
    used_by:
      - object_model（path/查询主键）
      - object_instance.search（path 参数 /v3/object/{object_id}/instance/_search）
      - cmdb_relation.left_object_id / right_object_id（锚到模型）
      - object_attr / object_relation（path 含 object_id）

  instance_id:
    description: 实例主键锚。
    format: "13 位 [0-9a-z]（微秒时间戳 hex，如 5cf1da055c315）；新建可不带，后端自动生成"
    pattern: '^[0-9a-z]{13}$'
    used_by:
      - object_instance.search（fields 返回 / query 过滤）
      - object_instance.import（datas 带上则定向改；keys=[instanceId] 则纯 update）
      - object_instance.delete（instanceIds 分号串）
      - 关系字段值（关联对端实例 instanceId）

  relation_id:
    description: 关系主键锚。object_relation 细粒度 CRUD 用它做 path 参数。
    format: "导入时不填则自动生成；约定可形如 <LEFT_OBJECT>_<RIGHT_ROLE>"

  attr_id:
    description: 属性主键锚（模型内唯一）。
    convention: "给已存在模型新增属性时，id 加 _ 前缀（如 _regulatory_level）标识新增。详见 objects.yaml cmdb_object.side_effects。"

  org:
    description: 租户锚（请求头 org）。每个 org 一个独立数据库/命名空间。
    type: integer
    rules: ["gte:1（org=0 无库）", "系统自带 0/1/2 禁动；测试 18832008"]
    # 接入侧（怎么取 org）见 systems.yaml runtime

  user:
    description: 用户锚（请求头 user）。模型系统管理员=easyops。
    # 权限差异见 systems.yaml runtime

  # ===========================================================================
  # AutoOps 工具管理锚（tool_service）
  # ===========================================================================
  tool_id:
    description: 工具主键锚（tool_service）。前端详情页 URL 的 <id> 即此；≠ CMDB instanceId。
    format: "32 位 hex md5（服务端生成，如 e292a31864662200d85a6a72ec89854a）"
    pattern: '^[a-fA-F0-9]{32}$'
    used_by:
      - tool.get / tool.update / tool.delete / tool_package.export / tool_package.export_check（path 参数 {toolId}）
      - tool_execution.run（body.toolId）
      - tool_version.list（path 参数 {toolId}）

  tool_vId:
    description: 工具版本主键锚。支持别名 $latest_version/$latest_development/$latest_production（get/run 默认 $latest_production）。
    format: "32 位 hex；或别名 $latest_version/$latest_development/$latest_production"
    used_by:
      - tool.get（query vId）、tool_execution.run（body vId）
      - tool.update 派生新版本后返回新 vId

  tool_version_id:
    description: 导出/删除专用的版本 ID 锚。⚠️参数名是 versionId 不是 vId，与 get/run 的 vId 不一致——同名概念两种参数名，易混。
    format: "32 位 hex"
    pattern: '^[a-fA-F0-9]{32}$'
    used_by:
      - tool_package.export（query versionId，必填；场景5）
      - tool.delete（query versionId，可选，按版本删）
    trap: "导出/删除用 versionId；get/run 用 vId。从 get 拿到 vId 喂 export 时要改名（值相同，参数名不同）。"

  exec_id:
    description: 工具执行句柄锚（异步）。tool_execution.run 返回，轮询取结果用。
    used_by:
      - tool_execution.run 返回 execId
      - tool_execution.get_result / get_table / get_status（path 参数 {execId}）

  # ===========================================================================
  # ITSM 表单管理锚（flowable_service）
  # ===========================================================================
  form_id:
    description: 表单主键锚（flowable_service）。form 资源 path 参数 {formId}；form_version 资源 path 参数 {formId}。
    format: "13 位 hex（CMDB 生成，不可在 body 指定；save 返回 data.instanceId）"
    pattern: '^[0-9a-z]{13}$'
    used_by:
      - form.delete（path {formId}）
      - form_version.list / get / update / delete / set_main（path {formId}）

  form_version_id:
    description: 表单版本主键锚。form_version 资源 path 参数。
    format: "13 位 hex（CMDB 生成，不可在 body 指定；save 返回 data.lastestVersion.instanceId；update 对 done 版派生新草稿返回新 versionId）"
    pattern: '^[0-9a-z]{13}$'
    used_by:
      - form_version.get / update / set_main（path {versionId}）
      - form_version.delete（path {versionIds}，复数分号，⚠️参数名不同：versionIds 非 versionId）
    trap: "delete 路径参数是 versionIds（复数，分号分隔）；其余是 versionId（单数）。值同 13hex，参数名不同。"
    state_machine: "版本状态两态：unfinished(草稿)/done(完成)。set_main 须 done。无 draft/published 叫法。"

  # ===========================================================================
  # ITSM 流程定义锚（flowable_service）
  # ===========================================================================
  process_definition_id:
    description: 流程定义主键锚（flowable_service）。process_definition path 参数 {definitionId}；process_version path 参数 {definitionId}。
    format: "13 位 hex（CMDB 生成，不可在 body 指定；create 返回 data.instanceId）"
    pattern: '^[0-9a-z]{13}$'
    used_by:
      - process_definition.edit / delete（path {definitionId}）
      - process_version.list / get / create / edit / delete / set_main（path {definitionId}）

  process_version_id:
    description: 流程版本主键锚。process_version path 参数。list 支持 'lastest' 别名。
    format: "13 位 hex（CMDB 生成；create 返回 versionId）"
    pattern: '^[0-9a-z]{13}$'
    used_by:
      - process_version.get / edit / set_main（path {versionId}）
      - process_version.delete（path {versionIds} 复数分号，⚠️参数名 versionIds）
      - process_form.set（path {versionId}）
    trap: "delete 参数名是 versionIds（复数）；其余 versionId。批量是壳只删第一个。"
    state_machine: "两态 unfinished/done。done 才能设主版本+部署 Flowable；done 不可编辑。"

  service_instance_id:
    description: 服务实例主键锚（flowable_service）。service_instance resource path 参数 {instanceId}。
    format: "13 位 hex（CMDB 生成，不可在 body 指定；create 返回 data.instanceId）"
    pattern: '^[0-9a-z]{13}$'
    used_by:
      - service_instance.get / edit / delete（path {instanceId}）

  # ---------- ITSM 触发器/通知/SLA/值班组 id（2026-08-11，均 8134 flowable_service）----------
  trigger_id:
    description: 触发器主键锚。trigger resource path 参数 triggerId / triggerIds。
    format: "13 位 hex（^[0-9a-z]{13}$，validator 证实）；delete 用 triggerIds 分号批量（path）"
    used_by:
      - trigger.get / update（path triggerId）
      - trigger.delete（path triggerIds 分号）
  notify_policy_id:
    description: 通知策略主键锚。notify_policy resource。
    format: "13 位 hex；⚠️delete 用 instanceIds 但走 query（非 path）—— DELETE /notify_policy?instanceIds=a;b"
    used_by:
      - notify_policy.get / update（path instanceId）
      - notify_policy.delete（query instanceIds 分号）
  sla_rule_id:
    description: SLA 规则主键锚。sla resource path 参数 ruleId / ruleIds。
    format: "13 位 hex；delete 用 ruleIds 分号批量（path）"
    used_by:
      - sla.get / update（path ruleId）
      - sla.delete（path ruleIds 分号）
  duty_group_id:
    description: 值班组主键锚。duty_group resource path 参数 groupId / groupIds。
    format: "13 位 hex；delete 用 groupIds 分号批量（path）"
    used_by:
      - duty_group.get / update（path groupId）
      - duty_group.delete（path groupIds 分号）

  # ---------- 工作日历 id（跨 system：sys_setting 微服务，⚠️24hex ≠ 13hex）----------
  work_calendar_id:
    description: |
      工作日历主键锚（sys_setting 微服务 :8271，独立 system easyops-sys-setting）。
      ⚠️格式 24 位 hex MongoDB ObjectId（≠ flowable_service 的 13hex 微秒时间戳）——
      印证 work_calendar 属不同存储/微服务。被 ITSM SLA 经
      sla.slaConfig[].levelConfig[].workingCalendarId 引用（跨 system 接力）。
    format: "24 位 hex MongoDB ObjectId"
    used_by:
      - work_calendar.get / update / delete（path id / ids 分号批量，均在 sys-setting system 的 spec）
      - sla.create/update 的 body slaConfig[].levelConfig[].workingCalendarId（跨 system：先在 sys-setting 建日历拿 id，再填入 itsm 的 sla body）

  # ===========================================================================
  # 常用 CMDB 模型速查表（省去按语义查 model id）
  # 编排时直接用 objectId，不用先 object_model.list?q=主机 → 拿 id。
  # 别名覆盖自然语言常见说法——LLM 匹配后直出 objectId。
  # ===========================================================================
  common_models:
    description: |
      EasyOps CMDB 常用模型速查。编排场景提到这些实体时直接取 objectId，
      省去 object_model.list 按 name/别名 搜索的步骤。按分类组织。
      查找：匹配自然语言关键词 → 直出 objectId → 喂 object_instance.search 的 path {object_id}。
    categories:
      组织信息:
        - { name: 用户, aliases: [账号, 人员, 用户账号], objectId: USER }
        - { name: 用户组, aliases: [用户分组, 群组, 组, Team], objectId: USER_GROUP }
      应用资源.应用系统:
        - { name: 系统, aliases: [应用系统, 业务系统], objectId: APP_SYSTEM@ONEMODEL }
        - { name: 服务集, aliases: [集群, 环境], objectId: SERVICE_SET@ONEMODEL }
        - { name: 应用, aliases: [应用模块, 模块], objectId: APPLICATION@ONEMODEL }
      基础设施.计算资源:
        - { name: 主机, aliases: [操作系统], objectId: HOST }
        - { name: 物理服务器, aliases: [服务器, 物理机], objectId: PHYSICAL_SERVER@ONEMODEL }
      基础设施.数据中心:
        - { name: 机房信息, aliases: [机房, IDC], objectId: IDC@ONEMODEL }
        - { name: 机柜信息, aliases: [机柜, 机架], objectId: RACK@ONEMODEL }
        - { name: 数据中心, aliases: [DC, 机房园区], objectId: DATA_CENTER@ONEMODEL }
      基础设施.网络资源:
        - { name: 交换机, aliases: [Switch, 网络交换机], objectId: SWITCH@ONEMODEL }
        - { name: 路由器, aliases: [Router, 网关设备], objectId: ROUTER@ONEMODEL }
        - { name: 负载均衡器, aliases: [LB, 负载均衡, SLB], objectId: LOADBALANCER@ONEMODEL }
      基础设施.存储资源:
        - { name: 存储设备, aliases: [存储阵列, 磁盘阵列, SAN], objectId: STORAGE@ONEMODEL }
      基础设施.安全资源:
        - { name: 防火墙, aliases: [FW, 防火墙设备], objectId: FIREWALL@ONEMODEL }
    usage: |
      场景："查主机的实例" → common_models 匹配 "主机" → objectId=HOST
      → scripts/run.sh --spec easyops-cmdb.yaml object_instance search HOST ...
      省去：object_model.list --q 主机 → 解析 → 拿 objectId → 再 search。
    count_recipe: |
      计数（"有几个/多少"）→ object_instance.search + 读 stderr 的 _meta.total（新版 binary）：
        scripts/run.sh --spec easyops-cmdb.yaml object_instance search <objectId> \
          --body '{"fields":["instanceId"],"page":1,"page_size":1,"ignore_missing_field_error":true}'
        → stderr {"_meta":{"total":N}} 即实例总数（fields 最小化只取数，不拉数据）。
      边界：空结果（total=0）时 stderr 无 total、stdout 也空——exit 0 即代表 0 条
        （新版错误可读到 stderr 且 exit≠0，故 exit0+空输出可放心判 0，无需 raw 兜底）。

# =============================================================================
# 跨实体转换（编排挡 step 间接力时怎么传字段）
# =============================================================================
transitions:
  - from: object_model.list
    pick: objectId
    to: [object_model.detail, object_model.delete, object_model.export, object_instance.search]
    how: "list 返回的 objectId（NDJSON 每行一个）→ 作为 path 参数 {object_id} 喂下游"
  - from: object_model.export
    pick: data[].attrList[].id
    to: object_model.import
    how: "导出完整模型 → 改 attrList（新属性加 _ 前缀）→ import 回写（upsert）"
  - from: object_instance.search
    pick: data.list[].instanceId
    to: [object_instance.delete]
    how: "search 的 data.list[].instanceId → jq 拼成分号串喂 delete 的 instanceIds query（场景4 按 ip 范围删）"
  - from: object_instance.search
    pick: data.list[].instanceId（+ 既有属性值）
    to: [object_instance.import]
    how: "search 取目标 instanceId → 作为 import 的 keys=[instanceId] + datas（每条带 instanceId + 新属性值）做定向 update（场景3 批量补属性）"

  # ---- AutoOps 转换（编排挡 step 间接力）----
  - from: tool.list
    pick: toolId
    to: [tool.get, tool.update, tool.delete, tool_package.export, tool_package.export_check, tool_execution.run, tool_version.list]
    how: "list 返回 data.list[].toolId → 作为 path 参数 {toolId} 喂下游（场景1查到 → 场景2/3/5/6 操作同一工具）"
  - from: tool.create
    pick: data.toolId + data.vId
    to: [tool.get, tool.update, tool_execution.run, tool_package.export]
    how: "create 返回新 toolId + vId → 喂后续操作（场景2 建工具后拿 toolId 走场景3/5/6）"
  - from: tool.update
    pick: data.vId（新版本，update 派生时）
    to: [tool.get, tool_execution.run, tool_package.export]
    how: "update 派生新版本返回新 vId → 喂 get（确认新版本）/ run（执行新版本）/ export（导出新版本，注意 export 的 query 参数是 versionId 不是 vId）"
  - from: tool_execution.run
    pick: data.execId
    to: [tool_execution.get_result, tool_execution.get_table, tool_execution.get_status]
    how: "run 异步返回 execId → 轮询：先 get_status 确认完成，再 get_table（表格结果，查内存）/ get_result（每主机 stdout）。场景4。"
  - from: tool.get
    pick: data.vId（当前版本）
    to: [tool_package.export]
    how: "get 拿当前版本 vId → 导出时改名填进 export 的 versionId query（值相同，参数名不同，详见 tool_version_id.trap）"
  # ---------- ITSM 表单 ----------
  - from: form.list
    pick: data.list[].instanceId（formId）
    to: [form.delete, form_version.list, form_version.get, form_version.update, form_version.set_main]
    how: "list 返回的表单 instanceId → 作为 {formId} path 喂下游。场景②『test 几个版本』=list 找 test 的 formId → form_version.list 数 total"
  - from: form.save
    pick: data.instanceId（formId）+ data.lastestVersion.instanceId（versionId）
    to: [form_version.get, form_version.update, form.delete]
    how: "save 返回 formId + 首版本 versionId → get 校验内容 / update（done 版派生新版本=场景④）/ delete（先清版本再删 form=场景⑤）"
  - from: form_version.list
    pick: data.list[].versionInfo.instanceId（versionId）
    to: [form_version.get, form_version.update, form_version.delete]
    how: "list 返回版本 instanceId → 作为 {versionId} 喂 get/update/delete。注意 delete 的参数名是 versionIds（复数）"
  # ---------- ITSM 流程定义 ----------
  - from: process_definition.list
    pick: data.list[].instanceId（definitionId）
    to: [process_definition.edit, process_definition.delete, process_version.list, process_version.create]
    how: "list 返回流程定义 instanceId → 作为 {definitionId} 喂下游。场景①看有哪些流程 / 场景②建版本须先有 definitionId"
  - from: process_definition.create
    pick: data.instanceId（definitionId）
    to: [process_version.create, process_definition.edit, process_definition.delete]
    how: "create 返回 definitionId → process_version.create 建版本（场景②建流程后建 BPMN 版本）"
  - from: process_version.create
    pick: data.versionId
    to: [process_version.get, process_version.edit, process_version.set_main, process_form.set]
    how: "create 返回 versionId → get 校验 / edit 改 / set_main 部署生效 / process_form.set 绑表单。⚠️建版本不部署，set_main 才生效"
  - from: process_version.list
    pick: data.list[].vInstanceId（versionId）
    to: [process_version.get, process_version.edit, process_version.delete, process_version.set_main, process_form.set]
    how: "list 返回版本 id → 喂下游。delete 参数名 versionIds（复数）"
  # ---------- ITSM 触发器/通知/SLA/值班组（2026-08-11）----------
  - from: trigger.list
    pick: data.list[].instanceId（triggerId）
    to: [trigger.get, trigger.update, trigger.delete]
    how: "list 返回触发器 instanceId → 作为 {triggerId} 喂 get/update；delete 拼 ;-串喂 {triggerIds}"
  - from: notify_policy.list
    pick: data.list[].instanceId
    to: [notify_policy.get, notify_policy.update, notify_policy.delete]
    how: "list 返回策略 instanceId → 作为 {instanceId} 喂 get/update；delete 拼 ;-串喂 query instanceIds（⚠️非 path）"
  - from: sla.list
    pick: data.list[].instanceId（ruleId）
    to: [sla.get, sla.update, sla.delete]
    how: "list（POST _search）返回规则 instanceId → 作为 {ruleId} 喂 get/update；delete 拼 ;-串喂 {ruleIds}"
  - from: duty_group.list
    pick: data.list[].instanceId（groupId）
    to: [duty_group.get, duty_group.update, duty_group.delete]
    how: "list 返回值班组 instanceId → 作为 {groupId} 喂 get/update；delete 拼 ;-串喂 {groupIds}"
  # ---------- 工作日历（sys-setting system）+ 跨 system 接力到 SLA（itsm system）----------
  - from: work_calendar.list
    pick: data.list[].id（24hex）
    to: [work_calendar.get, work_calendar.update, work_calendar.delete]
    how: "list 返回日历 id（24hex）→ 作为 {id} 喂 get/update；delete 拼 ;-串喂 {ids}。⚠️均在 sys-setting system 的 spec（--spec easyops-sys-setting.yaml）"
  - from: work_calendar.create
    pick: data.id（24hex）
    to: [sla.create, sla.update]
    how: "跨 system 接力：sys-setting 的 work_calendar.create 返回 24hex id → 填入 itsm 的 sla body 的 slaConfig[].levelConfig[].workingCalendarId（场景：建 SLA 前先建工作日历）"
