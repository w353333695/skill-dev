# =============================================================================
# EasyOps ITSM（flowable_service）—— api-cli 集中清单
# -----------------------------------------------------------------------------
# 当前覆盖：表单管理（form/form_version）+ 流程定义（process_definition/process_version/process_form）+ 服务实例（service_instance）+ 工单实例（ticket）。未来 ITSM 其它域统一并入本清单。
# 表单三层体系：
#   ① form        表单层（FormSchema）—— 表单本身的 list/save(新建+首版本)/delete
#   ② form_version 表单版本层（FormSchemaVersion）—— 版本的 list/get/update/delete/set_main
#   ③ formDefinition  版本内容层 —— JSON 字符串 []Container（容器/控件/脚本/条件显示/继承）
#                  非独立端点，作为 form.save / form_version.update 的 body 字段透传。
#                  完整内容模型（5 容器 / 23 控件 / 5 生命周期脚本 / 条件显示 / 数据继承）
#                  见 objects.yaml#itsm_form_definition（本清单只定 wire 层）。
#
# 数据来源：
#   • 契约  data/api-doc/itsm-form.json（8 EAML：form + form_version CRUD）
#   • 后端  data/sources/backend/ITSM/flowable_service/form_schema_version/
#        - route.go:6-19                           （12 条路由，契约漏 4：ListVersion/V2get/V2upd/Category）
#        - form_schema_version_service.go           （CRUD 真相 + 副作用 + upsert 非对称行为）
#        - validators/{api_validator,request_validate_trees}.go （必填/正则校验）
#   • 内容模型 internal/form/definition/ + internal/enums/{field_kind,process_script}/
#     （容器/控件/脚本枚举与结构体，objects.yaml 详述）
#
# 接入面：
#   • backend —— 直连 flowable_service :8134（HTTP，无 path 前缀）。所有 verb 路径
#     带 /api/flowable_service/v1|v2 前缀，故 resource.path 留空，每 operation 持完整路径。
#   • 无 frontend 网关接入（ITSM 表单网关 per-API 路由，CLI 直连 backend 即可）。
#
# 鉴权：auth: easyops-cookie（与 cmdb/autoops 同一 cookie）。
#   ⚠️ cookie 不够！直连后端还要 org+user header（orguser 中间件，
#      cmd/flowable_service/flowable_service_start/main_start.go:336-344；缺一报
#      "org、user获取失败"）。见 endpoint.headers。
#   ⚠️ 比 cmdb 多一道权限校验：每端点校验 itsc:form_management_{access,create,update,delete}
#      4 个 action（form_schema_version_service.go:31-34），缺权限报 403「鉴权失败」。
#      实测 easyops 用户具备这 4 个权限。
#
# 关键坑（详见 systems.yaml runtime + objects.yaml side_effects）：
#   • save(POST v2/form) 非 upsert——永远新建 form + 首版本，formId/versionId 不可指定
#   • update(PUT v2/.../version/:versionId) 才是 upsert 且非对称：done 版→新建版本，unfinished→就地改
#   • 删 form 要求 version 先清空（"表单存在版本,无法删除"）；删最后一个 version 隐式级联删 form
#   • DELETE version 路径参数是 versionIds（复数，分号分隔），但代码只删第一个（批量是壳）
#   • set_main 须 state==done，触发流程表单关系换绑（ITSC_PROCESS_FORM_RELATION）
# =============================================================================
spec: api-cli/v1
service:
  name: easyops-itsm
  version: "1.0"
  default_endpoint: backend
  endpoints:
    backend:
      base_url: ${EASYOPS_ITSM_BACKEND_URL}          # http://172.30.0.232:8134
      host: admin.easyops.local                       # IP 直连，Host 由 endpoint.Host 注入
      path_prefix: ""                                 # 路由挂在 /api/flowable_service/...（每 op 持完整路径）
      auth: easyops-cookie
      headers:                                        # endpoint 级固定 header（每个请求都带）
        org: ${EASYOPS_ORG}                           # EasyOps 租户 org（测试 18832008；0/1/2 禁动）。export EASYOPS_ORG=<值>
        user: ${EASYOPS_USER}                         # EasyOps 用户（easyops 具备 itsc:form_management_* 4 权限）。export EASYOPS_USER=easyops

# -----------------------------------------------------------------------------
# 资源 1：form —— 表单（FormSchema）层。
# 路径 disparate（/api/flowable_service/v1|v2/form[/:formId]），resource.path 留空。
# -----------------------------------------------------------------------------
resources:
  form:
    description: ITSM 表单（FormSchema）—— 表单本身的查询/新建/删除。一个表单含多个版本（form_version）；表单的"内容"在版本的 formDefinition 里（不在本层）。注意：无单 form 详情端点（GET /form/:formId 不存在），取 form 元信息走 list 过滤或 form_version.get 的 formSchema 子对象。
    path: ""

    operations:
      # ---------- 列表（GET /api/flowable_service/v1/form）—— 场景① ----------
      list:
        description: 表单列表（分页，支持 name/category/creator/state/Q 模糊过滤）。注意：state 过滤的是【版本状态】(ITSC_FORM_VERSION.state) 非 form 本身；isMain=true 只取主版本，缺省取每 form 最新 ctime 版本。list 元素含 lastestMainVersion/lastestVersion（字段名 lastest 拼写如此，少一个 t，API 就这么返）。
        method: GET
        path: /api/flowable_service/v1/form
        params:
          name:     { in: query, type: string,  description: "form 名模糊匹配（$like %x%）" }
          category: { in: query, type: string,  description: "分类模糊匹配" }
          creator:  { in: query, type: string,  description: "创建者模糊匹配" }
          state:    { in: query, type: string, enum: [unfinished, done], description: "【版本状态】精确匹配（过滤的是 version.state）" }
          Q:        { in: query, type: string,  description: "通用关键词，$or 同时模糊匹配 name/state/creator" }
          isMain:   { in: query, type: boolean, description: "true=只取主版本；缺省/false=取每 form 最新 ctime 版本" }
          page:     { in: query, type: integer, description: "页码，默认 1，≥1" }
          pageSize: { in: query, type: integer, description: "每页条数，默认 10，≥1" }
        response:
          type: object
          description: "标准 wrapper：{ code, data: { page, pageSize, total, list[] } }"
          properties:
            code: { type: integer }
            data:
              type: object
              properties:
                page:     { type: integer }
                pageSize: { type: integer }
                total:    { type: integer, description: "表单总数" }
                list:
                  type: array
                  items:
                    type: object
                    properties:
                      instanceId:          { type: string, description: "表单 id（13 hex）" }
                      name:                { type: string }
                      category:            { type: string }
                      memo:                { type: string }
                      creator:             { type: string }
                      ctime:               { type: string }
                      lastestMainVersion:  { type: object, description: "最新主版本（字段名拼写如此，少 t）" }
                      lastestVersion:      { type: object, description: "最新版本" }
        pagination:
          type: offset
          page_in: query
          items_path: data.list
          page_param: page
          size_param: pageSize
          size: 10

      # ---------- 新建（POST /api/flowable_service/v2/form）—— 场景③ ----------
      save:
        description: 新建表单（永远新建 form + 第一个 isMain=true 的版本；非 upsert，formId 不可指定，由 CMDB 生成并返回）。body 含表单元信息(name/category/memo) + 首版本内容(formDefinition/versionName/state/versionMemo) + 关联(domainModelId[]/dataSourceIdList[]) + businessRules。formDefinition 是 JSON 字符串（[]Container，结构见 objects.yaml#itsm_form_definition）。场景③建主机申请表单用它。
        method: POST
        path: /api/flowable_service/v2/form
        body:
          type: object
          required: [name, category, formDefinition, state]
          description: "新建表单请求。name/category/formDefinition/state 必填。"
          properties:
            name:             { type: string, description: "表单名" }
            category:         { type: string, description: "分类（自由文本，无枚举）" }
            formDefinition:   { type: string, description: "表单定义 JSON 字符串 = []Container（容器/控件树）。完整结构见 objects.yaml#itsm_form_definition。前端二次 JSON.parse。例：JSON.stringify([{type:'row',name:'基础信息',propertys:[...]}])" }
            state:            { type: string, enum: [unfinished, done], description: "首版本状态：unfinished=草稿 / done=完成。新建通常传 unfinished" }
            versionName:      { type: string, pattern: '^\d+\.\d+\.\d+$', description: "版本号（语义化三段式，如 1.0.0）；不传则空" }
            memo:             { type: string, description: "表单级备注" }
            versionMemo:      { type: string, description: "版本级备注（落 version.memo；v1 的 vMemo 已弃用）" }
            businessRules:    { type: string, description: "业务规则 JSON 字符串（前端解释，后端透传）" }
            domainModelId:    { type: array, items: { type: string }, description: "关联的领域模型 id 列表" }
            dataSourceIdList: { type: array, items: { type: string }, description: "关联的数据源 id 列表" }
        response:
          type: object
          description: "{ code, data: { instanceId(表单), lastestVersion: {instanceId(版本), versionName, isMain, state, ...} } }"
          properties:
            code: { type: integer }
            data:
              type: object
              additional_properties: true

      # ---------- 删除（DELETE /api/flowable_service/v1/form/:formId）—— 场景⑤ ----------
      delete:
        description: 删除表单。⚠️有版本时拒绝（"表单存在版本,无法删除"）——必须先把所有版本删干净。form 不存在则静默成功（幂等）。删最后一个版本会隐式级联删 form（见 form_version.delete）。
        method: DELETE
        path: /api/flowable_service/v1/form/{formId}
        params:
          formId: { in: path, type: string, required: true, description: "表单 id（13 hex）" }

  # -----------------------------------------------------------------------------
  # 资源 2：form_version —— 表单版本（FormSchemaVersion）层。
  # 路径 disparate（/api/flowable_service/v1|v2/form/:formId/version[/:versionId|:versionIds]）。
  # V2（get/update）比 V1 多返回 businessRules/domainModel[]/formDataSources[]。
  # -----------------------------------------------------------------------------
  form_version:
    description: ITSM 表单版本（FormSchemaVersion）—— 版本的查询/改/删/设主版本。一个 form 有多版本 1:N，同时只有一个 isMain=true（由 set_main 保证，旧主版本自动降级）。版本状态机两态：unfinished(草稿)/done(完成)。版本的 formDefinition 才是表单内容（容器/控件树）。set_main=设主版本(=对外生效)，须 done 状态。
    path: ""

    operations:
      # ---------- 版本列表（GET /v1/form/:formId/version）—— 场景② ----------
      list:
        description: 列某表单的所有版本。name 参数实际是 versionName 精确匹配（非 form 名）。list 元素含 versionInfo（版本完整字段）+ processVersions（流程绑定）。
        method: GET
        path: /api/flowable_service/v1/form/{formId}/version
        params:
          formId:   { in: path, type: string, required: true, description: "表单 id（13 hex）" }
          name:     { in: query, type: string, description: "versionName 精确匹配（注意：是版本号非 form 名）" }
          state:    { in: query, type: string, enum: [unfinished, done], description: "版本状态精确匹配" }
          page:     { in: query, type: integer, description: "页码，默认 1" }
          pageSize: { in: query, type: integer, description: "每页条数，默认 10" }
        response:
          type: object
          description: "{ code, data: { page, pageSize, total, list[] } }。total=版本数（场景『有几个版本』读这个）。"
          properties:
            code: { type: integer }
            data:
              type: object
              properties:
                total: { type: integer }
                list:
                  type: array
                  items:
                    type: object
                    additional_properties: true
                    properties:
                      versionInfo: { type: object, description: "版本完整字段 {instanceId,versionName,isMain,state,memo,creator,ctime}" }
                      processVersions: { type: array, description: "绑定该版本的流程" }
        pagination:
          type: offset
          page_in: query
          items_path: data.list
          page_param: page
          size_param: pageSize
          size: 10

      # ---------- 版本详情（GET /v2/form/:formId/version/:versionId）—— 取完整 schema ----------
      get:
        description: 读取单个版本完整详情（V2 超集）。返回 formDefinition(JSON 字符串)+businessRules+form 元信息+domainModel[]+standardFields[]+formDataSources[]+userDisplayMap。formDefinition 前端需二次 JSON.parse 得到 []Container。取表单内容（容器/控件/脚本）走它。
        method: GET
        path: /api/flowable_service/v2/form/{formId}/version/{versionId}
        params:
          formId:    { in: path, type: string, required: true, description: "表单 id（13 hex）" }
          versionId: { in: path, type: string, required: true, description: "版本 id（13 hex）" }
        response:
          type: object
          description: "{ code, data: {版本字段 + formSchema + domainModel[] + ...} }"
          properties:
            code: { type: integer }
            data:
              type: object
              properties:
                instanceId:      { type: string, description: "版本 id" }
                versionName:     { type: string }
                isMain:          { type: boolean, description: "是否主版本" }
                state:           { type: string, enum: [unfinished, done] }
                memo:            { type: string }
                creator:         { type: string }
                formDefinition:  { type: string, description: "表单定义 JSON 字符串 = []Container（见 objects.yaml#itsm_form_definition）" }
                businessRules:   { type: string, description: "业务规则 JSON 字符串" }
                ctime:           { type: string }
                formSchema:      { type: object, description: "form 元信息 {instanceId,name,category,creator,memo,ctime}" }
                domainModel:     { type: array, description: "领域模型列表（V2 返整个列表；V1 只返 [0]）" }
                standardFields:  { type: array, description: "标准字段列表" }
                formDataSources: { type: array, description: "数据源列表" }
                userDisplayMap:  { type: object, description: "creator 展示名映射 {user:showName}" }

      # ---------- 改版本（PUT /v2/form/:formId/version/:versionId）—— 场景④ ----------
      update:
        description: 改表单版本（upsert，非对称）。行为按【当前 version 的 state】分：done 版→【新建一个 isMain=false 的草稿版本】（基于已发布版派生新草稿，场景④"加版本"走这条）；unfinished 版→【就地更新】。同时改 form 的 name/category/memo。versionName 唯一性：done 新建时不能与已有重，unfinished 改 versionName 也不能重（否则"重复的表单版本号"）。body 字段同 form.save。
        method: PUT
        path: /api/flowable_service/v2/form/{formId}/version/{versionId}
        params:
          formId:    { in: path, type: string, required: true, description: "表单 id" }
          versionId: { in: path, type: string, required: true, description: "【当前】版本 id（done 版→基于它派生新版本；unfinished 版→就地改它）" }
        body:
          type: object
          required: [name, category, formDefinition, state]
          description: "改版本请求（字段同 form.save）。done 版时本 body 成为新派生草稿的内容；unfinished 版时就地覆盖。"
          properties:
            name:             { type: string, description: "表单名（同时改 form.name）" }
            category:         { type: string, description: "分类（同时改 form.category）" }
            formDefinition:   { type: string, description: "表单定义 JSON 字符串 = []Container（见 objects.yaml#itsm_form_definition）" }
            state:            { type: string, enum: [unfinished, done], description: "目标版本状态" }
            versionName:      { type: string, pattern: '^\d+\.\d+\.\d+$', description: "版本号（done 派生新版本时的新版本号，不能与已有重）" }
            memo:             { type: string, description: "表单级备注" }
            versionMemo:      { type: string, description: "版本级备注" }
            businessRules:    { type: string, description: "业务规则 JSON 字符串" }
            domainModelId:    { type: array, items: { type: string } }
            dataSourceIdList: { type: array, items: { type: string } }
        response:
          type: object
          description: "{ code, data: {版本字段} }（done 版时 data 是新派生的草稿版本）"
          properties:
            code: { type: integer }
            data: { type: object, additional_properties: true }

      # ---------- 删版本（DELETE /v1/form/:formId/version/:versionIds）—— 场景⑤ ----------
      delete:
        description: 删除版本。⚠️路径参数是 versionIds（复数，分号分隔，契约误写单数）；但代码只用第一个——批量是壳，实际只删一个。被流程节点引用时拒绝（"表单已绑定节点，不可删除!"）。副作用：删完若该 form 已无任何版本，【隐式级联删 form】。删主版本代码不拦（但会导致 form 无主版本，不建议）。
        method: DELETE
        path: /api/flowable_service/v1/form/{formId}/version/{versionIds}
        params:
          formId:     { in: path, type: string, required: true, description: "表单 id" }
          versionIds: { in: path, type: string, required: true, description: "版本 id（参数名复数 versionIds；分号分隔，但只删第一个；单删传一个 id）" }

      # ---------- 设主版本（POST /v1/form/:formId/version/:versionId）—— 发布 ----------
      set_main:
        description: 设主版本（=对外生效/发布）。把指定 version 设 isMain=true，原主版本自动降级 isMain=false。⚠️目标 version 必须 state==done（unfinished 报"未完成状态不能设置为主版本"）。隐式副作用：若旧主版本被流程绑定，触发换绑——把 ITSC_PROCESS_FORM_RELATION 从旧主版本迁到新主版本（保证业务连续）。已是主版本则幂等返回。
        method: POST
        path: /api/flowable_service/v1/form/{formId}/version/{versionId}
        params:
          formId:    { in: path, type: string, required: true, description: "表单 id" }
          versionId: { in: path, type: string, required: true, description: "要设为主版本的版本 id（须 state==done）" }

  # ===========================================================================
  # ITSM 流程定义（process）—— 复用同 service（flowable_service:8134），三层体系：
  #   ① process_definition  流程定义层（ITSC_PROCESS）—— list/create/edit/delete
  #   ② process_version      流程版本层（ITSC_PROCESS_VERSION）—— list/get[V2]/create/edit/delete/set_main
  #   ③ process_form         表单绑定层（ITSC_PROCESS_FORM_RELATION）—— set（绑/解/换节点表单）
  # 版本内容 = bpmnXML（标准 BPMN 2.0 XML + flowable:扩展）+ processSetting（节点配置 JSON）+ stageSetting（阶段，relation）。
  # 完整内容模型（BPMN/节点/脚本/orderInfo/表单流转）见 objects.yaml#itsm_process_*（本清单只定 wire）。
  # ⚠️ 路径 disparate：list/get/delete/set_main 走 /definition/:definitionId/version...；
  #    create/edit 走 /process_definition/:definitionId[/version/:versionId]——resource.path 留空，每 op 持完整路径。
  # 数据来源：契约 data/api-doc/itsm-process_definition.json（10 EAML）+ 后端 process_definition_version/ +
  #   internal/bpmn/（BPMN 解析/校验）+ internal/process/（流转求值）+ internal/process_script/（orderInfo）。
  # ===========================================================================
  process_definition:
    description: ITSM 流程定义（ITSC_PROCESS）—— 流程本身的查询/新建/编辑/删除。一个流程定义含多版本（process_version），主版本(isMain)部署到 Flowable 引擎才生效。无单 def 详情 verb——取 def 元信息走 list 过滤。
    path: ""
    operations:
      list:
        description: 流程定义列表（分页，name/category/creator/Q 模糊过滤）。isMain=true 只列有主版本的 def。list 元素含 instanceId/name/category/creator/dVersionName/vInstanceId/versionName/state/isMain。⚠️不返回 bpmnXML/processSetting（list 不取重字段）。
        method: GET
        path: /api/flowable_service/v1/process_definition
        params:
          name:     { in: query, type: string, description: "流程名模糊匹配" }
          category: { in: query, type: string, description: "分类模糊匹配" }
          creator:  { in: query, type: string, description: "创建者模糊匹配" }
          Q:        { in: query, type: string, description: "通用关键词，$or 模糊匹配 name+creator" }
          isMain:   { in: query, type: boolean, description: "true=只列有主版本的 def；响应只填 MainVersion" }
          page:     { in: query, type: integer, description: "页码默认 1 ≥1" }
          pageSize: { in: query, type: integer, description: "每页默认 10 ≥1" }
        pagination: { type: offset, page_in: query, items_path: data.list, page_param: page, size_param: pageSize, size: 10 }
      create:
        description: 新建流程定义（只建 def 元信息 name/category/memo/triggerIdList；不含版本。versionId 不可指定，CMDB 生成）。建完用 process_version.create 建 BPMN 版本。useFormBuilder=false（老表单）默认。
        method: POST
        path: /api/flowable_service/v2/process_definition
        body:
          type: object
          required: [name, category]
          properties:
            name:           { type: string, description: "流程名（def 内唯一）" }
            category:       { type: string, description: "分类（自由文本）" }
            memo:           { type: string, description: "备注" }
            triggerIdList:  { type: array, items: { type: string }, description: "触发器 id 列表" }
            useFormBuilder: { type: boolean, description: "是否引入 form_builder，默认 false" }
      edit:
        description: 编辑流程定义元信息（name/category/memo/triggerIdList）。不是 upsert——必须传已存在 definitionId。改 name 防重（排除自己）。
        method: PUT
        path: /api/flowable_service/v2/process_definition/{definitionId}
        params:
          definitionId: { in: path, type: string, required: true, description: "流程定义 id（13 hex）" }
        body:
          type: object
          required: [name, category]
          properties:
            name:           { type: string }
            category:       { type: string }
            memo:           { type: string }
            triggerIdList:  { type: array, items: { type: string } }
            useFormBuilder: { type: boolean }
      delete:
        description: 删除流程定义。⚠️有版本时拒绝（『存在流程定义版本，不允许删除』）——必须先删干净所有版本。def 不存在静默成功（幂等）。删最后一个版本会隐式级联删 def（见 process_version.delete）。
        method: DELETE
        path: /api/flowable_service/v1/process_definition/{definitionId}
        params:
          definitionId: { in: path, type: string, required: true, description: "流程定义 id" }

  process_version:
    description: ITSM 流程版本（ITSC_PROCESS_VERSION）—— 版本的查询/建/改/删/设主版本。一个 def 多版本 1:N，同时仅一版 isMain（由 set_main 保证，旧主自动降级）。状态机两态 unfinished(草稿)/done(完成)。版本内容=bpmnXML（BPMN 2.0 XML）+ processSetting（{nodeSettings,lineSettings} 节点配置 JSON）+ stageSetting（阶段）。⚠️只有 set_main 才把 BPMN 部署到 Flowable 引擎（版本真正生效）；done 版本不可编辑。完整内容模型见 objects.yaml#itsm_process_bpmn / itsm_process_node_setting。
    path: ""
    operations:
      list:
        description: 列某流程定义的所有版本。versionId 支持 "lastest" 别名（取最新版本，仅 list 类可靠）。list 元素含 vInstanceId/versionName/state/isMain。⚠️不返回 bpmnXML/processSetting。
        method: GET
        path: /api/flowable_service/v1/definition/{definitionId}/version
        params:
          definitionId: { in: path, type: string, required: true, description: "流程定义 id（13 hex）" }
          versionId:    { in: query, type: string, description: "版本 id；'lastest' 取最新版本" }
        pagination: { type: offset, page_in: query, items_path: data.list, page_param: page, size_param: pageSize, size: 10 }
      get:
        description: 读取版本完整详情（V2 超集）。返回 bpmnXML + taskInfo（每节点设置含表单绑定/审批人/审批方法/流转条件，即 processSetting.nodeSettings 的展示视图）+ lineSettings + stageSetting。bpmnXML 是标准 BPMN 2.0 XML。取流程内容走它。
        method: GET
        path: /api/flowable_service/v2/definition/{definitionId}/version/{versionId}
        params:
          definitionId: { in: path, type: string, required: true, description: "流程定义 id" }
          versionId:    { in: path, type: string, required: true, description: "版本 id（13 hex）" }
      create:
        description: 新建流程版本（保存 BPMN + 节点配置）。body 必填 bpmnXML(BPMN 2.0 XML)/versionName/state/processSetting。baseVersionId 传则克隆【表单关系+阶段设置】（不克隆 bpmnXML/processSetting，仍须 request 给）。versionId CMDB 生成返回。⚠️建版本不部署 Flowable——须再 set_main 才生效。场景②建主机申请流程用它。
        method: POST
        path: /api/flowable_service/v2/process_definition/{definitionId}
        params:
          definitionId: { in: path, type: string, required: true, description: "流程定义 id" }
        body:
          type: object
          required: [bpmnXML, versionName, state, processSetting]
          description: "新建版本请求。bpmnXML/versionName/state/processSetting 必填。"
          properties:
            bpmnXML:        { type: string, description: "BPMN 2.0 XML 字符串（流程图）。bpmn2:命名空间 + flowable:扩展属性。结构+校验见 objects.yaml#itsm_process_bpmn。例：'<bpmn2:definitions ...><bpmn2:process id=...><bpmn2:startEvent/><bpmn2:userTask id=\"Activity_xxx\" flowable:assignee=\"...\"/><bpmn2:sequenceFlow><bpmn2:conditionExpression>${pass==1}</bpmn2:conditionExpression></bpmn2:sequenceFlow></bpmn2:process></bpmn2:definitions>'" }
            versionName:    { type: string, description: "版本名（def 内唯一）" }
            state:          { type: string, enum: [unfinished, done], description: "unfinished=草稿 / done=完成（done 才能 set_main）" }
            processSetting: { type: object, description: "节点配置 {nodeSettings:[NodeSetting], lineSettings:[LineSetting]}。NodeSetting 按 userTaskId 关联 BPMN 节点（审批人/审批方法/脚本/驳回/自动化）。完整结构见 objects.yaml#itsm_process_node_setting。存为 JSON 字符串" }
            memo:           { type: string, description: "版本说明" }
            baseVersionId:  { type: string, description: "克隆源版本 id——克隆【表单关系+阶段设置】到新版本（不克隆 bpmnXML/processSetting）。场景『基于现有版本派生』用" }
      edit:
        description: 编辑流程版本（bpmnXML/processSetting/versionName等）。⚠️done 版本拒绝编辑（『当前版本已完成，不可修改！』）——只能改 unfinished 版本。要改 done 版本须先创派生新版本（create + baseVersionId）。
        method: PUT
        path: /api/flowable_service/v2/process_definition/{definitionId}/version/{versionId}
        params:
          definitionId: { in: path, type: string, required: true, description: "流程定义 id" }
          versionId:    { in: path, type: string, required: true, description: "版本 id（须 unfinished）" }
        body:
          type: object
          required: [bpmnXML, versionName, state, processSetting]
          description: "编辑版本请求（字段同 create）。仅 unfinished 版本可编辑。"
          properties:
            bpmnXML:        { type: string, description: "BPMN 2.0 XML（见 objects.yaml#itsm_process_bpmn）" }
            versionName:    { type: string }
            state:          { type: string, enum: [unfinished, done] }
            processSetting: { type: object, description: "节点配置（见 objects.yaml#itsm_process_node_setting）" }
            memo:           { type: string }
      delete:
        description: 删除流程版本。⚠️路径参数 versionIds（复数分号）但代码只删第一个——批量是壳。约束（任一即拒，HTTP 412）：①绑定了表单『当前流程已有绑定表单，不可删除!』②关联工单『当前流程有正在流转中的工单，不可删除!』③主版本+绑定服务 ④被父/子流程引用。副作用：删完若该 def 已无版本，【隐式级联删 def】。
        method: DELETE
        path: /api/flowable_service/v1/definition/{definitionId}/version/{versionIds}
        params:
          definitionId: { in: path, type: string, required: true, description: "流程定义 id" }
          versionIds:   { in: path, type: string, required: true, description: "版本 id（参数名复数 versionIds；分号分隔但只删第一个；单删传一个 id）" }
      set_main:
        description: 设主版本（=部署到 Flowable 引擎对外生效）。⚠️目标须 state==done（unfinished 报『未完成状态不能设置为主版本』）。旧主版本自动降级（MAIN_VERSION 关系覆盖）。只有 set_main 才把 BPMN 真正部署到 Flowable（建/改版本都不部署）。运行中工单不受影响（仍走旧 deploymentId）。已是主版本则幂等。
        method: PUT
        path: /api/flowable_service/v1/definition/{definitionId}/version/{versionId}
        params:
          definitionId: { in: path, type: string, required: true, description: "流程定义 id" }
          versionId:    { in: path, type: string, required: true, description: "要设主版本的版本 id（须 done）" }

  process_form:
    description: 流程版本↔表单绑定（ITSC_PROCESS_FORM_RELATION）。表单绑到【节点】(userTaskId)非整个版本；一个版本每个节点一条表单关系。绑/解/换同一接口靠 formRelationInstanceId + formId 组合区分。
    path: ""
    operations:
      set:
        description: 给流程版本的某节点【绑/解/换】表单。按 formRelationInstanceId + formId 组合决定动作：①都空=无操作 ②formRelationInstanceId空+formId非空=绑定 ③formRelationInstanceId非空+formId空=解绑 ④都非空=换绑。useFormBuilder=false（老表单，formId+formSchemaVersion）时后端默认取表单【主版本】绑定。场景②绑主机申请表单走它。
        method: POST
        path: /api/flowable_service/v1/process/version/{versionId}
        params:
          versionId: { in: path, type: string, required: true, description: "流程版本 id（13 hex）" }
        body:
          type: object
          required: [userTaskId]
          description: "节点表单绑定请求。userTaskId 必填（绑到节点）。"
          properties:
            userTaskId:             { type: string, description: "BPMN 用户任务节点 id（表单绑到节点，非版本）" }
            useFormBuilder:         { type: boolean, description: "true=接入 formBuilder(fbFormId)；false=老表单(formId)。默认 false" }
            formRelationInstanceId: { type: string, description: "已存在的表单关系实例 id（空=没绑过；非空=已绑，配 formId 决定解绑/换绑）" }
            formId:                 { type: string, description: "老表单 form schema id（useFormBuilder=false）；空+formRelationInstanceId非空=解绑" }
            fbFormId:               { type: string, description: "formBuilder 表单 id（useFormBuilder=true）" }
            fbFormInstanceId:       { type: string, description: "formBuilder 表单版本实例 id" }
            formDisplayMode:        { type: string, description: "表单展示模式" }
            isDesensitization:      { type: boolean, description: "是否脱敏（仅 useFormBuilder=true 生效）" }

  # ===========================================================================
  # ITSM 服务目录（service_catalog）—— 同 flowable_service，目录树 CRUD + 权限。
  # 数据来源：后端 service_catalog/（route.go + service_catalog_service.go + manager.go）
  #          + Catalog struct（internal/cmdb_service/knowledge/models.go）。
  # ===========================================================================
  service_catalog:
    description: ITSM 服务目录树（服务实例的容器）。一级目录如 事件管理/服务请求；子目录如 请求目录。服务实例挂在目录下。CRUD 全在 /v1/service_catalog。
    path: ""

    operations:
      list:
        description: 列目录（按 parentId 查子目录）。parentId 空查一级目录；ignoreEmpty=true 忽略空目录；category 过滤分类。返回目录列表含服务实例数。
        method: GET
        path: /api/flowable_service/v1/service_catalog
        params:
          parentId:     { in: query, type: string, description: "父目录 id（空=查一级目录）" }
          category:     { in: query, type: string, description: "分类过滤（如 事件管理）" }
          ignoreEmpty:  { in: query, type: boolean, description: "true=忽略无服务的目录" }

      list_tree:
        description: 列完整目录树（递归）。返回嵌套树结构，含每个目录的服务实例数。查整个目录结构用它。
        method: GET
        path: /api/flowable_service/v1/service_catalog_tree
        params:
          category:    { in: query, type: string, description: "分类过滤" }
          ignoreEmpty: { in: query, type: boolean, description: "true=忽略空目录" }

      create:
        description: 建目录。parentID 指定父目录（空=一级目录）；name 必填且同父下唯一。场景②建 test-permission 用它。
        method: POST
        path: /api/flowable_service/v1/service_catalog
        body:
          type: object
          required: [name]
          description: "建目录请求"
          properties:
            name:          { type: string, description: "目录名称（同父下唯一）" }
            parentID:      { type: string, description: "父目录 id（空=一级目录）" }
            description:   { type: string, description: "目录描述" }
            url:           { type: string, description: "自定义 URL" }
            isTargetBlank: { type: boolean, description: "URL 新窗口打开" }

      edit:
        description: 编辑目录（全量覆盖：name/description/url/isTargetBlank）。instanceId 路径参数。
        method: PUT
        path: /api/flowable_service/v1/service_catalog/{instanceId}
        params:
          instanceId: { in: path, type: string, required: true, description: "目录 id" }
        body:
          type: object
          properties:
            name:          { type: string }
            description:   { type: string }
            url:           { type: string }
            isTargetBlank: { type: boolean }

      delete:
        description: 删除目录。⚠️内置目录(builtIn)不可删（『服务目录为内置，不允许删除』）。目录下有服务实例不可删（『服务目录下存在服务实例，不允许删除』）——须先迁移或删除子服务。manager.go:243 CheckCatalogRemovable。
        method: DELETE
        path: /api/flowable_service/v1/service_catalog/{instanceId}
        params:
          instanceId: { in: path, type: string, required: true, description: "目录 id" }

      set_permission:
        description: 设目录权限（读+管理）。modifyUserList 自动获得 read 权限。场景②配管理员用它。⚠️字段名是 instanceId 不是 catalogId。
        method: POST
        path: /api/flowable_service/v1/set_catalog_permission
        body:
          type: object
          required: [instanceId]
          description: "设目录权限请求"
          properties:
            instanceId:      { type: string, description: "目录 id（字段名是 instanceId 不是 catalogId）" }
            readUserList:    { type: array, items: { type: string }, description: "读权限用户列表（自动含 modifyUserList）" }
            modifyUserList:  { type: array, items: { type: string }, description: "管理权限用户列表（自动授予 read）" }
  # 工单发起涉及前端表单渲染+生命周期脚本，不适合 API——本域只管 list/delete/state/export。
  # 数据来源：契约 data/api-doc/itsm-process_instance.json（6 EAML，取 4 个有效）
  #          + 后端 process_instance/ + service_catalog/。
  # ===========================================================================
  ticket:
    description: ITSM 工单实例（运行中的流程实例）。发起工单走前端（表单渲染+脚本），API 只管查询/删除/状态变更/导出。工单状态三态：running(运行中)/done(已完成)/closed(已关单)，另有挂起(isSuspended)/作废(isCancelled) 布尔标记。
    path: ""

    operations:
      list:
        description: 工单搜索（V4 高级搜索）。POST body 含 filter（standard_fields/process_fields 条件）+ 分页参数（token 翻页）。按 Q 模糊搜名称/状态/服务名；按 status/serviceCategory/creator/ctime 等精确过滤。返回 ProcessInstanceBasic 列表 + total + nextToken。
        method: POST
        path: /api/flowable_service/v4/process_instance_filter
        body:
          type: object
          description: "工单搜索请求"
          properties:
            Q:                { type: string, description: "模糊搜索 name/status/service/form" }
            status:           { type: string, enum: [running, done, closed], description: "工单状态" }
            name:             { type: string, description: "工单名称" }
            orderNum:         { type: string, description: "工单编号" }
            serviceCategory:  { type: string, description: "服务分类 change/event/req/question/release" }
            serviceId:        { type: string, description: "服务实例 id" }
            creator:          { type: string, description: "发起人" }
            currentAssignee:  { type: string, description: "当前处理人" }
            idList:           { type: array, items: { type: string }, description: "工单 id 列表（精确）" }
            pageSize:         { type: integer, description: "每页条数默认 10" }
            token:            { type: string, description: "翻页 token（上一页返回的 nextToken）" }
            filter:
              type: object
              description: "高级过滤 {standard_fields:[{field,operator,value}], process_fields:[{field,operator,value}]}。operator: ==/!==~/!~。process_fields 支持 name/status/creator/ctime/serviceCategory/serviceId/ete 等。"
              additional_properties: true
        response:
          type: object
          description: "{ code, data: { total, list:[ProcessInstanceBasic], pageSize, nextToken, previousToken } }"
          properties:
            code: { type: integer }
            data:
              type: object
              properties:
                total:     { type: integer }
                nextToken: { type: string, description: "下一页 token（空=无下一页）" }
                list:
                  type: array
                  items:
                    type: object
                    properties:
                      instanceId:  { type: string, description: "工单 id" }
                      orderNum:    { type: string, description: "工单号" }
                      name:        { type: string, description: "工单名称" }
                      status:      { type: string, description: "running/done/closed" }
                      isSuspended: { type: boolean }
                      isCancelled: { type: boolean }

      delete:
        description: 删除工单（批量）。⚠️只有作废(isCancelled)的工单才能删除——running/done/closed 的须先作废再删。instanceIds 分号分隔。
        method: DELETE
        path: /api/flowable_service/v1/process_instance/{instanceIds}
        params:
          instanceIds: { in: path, type: string, required: true, description: "工单 id，分号分隔" }

      set_state:
        description: 批量修改工单状态（挂起/激活/作废）。⚠️只有 running 的工单能挂起；作废后才能删除。instanceIds 分号分隔。
        method: PUT
        path: /api/flowable_service/v1/process_instance_state
        body:
          type: object
          required: [instanceIds, action]
          description: "工单状态变更请求"
          properties:
            instanceIds:          { type: string, description: "工单 id，分号分隔" }
            action:              { type: string, enum: [suspend, activate, cancel], description: "suspend=挂起(仅running)/activate=激活(仅suspended)/cancel=作废(仅running)" }
            memo:                { type: string, description: "操作说明" }
            autoRestartInterval: { type: integer, description: "自动激活时间（小时），0=不自动" }

      export_excel:
        description: 批量导出工单详情 Excel。ticketIds 指定工单；fields 指定导出字段（空=用服务工单导出配置）。返回二进制 Excel 流。
        method: POST
        path: /api/flowable_service/v1/file/batch/ticket/excel_export
        body:
          type: object
          required: [ticketIds]
          description: "工单导出请求"
          properties:
            ticketIds: { type: array, items: { type: string }, description: "工单 id 列表" }
            fields:    { type: array, items: { type: string }, description: "导出字段（空=用服务配置）。支持 ticketNum/name/status/creator/ctime/ete/serviceCategory/serviceName 等" }
  service_instance:
    description: ITSM 服务实例（服务目录里的一个服务条目）。用户在 ITSM 前端选服务发起工单；服务关联一个流程定义（associatedProcess）。CRUD 全在 /v1/service_instance。
    path: ""

    operations:
      list:
        description: 服务实例列表（按目录 catalogID 过滤）。catalogID 逗号分隔多个目录 id（空=查无目录的服务）。Q 模糊搜索名称。hideDisabled=true 隐藏禁用服务。⚠️ list 需要必填参数（catalogID/page/pageSize），前端默认不渲染否则——见 acceptance_urls。
        method: GET
        path: /api/flowable_service/v1/service_instance
        params:
          catalogID:     { in: query, type: string, description: "目录实例 id 列表，逗号分隔。空=无目录的服务" }
          Q:             { in: query, type: string, description: "模糊搜索服务名称" }
          fuzzyNickname: { in: query, type: string, description: "模糊搜索昵称" }
          hideDisabled:  { in: query, type: boolean, description: "true=隐藏禁用服务，默认 false" }
          page:          { in: query, type: integer, description: "页码默认 1" }
          pageSize:      { in: query, type: integer, description: "每页默认 10" }
        pagination: { type: offset, page_in: query, items_path: data.list, page_param: page, size_param: pageSize, size: 10 }

      create:
        description: 创建服务实例。必填 name/category/associatedProcess。catalogId 指定所在目录（如服务请求.请求目录 的 catalog id）；owner 指定负责人（用户名）。associatedProcess=流程定义 instanceId（如主机申请流程的 definitionId）。场景②建 test-host 服务用它。
        method: POST
        path: /api/flowable_service/v1/service_instance
        body:
          type: object
          required: [name, category, associatedProcess]
          description: "创建服务请求。name/category/associatedProcess 必填。"
          properties:
            name:               { type: string, description: "服务名称" }
            category:           { type: string, description: "分类（如 服务请求.请求目录）" }
            associatedProcess:  { type: string, description: "关联流程定义 instanceId（如 658aa1ed3bbd2）" }
            catalogId:          { type: string, description: "所在目录实例 id" }
            owner:              { type: string, description: "负责人用户名（如 easyops）" }
            description:        { type: string, description: "服务说明" }
            guide:              { type: string, description: "服务指引" }
            status:             { type: string, enum: [enabled, disabled], description: "是否启用，默认 enabled" }
            icon:               { type: object, description: "图标 {name,lib}" }
            iconColor:          { type: string, description: "图标颜色" }
            url:                { type: string, description: "自定义服务 URL" }
            triggerIdList:      { type: array, items: { type: string }, description: "触发器 id 列表" }
            slaRuleId:          { type: string, description: "SLA 规则 id" }

      get:
        description: 获取服务实例详情（含关联流程/负责人/SLA/权限等）。
        method: GET
        path: /api/flowable_service/v1/service_instance/{instanceId}
        params:
          instanceId: { in: path, type: string, required: true, description: "服务实例 id（13 hex）" }

      edit:
        description: 编辑服务实例（全量覆盖元信息：name/category/owner/description/guide等）。场景③改说明用它。
        method: PUT
        path: /api/flowable_service/v1/service_instance/{instanceId}
        params:
          instanceId: { in: path, type: string, required: true, description: "服务实例 id" }
        body:
          type: object
          description: "编辑服务（字段同 create，全量覆盖）。"
          properties:
            name:               { type: string }
            category:           { type: string }
            associatedProcess:  { type: string }
            catalogId:          { type: string }
            owner:              { type: string }
            description:        { type: string }
            guide:              { type: string }
            status:             { type: string, enum: [enabled, disabled] }
            url:                { type: string }
            iconColor:          { type: string }

      delete:
        description: 删除服务实例。⚠️有工单在流转时拒绝（『服务尚有工单正在流转中,不允许删除』）——须先删完该服务所有工单。内置服务（builtIn=true）不可删。
        method: DELETE
        path: /api/flowable_service/v1/service_instance/{instanceId}
        params:
          instanceId: { in: path, type: string, required: true, description: "服务实例 id" }

      sort:
        description: 服务排序。serviceIdList + sortList 两个数组一一对应，按 sortList 值排序。
        method: POST
        path: /api/flowable_service/v1/service_instance/sort
        body:
          type: object
          required: [serviceIdList, sortList]
          description: "服务排序请求"
          properties:
            serviceIdList: { type: array, items: { type: string }, description: "服务 id 列表（排序后顺序）" }
            sortList:     { type: array, items: { type: integer }, description: "对应 sort 值列表" }

      export:
        description: 导出服务实例（按 id 列表导出为文件）。instanceIds 逗号分隔。返回二进制文件流。
        method: GET
        path: /api/flowable_service/v1/export/service_instance
        params:
          instanceIds: { in: query, type: string, required: true, description: "服务实例 id 列表，逗号分隔" }
          isMain:     { in: query, type: boolean, description: "是否只导出流程定义主版本" }

      import:
        description: 导入服务实例（上传文件到指定目录）。multipart/form-data。onlyCheck=true 仅校验不上传。
        method: POST
        path: /api/flowable_service/v1/service_catalog/{serviceId}/import
        params:
          serviceId: { in: path, type: string, required: true, description: "目标服务目录 id" }
        body:
          type: object
          description: "multipart/form-data：file=服务文件；onlyCheck=仅校验"

  # ===========================================================================
  # ITSM 默认常用服务（common_service）—— ITSM 前端门户的"常用服务"快捷入口配置。
  # 路径 /api/flowable_service/v1/process_common/default_common_service。
  # 数据来源：契约 data/api-doc/itsm-service_instance.xlsx（5 个 DefaultCommonService 接口）。
  # ===========================================================================
  common_service:
    description: ITSM 默认常用服务——前端门户的"常用服务"快捷入口配置。每个常用服务条目含名称/排序/关联服务实例/可见用户组。
    path: ""

    operations:
      list:
        description: 列默认常用服务（分页）。
        method: GET
        path: /api/flowable_service/v1/process_common/default_common_service
        params:
          page:     { in: query, type: integer, description: "页码默认 1" }
          pageSize: { in: query, type: integer, description: "每页默认 10" }
        pagination: { type: offset, page_in: query, items_path: data.list, page_param: page, size_param: pageSize, size: 10 }

      create:
        description: 创建默认常用服务条目。name 必填；priority 排序（默认0）；userGroups 控制可见范围。
        method: POST
        path: /api/flowable_service/v1/process_common/default_common_service
        body:
          type: object
          required: [name]
          description: "创建常用服务请求"
          properties:
            name:       { type: string, description: "常用服务名称" }
            priority:   { type: integer, description: "排序权重，默认 0" }
            userGroups: { type: array, items: { type: string }, description: "可见用户组列表" }

      update:
        description: 编辑默认常用服务（name/priority/userGroups）。
        method: PUT
        path: /api/flowable_service/v1/process_common/default_common_service/{instanceId}
        params:
          instanceId: { in: path, type: string, required: true, description: "常用服务条目 id" }
        body:
          type: object
          properties:
            name:       { type: string }
            priority:   { type: integer }
            userGroups: { type: array, items: { type: string } }

      delete:
        description: 删除默认常用服务条目。
        method: DELETE
        path: /api/flowable_service/v1/process_common/default_common_service/{instanceId}
        params:
          instanceId: { in: path, type: string, required: true, description: "常用服务条目 id" }

      set_services:
        description: 关联服务实例到常用服务条目（commonServices 字段）。
        method: POST
        path: /api/flowable_service/v1/process_common/default_common_service/{instanceId}/services
        params:
          instanceId: { in: path, type: string, required: true, description: "常用服务条目 id" }
        body:
          type: object
          required: [commonServices]
          description: "关联服务请求"
          properties:
            commonServices: { type: array, items: { type: string }, description: "服务实例 id 列表" }

  # ---------------------------------------------------------------------------
  # 资源：trigger —— 触发器（流程/任务事件 → 动作列表）。
  # 8134 flowable_service，前缀 /api/flowable_service/v1/trigger。
  # delete 路径 :triggerIds（分号分隔批量）；config.actionList[].args.notifyPolicyId
  # 引用 notify_policy（跨资源依赖，见 objects.yaml#itsm_trigger）。
  # 数据源：契约 itsm-trigger.xlsx + trigger/validators/request_validate_trees.go:31,35。
  # ---------------------------------------------------------------------------
  trigger:
    description: ITSM 触发器——绑定流程/任务事件（event，如 process_task.todo）到动作列表（config.actionList：发通知 send_message / 改字段等）。scope=作用域（process_instance/process_task 等）；status=enabled/disabled。config.actionList[].args.notifyPolicyId 引用 notify_policy 实例。系统自带触发器（builtin/defaultUser 建）勿动。
    path: ""

    operations:
      list:
        description: 触发器列表（分页）。Q 模糊搜名称；scope/domainModelId 精确过滤；instanceId 多个用逗号精确过滤。list 元素含 instanceId/name/scope/event/status。
        method: GET
        path: /api/flowable_service/v1/trigger
        params:
          page:          { in: query, type: integer, description: "页码，默认 1" }
          pageSize:      { in: query, type: integer, description: "每页条数，默认 10" }
          Q:             { in: query, type: string, description: "名称模糊搜索" }
          scope:         { in: query, type: string, description: "作用域过滤，如 process_task/process_instance" }
          domainModelId: { in: query, type: string, description: "领域模型 id 过滤" }
          instanceId:    { in: query, type: string, description: "实例 id 过滤，多个用逗号分隔" }
        response:
          type: object
          description: "{ code, data: { page, pageSize, total, list[] } }"
          properties:
            code: { type: integer }
            data:
              type: object
              properties:
                total: { type: integer }
                list:
                  type: array
                  items:
                    type: object
                    properties:
                      instanceId: { type: string, description: "触发器 id（13 hex）" }
                      name:       { type: string }
                      scope:      { type: string }
                      event:      { type: string }
                      status:     { type: string }
        pagination:
          type: offset
          page_in: query
          items_path: data.list
          page_param: page
          size_param: pageSize
          size: 10

      get:
        description: 触发器详情（含完整 config.actionList 与 processVersionTasks 引用关系）。
        method: GET
        path: /api/flowable_service/v1/trigger/{triggerId}
        params:
          triggerId: { in: path, type: string, required: true, description: "触发器 id（13 hex）" }

      create:
        description: 新建触发器。config 必填是动作对象 {actionList:[{name,args,condition}]}；常见 name=send_message，args 含 notifyPolicyId（→notify_policy 实例）、notifyInterval（如 5m）、notifyTimes。event 形如 process_task.todo / process_instance.start。
        method: POST
        path: /api/flowable_service/v1/trigger
        body:
          type: object
          required: [name, scope, status, event, config]
          description: "新建触发器。name/scope/status/event/config 必填。"
          properties:
            name:          { type: string, description: "触发器名" }
            scope:         { type: string, description: "作用域，如 process_task / process_instance" }
            status:        { type: string, enum: [enabled, disabled], description: "启用状态" }
            event:         { type: string, description: "触发事件，如 process_task.todo" }
            config:        { type: object, description: "动作配置 {actionList:[{name, args, condition}]}。name=send_message 时 args={notifyPolicyId(notify_policy id), notifyInterval(如 5m), notifyTimes}（结构据真实实例 trigger 5c9a95cd583c2）" }
            memo:          { type: string, description: "备注" }
            domainModelId: { type: string, description: "关联领域模型 id（13 hex）" }
        response:
          type: object
          description: "{ code, data: { instanceId, ... } }"
          properties:
            code: { type: integer }
            data: { type: object, additional_properties: true }

      update:
        description: 修改触发器（全量覆盖 name/scope/status/event/config）。triggerId 正则 ^[0-9a-z]{13}$（validator 证实）。
        method: PUT
        path: /api/flowable_service/v1/trigger/{triggerId}
        params:
          triggerId: { in: path, type: string, required: true, description: "触发器 id（13 hex，正则 ^[0-9a-z]{13}$）" }
        body:
          type: object
          required: [name, scope, status, event, config]
          description: "修改触发器（全量覆盖）。"
          properties:
            name:          { type: string }
            scope:         { type: string }
            status:        { type: string, enum: [enabled, disabled] }
            event:         { type: string }
            config:        { type: object, description: "动作配置（结构同 create）" }
            memo:          { type: string }
            domainModelId: { type: string }

      delete:
        description: 删除触发器（批量）。triggerIds 走 path 分号分隔。系统自带（builtin）触发器勿删。
        method: DELETE
        path: /api/flowable_service/v1/trigger/{triggerIds}
        params:
          triggerIds: { in: path, type: string, required: true, description: "触发器 id，分号分隔（如 5c9a95cd583c2;5c9a94cd91014）" }

  # ---------------------------------------------------------------------------
  # 资源：notify_policy —— 通知策略。
  # 8134 flowable_service，但前缀是 /api/itsc_trigger/v1/notify_policy（≠ flowable_service！）。
  # delete 无 path param——instanceIds 走 query（validator BindQuery 证实，route.go:8）。
  # 被 trigger.config.actionList[].args.notifyPolicyId 引用。
  # 数据源：契约 itsm-notify_policy.xlsx + notify_policy/validators/api_validator.go:75-99。
  # ---------------------------------------------------------------------------
  notify_policy:
    description: ITSM 通知策略——定义「什么信号（triggerSignal）→ 通知谁（notifyRange）→ 怎么发（notifyMode）→ 发什么（subject/content）」。notifyType=通知载体类型（process_instance/process_task 等）；triggerSignal=触发信号（start/finish 等）；notifyRange=收件范围数组（如 [creator]）；notifyMode=渠道数组（如 [email]）；content 支持模板变量（${process_instance_id} 等，前端解释）。被 trigger 通过 notifyPolicyId 引用。
    path: ""

    operations:
      list:
        description: 通知策略列表（分页）。Q 模糊匹配 名称/类型/信号/模式/范围；也可按 name/notifyType/triggerSignal/notifyRange/notifyMode/creator/st/et 高级过滤。
        method: GET
        path: /api/itsc_trigger/v1/notify_policy
        params:
          page:          { in: query, type: integer, description: "页码，默认 1" }
          pageSize:      { in: query, type: integer, description: "每页数据量" }
          Q:             { in: query, type: string, description: "模糊搜索（匹配 名称/类型/信号/模式/范围）" }
          name:          { in: query, type: string, description: "高级搜索-通知名称" }
          notifyType:    { in: query, type: string, description: "高级搜索-通知类型" }
          triggerSignal: { in: query, type: string, description: "高级搜索-触发信号" }
          notifyRange:   { in: query, type: string, description: "高级搜索-通知范围" }
          notifyMode:    { in: query, type: string, description: "高级搜索-通知模式" }
          creator:       { in: query, type: string, description: "高级搜索-创建人" }
          st:            { in: query, type: string, description: "开始时间" }
          et:            { in: query, type: string, description: "结束时间" }
        response:
          type: object
          description: "{ code, data: { page, pageSize, total, list[] } }"
          properties:
            code: { type: integer }
            data:
              type: object
              properties:
                total: { type: integer }
                list:
                  type: array
                  items:
                    type: object
                    properties:
                      instanceId:    { type: string, description: "通知策略 id（13 hex）" }
                      name:          { type: string }
                      notifyType:    { type: string }
                      triggerSignal: { type: string }
                      builtin:       { type: boolean, description: "系统自带勿动" }
        pagination:
          type: offset
          page_in: query
          items_path: data.list
          page_param: page
          size_param: pageSize
          size: 10

      get:
        description: 通知策略详情（含完整 content 模板 + notifyRange/notifyMode 数组）。
        method: GET
        path: /api/itsc_trigger/v1/notify_policy/{instanceId}
        params:
          instanceId: { in: path, type: string, required: true, description: "通知策略 id（13 hex）" }

      create:
        description: 新建通知策略。content 是模板字符串（支持 ${process_instance_id} 等变量，后端透传前端解释）。
        method: POST
        path: /api/itsc_trigger/v1/notify_policy
        body:
          type: object
          required: [name, notifyType, triggerSignal, notifyRange, notifyMode, content]
          description: "新建通知策略。name/notifyType/triggerSignal/notifyRange/notifyMode/content 必填。"
          properties:
            name:           { type: string, description: "策略名" }
            notifyType:     { type: string, description: "通知类型，如 process_instance / process_task" }
            triggerSignal:  { type: string, description: "触发信号，如 start / finish" }
            notifyRange:    { type: array, items: { type: string }, description: "通知范围，如 [creator]" }
            notifyMode:     { type: array, items: { type: string }, description: "通知渠道，如 [email]" }
            content:        { type: string, description: "通知正文模板（支持 ${process_instance_id}/${process_instance_number} 等变量）" }
            subject:        { type: string, description: "通知主题" }
            customUserGroup: { type: array, items: { type: string }, description: "自定义通知用户组" }
            domainModel:    { type: string, description: "领域模型" }
        response:
          type: object
          description: "{ code, data: { instanceId, ... } }"
          properties:
            code: { type: integer }
            data: { type: object, additional_properties: true }

      update:
        description: 修改通知策略（全量覆盖）。字段同 create。
        method: PUT
        path: /api/itsc_trigger/v1/notify_policy/{instanceId}
        params:
          instanceId: { in: path, type: string, required: true, description: "通知策略 id（13 hex）" }
        body:
          type: object
          required: [name, notifyType, triggerSignal, notifyRange, notifyMode, content]
          description: "修改通知策略（全量）。"
          properties:
            name:           { type: string }
            notifyType:     { type: string }
            triggerSignal:  { type: string }
            notifyRange:    { type: array, items: { type: string } }
            notifyMode:     { type: array, items: { type: string } }
            content:        { type: string }
            subject:        { type: string }
            customUserGroup: { type: array, items: { type: string } }
            domainModel:    { type: string }

      delete:
        description: 删除通知策略（批量）。⚠️与其它资源不同——无 path param，instanceIds 走 query（validator ctx.BindQuery 证实）。分号分隔。builtin 策略勿删。
        method: DELETE
        path: /api/itsc_trigger/v1/notify_policy
        params:
          instanceIds: { in: query, type: string, required: true, description: "通知策略 id，分号分隔（如 5ab9f10a6ef88;5abb0dca9971d）" }

  # ---------------------------------------------------------------------------
  # 资源：sla —— 服务级别协议（SLA）规则。
  # 8134 flowable_service，前缀 /api/flowable_service/v1/sla/rule。
  # ⚠️list 是 POST _search（GET list 返 404，实测）。slaConfig[].levelConfig[].workingCalendarId
  # 引用 work_calendar（24 hex，跨资源依赖，见 objects.yaml#itsm_sla）。
  # 数据源：契约 itsm-sla.xlsx + 实测 _search 样例（sla 658c21d6beda6）。
  # ---------------------------------------------------------------------------
  sla:
    description: ITSM 服务级别协议规则——约定工单/任务节点在各级别（plan/common/priority/emergency）的达成时长。basicInfo=协议基本信息（名/状态/类型/负责人/服务实例）；slaConfig[]=配置数组，每条 levelConfig[] 按 4 个级别设 duration，workingCalendarId 引用 work_calendar（用来按时长计算剔除非工作时间）。type=inst(工单级)/step(任务节点级)。
    path: ""

    operations:
      list:
        description: SLA 规则搜索（POST _search，非 GET list——GET list 返 404）。body 含分页+过滤。返回 data.list[]，每条含 basicInfo 展开字段 + slaConfig[]。Q 模糊搜；serviceName/ownerName/priorityId/instanceIds 精确过滤。
        method: POST
        path: /api/flowable_service/v1/sla/rule/_search
        body:
          type: object
          description: "SLA 搜索请求（分页参数也在 body）"
          properties:
            page:            { type: integer, description: "页码，默认 1" }
            pageSize:        { type: integer, description: "每页条数" }
            Q:               { type: string, description: "模糊搜索" }
            name:            { type: string, description: "名称" }
            serviceCategory: { type: string, description: "服务分类" }
            status:          { type: string, description: "状态" }
            serviceName:     { type: string, description: "应用对象（服务实例）名称" }
            ownerName:       { type: string, description: "负责人名称" }
            priorityId:      { type: string, description: "引用的优先级 id 过滤" }
            instanceIds:     { type: array, items: { type: string }, description: "sla 实例 id 过滤（in 查询）" }
        response:
          type: object
          description: "{ code, data: { page, page_size, total, list[] } }"
          properties:
            code: { type: integer }
            data:
              type: object
              properties:
                total: { type: integer }
                list:
                  type: array
                  items:
                    type: object
                    properties:
                      instanceId:          { type: string, description: "SLA 规则 id（13 hex）" }
                      name:                { type: string }
                      status:              { type: string }
                      type:                { type: string, description: "inst=工单级 / step=节点级" }
                      ownerName:           { type: string }
                      serviceInstanceName: { type: string }
        pagination:
          type: offset
          page_in: body                                # ⚠️page/pageSize 在 body（POST _search），非 query
          items_path: data.list
          page_param: page
          size_param: pageSize
          size: 10

      get:
        description: SLA 规则详情（含完整 slaConfig[].levelConfig[]，每级 workingCalendarId→work_calendar）。
        method: GET
        path: /api/flowable_service/v1/sla/rule/{ruleId}
        params:
          ruleId: { in: path, type: string, required: true, description: "SLA 规则 id（13 hex）" }

      create:
        description: 新建 SLA 规则。basicInfo（协议基本信息对象）+ slaConfig（配置数组，每条 levelConfig 按级别设 duration+workingCalendarId）必填。结构据真实实例 sla 658c21d6beda6。
        method: POST
        path: /api/flowable_service/v1/sla/rule
        body:
          type: object
          required: [basicInfo, slaConfig]
          description: "新建 SLA 规则。basicInfo + slaConfig 必填。"
          properties:
            basicInfo:
              type: object
              description: "协议基本信息（结构据真实实例）。"
              properties:
                name:                { type: string, description: "SLA 名" }
                status:              { type: string, enum: [enabled, disabled] }
                type:                { type: string, enum: [inst, step], description: "inst=工单级 / step=任务节点级" }
                ownerId:             { type: string, description: "负责人 id" }
                ownerName:           { type: string }
                serviceInstanceId:   { type: string, description: "关联服务实例 id" }
                serviceInstanceName: { type: string }
                serviceCategory:     { type: string }
                memo:                { type: string }
            slaConfig:
              type: array
              description: "协议配置数组。"
              items:
                type: object
                properties:
                  bindID:   { type: string }
                  bindName: { type: string }
                  levelConfig:
                    type: array
                    items:
                      type: object
                      properties:
                        levelName:         { type: string, description: "优先级名：plan/common/priority/emergency" }
                        agreementType:     { type: string, description: "达成类型，如 done" }
                        workingCalendarId: { type: string, description: "引用 work_calendar 实例 id（24 hex）" }
                        duration:          { type: string, description: "时长，如 1h" }
                        criticalRate:      { type: integer }
        response:
          type: object
          description: "{ code, data: { instanceId, ... } }"
          properties:
            code: { type: integer }
            data: { type: object, additional_properties: true }

      update:
        description: 修改 SLA 规则（全量覆盖 basicInfo + slaConfig）。
        method: PUT
        path: /api/flowable_service/v1/sla/rule/{ruleId}
        params:
          ruleId: { in: path, type: string, required: true, description: "SLA 规则 id（13 hex）" }
        body:
          type: object
          required: [basicInfo, slaConfig]
          description: "修改 SLA 规则（全量）。字段结构同 create。"
          properties:
            basicInfo:
              type: object
              additional_properties: true
              description: "协议基本信息（结构同 create.basicInfo）"
            slaConfig:
              type: array
              description: "协议配置数组（结构同 create.slaConfig）"
              items: { type: object, additional_properties: true }

      delete:
        description: 删除 SLA 规则（批量）。ruleIds 走 path 分号分隔。
        method: DELETE
        path: /api/flowable_service/v1/sla/rule/{ruleIds}
        params:
          ruleIds: { in: path, type: string, required: true, description: "SLA 规则 id，分号分隔" }

  # ---------------------------------------------------------------------------
  # 资源：duty_group —— 值班组。
  # 8134 flowable_service，前缀 /api/flowable_service/v1/duty_group。
  # delete 路径 :groupIds（分号分隔批量）。dutyShift=班次数组。duty_group_config
  # 系列（日历配置/导入）按场景「不增噪声」未纳入（如需再补）。
  # 数据源：契约 itsm-duty_group.xlsx + 实测详情样例（duty_group 658c1d374b66b）。
  # ---------------------------------------------------------------------------
  duty_group:
    description: ITSM 值班组——定义一个值班组的名/周期（dutyCycle，如 2026-01~2026-12）/班次（dutyShift[]：名+时段）/弹性时间（flexTime 分钟）。status=enabled/disabled。被 SLA/工单排班引用。
    path: ""

    operations:
      list:
        description: 值班组列表（分页）。Q 模糊搜；name/dutyCycle/memo/creator/dutyShiftName 精确；dutyGroupIds 多个逗号；st/et 时间范围。
        method: GET
        path: /api/flowable_service/v1/duty_group
        params:
          page:         { in: query, type: integer, description: "页码，默认 1" }
          pageSize:     { in: query, type: integer, description: "每页条数" }
          dutyGroupIds: { in: query, type: string, description: "值班组 id，多个逗号分隔" }
          Q:            { in: query, type: string, description: "模糊搜索" }
          name:         { in: query, type: string }
          dutyCycle:    { in: query, type: string, description: "值班周期，如 2026-01~2026-12" }
          memo:         { in: query, type: string }
          creator:      { in: query, type: string }
          dutyShiftName: { in: query, type: string, description: "班次名" }
          st:           { in: query, type: string, description: "开始时间" }
          et:           { in: query, type: string, description: "结束时间" }
        response:
          type: object
          description: "{ code, data: { page, pageSize, total, list[] } }"
          properties:
            code: { type: integer }
            data:
              type: object
              properties:
                total: { type: integer }
                list:
                  type: array
                  items:
                    type: object
                    properties:
                      instanceId: { type: string, description: "值班组 id（13 hex）" }
                      name:       { type: string }
                      dutyCycle:  { type: string }
                      status:     { type: string }
        pagination:
          type: offset
          page_in: query
          items_path: data.list
          page_param: page
          size_param: pageSize
          size: 10

      get:
        description: 值班组详情（含 dutyShift 班次数组 + flexTime）。
        method: GET
        path: /api/flowable_service/v1/duty_group/{groupId}
        params:
          groupId: { in: path, type: string, required: true, description: "值班组 id（13 hex）" }

      create:
        description: 新建值班组。name/dutyCycle/status/dutyShift 必填。dutyShift 班次结构 {name, dutyTime:"08:00~12:00"}（据真实实例 duty_group 658c1d374b66b）。
        method: POST
        path: /api/flowable_service/v1/duty_group
        body:
          type: object
          required: [name, dutyCycle, status, dutyShift]
          description: "新建值班组。name/dutyCycle/status/dutyShift 必填。"
          properties:
            name:          { type: string, description: "值班组名" }
            dutyCycle:     { type: string, description: "值班周期，如 2026-01~2026-12" }
            status:        { type: string, enum: [enabled, disabled] }
            dutyShift:
              type: array
              description: "班次列表"
              items:
                type: object
                properties:
                  name:     { type: string, description: "班次名，如 白" }
                  dutyTime: { type: string, description: "时段，如 08:00~12:00" }
            memo:          { type: string }
            flexTime:      { type: integer, description: "弹性时间（分钟）" }
            useFormBuilder: { type: boolean, description: "是否用表单构建器" }
        response:
          type: object
          description: "{ code, data: { instanceId, ... } }"
          properties:
            code: { type: integer }
            data: { type: object, additional_properties: true }

      update:
        description: 修改值班组（全量覆盖）。字段同 create。
        method: PUT
        path: /api/flowable_service/v1/duty_group/{groupId}
        params:
          groupId: { in: path, type: string, required: true, description: "值班组 id（13 hex）" }
        body:
          type: object
          required: [name, dutyCycle, status, dutyShift]
          description: "修改值班组（全量）。"
          properties:
            name:          { type: string }
            dutyCycle:     { type: string }
            status:        { type: string, enum: [enabled, disabled] }
            dutyShift:
              type: array
              items:
                type: object
                properties:
                  name:     { type: string }
                  dutyTime: { type: string }
            memo:          { type: string }
            flexTime:      { type: integer }

      delete:
        description: 删除值班组（批量）。groupIds 走 path 分号分隔。
        method: DELETE
        path: /api/flowable_service/v1/duty_group/{groupIds}
        params:
          groupIds: { in: path, type: string, required: true, description: "值班组 id，分号分隔" }
