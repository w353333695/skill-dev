# =============================================================================
# EasyOps 采集服务套件激活面（kit activate/list）—— api-cli 集中清单
# -----------------------------------------------------------------------------
# ⚠️真调环境（172.30.0.90）拓扑实测（2026-08-13）：
#   • collector_service:8125 —— 旧版，collector_job 端点在（/api/v1/collector_job HTTP400=参数错），
#     但 kit 端点（/api/v1/collector/kit/activate|info/list）全 404（缺 kit 模块，源码 tmp/源代码/collector_service 印证）。
#   • :12000 —— kit activate/info/list 端点【实际在这里】，需 giraffe-contract-name header 路由。
#     实测错误链：缺 header → 'get giraffe-contract-name none'；带 header → 'contract <name>@<版本> not found'。
#     contract 实际版本号待 e2e 探测（kits.go 用 ActivateCollectorKit@1.0.19 / ListCollectorKitInfo@1.0.5，
#     但 .90 环境返回 not found，实际版本可能不同——e2e 激活时探测真实 contract 名回流）。
#   故 default_endpoint 指向 :12000（base_url=${EASYOPS_COLLECTOR_SERVICE_BACKEND_URL} 改指 12000）。
#
# 数据来源（契约权威在 easyops-cli，Go 源码旧版无 kit 模块）：
#   • tmp/easyops-cli/.../contracts/mutation-semantics.json（端点 path 契约）
#   • tmp/easyops-cli/.../internal/platform/kits.go（实现：body 字段、成功判定）
#   • ⚠️不可用 tmp/源代码/collector_service 说「端点不存在」——那是旧版。
#
# 接入面：
#   • backend —— :12000（HTTP，giraffe-contract-name header 路由）。
#
# 鉴权：与 collector_plugin_service 同 EasyOps 平台。org+user header；cookie 非必需。
#
# ⚠️ giraffe-contract-name 路由（关键，影响每个请求）：
#   每个端点必须带 header `giraffe-contract-name: <proto服务名>@<版本>` 才能路由。
#   proto 服务名见各 operation 的 contract 注释。⚠️api-cli endpoint.headers 是【固定 header】
#   （每请求注入），但 contract-name 因 operation 而异（activate≠list），无法用 endpoint.headers
#   统一设——真调时用 --header 逐 operation 传，或走 Python SDK 在 call 时注入。
#   （e2e 阶段先探测真实 contract 版本号，再决定是 endpoint.headers 固化还是 per-op 传）
#
# ⚠️ api-cli 能力边界：activate/list 是 JSON 交互，api-cli 可真调（需带 contract-name header）。
#   activate 实际效果（下发采集任务）异步，需轮询 collector_job 状态验证。
#
# 知识分文件：
#   激活机制（CMDB 事件驱动 AssignJobs + 600s 兜底）+ 拓扑 → systems.yaml runtime；
#   collector_job 结构 → objects.yaml#collector_job；activate e2e → flows/。
# =============================================================================
spec: api-cli/v1
service:
  name: easyops-collector-service
  version: "1.0"
  default_endpoint: backend
  endpoints:
    backend:
      base_url: ${EASYOPS_COLLECTOR_SERVICE_BACKEND_URL}   # 值在 env.d/collector.env，指 http://172.30.0.90:12000（实测 kit 端点在 12000 非 8125）
      host: admin.easyops.local                              # IP 直连，Host 由 endpoint.Host 注入
      path_prefix: ""
      auth: none                                              # 直连 auth=none，org/user 由 headers 注入
      headers:
        org: ${EASYOPS_ORG}
        user: ${EASYOPS_USER}
        # giraffe-contract-name 不在此设——它因 operation 而异（activate≠list），真调 per-op 用 --header 传

# -----------------------------------------------------------------------------
# 资源 1：kit —— 套件激活/列表（collector_service.job 模块）
# ⚠️源码此版本（tmp/源代码/collector_service）无 kit 模块，契约权威源是 easyops-cli/kits.go。
# -----------------------------------------------------------------------------
resources:
  kit:
    description: |
      采集套件的运行态操作（激活/更新/列表）。与 collector_plugin_service.plugin 的区别：
      plugin 管「套件定义的 CRUD」，kit 管「把定义激活成运行中的采集任务」。
      ⚠️激活机制：activate 不直接建任务，而是触发 collector_service 的 AssignJobs
      （CMDB 事件驱动 + 600s 定时兜底，assign_job.go:28；详见 systems.yaml runtime.activation_mechanism）。
      成功判定：HTTP 成功且响应 totalStatus != "fail"（kits.go:134）。
    path: ""

    operations:
      # ---------- 激活套件（首次部署 / 更新同步）----------
      activate:
        description: |
          激活套件（把套件定义变成运行中的采集任务）。proto: ActivateCollectorKit@1.0.19。
          必填 instanceId。可选 objectId（关联模型）/params（采集参数 JSON）/centralizedEnable（集中式）/hostIds（目标主机）/collectAgent。
          ⚠️同一端点也用于「更新套件同步到任务」（kits update 复用本端点，body 加 syncToJobs/dashboards/dashboardStrategy）。
          成功判定：HTTP 200 且响应 totalStatus != "fail"（fail 报 KITS_005）。
          激活是异步的（触发 AssignJobs），激活后采集任务实际生效可能需轮询 collector_job 状态。
          权威实现：tmp/easyops-cli/.../platform/kits.go:95-139（registerKitsActivate）。
        method: POST
        path: /api/v1/collector/kit/activate
        body:
          type: object
          required: [instanceId]
          description: "ActivateCollectorKit 请求。instanceId=套件实例ID（来自 collector_plugin_service.plugin import/create 返回）。"
          properties:
            instanceId: { type: string, description: "套件实例ID（13hex，必填）。来自 plugin.import 或 plugin.create_with_*" }
            objectId: { type: string, description: "关联CMDB模型ID（如 HOST@ONEMODEL）。激活时指定采集目标模型" }
            params: { type: object, description: "采集参数（JSON 对象，覆盖套件 paramDefine 默认值）。⚠️参数 paramType 规则见 formats/collector-kit/param-mechanism.yaml" }
            centralizedEnable: { type: boolean, description: "是否集中式启用" }
            hostIds: { type: array, items: { type: string }, description: "目标主机ID列表" }
            collectAgent: { type: string, description: "采集Agent（如 $.ip）" }
        response:
          type: object
          description: "激活结果。⚠️totalStatus=fail 表示激活失败（即使 HTTP 200）。"
          properties:
            code: { type: integer, description: "0=成功" }
            data: { type: object, additional_properties: true, description: "激活结果（含 totalStatus: success|fail）" }

      # ---------- 更新套件（同步到采集任务，复用 activate 端点）----------
      update:
        description: |
          更新套件并同步到关联的采集任务（复用 activate 端点，proto 同 ActivateCollectorKit@1.0.19）。
          与 activate 的区别：body 字段不同。syncToJobs=true 才同步到任务；dashboards/dashboardStrategy 控制仪表盘更新。
          ⚠️dashboardStrategy 仅允许 overwrite|rename（kits.go:154-156）。
          权威实现：kits.go:141-171（registerKitsUpdate）。
        method: POST
        path: /api/v1/collector/kit/activate
        body:
          type: object
          required: [instanceId]
          description: "更新套件请求（复用 activate 端点）"
          properties:
            instanceId: { type: string, description: "套件实例ID（13hex，必填）" }
            syncToJobs: { type: boolean, description: "是否同步更新到所有关联采集任务" }
            dashboards: { type: array, items: { type: string }, description: "要更新的仪表盘ID列表" }
            dashboardStrategy: { type: string, enum: [overwrite, rename], description: "仪表盘更新策略（仅 overwrite|rename）" }
        response:
          type: object
          description: "更新结果（同 activate 响应）"
          properties:
            code: { type: integer }
            data: { type: object, additional_properties: true }

      # ---------- 套件列表（含运行态信息）----------
      list:
        description: |
          列出套件（含运行态 status/params/metricSets/pluginUpdateTime）。proto: ListCollectorKitInfo@1.0.5。
          双源合并：本端点（collector_service）返套件基本信息 + CMDB _COLLECTOR_EASYOPS_PLUGIN search 补 status/params/metricSets/collectAgent。
          status=enabled=内置套件（protected，禁覆盖）；status=available=自定义套件（可覆盖）。
          权威实现：kits.go:32-67（registerKitsList，主端点 + 旁路 cmdb search merge）。
        method: GET
        path: /api/v1/collector/kit/info/list
        params:
          page: { in: query, type: integer, description: "页码" }
          pageSize: { in: query, type: integer, description: "每页数" }
          keyword: { in: query, type: string, description: "关键词（模糊匹配 name/memo）" }
          status: { in: query, type: string, description: "状态过滤（enabled=内置/available=自定义）" }
        response:
          type: object
          description: "套件列表（含运行态字段）。list 元素字段见 collector_plugin_service.plugin.list + status/params/metricSets/pluginUpdateTime/collectAgent"
          properties:
            code: { type: integer }
            data: { type: object, properties: { list: { type: array, items: { type: object, additional_properties: true } }, total: { type: integer } } }

# -----------------------------------------------------------------------------
# 资源 2：collector_metric —— 指标元数据（collector_service.metric 模块）。
# 源码：07-source-repos/collector_service/metric/route.go:20-21,38 + validators/
# request_validate_trees.go:67,71 + metric_service.go:756,835。
# 这是「dashboard 有哪些指标可用」的权威查询途径（data_exchange 的 tags-list 是空实现桩，
# olap/olap_service.go:91-93——勿用它查指标元数据）。
# ⚠️端口待 e2e 探测：metric 模块在 collector_service 进程，候选 :12000（kit 所在）或
#   :8125（legacy collector_job 所在）——e2e 阶段确认后回填此处注释。
# -----------------------------------------------------------------------------
  collector_metric:
    description: 采集指标元数据（CollectorAliasMetric 目录）——指标名/显示名/单位/维度/objectId/所属插件与套件。dashboard cmdb-olap 数据源选指标前用它查证（指标名错→图表静默空白）。list=v2 分页检索（支持 metricName 模糊/metricNames 精确集合/objectId/jobId/pluginId/metricSetId 过滤），get=单指标详情（objectId+metricName 定位）。
    path: ""

    operations:
      # ---------- v2 列表（POST /api/v2/collector-metric-names）----------
      list:
        description: 分页检索指标元数据（metric/route.go:21 ListCollectorMetricNamesV2）。过滤参数（validator 树 request_validate_trees.go:71）：page/pageSize 必填；metricNames 逗号分隔精确集合（$in）；其余模糊/外键过滤选填。响应 data.list 元素 = CollectorMetricName（metric_service_test.go:4128-4177 实证字段）：metricId/metricName/objectId/description/unit/displayName/dims/isKeyMetric/keyMetricOrder。total=总数。查「HOST 有哪些指标」：object_id 传 HOST。
        method: POST
        path: /api/v2/collector-metric-names
        body:
          type: object
          required: [page, pageSize]
          description: "指标列表检索请求（ListCollectorMetricNamesV2Request）"
          properties:
            page:          { type: integer, description: "页码（≥1，必填）" }
            pageSize:      { type: integer, description: "每页（≥1，必填）" }
            metricNames:   { type: string, description: "精确指标名集合，逗号分隔（$in，如 cpu_usage,mem_usage）" }
            metricName:    { type: string, description: "指标名模糊匹配（$like %x%）" }
            metricDisplayName: { type: string, description: "显示名模糊匹配" }
            objectId:      { type: string, description: "按模型过滤（如 HOST）——查某模型可用指标用这个" }
            jobId:         { type: string, description: "按采集任务过滤（13 位 id）" }
            pluginId:      { type: string, description: "按采集插件过滤（13 位 id）" }
            metricSetId:   { type: string, description: "按指标集过滤（13 位 id）" }
            types:         { type: string, description: "按数据类型过滤，逗号分隔" }
        response:
          type: object
          description: "wrapper：{ code, data: { list, total } }（kitweb JSONPb gogo 序列化）"
          properties:
            code: { type: integer }
            data:
              type: object
              properties:
                total: { type: integer, description: "指标总数" }
                list:
                  type: array
                  description: "CollectorMetricName 列表"
                  items:
                    type: object
                    additional_properties: true
                    properties:
                      metricId:   { type: string, description: "指标 ID" }
                      metricName: { type: string, description: "指标名（cmdb-olap measures[].function.args 用它，snake_case）" }
                      displayName: { type: string, description: "显示名（如 CPU使用率）" }
                      objectId:   { type: string, description: "所属模型" }
                      unit:       { type: string, description: "单位（如 percent(1)/bibytes）" }
                      dims:       { type: array, description: "维度列表", items: { type: object, additional_properties: true } }
                      isKeyMetric: { type: boolean, description: "是否关键指标" }
                      keyMetricOrder: { type: integer, description: "关键指标排序" }

      # ---------- 详情（GET /api/v1/detail-collector-metric-name）----------
      get:
        description: 单指标详情（metric/route.go:38 DetailCollectorMetricName）。objectId+metricName 定位（request_validate_trees.go:35），返回指标完整定义（含 dims 维度、unit 单位、originalMetrics 来源插件）。dashboard 配指标前查证用。
        method: GET
        path: /api/v1/detail-collector-metric-name
        params:
          objectId:   { in: query, type: string, required: true, description: "模型 ID（如 HOST）" }
          metricName: { in: query, type: string, required: true, description: "指标名（snake_case）" }
        response:
          type: object
          description: "wrapper：{ code, data: { metricName, metricKey, ... } }（字段同 list 元素）"
          properties:
            code: { type: integer }
            data: { type: object, additional_properties: true }
