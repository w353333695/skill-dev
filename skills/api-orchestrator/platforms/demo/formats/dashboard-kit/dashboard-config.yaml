# =============================================================================
# formats/dashboard-kit/dashboard-config.yaml
# EasyOps 仪表盘（hyper-insight）配置结构 —— 自然语言 → _DASHBOARD 实例配置 JSON。
#
# 核心事实：仪表盘 = CMDB _DASHBOARD 模型实例（CRUD 走 object_instance，无独立 API）。
# 配置主体 = panels(构件) + context(数据源) + variables(变量) + 顶层布局字段。
#
# 权威源：
#   A. 知识库 data/sources/frontend/dashboard-dev-skill/（构件库/Provider/表单/框架文档/黄金样例）
#   B. 真调实测（2026-08-14 .90/org8888）：_DASHBOARD 22 字段实锤 / 85 个现有仪表盘 /
#      真实实例结构（panels list / context list / template normal|bigScreen）
#
# 相关文件（本 kit 内）：
#   providers-context.yaml —— 数据接入（10 Provider + context 类型 + cmdb-olap 查询三件套）
#   构件库全量 JSON 不复制——指针引用知识库：
#     01-build-bricks/_DASHBOARD_ATOM_BRICK.json（15 原子构件）
#     01-build-bricks/_DASHBOARD_BRICK.json（18 复合构件）
#     02-data-access/_DASHBOARD_PROVIDER.json（10 Provider 目录）
#     05-examples/*.json（4 黄金样例）
# =============================================================================

# -----------------------------------------------------------------------------
# 一、_DASHBOARD 实例骨架（CMDB import 入参）
# -----------------------------------------------------------------------------
dashboard_schema:
  crud_note: |
    建/改仪表盘 = CMDB 实例操作：object_instance.import（upsert，keys=[name]）/ search / delete。
    objectId=_DASHBOARD。无独立 dashboard API。
  required_core: [name, panels, context]   # 最小可建
  fields:
    name: "仪表盘名（唯一，upsert keys）"
    namespace: "命名空间（如 resource-monitor.IOT_DEVICE@ONEMODEL / dashboard / cmdb——按用途：实例监控页用 模块.objectId 格式，独立大盘用 dashboard）"
    category: "分类（如 物联网设备/CMDB统计报表/大屏模板）"
    dashboardVersion: "v2（当前唯一在用版本）"
    template: "布局模板：normal（普通仪表盘，网格布局）/ bigScreen（大屏）"
    timerange: "默认时间范围：now-1h / now-24h 等（页面顶部时间选择器初值，QUERY.from/to 由它注入）"
    panels: "构件实例数组（见 panel_schema）"
    context: "数据源数组（见 providers-context.yaml）"
    variables: "变量数组（见 variable_schema；URL query 参数声明+选择器）"
    size: "画布尺寸 {width,height}（bigScreen 用）"
    background: "背景样式（bigScreen 用）"
    messages: "消息订阅（高级，通常 []）"
    type: "builtIn（内置）/ 空（自建）"
    default: "bool 是否该 namespace 默认页"
    protected: "受保护（禁删）"
    isHidden: "隐藏"
    hiddenTimeRange: "隐藏时间选择器"
    thumbnail: "缩略图"
    adaptive: "自适应"
    sequenceNumber: "排序"
  real_example_toplevel: |
    {"_object_id":"_DASHBOARD","name":"物联网设备状态","namespace":"resource-monitor.IOT_DEVICE@ONEMODEL",
     "category":"物联网设备","dashboardVersion":"v2","template":"normal","timerange":"now-1h",
     "panels":[...],"context":[...],"variables":[]}
  source: "实测 .90 _DASHBOARD 模型 attrList（22字段）+ 真实实例（硬件设备统计大屏 16 panels/8 context）"

# -----------------------------------------------------------------------------
# 二、panel（构件实例）结构
# -----------------------------------------------------------------------------
panel_schema:
  fields:
    brickId: "引用构件库——原子构件填 brick 字段值（如 chart-v2.line-chart）；复合构件填 brickId 字段值（如 monitor-charts.instance-metrics-trend-chart）"
    brickConf: '⚠️JSON 字符串（非对象！）：{brick:<运行时构件名>, properties:{...含 data:"<% CTX.DS.<context名> %> 数据绑定"}, slots:{}}'
    formData: "表单结构化镜像（dataSource=context名/yamlProperties/布局样式，供编辑器 UI 用，与 brickConf 内容等价）"
    x/y: "网格坐标（左上原点，24 列网格）"
    width: "宽（常用 8/12/24 三分/半/全宽）"
    height: "高（单图常用 6-10）"
    mode: "default | yaml（编辑模式）"
    source: "brick（固定）"
    type: "brick（固定）"
    wrapped: "bool 是否包白色卡片容器（true=有边框卡片）"
    wrappedConf: '卡片样式 {background:{backgroundColor:"#ffffff"},border:{borderColor,borderRadius:4,borderWidth:1,padding:{16,16,16,16}},borderType:"solid"}'
    title: "面板标题"
    titleStyle: "标题样式"
  data_binding: '构件绑数据源的唯一方式：brickConf.properties.data = "<% CTX.DS.<context项name> %>"（CTX.DS 是 dashboard 数据源专用命名空间）'
  brick_conf_example: |
    {"brick":"chart-v2.line-chart",
     "properties":{"xField":"time","yField":"cpu_usage","groupField":"device_name",
       "data":"<% CTX.DS.cpuTrend %>",
       "axis":{"yAxis":{"precision":1},"xAxis":{"type":"time"}},
       "timeFormat":"MM/DD HH:mm","timeUnit":"second","style":{"height":"100%"}},
     "slots":{}}
  source: "05-examples/入门-物联网设备状态.json panel + TplBrickPanelSettingsDrawer.yaml:359-377,451-452"

# -----------------------------------------------------------------------------
# 三、构件选型（原子 15 + 复合 18——全量查知识库，此处决策树）
# -----------------------------------------------------------------------------
brick_selection:
  decision_tree: |
    要不要预置数据源绑定？
    ├─ 要（快速标准场景）→ 复合构件（propertiesConf 已内置数据查询，只改参数）
    │   指标趋势   → monitor-charts.instance-metrics-trend-chart（单实例）
    │              → monitor-charts.multi-instance-metrics-trend-chart（多实例）
    │   当前值统计 → monitor-charts.instance-metric-single-value
    │   CMDB 实例表→ cmdb-instances.highlight-table
    │   按属性分组 → cmdb-instances.group-chart
    │   实例总数   → monitor-charts.instances-total
    │   告警趋势/列表 → monitor-alert.trend-chart-of-alert-event-number / instance-alert-not-recover-events-list
    └─ 不要（自由定制）→ 原子构件（数据全靠 context + CTX.DS 注入）
        趋势图  → chart-v2.time-series-chart（时序专用，xRange/brush）
        折线/面积/柱状 → chart-v2.line-chart / area-chart / bar-chart / horizontal-bar-chart
        占比    → chart-v2.pie-chart / donut-chart
        仪表盘  → chart-v2.gauge-chart
        雷达    → chart-v2.radar-chart
        表格    → presentational-bricks.brick-table
        统计卡  → general-charts.statistic-card（带图标）/ statistic-item
        文本    → presentational-bricks.markdown-display / code-bricks.code-display
  nl_to_brick: |
    自然语言 → 构件速查：
    「趋势/随时间」→ time-series-chart｜「当前使用率/状态值」→ statistic-card 或 gauge-chart
    「列表/明细」→ brick-table｜「占比/分布」→ pie/donut-chart｜「对比」→ bar-chart
    「多实例对比趋势」→ multi-instance-metrics-trend-chart（复合）
  full_catalog_pointer: |
    构件全量（含 defaultProperties/propertiesConf 逐字段）不复制到 platforms——
    查知识库：data/sources/frontend/dashboard-dev-skill/01-build-bricks/
      _DASHBOARD_ATOM_BRICK.json（15 原子）/ _DASHBOARD_BRICK.json（18 复合）
    黄金样例：05-examples/入门-物联网设备状态.json（最小）/ 全量-K8s-Cluster.json（44KB 全功能）
  source: "知识库 01-build-bricks/ 两个 JSON 全量分析"

# -----------------------------------------------------------------------------
# 四、变量（variables）结构
# -----------------------------------------------------------------------------
variable_schema:
  desc: "dashboard 级 URL query 参数声明 + 选择器配置。值通过 QUERY.{id} 被 context/panel 表达式引用"
  fields:
    id: "变量 ID（被 QUERY.{id} 引用，如 instanceId）"
    name: "显示名（如 K8S 集群 ID）"
    type: "cmdb（从模型实例选）/ cmdb-model（从模型选）/ constant（常量列表）"
    selectorObjectId: "CMDB 模型 ID（type=cmdb 时，如 KUBERNETES_CLUSTER@ONEMODEL）"
    fieldsLabel: "选项显示字段（如 [name, clusterId]）"
    fieldsValue: "选项值字段（常 instanceId）"
    multiSelect: "多选（QUERY 值为逗号分隔串，消费端 .split(',')+$in）"
    selectorQuery: "选择器过滤 JSON（可含 <% QUERY.xxx %> 引用其他变量做级联）"
    showSelector: "是否显示选择器 UI（false=纯 URL 传参）"
  builtin_vars: "QUERY.from/to（timerange 注入）/ QUERY.instanceId / QUERY.sort|order|page（表格排序分页）"
  real_example: |
    {"id":"instanceId","name":"K8S 集群 ID","type":"cmdb","selectorObjectId":"KUBERNETES_CLUSTER@ONEMODEL",
     "fieldsLabel":["name","clusterId"],"fieldsValue":"instanceId","multiSelect":false,
     "selectorQuery":"{}","showSelector":false}
  cascade_example: '级联（变量A过滤变量B选项）：selectorQuery: {"kubernetesCluster.instanceId": "<% QUERY.instanceId %>"}'
  source: "全量-K8s-Cluster.json:449-464 + TplVarSelectorModal.yaml"

# -----------------------------------------------------------------------------
# 五、表达式框架（<% %> / 内置对象——跨文件通用）
# -----------------------------------------------------------------------------
expression_framework:
  syntax: '表达式 = "<% " + 单个JS表达式 + " %>"（求值）；注意与复合构件 propertiesConf 里的 ${query.x="默认"|string} 占位符是两套语法'
  builtin_objects:
    QUERY: "URL query 参数（变量/timerange 注入：QUERY.instanceId / QUERY.from）"
    CTX: "上下文——dashboard 数据源专用 CTX.DS.{context名}"
    DATA: "转换用的原始数据（context.transform 里：DATA?.list ?? []）"
    PIPES: "管道字典（PIPES.unitFormat(...) / PIPES.yaml(...)），完整列表见 brick-next-pipes 仓库"
    _: "Lodash（_.map/_.orderBy/_.get）"
    moment: "Moment 时间库"
  js_subset: "✅箭头函数/三元/?.可选链/??空值合并/模板字符串/展开；❌if语句/var/赋值/类（必须是单表达式）"
  common_patterns: |
    取列表空兜底   ： <% DATA?.list ?? [] %>
    带默认值取参   ： <% QUERY.from ?? "now-1h" %>
    条件注入过滤   ： <% { ...(QUERY.ns ? {"kubernetesNamespace.instanceId": {"$in": QUERY.ns.split(",")}} : {}) } %>
    合并对象       ： <% { ...(A ?? {}), ...(B ?? {}) } %>
  source: "06-framework-docs/expressions.md:19-118 + 04-data-transforms/i18n.yaml:1322"

# -----------------------------------------------------------------------------
# 六、自然语言 → 仪表盘 决策流程（flow 的核心逻辑，此处为知识）
# -----------------------------------------------------------------------------
nl_build_knowledge:
  inferrable: |
    可从自然语言推断：
    - 构件类型：「趋势」→time-series；「统计值」→statistic-card；「列表」→table；「占比」→pie
    - Provider：「指标」→olap；「实例列表」→cmdb search；「告警」→alert；「分组统计」→cmdb groupBy
    - context 结构：cmdb-olap 三件套 dims/measures/filters + QUERY.from/to 时间过滤
    - 默认值：timerange=now-1h / template=normal / 单图全宽 24 列高 10 / 白卡片样式
    - 单实例场景默认加 instanceId 变量（type=cmdb, showSelector:true）
  must_confirm: |
    必须查证或问用户（勿编造！证据纪律）：
    - 🔴具体指标名（node.cpu.usage vs host_cpu_used_total）——查 CMDB 模型/指标定义，或问用户
    - 🔴目标 objectId（HOST vs KUBERNETES_NODE@ONEMODEL）——object_model.list 确认
    - 聚合方式（趋势 avg / 当前值 last）、单位（CPU percent(1) / 内存 bibytes / 网络 bps）
    - instanceId 来源（URL 变量 or 固定值）、多图布局分配
  source: "agent 深挖报告（2026-08-14）+ 黄金样例归纳"
