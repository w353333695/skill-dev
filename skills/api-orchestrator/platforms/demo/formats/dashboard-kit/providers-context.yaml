# =============================================================================
# formats/dashboard-kit/providers-context.yaml
# 仪表盘数据接入 —— 10 Provider + context 类型 + cmdb-olap 查询三件套。
#
# 仪表盘的数据从哪来、怎么配：context 数组声明数据源（引用 Provider + 查询参数），
# 构件通过 <% CTX.DS.{name} %> 消费。本文件是 context 项的模板库。
#
# 权威源：
#   A. 知识库 02-data-access/（_DASHBOARD_PROVIDER.json + 6 数据源表单 + dashboard_service 后端）
#   B. 05-examples 黄金样例的真实 context 项
#   C. 06-framework-docs/context.md（Context 机制）
# =============================================================================

# -----------------------------------------------------------------------------
# 一、Provider 目录（10 个——数据能力的入口）
# -----------------------------------------------------------------------------
provider_catalog:
  note: |
    Provider = CMDB _DASHBOARD_PROVIDER 模型实例（目录条目）。
    context 项用【运行时全名】引用（provider 字段），与目录短名是两层映射。
  providers:
    cmdb_search:      { runtime: "providers-of-cmdb.instance-api-post-search", use: "搜索 CMDB 实例列表（context type=cmdb）" }
    cmdb_count:       { runtime: "providers-of-cmdb.instance-api-search-total", use: "CMDB 实例总数统计" }
    cmdb_groupby:     { runtime: "providers-of-cmdb.instance-api-group-instance-v2", use: "CMDB 按属性分组统计" }
    olap_metric:      { runtime: "providers-of-data-exchange.olap-api-query", use: "★监控指标查询（最常用，context type=cmdb-olap）" }
    alert_history:    { runtime: "providers-of-alert-service.monitor-event-api-search-monitor-event", use: "历史告警列表" }
    influxdb_proxy:   { runtime: "providers-of-dashboard-service.database-proxy-api-influxdb-query", use: "InfluxDB 代理查询" }
    mysql_proxy:      { runtime: "providers-of-dashboard-service.database-proxy-api-mysql-query", use: "MySQL 代理查询" }
    es_proxy:         { runtime: "providers-of-dashboard-service.database-proxy-api-elastic-search-query", use: "Elasticsearch 代理查询" }
    mongodb_proxy:    { runtime: "providers-of-dashboard-service.database-proxy-api-mongo-db-query", use: "MongoDB 代理查询" }
  runtime_fullname: |
    context.provider 填运行时全名（带 @版本），与目录短名对应：
      olap   → easyops.api.data_exchange.olap@Query:1.0.0
      cmdb搜索 → easyops.api.cmdb.instance@PostSearch:1.0.0（以实际 context 范例为准）
    static 类型 provider=null。
  full_catalog_pointer: "全量查知识库 02-data-access/_DASHBOARD_PROVIDER.json（10 项含 instanceId）"
  source: "_DASHBOARD_PROVIDER.json 全量分析 + 入门样例 context 实测"

# -----------------------------------------------------------------------------
# 二、context 项结构（11 字段）
# -----------------------------------------------------------------------------
context_schema:
  fields:
    id: "内部 ID（data_{seq}_{name}{随机}，自生成）"
    name: "⚠️数据源名——被构件 <% CTX.DS.{name} %> 引用，全 dashboard 唯一"
    type: "static | cmdb-olap | cmdb | cmdb-detail | cmdb-multiple-all | http"
    provider: "运行时 Provider 全名（static 为 null）"
    dataType: "返回类型 array | object"
    args: "完整查询 YAML 字符串（与 formData 互为表里）"
    formData: "表单结构化数据（编辑器用）"
    data: "实际数据（仅 static 有值）"
    transform: '转换表达式（"<% DATA?.list ?? [] %>"——DATA 是接口原始返回）'
    outputFields: "[{key, alisa}] 输出字段声明"
    yamlArgs: "args 镜像"
  source: "入门-物联网设备状态.json context 项实测"

# -----------------------------------------------------------------------------
# 三、context 类型模板（按 type 查——LLM 写 context 的模板库）
# -----------------------------------------------------------------------------
context_types:
  cmdb_olap:
    desc: "★监控指标查询（最常用）——_dims/measures/filters 三件套"
    provider: "easyops.api.data_exchange.olap@Query:1.0.0"
    template: |
      id: data_1_cpuTrend99
      name: cpuTrend
      type: cmdb-olap
      provider: easyops.api.data_exchange.olap@Query:1.0.0
      dataType: array
      args: |
        - model: easyops.HOST                    # ⚠️格式 easyops.<objectId>
          fillEmptyData: true                    # 空数据点补齐（趋势图平滑）
          dims: [time(auto), device_name]        # 维度：time(auto)=自动时间粒度；可加分组维度
          filters:
            - {name: time, operator: '>=", value: <% QUERY.from ?? "now-1h" %>}
            - {name: time, operator: '<=", value: <% QUERY.to ?? "now-1s" %>}
            - {name: <字段>, operator: ==, value: <% QUERY.instanceId %>}   # 可选实例过滤
          measures:
            - name: CPU使用率                    # 输出列名
              function: {expression: avg, args: [node.cpu.usage]}   # 🔴指标名必查证勿编
          query: {instanceId: <% QUERY.instanceId %>}               # 可选实例限定
      transform: "<% DATA?.list ?? [] %>"
      outputFields: [{key: time}, {key: CPU使用率}]
    measure_expressions: "avg / min / max / sum / last / count / rate（TplOlapDataSourceForm.yaml:96-114）"
    filter_operators: "== != >= > <= < =~(正则) !~（OLAP 维度过滤）；时间过滤用 >= / <="
    source: "TplOlapDataSourceForm.yaml + 入门-物联网 context 实测"

  cmdb_search:
    desc: "CMDB 实例搜索（表格/列表数据源）"
    template: |
      id: data_1_hostList99
      name: hostList
      type: cmdb
      formData:
        mode: form
        objectId: HOST                            # 🔴目标模型（object_model.list 查证）
        query: {instances: {query: {}, type: all}}   # type: all | editor
      transform: "<% DATA?.list ?? [] %>"
    source: "TplCmdbRelativeDataSourceForm.yaml:6-11"

  http:
    desc: "HTTP 请求（自建服务/openapi 数据）"
    provider: "basic.http-request"
    template: |
      type: http
      provider: basic.http-request
      formData: {url: "<接口>", method: POST, body: <YAML>, transform: "<% DATA?.data?.list ?? [] %>"}
    source: "全量-K8s-Cluster.json:772-778"

  static:
    desc: "静态演示数据（每个 dashboard 自带 时间序列数据Demo/分类数据Demo 两个，可删）"
    note: "data 字段存真实数组，provider=null，transform=null"

  db_proxy:
    desc: "influxdb/mysql/es/mongodb 代理查询（走 dashboard_service 后端 database_proxy）"
    backend_endpoints: |
      POST /api/v1/{elasticsearch|influxdb|mysql}/proxy/:instance/query
      POST /api/v1/mongodb/proxy/:instance/{query|aggregate}
      （dashboard_service，:instance=数据源实例名；后端源码 02-data-access/dashboard_service/database_proxy/）
    source: "database_proxy/route.go:7-11"

# -----------------------------------------------------------------------------
# 四、数据转换（transform——接口数据 → 构件可消费形态）
# -----------------------------------------------------------------------------
transform_rules:
  syntax: '"<% JS表达式 %>"，DATA=接口原始返回；结果必须是对象或数组；为空=不转换返回全部'
  examples:
    - "<% DATA.data %>                                # 取 data 字段"
    - "<% DATA.data.map(item => ({hostname: item.name})) %>   # 字段重命名"
    - "<% _.map(DATA.data, \"name\") %>               # 对象数组→值数组"
    - "<% _.orderBy(DATA.data, \"name\", \"desc\") %> # 排序"
    - "<% DATA?.list ?? [] %>                          # ★最常用：取list空兜底"
  source: "04-data-transforms/i18n.yaml:1322 + 样例归纳"

# -----------------------------------------------------------------------------
# 五、CMDB 过滤比较器（query.instances.query 用——区别于 OLAP 比较器）
# -----------------------------------------------------------------------------
cmdb_comparators: "$like(包含) / $nlike(不包含) / $eq / $ne / $exists:false(为空) / $exists:true(不为空)（TplComparatorForm.yaml:29-40）"
