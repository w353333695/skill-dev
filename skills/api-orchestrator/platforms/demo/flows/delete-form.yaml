# 流程模板：删除表单—— 场景⑤。规划挡（写、破坏性）。
# 场景：删除 test 表单。⚠️有版本拒绝删 form，须先清版本；删最后一个版本会级联删 form。
name: delete-form
intent: 删除一个 ITSM 表单（含其所有版本）
trigger: ["删除表单", "删掉 X 表单", "清理测试表单"]
guard: 规划挡（写、破坏性）—— 必须确认删哪些（formId + 其所有版本）

prerequisites:
  env: [EASYOPS_ORG, EASYOPS_USER=easyops, EASYOPS_ITSM_BACKEND_URL]
  confirm: "已确认 formId；删错不可逆（form_version 软删/级联）"

steps:
  - n: 1
    op: form_version.list
    args: ["<formId>", --insecure]
    desc: 列该表单所有版本，拿 versionId 清单（顺便确认要删的目标）
    dataflow: "data.list[].versionInfo.instanceId → step2 的 versionIds"
    expect: "total=版本数；向用户展示版本清单确认"

  - n: 2
    op: form_version.delete
    args: ["<formId>", "<versionId1>", --insecure, --yes]
    desc: |
      逐个删版本。⚠️路径参数是 versionIds（复数），但代码只用第一个——一次只删一个，循环调。
      被流程节点引用的版本拒绝（『表单已绑定节点，不可删除!』）——须先在流程侧解绑。
      ⚠️隐式级联：删完若 form 已无任何版本，连带删 form——若这是最后一个版本，删完 form 也没了，step3 的 form.delete 会幂等返回（form 已不存在）。
    on_fail: "『表单已绑定节点』→ 先在流程侧解绑该版本再删"

  - n: 3
    op: form.delete
    args: ["<formId>", --insecure, --yes]
    desc: 删 form（若 step2 已把版本清光，本步幂等成功；若还有版本残留则报『表单存在版本,无法删除』）
    on_fail: "『表单存在版本,无法删除』→ 回 step1 确认版本没清干净，继续 step2 删剩余"

key_rule: |
  删 form 必须先清所有版本（有版本就拒绝）。两条等效路径：
   ① 逐个 form_version.delete 清版本 → form.delete（显式）
   ② 删最后一个版本时隐式级联删 form（step2 删完最后一个，form 自动没，step3 幂等）
  delete 路径参数 versionIds（复数分号），但代码只用 [0]——批量是壳，循环单删。
  被流程引用的版本不可删——须先解绑。
side_effects: objects.yaml#itsm_form_version.side_effects
acceptance: "form.list 过滤该 formId → total 不含它（删干净）"
