# 流程模板：删除表单—— 场景⑤。规划挡（写、破坏性）。
# 场景：删除 test 表单。删除约束/级联规则见 objects.yaml#itsm_form_version.side_effects（form_version.delete rule）+ objects.yaml#itsm_form.side_effects（form.delete rule）。本文件不复述规则全文。
name: delete-form
intent: 删除一个 ITSM 表单（含其所有版本）
trigger: ["删除表单", "删掉 X 表单", "清理测试表单"]
guard: 规划挡（写、破坏性）—— 必须确认删哪些（formId + 其所有版本）

prerequisites:
  env: [EASYOPS_ORG, EASYOPS_USER=easyops, EASYOPS_ITSM_BACKEND_URL]
  confirm: "已确认 formId；删错不可逆（form_version 软删/级联）"

steps:
  - n: 1
    op: form_version.list
    args: ["<formId>", --insecure]
    desc: 列该表单所有版本，拿 versionId 清单（顺便确认要删的目标）
    dataflow: "data.list[].versionInfo.instanceId → step2 的 versionIds"
    expect: "total=版本数；向用户展示版本清单确认"

  - n: 2
    op: form_version.delete
    args: ["<formId>", "<versionId1>", --insecure, --yes]
    desc: |
      逐个删版本（循环单删——versionIds 路径复数但只删第一个）。
      删除可能被流程节点引用拒绝（报错原文 + 约束清单 + 隐式级联行为见 objects.yaml#itsm_form_version.side_effects form_version.delete rule）。
      若删的是最后一个版本，会隐式级联删 form（见权威源）——此时 step3 form.delete 幂等返回。
    on_fail: "按 key_rule 解约束（流程侧解绑），解后重删版本"

  - n: 3
    op: form.delete
    args: ["<formId>", --insecure, --yes]
    desc: 删 form（step2 清光版本后本步幂等成功）
    on_fail: "『表单存在版本,无法删除』→ 回 step1 确认版本没清干净，继续 step2 删剩余（规则见 objects.yaml#itsm_form.side_effects）"

key_rule: |
  删 form = 先清所有版本（约束清单/级联规则见 objects.yaml#itsm_form_version.side_effects + objects.yaml#itsm_form.side_effects）。本文件只列【清理顺序】（怎么做）：
   ① 逐个 form_version.delete 清版本（须先在流程侧解绑『表单已绑定节点』）
   ② form.delete（step2 清光版本后幂等；或删最后一个版本时隐式级联已删 form）
side_effects: objects.yaml#itsm_form_version.side_effects
acceptance: "form.list 过滤该 formId → total 不含它（删干净）"
