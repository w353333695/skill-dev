# 流程模板：批量给已有实例补/改属性（cmdb-instance 场景③）。change 挡。
# 场景：给所有 TESTWWH 实例补充「整型示例」属性，数值=ip 转整型。
name: update-instances-batch
intent: 对一批已有实例批量写/改某个属性——search 取列表 → 计算 → import 定向 update（keys=[instanceId]）
trigger: ["给所有实例补属性", "批量更新实例字段", "给实例批量赋值", "把 X 算出来填进实例"]
guard: 规划挡（写、批量）—— 须展示「改哪些实例 + 改成什么」确认
prerequisites:
  env: [EASYOPS_ORG, EASYOPS_USER=easyops, EASYOPS_CMDB_BACKEND_URL]
  attr_exists: "目标属性（如『整型示例』）须先在模型层定义；若模型还没有该属性，先走 add-attributes.yaml（object_model.import 加属性，新属性 id 加 _ 前缀）再回本流程"
steps:
  - n: 1
    op: object_instance.search
    args: ["<OBJECT_ID>", --body-file, "<list.json>", --all, --insecure]
    desc: 取全部目标实例的 instanceId + 计算所需的源字段（如 ip）
    body_hint: '{ fields: ["instanceId","ip"], page:1, page_size:3000, query: {_object_id: {"$eq":"<OBJECT_ID>"}} }'
    dataflow: "data.list[].{instanceId, ip} → step2 计算"
    on_fail: "结果不全 → 加 --all 或调大 page_size（≤3000）；仍不全分页循环"
  - n: 2
    transform: compute（本地 jq/python，非 API 调用）
    desc: "计算每条的目标值（如 ip→整型：192.168.1.1 = 192*256^3+168*256^2+1*256+1）。生成 import 的 datas：每条 {instanceId, <整型示例属性id>: <int>}"
    how: "jq 抽 instanceId/ip → python 把 ip 按 4 个 octet 加权求和 → 拼成 datas JSON 文件"
    dataflow: "step1 的 (instanceId, ip) → 算出 (instanceId, int) → step3 的 datas"
  - n: 3
    op: object_instance.import
    args: ["<OBJECT_ID>", --body-file, "<update.json>", --insecure, --yes]
    desc: 定向改——keys=[instanceId] 必命中主键→纯 update（不新建）
    body_hint: '{ keys: ["instanceId"], datas: [ {instanceId:"...", "整型示例": 3232235777}, ... ] }'
    expect: "code=0；data.update_count=实例数，insert_count=0，failed_count=0"
key_rule: |
  keys=[instanceId] 是定向改的关键——主键必命中已有实例→update，不会误建。
  datas 字段名必须是模型里已定义的属性 id（如『整型示例』的 id，可能是 _整型示例 若是新增的）。
  属性类型须匹配（整型示例= int 属性，值传整数非字符串）。
side_effects: objects.yaml#cmdb_instance.side_effects
acceptance: "${EASYOPS_CMDB_FRONTEND_URL}/next/next-cmdb-instance-management/next/<OBJECT_ID>/list"
