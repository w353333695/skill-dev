# 流程模板：自然语言 → 构建仪表盘（dashboard）。
name: build-dashboard
intent: 根据自然语言需求（如「看某主机的CPU使用率趋势」「各模型实例数量统计」），结合 CMDB/监控数据能力，构建仪表盘（_DASHBOARD 实例）
trigger: ["建仪表盘", "做个dashboard", "构建监控大盘", "看XX趋势的仪表盘", "XX统计大屏", "可视化XX"]
guard: 规划挡（写 CMDB）—— 必须确认仪表盘名 + 展示意图后出配置草案，用户确认再建

prerequisites:
  env: [EASYOPS_CMDB_BACKEND_URL, EASYOPS_ORG, EASYOPS_USER]
  payload: "自然语言需求（看什么数据/什么形态/给谁看）"
  format_knowledge: "读 formats/dashboard-kit/{dashboard-config,providers-context}.yaml（配置骨架+数据接入 全文在此）"
  crud_note: "仪表盘 CRUD = CMDB 实例操作（object_instance），无独立 dashboard API"

key_rule: |
  仪表盘 = _DASHBOARD 实例：panels(构件)+context(数据源)+variables(变量)+顶层字段。
  🔴证据纪律：指标名（node.cpu.usage）和 objectId（HOST）必须查证（CMDB 模型/指标定义），
  勿从自然语言编造——详见 dashboard-config.yaml#nl_build_knowledge.must_confirm。
  数据绑定：<% CTX.DS.<context名> %>；构件选型决策树见 dashboard-config.yaml#brick_selection。

steps:
  - n: 1
    desc: |
      解析自然语言需求 → 拆解为图表清单。每个图确定：
      数据类型（指标趋势/当前值/实例列表/分组占比/告警）+ 展示形态（曲线/卡片/表格/饼图）。
      按格式速查「nl_to_brick」映射构件；输出配置草案给用户确认。
    expect: "得到图表清单（每项：意图/构件/数据源类型）+ 用户确认"
  - n: 2
    op: object_model.list
    args: ["--q <目标对象关键词>"]
    desc: |
      查证 objectId（如 HOST/IOT_DEVICE@ONEMODEL）——🔴勿从自然语言猜模型 ID。
      同时看模型字段（context filters/表格列/变量 fieldsLabel 要用真实属性）。
    expect: "确认 objectId + 可用字段清单"
  - n: 3
    desc: |
      查证指标名（若数据源是监控指标 cmdb-olap）：从已有仪表盘 context 找同类指标范例
      （object_instance search _DASHBOARD → 找含指标的 dashboard → 看 context[].args 的
      measures[].function.args）或问用户。🔴指标名错则图空。
    expect: "得到真实指标名（如 node.cpu.usage）+ 聚合方式（趋势avg/当前last）"
  - n: 4
    desc: |
      组装配置 JSON（本地）：
      ① context：每图一个数据源项（模板见 providers-context.yaml#context_types——
        指标用 cmdb-olap 三件套，实例列表用 cmdb，分组用 cmdb groupBy）
      ② variables：单实例场景加 instanceId 变量（type=cmdb, selectorObjectId=目标模型）
      ③ panels：每图一个 panel（brickConf 数据绑定 CTX.DS + 网格布局 x/y/width/height，
        模板见 dashboard-config.yaml#panel_schema）
      ④ 顶层：name/template(normal|bigScreen)/timerange(now-1h)/dashboardVersion(v2)/category/namespace
      对照黄金样例验证结构：知识库 05-examples/入门-物联网设备状态.json（最小范本）。
    expect: "完整配置 JSON 草案"
  - n: 5
    op: object_instance.import
    args: ["_DASHBOARD"]
    desc: |
      建仪表盘（CMDB upsert，keys=[name]）：datas=[{name, panels, context, variables, ...顶层字段}]。
      ⚠️panels/context/variables 是数组对象直接传（CMDB struct/array 属性）。
    expect: "code=0；search 验证 instanceId 生成"
  - n: 6
    desc: |
      验收：把前端 URL 给用户——
      ${EASYOPS_CMDB_FRONTEND_URL}/next/dashboard-r/dashboard?name=<name>
      （或按 namespace 的实例监控页路径）。用户在页面确认图表渲染正常（数据出/布局对）。
    expect: "用户确认图表正常显示"
  - n: 7
    op: object_instance.delete
    desc: "(不满意时)删了重建：delete _DASHBOARD by instanceId；或改配置再 import（keys=[name] upsert 覆盖）"
    expect: "迭代直到满意"

side_effects: objects.yaml#dashboard_instance（若未单列则见 cmdb_instance）
acceptance: "前端打开仪表盘 URL，各 panel 渲染且数据正确；_DASHBOARD search 可查到该实例"
rollback: "object_instance.delete（_DASHBOARD, instanceId）"
note: |
  迭代利器：改配置后重新 import（keys=[name]）即覆盖更新，浏览器刷新即见——比编辑器手点快。
  大屏（bigScreen）差异：template=bigScreen + size 画布 + background 背景，构件同。
  database_proxy（influxdb/mysql/es/mongodb 数据源）后端 5 端点见 providers-context.yaml#context_types.db_proxy，
  未部署探测到 .90 端口——DB 代理类数据源暂不可用，主线用 cmdb-olap/cmdb/alert。
