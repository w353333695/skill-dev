# 流程模板：开发三方告警通知脚本 + 调试 + 发送（msgsender custom 通知方式）。
name: develop-notify-script
intent: 开发自定义通知方式（custom 脚本）→ 建 config → 调试 → 发送
trigger: ["开发通知脚本", "加个通知方式", "自定义告警通知", "接入钉钉/短信/语音 三方通知", "开发 custom sender"]
guard: 规划挡（写 config 须系统管理员）—— 必须确认通知方式名 + cmdbUserObjectColName（CMDB USER 字段）

prerequisites:
  env: [EASYOPS_MSGSENDER_BACKEND_URL, EASYOPS_ORG, EASYOPS_USER]
  payload: "通知需求（目标渠道：短信/语音/IM webhook 等）+ 取值字段（CMDB USER 模型上真实属性，如 telephone）+ 凭证（api_key/token，哪些敏感）"
  format_knowledge: "读 formats/notify-kit/notify-script-protocol.yaml（脚本契约+敏感协议+API面 全文在此）"
  admin_required: "config 写操作须系统管理员，send/debug 无鉴权（权限矩阵见 objects.yaml#msg_config.side_effects）"

key_rule: |
  通知方式 = config 实例（CMDB _MSGSENDER_NOTIFY_CONFIG）+ notify_scripts/<pluginName>.py 脚本。
  三方脚本：msgType=custom + scriptContent（def run(msg_data, users, cmdb_object_key, server_config={}, **kwargs)，py2）。
  🔴脚本开发红线（含中文必须首行 # -*- coding: utf-8 -*-、run 模块级可调用、server_config 敏感字段平台已解码等）—— 全文见 notify-script-protocol.yaml#script_contract.dev_redlines
  🔴敏感字段协议（password 字段 base64 入站 / ******** 出站）—— 见 notify-script-protocol.yaml#sensitive_protocol
  🔴config 读写走 v2（v1 明文密码，实测）；单条 GET/DELETE 仅 v1 有路由。
  ⚠️api-cli 写 config 触发确认挡，加 --yes 跳过。

steps:
  - n: 1
    desc: "需求确认：通知渠道（短信/语音/webhook）+ CMDB USER 取值字段 + 凭证（哪些 type=password）"
    expect: "得到 cmdbUserObjectColName（USER 模型真实字段）+ serverConfig 草案 + configFields（标 password）"
  - n: 2
    op: object_model.detail
    args: ["USER@EASYOPS"]
    desc: "确认 CMDB USER 模型有 cmdbUserObjectColName 字段（如 telephone/手机号）。无则脚本 users 取不到值"
    expect: "USER 模型 attrList 含目标字段"
  - n: 3
    desc: |
      写脚本（本地准备 scriptContent 字符串）。首行 # -*- coding: utf-8 -*-（含中文必填，否则 py2 加载 SyntaxError）。
      def run(msg_data, users, cmdb_object_key, server_config={}, **kwargs)：users={username: USER实例}，
      user_obj[cmdb_object_key] 取值（缺字段 .get 跳过），server_config 敏感字段已解码可直接用。
      返回 list（送达标识）。完整契约+范本见 notify-script-protocol.yaml#script_contract。
  - n: 4
    op: notify_message.debug
    desc: |
      调试（不需先建 config）。body={name, msgType:'custom', scriptContent, serverConfig(敏感base64), receivers:[{user,method:'custom'}]}。
      ⚠️msg_data 内容被覆盖为测试文本（只验脚本可执行+receiver 解析，不验业务渲染）。receivers[].method 必须=msgType。
      失败报 'debug send msg plugin error: <异常>'（500）→ 按异常修脚本（常见：编码/KeyError/import）。
    expect: "code:0，data=脚返回的 list（如 [用户名]）"
  - n: 5
    op: notify_config.create
    desc: |
      建 config（v2，admin user + api-cli --yes 跳确认挡）。
      body={name, msgType:'custom', scriptContent, cmdbUserObjectColName, enable:true,
      serverConfig(敏感base64), configFields:[{name,type}]，description}。
      pluginName 服务端强制=name。409=重名。
    expect: "code:0，返回 instanceId"
  - n: 6
    op: notify_message.send
    desc: |
      正式发。body={topic?, data:{receivers:[{user|user_group|email_addr, method:<config.name>}], msg_data:{content,subject,...}}}。
      method=config.name。msg_data 自由 dict（脚本自解读）。
    expect: "code:0，data={method: 脚返回 list}（非 'not support'/'disable'/'error'）"
  - n: 7
    op: notify_method.list
    desc: "验证：method 列表应含新建方式（enable=true 时）"
    expect: "inform_type 含 config.name"

side_effects: objects.yaml#msg_config.side_effects
acceptance: "notify_method.list 含新方式；send_message 响应 data[method] 为脚返回的送达列表"
rollback: "notify_config delete <instanceId>（admin）删 config；notify_scripts/ 下平台自动清理 custom 脚本（debug 临时脚本 finally 删）"
note: |
  内置类型（email/wework/dingding_robot/dingding_easyops）无需开发脚本——直接建 config 传对应 msgType + serverConfig。
  本流程面向 custom（三方脚本）开发。debug 是核心利器：免建 config 原地试跑，快速迭代脚本。
  发送无鉴权但建 config 须管理员——调试可用普通 user，正式建 config 须管理员账号。
