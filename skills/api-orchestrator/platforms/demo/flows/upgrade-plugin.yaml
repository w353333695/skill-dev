# 流程模板：升级套件（导出→改→重新导入升级）。确认挡（写，单系统多步）。
name: upgrade-plugin
intent: 升级现有套件到新版本（导出现有→修改→import_update 上传新版本）
trigger: ["升级套件", "更新套件版本", "套件发新版", "改套件"]
guard: 确认挡（写）

key_rule: |
  ⚠️升级硬约束（约束全文 + 报错原文见 objects.yaml#collector_plugin.side_effects 的 plugin_package.import_update rule）：agentType 不可变 / version 唯一 / 参数加密位继承 / 无回滚。
  本文件不复述规则全文，只列【操作顺序】：detail 确认现状 → export 旧包 → 改 version/script/指标重打 → import_update 上传。
  version 建议：用 .version 文件管理，每次递增 patch（1.0.0→1.0.1）。

prerequisites:
  env: [EASYOPS_COLLECTOR_PLUGIN_BACKEND_URL, EASYOPS_ORG, EASYOPS_USER]
  payload: "目标 instanceId + 新版本号 + 修改后的套件包"

steps:
  - n: 1
    op: plugin.detail
    args: ["<instanceId>"]
    desc: "取套件现状（确认存在 + 当前 agentType/version）"
    expect: "code:0，记下 agentType（升级不可变）+ 当前 packageVersion"
  - n: 2
    op: plugin_package.export
    args: ["<instanceId>", "curl 存盘（api-cli 不支持 binary 流）"]
    desc: "导出现有套件 zip（拿当前完整定义作修改基础）"
    dataflow: "curl -o current.zip http://<8151>/api/v1/plugin/export/<instanceId>"
    expect: "zip 含 plugin.yaml/src/metric 定义/dashboard 等"
  - n: 3
    desc: "解压→改 plugin.yaml version/script/指标→重打 zip（顶层目录名=name 不变）"
    expect: "version 递增；agentType 不变；scriptPath 与 zip 内路径匹配"
  - n: 4
    op: plugin_package.import_update
    args: ["curl -F 上传（path instanceId + version 必填）"]
    desc: "升级（multipart：attachment + version）"
    dataflow: |
      curl -X PUT -F "attachment=@<套件名>_v<新ver>.zip" -F "version=<新ver>" \
           http://<8151>/api/v1/plugin/import_update/<instanceId>
    expect: "code:0，data.instanceId。⚠️version 重复报 code:100007"

note: "升级走 import_update（PUT），不是 import（POST）。import_update 的 instanceId 在 path，version 在 form 必填。"
side_effects: "见 objects.yaml#collector_plugin.side_effects plugin_package.import_update（agentType不可变/版本唯一/参数加密位继承/无回滚）"
rollback: "无显式回滚。若需还原：导出旧版本（步骤2的 zip）重新 import_update 回旧 version（只要旧 version 还在版本历史）"
acceptance: "plugin.detail <instanceId> 确认 packageVersion 已更新；前端 kit_detail URL"
