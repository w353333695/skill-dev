# 流程模板：查表单列表 + 查某表单版本数 —— 场景①②。直通挡（纯读）。
# 场景①：看看 easyops 建了哪些表单（form.list）。
# 场景②：看看 test 有几个版本（form.list 找 test 的 formId → form_version.list 数 total）。
name: list-forms-and-versions
intent: 查表单列表 / 查某表单的版本数（纯读，两步：先定位 formId 再列版本）
trigger: ["有哪些表单", "看表单列表", "X 表单有几个版本", "查表单版本数", "test 的版本"]
guard: 直通挡（纯读，无确认）

prerequisites:
  env: [EASYOPS_ORG, EASYOPS_USER=easyops, EASYOPS_ITSM_BACKEND_URL]

steps:
  # ---------- 场景①：表单列表 ----------
  - n: 1
    op: form.list
    args: [--page, "1", --pageSize, "50", --insecure]
    desc: 列表单（支持 name/category/creator/state/Q 过滤）。返回 list[]，每条含 instanceId/name/category/creator/lastestVersion 等
    note: "state 过滤的是【版本状态】非 form；isMain=true 只取主版本；字段 lastestVersion 拼写少 t（API 如此）。后处理 jq 抽 name+instanceId+category 列给用户看"
    expect: "code=0；data.total=表单总数，data.list[]=表单数组"

  # ---------- 场景②：某表单版本数（先定位 formId）----------
  - n: 2
    op: form.list
    args: [--name, "<test>", --page, "1", --pageSize, "20", --insecure]
    desc: 按 name 精确/模糊找目标表单，拿 formId
    dataflow: "data.list[].instanceId（formId）→ step3 path 参数"
    note: "name 是模糊匹配（$like）。若多名取第一个或加 creator 过滤收窄"

  - n: 3
    op: form_version.list
    args: ["<formId>", --page, "1", --pageSize, "50", --insecure]
    desc: 列该表单所有版本。data.total=版本数（场景②『有几个版本』读这个，不用数 list 长度）
    expect: "code=0；data.total=版本数，data.list[].versionInfo 含 {instanceId,versionName,isMain,state}"

key_rule: |
  场景②是两步：form.list 找 formId → form_version.list 数 total（不能跳过定位 formId，因 version list 的 path 必须带 formId）。
  form_version.list 的 name 参数是 versionName 精确匹配（非 form 名）——别用它找表单，找表单用 form.list 的 name。
side_effects: objects.yaml#itsm_form_version.side_effects
acceptance: "${EASYOPS_CMDB_FRONTEND_URL}/next/itsc-form-management/form-list?name=test"
