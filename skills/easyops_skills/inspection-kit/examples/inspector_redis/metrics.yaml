- id: basic
  pluginid: inspector_redis
  instanceid: 36678d8307819
  internalid: 36678d8307819
  name: 基本信息
  memo: ""
  category: 基本.配置
  dims: []
  vals:
  - id: version
    name: Redis版本
    type: string
    memo: ""
    unit: ""
    weight: 50
    conditions: []
  - id: mode
    name: 运行模式
    type: string
    memo: "standalone/sentinel/cluster"
    unit: ""
    weight: 50
    conditions: []
  - id: tcp_port
    name: 监听端口
    type: string
    memo: ""
    unit: ""
    weight: 50
    conditions: []
  - id: config_file
    name: 配置文件路径
    type: string
    memo: ""
    unit: ""
    weight: 50
    conditions: []

- id: server_status
  pluginid: inspector_redis
  instanceid: 5daa4c46551ee
  internalid: 5daa4c46551ee
  name: 服务状态
  memo: ""
  category: 运行.状态
  dims: []
  vals:
  - id: status
    name: 运行状态
    type: string
    memo: ""
    unit: ""
    weight: 50
    conditions:
    - comparators: nin
      level: 0
      value: running
      maxvalue: 0
      minvalue: 0
  - id: uptime_days
    name: 运行天数
    type: num
    memo: ""
    unit: "天"
    weight: 50
    conditions:
    - comparators: lt
      level: 5
      value: ""
      minvalue: 0
      maxvalue: 1

- id: memory_info
  pluginid: inspector_redis
  instanceid: b5ce60d06b215
  internalid: b5ce60d06b215
  name: 内存信息
  memo: ""
  category: 资源.内存
  dims: []
  vals:
  - id: used_memory_mb
    name: 已用内存
    type: num
    memo: ""
    unit: "MB"
    weight: 50
    conditions: []
  - id: peak_memory_mb
    name: 峰值内存
    type: num
    memo: ""
    unit: "MB"
    weight: 50
    conditions: []
  - id: mem_fragmentation_ratio
    name: 内存碎片率
    type: num
    memo: ""
    unit: ""
    weight: 50
    conditions:
    - comparators: gt
      level: 5
      value: ""
      minvalue: 1.5
      maxvalue: 0
  - id: maxmemory_policy
    name: 淘汰策略
    type: string
    memo: ""
    unit: ""
    weight: 50
    conditions:
    - comparators: eq
      level: 10
      value: noeviction
      maxvalue: 0
      minvalue: 0

- id: connection_info
  pluginid: inspector_redis
  instanceid: efafed2033a25
  internalid: efafed2033a25
  name: 连接信息
  memo: ""
  category: 运行.连接
  dims: []
  vals:
  - id: connected_clients
    name: 当前连接数
    type: num
    memo: ""
    unit: ""
    weight: 50
    conditions: []
  - id: max_clients
    name: 最大连接数
    type: num
    memo: ""
    unit: ""
    weight: 50
    conditions: []
  - id: rejected_connections
    name: 拒绝连接数
    type: num
    memo: ""
    unit: ""
    weight: 50
    conditions:
    - comparators: gt
      level: 0
      value: ""
      minvalue: 0
      maxvalue: 0

- id: performance
  pluginid: inspector_redis
  instanceid: 58bfdd40d5fa3
  internalid: 58bfdd40d5fa3
  name: 性能指标
  memo: ""
  category: 运行.性能
  dims: []
  vals:
  - id: qps
    name: 即时QPS
    type: num
    memo: ""
    unit: "ops/s"
    weight: 50
    conditions: []
  - id: hit_rate
    name: 缓存命中率
    type: num
    memo: ""
    unit: "%"
    weight: 50
    conditions:
    - comparators: lt
      level: 5
      value: ""
      minvalue: 0
      maxvalue: 80
  - id: keyspace_hits
    name: 键空间命中数
    type: num
    memo: ""
    unit: ""
    weight: 50
    conditions: []
  - id: keyspace_misses
    name: 键空间未命中数
    type: num
    memo: ""
    unit: ""
    weight: 50
    conditions: []

- id: persistence
  pluginid: inspector_redis
  instanceid: a06c0ff414539
  internalid: a06c0ff414539
  name: 持久化状态
  memo: ""
  category: 运行.持久化
  dims: []
  vals:
  - id: rdb_status
    name: RDB状态
    type: string
    memo: ""
    unit: ""
    weight: 50
    conditions:
    - comparators: neq
      level: 0
      value: ok
      maxvalue: 0
      minvalue: 0
  - id: rdb_last_save_time
    name: 上次RDB保存时间
    type: string
    memo: ""
    unit: ""
    weight: 50
    conditions: []
  - id: aof_enabled
    name: AOF是否启用
    type: string
    memo: ""
    unit: ""
    weight: 50
    conditions: []
  - id: aof_last_rewrite_status
    name: 上次AOF重写状态
    type: string
    memo: ""
    unit: ""
    weight: 50
    conditions:
    - comparators: nin
      level: 0
      value: ok
      maxvalue: 0
      minvalue: 0

- id: slowlog
  pluginid: inspector_redis
