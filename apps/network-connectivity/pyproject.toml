[project]
name = "network-connectivity"
version = "0.1.0"
description = "零第三方运行依赖的本地及 SSH 远程网络连通性检查工具"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
network-connectivity = "network_connectivity:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["network_connectivity"]
