# ============================================================
# EasyOps 平台迁移工具 - 配置文件示例
# ============================================================
#
# 使用说明:
#   1. 复制本文件并修改为你的配置
#   2. 根据需要取消注释（删除行首 #）并填写对应资源类型
#   3. 运行: python migration_tool.py export -c config.yaml
#
# 执行顺序说明:
#   - 导出时自动按 "模型 → 实例 → 工具" 顺序执行
#   - 导出和导入可分开执行（跨网络隔离环境时先导出到文件再拷贝到目标机器导入）
#   - dry_run: true 时只打印不执行，用于验证配置
# ============================================================

# ====================
# 源平台（导出数据的平台）
# ====================
source:
  host: "127.0.0.1"       # 源平台 IP 或域名（必填）
  org: "1023"                # 源平台组织 ID（必填）
  # host: "172.30.0.148"       # 目标平台 IP 或域名（必填）
  # org: "8888"                # 目标平台组织 ID（必填）
  user: "defaultUser"        # 用户名（可选，默认 defaultUser）
  # ak: ""                   # OpenAPI Access Key（可选，内网直连不需要）
  # sk: ""                   # OpenAPI Secret Key（可选，内网直连不需要）
  # token: ""                # 老版本平台 Cookie Token（PHPSESSID），填写后工具 API 自动使用老版本接口

# ====================
# 目标平台（导入数据的平台）
# ====================
target:
  host: "127.0.0.1"       # 目标平台 IP 或域名（必填）
  org: "1023"                # 目标平台组织 ID（必填）
  # host: "172.30.0.90"       # 目标平台 IP 或域名（必填）
  # org: "8888"                # 目标平台组织 ID（必填）
  user: "defaultUser"        # 用户名（可选，默认 defaultUser）
  # ak: ""
  # sk: ""
  # token: ""                # 老版本平台 Cookie Token（PHPSESSID）

# ====================
# 全局选项
# ====================
options:
  dry_run: false             # true=仅模拟不执行，false=实际执行
  output_dir: "./output"  # 导出数据的存放目录
  batch_size: 1000           # 批量操作的分批大小

# ====================
# 要迁移的资源列表
# ====================
resources:
  # # --------------------------------------------------
  # # 资源类型一: CMDB 模型
  # # --------------------------------------------------
  # - type: cmdb_model

  #   # 模型过滤器（所有条件为空则导出全部模型，会自动跳过 _ 和 FLOW_ 开头的系统模型）
  #   filter:
  #     # 按分类筛选
  #     #   - 精确匹配: "自定义"
  #     #   - 匹配含子分类: "自定义%"（匹配 "自定义" 和 "自定义.xxx"）
  #     #   - 仅匹配子分类: "自定义.%"（匹配 "自定义.xxx" 不匹配 "自定义"）
  #     #   - 不填: 不按分类过滤
  #     # category: "自定义"

  #     # 按模型 ID 模糊匹配（类似 SQL 的 LIKE）
  #     #   - 例: "HOST" 匹配 ID 包含 HOST 的模型
  #     #   - 不填: 不过滤
  #     # q: "HOST"

  #     # 指定模型 ID（逗号分隔的字符串）
  #     #   - 与 model_ids 二选一
  #     #   - 例: "HOST,APP,SERVICE"
  #     #   - 不填: 不过滤
  #     # object_ids: "HOST,APP"

  #     # 指定模型 ID 列表（数组形式，会逐个获取完整定义）
  #     #   - 与 object_ids 二选一，优先级更高
  #     #   - 不填: 不过滤
  #     model_ids:
  #       - "BUSINESS"

  # --------------------------------------------------
  # 资源类型二: CMDB 实例
  # --------------------------------------------------
  - type: cmdb_instance

    # 必填: 要导出实例的模型列表
    models:
      # 对象形式：导出属性 + 关系数据
      - model_id: "USER_GROUP"
        fields: ["*", "_members.name"]
      # 对象形式：带查询条件
      # - model_id: "HOST"
      #   fields: ["*"]
      #   query:
      #     name:
      #       $like: "%prod%"

    # 导入时的批量大小（可选，默认使用全局 batch_size）
    # batch_size: 500

  # # --------------------------------------------------
  # # 资源类型三: 用户同步
  # # --------------------------------------------------
  # - type: user_sync

  #   # 注册新用户的密码模板，{name} 替换为用户名
  #   # password_tpl: "{name}@easyops2026"

  #   # 导入时的批量大小（可选，默认使用全局 batch_size）
  #   # batch_size: 500

  # # --------------------------------------------------
  # # 资源类型四: 工具
  # # --------------------------------------------------
  # - type: tool

  #   # 是否导出所有版本
  #   #   - true: 导出每个工具的所有历史版本（完整迁移）
  #   #   - false: 只导出每个工具的最新版本
  #   export_all_versions: true

  #   # 版本类型过滤（仅在 export_all_versions: true 时生效）
  #   #   - 不填: 导出所有类型版本
  #   #   - "production": 仅导出生产版本
  #   #   - "development": 仅导出开发版本
  #   # env_type: "production"

  #   # 工具过滤器
  #   filter:
  #     # 按分类筛选（精确匹配分类路径）
  #     #   - 例: "ITSM"（一级分类）
  #     #   - 例: "ITSM/默认"（二级分类）
  #     #   - 不填: 导出全部工具
  #     # category: "ITSM"

  #     # 按名称筛选（模糊匹配）
  #     #   - 不填: 不按名称过滤
  #     # name: "备份"

  #   # 导入时冲突处理策略
  #   #   - "skip": 目标平台已存在同名同版本工具时跳过（默认）
  #   #   - "overwrite": 覆盖目标平台的同名同版本工具
  #   conflict_strategy: "skip"
