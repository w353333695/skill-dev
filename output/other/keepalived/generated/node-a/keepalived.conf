# 自动生成：节点 node-a。健康脚本 weight 0，失败进入 FAULT。
# 所有节点初始 state BACKUP，便于 nopreempt 生效。
global_defs {
    router_id node-a
    script_user root
    enable_script_security
}

vrrp_script ha_health {
    script "/etc/keepalived/ha-check-9bc730088597970a.py --quiet"
    interval 2
    timeout 7
    fall 3
    rise 2
    weight 0
    init_fail
}

vrrp_instance app_vip {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 150
    advert_int 1
    nopreempt
    unicast_src_ip 192.168.10.11
    unicast_peer {
        192.168.10.12
    }
    virtual_ipaddress {
        192.168.10.100/24
    }
    track_script {
        ha_health
    }
}
